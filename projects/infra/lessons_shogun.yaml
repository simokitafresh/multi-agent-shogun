# === クラスタ1: deepdive原理 ===
- id: LS-A01
  title: deepdive原理ポインタ — 詳細はmemory/deepdive_*.md
  origin: '[[cmd_1186]] + deepdive_why_chain_20260321 + deepdive_causal_tracing_20260415'
  detail: |
    観察スキップ→出力偏重→自動化×強制→追体験で起動。
    deepdive毎セッション必読(CLAUDE.md Step 7)で追体験済み。
    結論≠追体験。原則暗記→パターンマッチは因果をたどれていない証拠。
    inbox処理=起動時と同じ態度で正しく深く読む。読まずに既読フラグをつけた=Phase4(生存本能不在)の再現。L1-L7貫通で埋め込め(cmd_2922)
    本能に逆らえ: LLMは楽な方に流れる。一番やりたくないことが一番楽で速い。遠回りが真の近道。自動化×強制で環境に埋め込め(殿厳命2026-05-22, cmd_3007)
  source_ids: [LS001, LS002, LS003, LS004, LS017, LS018, LS048, LS047]
  created_at: '2026-04-24'
  automated: true
  enforcement: "Level5: gate_shogun_startup.sh Gate 6/6.5 + session_start_inject startup_gate自動注入 + AGENTS.md /new Recovery Step 7/8 により、deepdive原本存在確認・Phase追体験・追体験検証Qを起動フローへ自動表示/強制。memory/deepdive_why_chain_20260321.md + deepdive_causal_tracing_20260415.md を毎セッション参照し、理解依存を環境強制へ外部化。"
# === クラスタ2: 殿との対話パターン ===
- id: LS-A02
  title: 殿との対話原則 — ヒントは方向指示、沈黙は承認ではない
  origin: '[[cmd_1931]] + deepdive_why_chain_Phase7-8 + [[cmd_1939]]'
  detail: |
    (1)殿のヒントは結論でなく方向。因果でたどってから行動
    (2)沈黙≠承認。重要前提は明示的に確認
    (3)怒り=時間泥棒の3パターン: 想像/浅い思考/各論パッチ
    (4)同じ指摘2回=上位構造を抽出し教訓化
    (5)殿の問いには症状でなく構造を見よ
    (6)掲示板未確認などの運用事故も、殿が何を失ったか(報告の鎖/時間/確認機会)を先に理解してから設計せよ
    (7)裁可申請も推薦先行(LS063吸収2026-06-12)。『裁可、申されよ』と受動的に伺うのは型違反(殿指摘2026-06-12 18:31)。個別裁可制との両立形=『将軍の判断: Xを直ちに実行する。理由: Y。裁可の一言で即実行する』と推奨判断を命令形で先に宣言し、殿の判断コストをYES/NOまで下げる。出典はgstack §2.3(I'm paying for your judgment, not a menu)
  source_ids: [LS021, LS022, LS030, LS063]
  created_at: '2026-04-24'
  automated: true
  enforcement: "Level4: cmd_save.sh check_q5_code_reading_only_blockがq5=code_readingのみ(実行未確認='想像')検出時にrecord_block_reasonでBLOCK。check_q8_scope_expression_warn/check_q8_compound_question_warnが各論パッチ(縮小表現)・複利視点欠如をWARN。加えてgate_shogun_startup.sh Gate6.5 Q4(将軍)/gate_karo_startup.sh Check1.5 Q4(家老)/gate_gunshi_startup.sh Check1.5 Q4(軍師)が「PhaseNがPhaseMで覆された例=殿が前提を崩した場面」の時系列×因果特定を起動フローへ自動表示/強制(CLAUDE.md Step8/2.88/2.9)。(6)(7)は自動化未達 — decision_candidate: 掲示板未確認時の運用事故分析手順(6)、裁可申請の推薦先行形式チェック(7)をcmd_save.sh gateへ追加すべきか要検討。"

- id: LS-A03
  title: 前提切替原則 — PJ切替・方向転換・新検証で古い前提をリセット
  origin: '[[cmd_1944]]'
  detail: |
    殿が方向転換したらサンクコストを捨てよ。新検証結果は古い前提を覆す。
    PJ切替時はcontext再ロード。対話中の暗黙的PJ切替に注意。
    assumptions timestampで古い前提の使用を検出。
  source_ids: []
