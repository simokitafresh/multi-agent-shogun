  created_at: '2026-04-15'
  automated: true
  enforcement: 'context/checklist-alm-registration.md + context/checklist-shin-v2-registration.md(登録チェックリスト)。PI-007(production_invariants)。context/dm-signal-core.md L456 L037(pipeline_config未設定→Cash fallback)'
- id: LS011
  title: 研究≠本番 — 研究出力をそのまま設計に流すな
  detail: |
