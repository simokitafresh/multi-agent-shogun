  enforcement: 'cmd_save.sh q8_why_what(BLOCK: WHY→WHAT因果連鎖必須) + gunshi review因果推論ルール(causal_chain必須フィールド) + gate_gunshi_cs_checklist.sh CS6(因果推論チェック)'
- id: LS014
  title: 想像するな確認せよ — ファイル一覧から推測するな現物を読め
  detail: |
    事故: ファイル名や一覧だけで「未実装」「未対応」と結論し、読めば10秒で分かる事実を外した事例が繰り返し起きた。
    原因: 現物読解を省略し、一覧や過去メモから中身を想像で埋めた。
