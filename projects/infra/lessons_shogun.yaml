# === クラスタ4: gate迂回・先走り ===
- id: LS-A07
  title: gate迂回禁止 — 正規フローが通らない=調査対象
  origin: '[[cmd_2134]]'
  detail: |
    迂回は1回で致命的(滑り坂: 1回目→2回目→3回目で完全崩壊)。
    正規フローが通らない=インフラバグか自分の理解不足。どちらも調査すれば解決。
    draft→pending→delegatedの3段階に全て理由がある。
    原因は100%自分の選択にある。他責厳禁。
    ナッジで作業させるな=cmd迂回の変形。inbox_writeで直接指示→lesson_candidate/binary_checks/軍師レビュー全欠落→鎖全体の成長停止。Phase2(出力=仕事の罠)の再現(cmd_2877)
    F001適用範囲曖昧+掲示板依頼チャネル混同=cmd迂回の変形(cmd_3137)。設計書は将軍直接編集、依頼はcmd経由。ルール違反はバグ→L0-L7貫通
