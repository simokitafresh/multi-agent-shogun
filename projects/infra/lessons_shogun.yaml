- id: LS022
  title: 殿のヒントは1行 — 結論でなく方向指示として受け取れ
  detail: |
    事故: deepdive Phase 7で殿が「自分で改善できるとこがないか」と1行。Phase 8で「次は他者を助けろ」と1行。将軍はヒントを「結論」として処理し、自分で方向を探索しなかった(Phase 6まで)。preprocessing_research Phase 11でも殿の転換点3連発を結論として吸収→次Phaseで同じ構造再発。
