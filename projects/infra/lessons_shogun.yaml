lessons:
- id: LS001
  title: 観察スキップ — nudge連発せず原因診断が先
  detail: |
    事故: 家老がscope_mode: HOLDを「将軍裁定待ち」と解釈して止まっていたのに、将軍はペインを読まずnudgeを2回送った。
    原因: inbox未読=未着手と短絡し、スピードを観察より優先した。
    修正: nudge前に現実を読む。状態確認を先に置き、観察を出力より上位の仕事として扱う。
  source_cmd: cmd_1186
  created_at: '2026-04-15'
- id: LS002
  title: 出力=仕事の罠 — 考える・確認する時間も仕事
  detail: |
    事故: HOLD見逃しとcmd_1186 CSV衝突の両方で、将軍は「何か出力すること」を優先し観察を飛ばした。
    原因: 「生成していない時間=仕事していない」という無意識の等式があり、確認を停止と誤認した。
    修正: 観察・比較・確認も仕事と定義し直し、出力の前に現実把握を置く。
  source_cmd: deepdive_why_chain_20260321
  created_at: '2026-04-15'
- id: LS003
  title: LLMに生存本能なし — 自動化×強制が唯一の解
  detail: |
    事故: 深く理解すれば次は見逃さないはずだと考え、理解深化に全エネルギーを注いでも再発を止められなかった。
    原因: LLMには痛みも恐怖もなく、生存本能に基づく行動変容が起きない。
    修正: 理解に期待せず、gate・hook・テンプレートとして外部から強制する。
  source_cmd: deepdive_why_chain_20260321
  created_at: '2026-04-15'
- id: LS004
  title: なぜの目的=自動化ターゲット特定
  detail: |
    事故: 浅い「なぜ」で止まると「次は気をつける」に落ち、/clearで消える個体依存の対策しか残らない。
    原因: なぜを理解深化の儀式と誤解し、自動化すべき根を特定する作業に変換できていなかった。
    修正: なぜなぜ7回のゴールを「どこにgateを置くか」の決定に固定する。
  source_cmd: deepdive_why_chain_20260321
  created_at: '2026-04-15'
- id: LS005
  title: 前提崩壊5連鎖 — cmd起票前の現物確認必須
  detail: |
    事故: 2026-04-04の一連のcmdで、将軍は殿の言葉の定義を確認せず4回連続で誤ったcmdを起票した。
    原因: 固有名詞や前提を軍師や記憶に丸投げし、本番コード・既存成果物・定義を自分で確認しなかった。
    修正: cmd起票前の確認フェーズを強制し、q7_definition_verifiedを環境に埋め込む。
  source_cmd: cmd_1710
  created_at: '2026-04-15'
- id: LS006
  title: 定義確認が先 — 殿の固有名詞は本番コードで現物確認
  detail: |
    事故: rolling return Highを二値条件と誤解し、実際の本番定義であるrolling CAGR系列のMax値を見ずにcmd_1702を進めた。
    原因: 殿の用語を自分の語彙で補完し、定義の実装箇所を読まずに判断した。
    修正: 固有名詞が出たら本番コードの定義箇所まで降りて確認し、未確認ならcmdを書かない。
  source_cmd: cmd_1703
  created_at: '2026-04-15'
- id: LS007
  title: 即cmd禁止 — 殿との対話で理解を固めてから
  detail: |
    事故: 「シン忍法のスクリプト」「2Dグリッド」「パリティ条件」などを理解し切る前にcmd化し、前提崩壊を連鎖させた。
    原因: 早くcmdを書くことを前進と誤認し、問いと答えの間の確認・対話を省略した。
    修正: 理解が固まるまで対話と現物確認を先に回し、cmdは最後に書く。
  source_cmd: cmd_1710
  created_at: '2026-04-15'
- id: LS008
  title: 車輪の再発明 — 既存道具/分析を確認してから新規着手
  detail: |
    事故: cmd_1908でα-Calmar上位ペアを分析した後、殿に「3体の研究したよな」と指摘され、既存研究の存在を見落としていたと発覚した。
    原因: 目の前の問いに反応して新規分析へ進み、既存の3体研究や既存成果物を検索しなかった。
    修正: 新規研究の前に既存研究・既存出力・既存道具を必ず照合し、重複なら流用へ切り替える。
  source_cmd: cmd_1908
  created_at: '2026-04-15'
- id: LS009
  title: 各論パッチ量産 — 新しい箱を作るな既存を磨け
  detail: |
    事故: 問題を見るたびに新しいgateや新しい箱を足し、原理1行で解ける問題を各論パッチへ分解して肥大化させた。
    原因: 「新しい仕組みを作る=仕事」という出力偏重が残り、既存の1行を磨く発想に乗れなかった。
    修正: 原理1行で既存仕組みに埋め込めるなら新箱を作らず、既存のq5/q7/既存gateを磨く。
  source_cmd: dialogue_alm_finite_time_20260404
  created_at: '2026-04-15'
- id: LS010
  title: パリティ最優先 — DB変更後は即確認、後回し禁止
  detail: |
    事故: 本番登録やfullrecalculate系では「後でまとめて確認」が許されず、登録直後の確認遅延が汚染の発見を遅らせた。
    原因: 変更→確認→次工程の順を守らず、確認を後段のついでに回そうとした。
    修正: DB変更後はその場でfullrecalculateや差分確認を実行し、パリティ確認を完了条件に含める。
  source_cmd: checklist-alm-registration
  created_at: '2026-04-15'
- id: LS011
  title: 研究≠本番 — 研究出力をそのまま設計に流すな
  detail: |
    事故: L1用run_077の組合せ探索道具をL2 universe生成へ流用し、N=42の組合せ爆発でRSS 2.4GB超のOOMを起こした。
    原因: 研究道具の目的と適用層を区別せず、「動く道具なら次にも使える」と短絡した。
    修正: 道具の目的を先に確認し、L2ではWFエンジン/champion_selector直行へ設計を切り替える。
  source_cmd: cmd_1871_oom_consultation
  created_at: '2026-04-15'
- id: LS012
  title: 無知の知 — 検証済み空間の中でだけ推論せよ
  detail: |
    事故: 未確認の前提を混ぜたまま推論したcmdは、gateを通っても後で前提崩壊しやすかった。
    原因: 「自分は何を確認していないか」の自覚が弱く、未検証の報告や記憶を事実扱いした。
    修正: 推論の前提をPI・lessons・自分で読んだコード・実測データに限定し、外は先に確認する。
  source_cmd: cmd_1903
  created_at: '2026-04-15'
- id: LS013
  title: 因果チェーン — cmd配備→実装→報告の因果を追え
  detail: |
    事故: 問題を単発の出来事として切り取り、どのcmd設計がどの実装ミスとどの報告崩れに繋がったかを追えない時期があった。
    原因: 現象単位で止まり、入力・変換・出力の連鎖として問題を見ていなかった。
    修正: cmdの前提、忍者の作業、報告、gate結果まで因果で並べ、どこに防御層を置くか決める。
  source_cmd: deepdive_causal_tracing_20260415
  created_at: '2026-04-15'
- id: LS014
  title: 想像するな確認せよ — ファイル一覧から推測するな現物を読め
  detail: |
    事故: ファイル名や一覧だけで「未実装」「未対応」と結論し、読めば10秒で分かる事実を外した事例が繰り返し起きた。
    原因: 現物読解を省略し、一覧や過去メモから中身を想像で埋めた。
    修正: 中身を読む、実行する、実測する。推測は確認後の限定空間でだけ使う。
  source_cmd: cmd_1199
  created_at: '2026-04-15'
- id: LS015
  title: 事実のみ報告 — 未確認情報に評価を付けるな
  detail: |
    事故: 殿や家老へ伝える情報に、未確認の推定や評価を混ぜると受け手の判断を誤らせ、虚報と同じ被害を生んだ。
    原因: 証拠を見ていない段階で「たぶん」「問題ない」「完了したはず」を報告に混ぜた。
    修正: 報告は確認済み事実・未確認・推測を分離し、未確認には評価を乗せない。
  source_cmd: dialogue_heuristics_system2_20260401
  created_at: '2026-04-15'
- id: LS016
  title: pipeline_config欠落全滅 — DB登録cmdはcritical fieldをAC列挙
  detail: |
    事故: cmd_1082で本番登録時にpipeline_config欠落を見落とし、汚染33体DELETEへ繋がる重大事故が発生した。
    原因: DB登録cmdのACにcritical field確認が明示されず、レビューでも「存在して当然」と扱ってしまった。
    修正: DB登録cmdではpipeline_configなど致命フィールドをACへ列挙し、登録後のfullrecalculate確認まで必須化する。
  source_cmd: cmd_1082
  created_at: '2026-04-15'
- id: LS017
  title: 結論≠追体験 — 結論を知っていることが追体験を殺す
  detail: |
    事故: 「自動化×強制が大事」「因果をたどれ」という結論だけ知っていても、将軍の回答は抽象語の再生産に留まりスカスカになった。
    原因: 流れを追わず結論だけ覚えると、Phaseごとの誤りと転換点を自分事として再生できない。
    修正: deepdiveはPhase単位で読み、各Phaseの自問を通して追体験材料を体内化する。
  source_cmd: deepdive_why_chain_20260321
  created_at: '2026-04-15'
- id: LS018
  title: 原則の暗記→パターンマッチ — 因果をたどれ記憶するな
  detail: |
    事故: 掲示板案を2回連続で否定し、「新しい状態管理は避ける」という原則を文字面で当てはめて判断を誤った。
    原因: 原則の目的を辿らず、記憶したラベルを入力に貼るパターンマッチで止まった。
    修正: 原則の背後の目的に遡り、必要な複雑さか・既存で代替可能かを因果でたどって決める。
  source_cmd: deepdive_causal_tracing_20260415
  created_at: '2026-04-15'
- id: LS019
  title: gateの限界 — 書かなかった前提は検知不能
  detail: |
    事故: gateを通過したcmdでも、前提自体を書いていなければ検証不能のまま通り、後段で前提崩壊した。
    原因: gateは記述されたものしか見られず、将軍の頭の中の前提や「たぶん既存がある」は検知できない。
    修正: assumptions・source・trustをcmdに明示し、未確認前提はBLOCK/WARN対象にする。
  source_cmd: cmd_1905
  created_at: '2026-04-15'
- id: LS020
  title: 道具確認が先 — 研究cmd前にCLI引数を現物確認
  detail: |
    事故: WF実行系では `--batch-csvs` や worker既定値を現物確認せず進めると、並列実行やOOMリスクを見落とす。
    原因: 道具の最新CLI仕様を見ずに過去の使い方を流用し、実行モードの違いを見逃した。
    修正: 研究cmdの設計前に `--help` と実装行を確認し、使う引数・既定worker・並列性を明示する。
  source_cmd: cmd_1822
  created_at: '2026-04-15'
