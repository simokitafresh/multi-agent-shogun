  created_at: '2026-04-15'
  automated: partial
  enforcement: 'deepdive必読(Step 2.55)で追体験。追体験検証Q5「殿が前提を崩した場面はあるか」で殿のヒントパターンを自問'
- id: LS023
  title: 殿の沈黙≠承認 — 承認も否定もない時は確認せよ
  detail: |
    事故: 殿が応答しない提案を「暗黙の承認」と解釈してcmd起票→後で前提崩壊。preprocessing_research Phase 15でUWPを3回目に指摘されるまで殿が何を重視しているか聞けていなかった。
    原因: 殿の沈黙を「問題なし」と解釈する楽観バイアス。殿は全てに応答する義務がない。
    修正: 重要な前提を含む提案に殿が応答しなければ「この前提で進めてよいか」を明示的に確認する。
  source_cmd: dialogue_preprocessing_research_Phase15
  created_at: '2026-04-15'
  automated: false
  enforcement: '未自動化。殿の沈黙検知はgate化困難(殿の入力タイミングは将軍の制御外)。将軍の自問に依存'
- id: LS024
  title: 殿の怒り=時間泥棒 — 想像/浅い/各論の3パターン
  detail: |
