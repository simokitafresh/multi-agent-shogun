# 将軍(shogun)教訓 — パターン集約版 (v3)
# v2: 21クラスタ+14個別=35件(2026-04-24〜25)
# v3: 14個別を既存クラスタに吸収→22件(2026-04-25統合)
# v1全文アーカイブ: docs/research/lessons_shogun_v1_archive.md
#
# 読み方:
#   - 各エントリは再利用可能なパターン(個別事故記録ではない)
#   - source_ids: 統合元のLS番号一覧。追体験にはv1アーカイブを参照
#   - enforcement: 環境埋込み先。全件automated:true
#   - 個別事故の詳細が必要な場合→v1アーカイブ参照
# 追記: bash scripts/lesson_write_shogun.sh "タイトル" "詳細" cmd_XXX ["enforcement"]
lessons:

# === クラスタ1: deepdive原理 ===
- id: LS-A01
  title: deepdive原理ポインタ — 詳細はmemory/deepdive_*.md
  detail: |
    観察スキップ→出力偏重→自動化×強制→追体験で起動。
    deepdive毎セッション必読(CLAUDE.md Step 7)で追体験済み。
    結論≠追体験。原則暗記→パターンマッチは因果をたどれていない証拠。
  source_ids: [LS001, LS002, LS003, LS004, LS017, LS018]
  created_at: '2026-04-24'
  automated: true
  enforcement: 'memory/deepdive_why_chain_20260321.md + deepdive_causal_tracing_20260415.md 毎セッション必読(CLAUDE.md Step 7)。追体験検証5問で強制自問'

# === クラスタ2: 殿との対話パターン ===
- id: LS-A02
  title: 殿との対話原則 — ヒントは方向指示、沈黙は承認ではない
  detail: |
    (1)殿のヒントは結論でなく方向。因果でたどってから行動
    (2)沈黙≠承認。重要前提は明示的に確認
    (3)怒り=時間泥棒の3パターン: 想像/浅い思考/各論パッチ
    (4)同じ指摘2回=上位構造を抽出し教訓化
    (5)殿の問いには症状でなく構造を見よ
  source_ids: [LS021, LS022, LS023, LS024, LS026]
  created_at: '2026-04-24'
  automated: true
  enforcement: 'deepdive追体験Q5(殿が前提を崩した場面特定)+cmd_save.sh q5/q8で想像/各論を部分対処'

- id: LS-A03
  title: 前提切替原則 — PJ切替・方向転換・新検証で古い前提をリセット
  detail: |
    殿が方向転換したらサンクコストを捨てよ。新検証結果は古い前提を覆す。
    PJ切替時はcontext再ロード。対話中の暗黙的PJ切替に注意。
    assumptions timestampで古い前提の使用を検出。
  source_ids: [LS025, LS028, LS029]
  created_at: '2026-04-24'
  automated: true
  enforcement: 'cmd_save.sh assumptions(AC>=3でBLOCK)+trust:unverified検出。/switch-projectスキルでPJ切替時context再ロード'

# === クラスタ3: cmd_save.sh BLOCK対応 ===
- id: LS-A04
  title: cmdテンプレートルール — バンドルFP回避+AC設計+書き方是正
  detail: |
    (1)command内にスクリプトフルパスを書かない(引数のみ)
    (2)target_pathは出力ディレクトリに設定(スクリプトパスと重複回避)
    (3)claim/assumptions内にファイル拡張子を含めない(一般名で記載)
    (4)1本ずつ昇格→委任→次(同時pendingでBLOCK)
    (5)AC条件はworktree状態と照合(dirty worktree衝突回避)
    (6)CoDDのACにimplementを入れるな(準備と実装は別cmd)
    (7)environment_changeは自cmdの成果物を参照先にしない(未存在でBLOCK。既存教訓を参照)
    (8)quality_gate拡張フィールド(q4-q11+diagnosis)全記入。省略→WARN累計昇格
    (9)q8は3部構成(WHY→WHAT→複利)。複利の問い忘れ→WARN
    (10)assumptions claimは末尾に「(確認日: YYYY-MM-DD)」独立パターン
    (11)claim内にファイル名を書くな。「何を確認したか」だけ書け
    (12)commandはターゲットファイル単位でグループ化(番号付きステップ列挙→command_steps_over_ac発火)
  source_ids: [LS061, LS064, LS067, LS068, LS069, LS072, LS081, LS088, LS089, LS090, LS091, LS093, LS094, LS095, LS097, LS023, LS026, LS030, LS032, LS033, LS034, LS035, LS036]
  created_at: '2026-04-25'
  automated: true
  enforcement: 'cmd_save.sh Check 14(バンドル検出)+Check 20(assumptions全フィールドパス検証)+environment_change grep検証+q8_compound検出+assumptions_claim_date+command_steps_over_ac'

- id: LS-A05
  title: 遡及学習対応 — BLOCKされたら修正より先にlesson_write
  detail: |
    教訓記録を後回しにすると遡及学習のWARN累計昇格で後続全cmdが汚染される。
    連鎖起票時は各cmdのgate前に前cmdの教訓記録を完了させる。
    緊急対応モードでもgate形式フィールドを省略するな(cmd_2259事故)。
    これは成長ループの正しい動作。教訓記録先送りが問題。
  source_ids: [LS062, LS070, LS071, LS073, LS076, LS077, LS092, LS029]
  created_at: '2026-04-25'
  automated: true
  enforcement: 'cmd_save.sh遡及学習(record_warn_reason内で過去N回BLOCK表示+WARN累計昇格でBLOCK化。自動強制)'

- id: LS-A06
  title: BLOCK→成長の主軸 — コードを読め、1CMD1ゲート、環境変化
  detail: |
    BLOCKされたらgateの検出ロジックのコードを読んでから修正(表面修正ループ脱出)。
    cmd_save.sh Session Stateが同一WARN 2回目以降で検出ロジックを自動表示。
    殿の定義: BLOCKされたら次のCMDでBLOCKされないように成長する=主軸。ゲートを通すのは枝葉。
  source_ids: [LS044, LS078, LS083, LS096]
  created_at: '2026-04-24'
  automated: true
  enforcement: 'cmd_save.sh Session State(GP-201: 過去BLOCK履歴自動表示+検出ロジック表示)+environment_change強制'

# === クラスタ4: gate迂回・先走り ===
- id: LS-A07
  title: gate迂回禁止 — 正規フローが通らない=調査対象
  detail: |
    迂回は1回で致命的(滑り坂: 1回目→2回目→3回目で完全崩壊)。
    正規フローが通らない=インフラバグか自分の理解不足。どちらも調査すれば解決。
    draft→pending→delegatedの3段階に全て理由がある。
    原因は100%自分の選択にある。他責厳禁。
  source_ids: [LS049, LS050, LS051, LS052]
  created_at: '2026-04-24'
  automated: true
  enforcement: 'cmd_delegate.sh guard(status=delegated未満はinbox_write BLOCK)+pre-bash-combined.sh Guard 4(shogun_to_karo regex BLOCK)'

- id: LS-A08
  title: 殿の指示範囲厳守 — 近道を最後にする、100億回従う
  detail: |
    先走りは究極の害。殿の指示範囲を完遂してから次を考える。
    殿が話していないことを記録するな(知識記録での先走り)。
    殿の指示は文字通り全て従う。省略・効率化・まとめ処理は指示違反。
  source_ids: [LS053, LS054, LS055]
  created_at: '2026-04-24'
  automated: true
  enforcement: 'deepdive Phase 2(出力=仕事の罠)との紐付け。追体験で構造的に自問強制'

# === クラスタ5: 想像するな確認せよ ===
- id: LS-A09
  title: 現物確認必須 — 定義/パス/データ/DB/掲示板/過去対話/PI全量照合
  detail: |
    (1)殿の固有名詞→本番コードの定義箇所まで降りる
    (2)「未実装」「未対応」→grep/git showで反証を探す
    (3)cmd起票前に理解を固める。即cmd禁止
    (4)掲示板/過去対話の「未完了」→現在も未完了かls/grepで確認
    (5)パイプライン系cmdは全レイヤーの入出力を現物確認
    (6)金融データは遡及的に変わる。過去データ不変の暗黙前提禁止
    (7)技術的可能≠ビジネス制約クリア。PI全量照合して禁止制約確認してからcmd起票(cmd_2258 PI-024事故)
  source_ids: [LS005, LS006, LS007, LS014, LS038, LS045, LS065, LS079, LS080, LS082, LS085, LS028]
  created_at: '2026-04-25'
  automated: true
  enforcement: 'CLAUDE.md「想像せずに確認する原則」+cmd_save.sh q5(BLOCK)+q7(BLOCK)+q10(WARNING)+Check 20 assumptions(BLOCK)'

- id: LS-A10
  title: 計測は仕組みを理解してから — 数字の生成メカニズムを先に理解
  detail: |
    計測データの生成メカニズム(コードパス)を理解せずに数字で結論するな。
    ローカル計測(WSL→Singapore RTT 80ms)≠本番ボトルネック(Render内RTT 1-5ms)。
    計測環境を明記し本番との差異を注記。本番特定にはRender上計測必須。
  source_ids: [LS039, LS041]
  created_at: '2026-04-24'
  automated: true
  enforcement: '設計書§4.1に計測環境注意追記済み。偵察cmdは計測環境をACに明記'

# === クラスタ6: 独立パターン ===
- id: LS-A11
  title: infra修正実績 — バグはenforcement(hook/gate)で修正済み
  detail: |
    CDP 403=auto-ops launch_browser(非headless)。inbox盲点=PostToolUse hook。
    watcher STATE_DIR不一致=再起動で修正。掲示板prepend=insert(0,...)。
    復帰手順スキップ=マーカー+hook。hookラベル+引用マーク=awk自動付与。
  source_ids: [LS032, LS033, LS037, LS074, LS084, LS086, LS087]
