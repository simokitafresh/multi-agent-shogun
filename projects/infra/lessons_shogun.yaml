- id: LS-A12
  title: inbox_write guard 3段階設計 — 迂回路ゼロの構造
  detail: |
    第1版=exit code判定→出力多様で不安定。第2版=status判定→正規フローもBLOCK。
    第3版=cmd_delegate.sh内でstatus変更順序入替→bypass廃止→迂回路ゼロ。
    教訓: (a)guardはデータ状態で判定 (b)bypass許可=迂回路 (c)テストに攻撃パターン含めよ
  source_ids: [LS040]
  created_at: '2026-04-24'
  automated: true
  enforcement: 'inbox_write.sh cmd_new guard(status判定)+cmd_delegate.sh status変更順序'

- id: LS-A13
  title: cmd設計3原則 — assumptions明示/3層防御/environment_change主軸
  detail: |
    (1)assumptions+tool引数を明示(q5/q7 gate強制)。書かなかった前提はgate検知不能
    (2)事前100%は怠慢→事前(粗い網)+事後(軍師レビュー)+診断(Session State)の3層
    (3)environment_changeが成長の主軸。type/file/patternに構造化→grep検証→未実装BLOCK
    (4)バンドル検出3段階: 各論パッチ→定義修正→除外リスト。定義を正しくすることが先
  source_ids: [LS019, LS020, LS035, LS047, LS048, LS056, LS057, LS059]
  created_at: '2026-04-24'
  automated: true
  enforcement: 'cmd_save.sh q5/q7/q10(BLOCK/WARN)+Check 3.6(environment_change強制)+Check 22(粗い網)+Session State(GP-201)'

- id: LS-A14
  title: 進行中計画は即永続化 — /clearは予告なく来る
  detail: 殿の裁定・cmd間の依存関係はその場でcontext/progress系に永続化。完了を待つな。
  source_ids: [LS034]
