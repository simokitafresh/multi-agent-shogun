    原因: 原則の目的を辿らず、記憶したラベルを入力に貼るパターンマッチで止まった。
    修正: 原則の背後の目的に遡り、必要な複雑さか・既存で代替可能かを因果でたどって決める。
  source_cmd: deepdive_causal_tracing_20260415
  created_at: '2026-04-15'
  automated: true
  enforcement: 'memory/deepdive_causal_tracing_20260415.md毎セッション必読(CLAUDE.md Step 2.55) + 追体験検証Q4「Phase NがPhase Mで覆された例。なぜ覆されたか？」→原則暗記パターンの自己検出を強制'
- id: LS019
