  enforcement: 'Level4(フロー内WARN/BLOCK接続): scripts/gates/gate_shogun_startup.sh check_ci_red_autodeploy() は timeout既定8sを復元し、未完了時はasync回収設計で直列待ちを増やさず、ci_json空応答はsilent deathを避けるためDIGESTのci=unknown/ci=failure表示で毎起動可視化する。CI failure時は同gate内でWARN化し、scripts/inbox_write.sh経由でkaroへci_red_fix配備を通知する。一次情報再検証(2026-07-09 cmd_reflux_promotion_202607090413_kagemaru): git blameで修復commit d5ed06f9bがgate_shogun_startup.sh L122-L125の8s timeout復元+silent-skip禁止コメントを導入済みと確認。tests/unit/test_gate_shogun_startup.bats「CI RED failure sends ci_red_fix to karo and shows WARN」はSHOGUN_STARTUP_GH_TIMEOUT=5でci=failure/WARN/inbox送信をassertし、「CI GREEN passes silently without WARN or inbox notification」はci=successをassert。旧enforcementはtype=gate/pattern=ci=のみでgate_lesson_enforcement_level.shがL1誤分類したため、構造化enforcement_levelを明示する。'
