  source_cmd: cmd_1903
  created_at: '2026-04-15'
  automated: true
  enforcement: 'cmd_save.sh q10_knowledge_boundary(WARNING) + q5_verified_source(BLOCK)。推論の前提と確認手段を明示強制'
