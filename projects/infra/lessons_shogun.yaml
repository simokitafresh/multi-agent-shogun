# === クラスタ5: 想像するな確認せよ ===
- id: LS-A09
  title: 現物確認必須 — 定義/パス/データ/DB/掲示板/過去対話/PI全量照合
  origin: '[[cmd_1710]] [[cmd_1703]] [[cmd_1199]] [[cmd_2213]] [[cmd_2233]]'
  detail: |
    現物確認29則。全文→docs/research/lessons_shogun_a04_a09_detail.md(2026-07-12 v4圧縮で移設)。核心則のみ再掲:
    (1)殿の固有名詞→本番コードの定義箇所まで降りる。(2)「未実装」→grep/git showで反証を探す
    (8)grepの存在確認は内容理解ではない。反証の不在≠不在の証明。(23)grepは断片、実行は全体。gate/script修正前に対象を実行して現在出力を確認
    (17)検証手段がその主張を証明できるか先に確認(git show --statは内容を証明しない。混入検分はgit show -w+実差分照合)。忍者のbinary_check yesも未検証の主張。整形分離ACのGATE CLEARは将軍が自らgit show -wで再検分
    (9)capture-paneを殿の裁定と断定するな。殿の裁定はlord_conversation inboundのみ。破壊的操作前に殿の明示承認必須(cmd_2783 force push事故)
    (27)殿の発言帰属捏造禁止(Guard15)。(28)忍者作業中の共有ツリーでブランチ切替え・index書込み・--amend禁止。read-onlyのみ。修正は常に新規commit
    (18)TZ付き時刻は暗算禁止。UTC/JST併記+date検算。(19)リモート状態の報告前にgit fetch必須
    (26)集計値は「どのイベントの前か後か」を確認。(32)UPSERT運用テーブルのupdated_atは最終上書き時刻。値の変化履歴+過去裁定の両方確認
    (13)実行順バグは設計意図カタログ([[infra_design_intent]])を先に照合。(22)自分の試行錯誤は隠れインフラバグのサイン。仮説は一次データで検証してからcmd化
    (34)実装完了≠本番到達(2026-07-13 cmd_3877): 第1段実装をgit showで確認したがlive deploy状態(consumer refs)を未確認のまま本番実行cmdを起票→家老AC1検分でlive refs=0発覚(本番run 0で停止、実害なし)。三hash区別(local/origin/live)は記録済みだったのに照合せず。本番実行系cmdのq5にlive反映確認(deploy commit/エンドポイント現物)を必須で含めよ。殿指摘「場当たり禁止。雑になっているぞ」
    (33)GATE CLEAR通知も未検証の主張(2026-07-13 cmd_3869偽CLEAR事故): report単体承認をcmd_complete_gateが親cmd完了と誤判定しCLEAR通知が飛んだ。将軍実測(bak残899個・df不変=削除0)との突合で検出。GATE CLEAR受信時はcmdの主要成果物(削除ならdf/件数、実装ならcommit/テスト)を一次データで突合してから完了と扱え。(17)のGATE CLEAR通知への拡張。構造根治=parent_ac_coverage mapping+fingerprint×正式承認SSOT(cmd_karo_hotfix_parent_ac_false_clear)
    (35)gateの自動修復提案(--fix等)も未検証の主張(2026-07-14 WA台帳偽解決事故): データ削除・上書き系の修復コマンドは対象エントリの中身を読み同一性(canonical原因単位)を自分で確認してから実行。gateの検出も修復提案も一次データで突合してから従う=(33)の拡張。全文→docs/research/lessons_shogun_a04_a09_detail.md
    (36)working tree現物での「修正済み」判定禁止(2026-07-14 semantic除外誤裁定): working treeは他者の未commit差分を含む共有作業場。「修正済み」判定はgit show HEAD:fileまたは-S/-Lのcommit証跡のみ。検索null結果(帰属先なしの一次情報)を見逃すな。全文→docs/research/lessons_shogun_a04_a09_detail.md
    (37)本番修復のスコープは症状由来でなく不変量からの逸脱全件で決めよ(2026-07-14 cmd_3905復元漏れ): 将軍が復元対象を「アラートに載った161行」で固定→アラートは上書きのみ検知し新規INSERT(7/13行23件)を拾わない構造だったため、復元後もAPIは誤値を返し続けた。殿の「検証しよう」指示による家老再検証で捕捉。是正=全対象を不変量(ledger最新event)との照合述語で機械的に導出し、mismatch全件を対象化(184行照合→23行追加復元→184/184 exact)。上位構造: 検知器の出力は検知器の盲点を継承する。修復・検証のスコープを検知器由来にせず、正しさの定義(不変量)から導け。(2)の「反証を探す」の修復スコープへの拡張
    (38)(LS103吸収2026-07-26)継続する警告を'stale'と流すな — 同一警告がN回続くのは必ず原因がある。見慣れた警告を流す前に発火条件を1度掘れ(RECOVERY INCOMPLETE nag 3時間放置の実例。全文→superseded_archive §LS103)
    (39)(LS106吸収2026-07-26)閾値の根拠はgit logでたどれ — 逆算で置かれた数値(実数32から発火させるための31等)は成長を装った空転を生む(全文→superseded_archive §LS106)
    (旧detail残りは移設先参照)
