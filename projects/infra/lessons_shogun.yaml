- id: LS-A15
  title: 研究道具制約 — 研究≠本番、GS OOM防止は1忍法1CMD
  detail: |
    研究出力を本番に流すな(目的と適用層を区別)。
    忍法GSは1忍法1CMD×1忍者。配備は完全直列。並列配備禁止(RSS=8.5GB実証)。
    WF並列実行禁止(OOM Killer実証)。直列1本ずつが正解。
  source_ids: [LS011, LS058]
  created_at: '2026-04-24'
  automated: true
  enforcement: 'pre-bash-combined.sh Guard 8(wf_runner.py BLOCK)+MCP L-ResearchVsProduction'

- id: LS-A16
