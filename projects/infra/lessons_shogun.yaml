  detail: |
    CoDD #5の3層(L1事前/L2事後/L3診断推論)を直接適用→Session State。
    外部知見の取込パターン: 記事→対応探す→ギャップ→なぜなぜ→cmd化。
    忍者の成長=間違える余地がない構造(report_field_set.sh GP-072c5)。
