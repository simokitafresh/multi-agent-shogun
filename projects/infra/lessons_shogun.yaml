- id: LS021
  title: 殿の問いの意図を読み違える — 症状でなく構造を見よ
  detail: |
    事故: 殿「将軍の解答は異常にまでスカスカ」→将軍は回答内容(症状)を見返したが、家老・軍師との構造的差異(原因)に到達できなかった。殿に「家老の解答も見ろ」「家老と軍師にあって将軍にだけ無いもの」と段階的にヒントを貰って初めて到達。
    原因: 殿の指摘を「直す対象」として受け取り、「なぜそうなるか」の構造探索に変換できなかった。
    修正: 殿が問題を指摘したら、まず「なぜ自分だけがこうなるか」の構造差を探す。症状を見るな、構造を比較せよ。
