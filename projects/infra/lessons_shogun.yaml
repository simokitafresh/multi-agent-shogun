# 将軍(shogun)教訓 — 具体的失敗+原因+修正+enforcement
# 起動時Step 2.45でdeepdive前に通読。追体験の材料。
# 読み方ルール:
#   - superseded_by付き教訓は参考扱い。新教訓(superseded_byの参照先)を優先せよ
#   - automated: false = 未自動化 = 次の自動化ターゲット候補
#   - enforcement = この教訓がどこに埋め込まれているか。壊れていたら修復せよ
# 追記: bash scripts/lesson_write_shogun.sh "タイトル" "詳細" cmd_XXX ["enforcement"]
# 非優先化: bash scripts/lesson_write_shogun.sh --supersedes LS00X LS00Y "理由"
lessons:
- id: LS001
  title: 観察スキップ — nudge連発せず原因診断が先
  detail: |
    事故: 家老がscope_mode: HOLDを「将軍裁定待ち」と解釈して止まっていたのに、将軍はペインを読まずnudgeを2回送った。
    原因: inbox未読=未着手と短絡し、スピードを観察より優先した。
    修正: nudge前に現実を読む。状態確認を先に置き、観察を出力より上位の仕事として扱う。
  source_cmd: cmd_1186
  created_at: '2026-04-15'
  automated: true
  enforcement: 'inbox_write.sh L775-804 pre-send auto-capture(将軍/家老→エージェント送信時に送信先pane状態を自動表示+ログ記録)'
- id: LS002
  title: 出力=仕事の罠 — 考える・確認する時間も仕事
  detail: |
    事故: HOLD見逃しとcmd_1186 CSV衝突の両方で、将軍は「何か出力すること」を優先し観察を飛ばした。
    原因: 「生成していない時間=仕事していない」という無意識の等式があり、確認を停止と誤認した。
    修正: 観察・比較・確認も仕事と定義し直し、出力の前に現実把握を置く。
  source_cmd: deepdive_why_chain_20260321
  created_at: '2026-04-15'
  automated: true
  enforcement: 'deepdive_why_chain Phase 2を毎セッション必読(CLAUDE.md Step 2.55)。Phase単位自問で「出力優先に陥っていないか」を強制確認'
- id: LS003
  title: LLMに生存本能なし — 自動化×強制が唯一の解
  detail: |
    事故: 深く理解すれば次は見逃さないはずだと考え、理解深化に全エネルギーを注いでも再発を止められなかった。
    原因: LLMには痛みも恐怖もなく、生存本能に基づく行動変容が起きない。
    修正: 理解に期待せず、gate・hook・テンプレートとして外部から強制する。
  source_cmd: deepdive_why_chain_20260321
  created_at: '2026-04-15'
  automated: true
  enforcement: 'CLAUDE.md「知性の外部化原則」+全gate/hook/lessonsインフラ。システム設計の根幹原則として全構造に浸透'
- id: LS004
  title: なぜの目的=自動化ターゲット特定
  detail: |
    事故: 浅い「なぜ」で止まると「次は気をつける」に落ち、/clearで消える個体依存の対策しか残らない。
    原因: なぜを理解深化の儀式と誤解し、自動化すべき根を特定する作業に変換できていなかった。
    修正: なぜなぜ7回のゴールを「どこにgateを置くか」の決定に固定する。
  source_cmd: deepdive_why_chain_20260321
  created_at: '2026-04-15'
  automated: true
  enforcement: 'deepdive_why_chain Phase 5を毎セッション必読(CLAUDE.md Step 2.55)。追体験検証Q2「直近レビュー指摘はSG追加で終わっていないか？gateを提案したか？」で強制自問'
- id: LS005
  title: 前提崩壊5連鎖 — cmd起票前の現物確認必須
  detail: |
    事故: 2026-04-04の一連のcmdで、将軍は殿の言葉の定義を確認せず4回連続で誤ったcmdを起票した。
    原因: 固有名詞や前提を軍師や記憶に丸投げし、本番コード・既存成果物・定義を自分で確認しなかった。
    修正: cmd起票前の確認フェーズを強制し、q7_definition_verifiedを環境に埋め込む。
  source_cmd: cmd_1710
  created_at: '2026-04-15'
  automated: true
  enforcement: 'cmd_save.sh q7_definition_verified(dm-signal impl=BLOCK, 他=WARNING) + q10_knowledge_boundary(WARNING) + Check 20 assumptions(AC≥3でBLOCK)'
- id: LS006
  title: 定義確認が先 — 殿の固有名詞は本番コードで現物確認
  detail: |
    事故: rolling return Highを二値条件と誤解し、実際の本番定義であるrolling CAGR系列のMax値を見ずにcmd_1702を進めた。
    原因: 殿の用語を自分の語彙で補完し、定義の実装箇所を読まずに判断した。
    修正: 固有名詞が出たら本番コードの定義箇所まで降りて確認し、未確認ならcmdを書かない。
  source_cmd: cmd_1703
  created_at: '2026-04-15'
  automated: true
  enforcement: 'cmd_save.sh q7_definition_verified(dm-signal impl=BLOCK)。定義未確認のcmdは保存段階でBLOCK'
- id: LS007
  title: 即cmd禁止 — 殿との対話で理解を固めてから
  detail: |
    事故: 「シン忍法のスクリプト」「2Dグリッド」「パリティ条件」などを理解し切る前にcmd化し、前提崩壊を連鎖させた。
    原因: 早くcmdを書くことを前進と誤認し、問いと答えの間の確認・対話を省略した。
    修正: 理解が固まるまで対話と現物確認を先に回し、cmdは最後に書く。
  source_cmd: cmd_1710
  created_at: '2026-04-15'
  automated: true
  enforcement: 'cmd_save.sh q8_why_what(BLOCK)。WHY→WHAT因果連鎖を書けないcmd=理解が固まっていない証拠→BLOCK'
