  title: 車輪の再発明 — 既存道具/分析を確認してから新規着手
  detail: |
    事故: cmd_1908でα-Calmar上位ペアを分析した後、殿に「3体の研究したよな」と指摘され、既存研究の存在を見落としていたと発覚した。
    原因: 目の前の問いに反応して新規分析へ進み、既存の3体研究や既存成果物を検索しなかった。
    修正: 新規研究の前に既存研究・既存出力・既存道具を必ず照合し、重複なら流用へ切り替える。
  source_cmd: cmd_1908
  created_at: '2026-04-15'
  automated: true
  enforcement: 'cmd_save.sh q11_not_already_done(BLOCK)。既存成果物・既存道具の現物確認結果を明示しないとBLOCK'
- id: LS009
  title: 各論パッチ量産 — 新しい箱を作るな既存を磨け
  detail: |
    事故: 問題を見るたびに新しいgateや新しい箱を足し、原理1行で解ける問題を各論パッチへ分解して肥大化させた。
    原因: 「新しい仕組みを作る=仕事」という出力偏重が残り、既存の1行を磨く発想に乗れなかった。
    修正: 原理1行で既存仕組みに埋め込めるなら新箱を作らず、既存のq5/q7/既存gateを磨く。
  source_cmd: dialogue_alm_finite_time_20260404
  created_at: '2026-04-15'
  automated: partial
  enforcement: 'lessons_gunshi LG023(原理1行>各論パッチ)+gunshi review因果推論ルール L207。軍師がdraft reviewで各論パッチを検出→REQUEST_CHANGES。将軍側の自動BLOCKはなし(軍師レビューに依存)'
- id: LS010
  title: パリティ最優先 — DB変更後は即確認、後回し禁止
  detail: |
    事故: 本番登録やfullrecalculate系では「後でまとめて確認」が許されず、登録直後の確認遅延が汚染の発見を遅らせた。
    原因: 変更→確認→次工程の順を守らず、確認を後段のついでに回そうとした。
    修正: DB変更後はその場でfullrecalculateや差分確認を実行し、パリティ確認を完了条件に含める。
