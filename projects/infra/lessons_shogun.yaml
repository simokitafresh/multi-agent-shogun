  detail: |
    事故: 問題を単発の出来事として切り取り、どのcmd設計がどの実装ミスとどの報告崩れに繋がったかを追えない時期があった。
    原因: 現象単位で止まり、入力・変換・出力の連鎖として問題を見ていなかった。
    修正: cmdの前提、忍者の作業、報告、gate結果まで因果で並べ、どこに防御層を置くか決める。
