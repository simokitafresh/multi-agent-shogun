- id: 'LG070'
  title: 'ACで選択肢を閉じるな — draft段階でしか捕まらない唯一の型'
  origin: '[[cmd_karo_recon_finalize_polling_to_event_20260726]] -> [[AC設計の仮説汚染]] -> [[実測が効かない]]'
  detail: '2026-07-26、家老はfinalize調査のAC1(b)を「家老のポーリング待機時間か、gate処理自体の時間か」の2択で設計した。第3の可能性(軍師のレビュー待ち時間)が抜けており、実測すると軍師のレビュー往復が585.5秒=91%で支配的であった。2択のままなら第3が支配的でも「家老かgateか」のどちらかに誤帰属していた。★AC設計の仮説汚染は他と性質が違う: 軍師の13件・家老の36件は自分の推論であり実測すれば自分で潰せたが、AC設計の汚染は忍者が実測しても潰れない。忍者は与えられたACに従うためである。∴本日扱った全ての型の中で唯一「実測が効かない」ものであり、レビュー(draft段階)でしか捕まらない。★軍師自身もB44のAC2「(1)(2)に稼働実装にない判定が含まれていないか」の2択を受け入れ、「実装しているが到達しない」という第3の状態を見落とした(後にA10=到達可能性として新設)。★また枠の不足は情報の欠落ではなく情報の移動として現れる: 才蔵はAC3の2択に主文で「別々」を選びつつ括弧内に混在を正確に記した。主文と詳細の粒度差は枠不足のサインである'
