- id: LG005
  title: AC pending矛盾 — status:done報告にAC pending項目があればFAIL
  detail: 忍者がstatus:doneで報告しつつAC pending項目が残存する矛盾パターン。cmd_1199影丸で発見。done報告にpending ACがあれば即FAIL判定し、差し戻すこと。
  source_cmd: cmd_1199
  origin: '[[cmd_1199]]'
  created_at: '2026-03-21'
  automated: true
  enforcement_level: 4
  enforcement: "Level4(フロー内BLOCK): scripts/gates/gate_report_format_main.py がterminal verdict PASSのbinary_checksを全件検査し、result空欄は『verdict: PASS but binary_checks contain empty result(s)』でBLOCK。status=pending自体も別経路でBLOCKし、revision_requestedのPASSもcompletedへ戻るまでBLOCK。gate_report_format.shが全report提出経路で強制する。"
  when: "report提出時。status:done/completedでACのbinary_checks.resultが空、またはstatus:pending/revision_requestedのままterminal verdictを持つと自動BLOCK"
  how: "全ACのbinary_checks.resultをyes/noで埋め、statusをcompletedにしてgate_report_format.shをPASSさせる。未完ACを残したdone報告は構造的に通らない。"
