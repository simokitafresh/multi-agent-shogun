  when: 'draftレビューでACが選択肢を列挙している時(2択・4択・分類軸の指定)。reportレビューで主文の分類と詳細の記述を読む時'
  how: 'ACが2択なら第3が無いかを問え。「AかBか判定せよ」なら「どちらでもない」が報告可能かを問え。脱出路を1箇所に置いても別のACで選択肢を閉じていれば足りない。reportでは主文の分類と詳細の記述が一致しているかを見よ。粒度差があれば枠が不足している'
