- id: LG024
  title: 軍師直接修正権限 — 軽微事実誤りは鎖維持下で直接修正可
  detail: |
    殿裁定(2026-04-08): 軍師がレビュー中に発見した軽微な事実誤り(数値欠落・パス誤記等)は
