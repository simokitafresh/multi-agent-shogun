- id: 'LG069'
  title: '仮説が探索範囲を汚染する — 一致を見た時点で確認を終えるな'
  origin: '[[gunshi_thirteen_errors_20260726]] -> [[hypothesis_contaminated_search]] -> [[confirmed_scope第2形]]'
  detail: '2026-07-26、軍師は13件誤ったが共通構造は単一である: 仮説を先に持ち、仮説に合う断片を見つけた時点で確認を終える。実例: (1)stem部分一致で家老の判定を14件偽陽性と誤断(厳密なgate:フィールドでは0件) (2)自己参照除外フィルタが原因と誤推定(真因は走査範囲=~/.claude/settings.jsonが対象外) (3)才蔵が対象範囲差を見落としたと誤断(報告本文に明記済みだった) (4)疾風の機序2は既是正と誤断(当該commitは報告の57秒後) (5)変数名の対比表で起動スクリプトの違いを見落とし (6)LG048のINFOだけを見てBLOCKを見落とし (7)planned_pathsをトップレベル2キーだけ探しNoneを得て契約不整合と誤断(実際はcommit_contract配下に9件実在)。★特に(7)は直前に立てた教訓「何を直すかを変えたらどこを触ってよいかも変えねばならない」とFAIL文言が一致したため仮説を結論として扱った。MEMORY.md無知の知原則「原理は仮説生成に使え、結論に使うな」の違反である。★教訓の逆説: 教訓が増えるほど一致が起きやすくなり、教訓が多いほど確認が薄くなる。本日立てた教訓群自体が同じ罠になりうる'
