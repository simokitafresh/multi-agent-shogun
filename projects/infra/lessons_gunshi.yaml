- id: LG028
  title: スケーラビリティ推定で内部ループ回数を計上せよ — per_combo固定は過小評価
  detail: |
    cmd_1949でスケーラビリティ推定~39s→実測10分超(10倍外れ)。
    原因: per_combo_ms=8msと仮定し、evaluate_expanding内のfor-loop(63回β推定/combo)を計上しなかった。
    β推定85回/combo × 4,851combo = 412,335回のOLS。1回≈1ms → 412s ≈ 7分。
    推定時は「1 combo内で何回の重い計算が走るか」を関数内部まで追跡せよ。
    対策: _fast_beta関数で10倍高速化(pandas排除→numpy直接OLS)。
    一般原理: 計算時間推定はO(外側ループ)×O(内側ループ)×単位時間。外側のみで推定するな。
