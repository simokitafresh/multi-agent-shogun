  detail: 忍者のcommitにタスクscope外のコード変更が混入することがある。事前検死で変更ファイル一覧とscope定義を照合し、scope外変更を検出せよ。cmd_1187で検出。
  source_cmd: cmd_1187
  origin: '[[cmd_1187]]'
  created_at: '2026-03-21'
  automated: true
  enforcement_level: 4
  enforcement: "Level4(フロー内BLOCK): scripts/ninja_scope_commit.sh がHEAD由来の専用indexへ宣言scopeだけをaddし、commit後にdiff-tree全pathをscope_path_is_in_scopeで二値検証する。空/root/絶対/../scope、patch内scope外path、foreign partial-stageはcommit前BLOCK。report review SG3+gate_report_format.shの事後照合も維持。回帰: tests/unit/test_ninja_scope_commit.bats。実装: 37819bc575d6cd2d42d512073693a079a8e33daf、並行直列化: 08bf0ca128ad930807798e841bd2e3c6d52e4257。"
