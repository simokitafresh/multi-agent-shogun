lessons:
- id: LG001
  title: git show HEAD検証必須 — Read toolはuncommitted含むため既実装判定に不十分
  detail: draft/report reviewで「既実装か」を判定する際、Read toolはuncommittedな変更も含めて表示する。cmd_1178-1181で3件誤判定が発生。対策はgit show HEAD:ファイルで確定済みのコードのみ確認すること。
  source_cmd: cmd_1178
  origin: '[[cmd_1178]]'
  created_at: '2026-03-21'
  automated: true
  enforcement_level: 4
  enforcement: "Level4(フロー内BLOCK、2026-07-17 cmd_reflux_promotion_202607170347_kagemaru): scripts/gunshi_log_append.sh の全review path(draft/report/self_study/consultation)共通append点で、「既実装」主張を含むentryに operational_simulation.command の git show 証跡が無ければ exit 2 BLOCK。tests/unit/test_gunshi_log_append_obs.bats が証跡なしBLOCKと git show HEAD 証跡あり許可を回帰強制。実装commit 2be7e1608a3d005e7682a88b7ee16226b9f24fe7。"
  when: draft/report reviewで既実装判定する時。Read toolはuncommitted含むため不十分
  how: "git show HEAD:ファイルで確定済みコードのみ確認。git log --oneline -1 -- 対象ファイルで直近commitのcmd_idも照合"
- id: LG002
