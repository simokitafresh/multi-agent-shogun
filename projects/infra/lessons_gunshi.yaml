- id: 'LG071'
  title: '判定基準は測定前に固定せよ — before/after実証あり'
  origin: '[[PD-134]] -> [[基準の後付け3改訂]] -> [[B49で1回確定]]'
  detail: '2026-07-26のPD-134では基準を後から3度改訂し、そのたびに判定不能が判明した: 閾値gap>100(恣意的)→将軍が機序から導けへ格上げ→gap=0が62件中0件で判定不能→gapの減少イベント有無へ改訂→分解能97秒>理論窓長75秒で判定不能→2点計測へ転換。★対してB49(refresh並列公開の逆転)では将軍が測定前に(A)(B)(C)を定義し、実測値が出た瞬間に(B)と確定した。解釈の議論がゼロであった。∴基準を後から決めると出た数値に合わせて基準が動き、判定不能の発見が遅れる。★併せて: 「これ以上確認できない」が確定したら判定を保留するな。B49ではsearch_logsに結果内容の列が無く追加確認が原理的に不可能と判明した時点で(iii)確定とした。確認手段が存在しないのに保留すると永久に閉じない。★また「待てば貯まる欠測」と「永久に貯まらない計装の不在」を区別せよ。前者なら観測を続ける価値があり後者なら待っても解決しない'
  source_cmd: 'cmd_karo_impl_b48_refresh_window_2point_telemetry_20260726'
  when: '観測を根拠に将来判断する設計をレビューする時。閾値・観測窓・判定条件が登場する時'
  how: '判定基準が測定前に固定されているかを問え。固定されていなければ「観測後に基準を決めると出た数値に合わせて基準が動く」と指摘せよ。閾値より実測値で直接判定できる方式を優先せよ(理論値が実態を represent していない場合でも影響を受けない)'
