# 家老(karo)教訓 — パターン集約版 (v2)
# 統合前: 92件/506行(2026-03-19〜04-24, v1)
# 統合後: 22件/本ファイル
# v1全文アーカイブ: docs/research/lessons_karo_v1_archive.md
#
# 読み方:
#   - 各エントリは再利用可能なパターン(個別事故記録ではない)
#   - source_ids: 統合元のLK番号。追体験にはv1アーカイブ参照
#   - enforcement: 環境埋込み先。全件automated:true
# 追記: bash scripts/lesson_write_karo.sh "タイトル" "詳細" cmd_XXX ["enforcement"]
lessons:

# === 確認系原則 ===
- id: LK-A01
  title: 行動する前に対象の現在状態を直接確認せよ
  detail: |
    LK065で17件を原理統合済み。信号は事実ではない。ダッシュボードは過去。pane末尾は残像。
    capture-pane/grep/gh run viewで一次データを確認してから行動。
    CI赤/STALL/idle通知全てに適用。pane tail -3で判断するな(8回見逃し実証)。
  source_ids: [LK006, LK009, LK012, LK018, LK030, LK037, LK040, LK041, LK043, LK044, LK047, LK048, LK052, LK054, LK065, LK069, LK085]
  created_at: '2026-04-24'
  automated: true
  enforcement: 'karo-operations.md §0.1判断4問チェック+ninja_monitor idle通知にpane最終3行自動添付+deepdive Phase1-2'

# === 配備技術 ===
- id: LK-A02
  title: deploy_task.sh正しい使い方 — cmd_id引数+全フィールドリセット
  detail: |
    (1)deploy_task.sh ninja cmd_XXXX の形式でcmd_id引数を渡す(resolve_cmd_to_task発動)
    (2)再配備前はtask YAMLを全フィールドリセット(3点クリアでは旧ACが残存)
    (3)parent_cmd手動設定ではACが上書きされない
    (4)Codex忍者はCLAUDE.md未読→nudgeにtask YAMLパス付き具体指示を送信
  source_ids: [LK021, LK023, LK028, LK029, LK045, LK053, LK060, LK061, LK063, LK092]
  created_at: '2026-04-24'
  automated: true
  enforcement: 'deploy_task.sh STALE_FIELDS全フィールドクリア+重複ガード(GP-042)+Codex config.toml instruction設定'

- id: LK-A03
  title: STALL再配備は検証→クリア→再配備の3段階
  detail: |
    STALL通知は信号であり事実ではない。検証3点:
    (i)task YAML progressに進捗あるか (ii)同一cmd_idが他忍者に配備済みでないか (iii)uncommitted changesがあるか
    Stage 1ガード(assigned/pending/acknowledged/in_progress保護)で構造防御。
  source_ids: [LK001, LK003, LK019, LK032]
  created_at: '2026-04-24'
  automated: true
  enforcement: 'ninja_monitor.sh Stage 1ガード+deploy_task.sh重複ガード+karo.md STALL手順'

# === 修行/訓練 ===
- id: LK-A04
  title: 修行サイクル設計原則 — テンプレート+環境改善+gate BLOCKは成長機会
  detail: |
    (1)テンプレート設計: 忍者の作業動線に合わせたヒント配置(ヘッダ+フッター挟撃)
    (2)gate BLOCKは成長機会。FP率100%=学習機会ゼロ。BLOCK消し≠改善
    (3)忍者別cmd_idで配備(重複ガード回避)
    (4)修行と実バグ修正の一体化。忍者の目がコードベースを巡回する効果
    (5)pane直接観察→gate_fire_logでは見えない摩擦の発見
  source_ids: [LK013, LK014, LK015, LK016, LK026, LK027, LK033, LK034]
  created_at: '2026-04-24'
  automated: true
  enforcement: 'context/training-cycle.md+deploy_task.sh テンプレート自動生成+gate_fire_log計測'

# === 消火禁止 ===
- id: LK-A05
  title: 消火禁止 — パターン集計→構造的解決→発火検証の3段階
  detail: |
    個別workaround修正→次へ進む=消火構造(deepdive Phase4)。
    3段階: (1)パターン集計→3件同一で構造的解決cmd起票 (2)gate作成 (3)発火率100%確認。
    代筆禁止: gate BLOCKされた報告は忍者に差し戻せ(免疫応答を妨げるな)。
    教訓L2/L3不在: 記録だけでは行動は変わらない。automated/enforcementフィールド必須。
  source_ids: [LK007, LK010, LK011, LK064]
  created_at: '2026-04-24'
  automated: true
  enforcement: 'gate_report_format.sh+gate_karo_startup.sh+karo_workaround_log.sh ALERT→PD自動起票(LK049)'

# === 並列配備/競合 ===
- id: LK-A06
  title: 並列配備の排他ルール — DB/gate系/ビルドは直列必須
  detail: |
    (1)DB操作は直列配備(タイムアウト実証済み)
    (2)gate系(autofix/format/テスト)変更は直列配備(依存関係で衝突)
    (3)Androidビルド(gradlew)は排他(build dir競合実証)
    (4)異なるcmd間のファイル変更競合は家老が手動確認
    (5)R000(Codex→Sonnet→Opus)は優先順位であり排他ではない。idle忍者は即配備
  source_ids: [LK022, LK046, LK050, LK051, LK066, LK067, LK068, LK079]
  created_at: '2026-04-24'
  automated: true
  enforcement: 'deploy_task.sh重複ガード(GP-042)+karo.md §10 DB排他+karo-operations.md並列配備ルール'

# === cmd設計/品質の鎖 ===
- id: LK-A07
  title: 品質の鎖 — cmd→配備→作業→報告→教訓の各環が品質を受け渡す
  detail: |
    cmdが曖昧→タスクYAMLが曖昧→忍者が迷う→報告不完全→教訓が浅い。
    配備品質が忍者の作業品質を決める。効率は品質の結果であり目的ではない(殿厳命)。
    仕組み変更時は3層同時修正必須(テンプレート/忍者ルール/家老ルール)。
  source_ids: [LK004, LK017, LK038]
  created_at: '2026-04-24'
  automated: true
  enforcement: 'deploy_task.sh テンプレート品質+karo-operations.md §1配備+§3レビュー'

- id: LK-A08
  title: cmdの制約を独自解釈するな — 制約通りに配備
  detail: |
    並列配備禁止→独自解釈で緩和→OOM事故。制約に疑問→将軍に確認。
    途中修正の二択(別CMD or 神速停止)は指示変更を禁止。補足ナッジ(ファクト提供)は許容。
    spec_mismatch防止はengineering_preferencesが最小コスト。
  source_ids: [LK024, LK048, LK076]
  created_at: '2026-04-24'
  automated: true
  enforcement: 'CLAUDE.md途中修正二択+projects/{id}.yaml engineering_preferences自動注入'

- id: LK-A09
  title: 配備後の軍師レビュー依頼を漏らすな → 自動化済み
  detail: |
    3件連続漏れ(LK081/LK088)+GS直列7本で漏れ(LK089)で意志依存の限界を実証。
    deploy_task.sh配備完了→軍師inbox_write自動送信+report_review自動GATE実行。
    cmd_2207で自動化初稼働、GATE CLEARまで手動ゼロ完走。
  source_ids: [LK056, LK081, LK088, LK089, LK091]
  created_at: '2026-04-24'
  automated: true
  enforcement: 'deploy_task.sh自動draft review送信+inbox_write.sh report_review自動GATE実行'

- id: LK-A10
  title: 研究cmd固有ルール — 成果物現物確認+ファイル名AC明示+context還流
  detail: |
    (1)研究cmdはcommit不要→gate commit checkが効かない→成果物のls+headが唯一の防御
    (2)ACに出力ファイル名プレフィックス(cmd_XXXX_*)を明記
    (3)研究cmd完了時のcontext還流が仕組み化されていない→gate_freshness WARNは遅い
    (4)DC前に既存裁定との重複チェック必須
  source_ids: [LK005, LK058, LK069, LK071, LK072]
  created_at: '2026-04-24'
  automated: true
  enforcement: 'gate_gunshi_report_precheck.sh PRE3(ファイル実在)+SG7 context_reflux'

- id: LK-A11
  title: AC設計は忍者が物理的に達成可能か事前確認
  detail: |
    gitignore対象ファイルへのcommit ACは達成不可能。推奨事項を必須binary_checkに混入。
    verdict_override 3件の根因。CoDDのACにimplementを入れるな(準備と実装は別cmd)。
    CI完了待ちで忍者を止めるな(報告を先に書かせろ)。
  source_ids: [LK042, LK020, LK078]
  created_at: '2026-04-24'
  automated: true
  enforcement: 'deploy_task.sh commit check gitignore確認+karo-operations.md §2分解パターン'

# === infra修正実績 ===
- id: LK-A12
  title: infra修正実績(ninja_monitor/inbox_watcher) — 各バグはenforcementで修正済み
  detail: |
    bats OOM(個別テスト指定)。idle通知standbyモード。idle_cycle on/off設定。
    clear_command post-verification(送信=停止ではない)。@agent_state Codex残留。
    karo_workaroundsテストデータ混入。auto-commit instructions→build_instructions.sh。
  source_ids: [LK025, LK035, LK036, LK044, LK049, LK059, LK063, LK073, LK080]
  created_at: '2026-04-24'
  automated: true
  enforcement: 'ninja_monitor.sh各修正+inbox_watcher.sh各修正+cmd_complete_gate.sh lifecycle自動化'

- id: LK-A13
  title: infra修正実績(deploy_task.sh/gate/hook) — 各バグはenforcementで修正済み
  detail: |
    scout_exempt→commit check消去バグ修正(2fb539d)。self_gate_checkテンプレート追加。
    Codex部分記入報告→RFS競合。karo_direct起票手順。git log --grep choreコミット除外。
    bashテストでbash -lc→bash -c(MOCK_BIN無効化防止)。hookでcat→$(</dev/stdin)禁止。
  source_ids: [LK039, LK053, LK074, LK077, LK082, LK083, LK084, LK087, LK090]
  created_at: '2026-04-24'
  automated: true
  enforcement: 'deploy_task.sh各修正+gate各修正+hook各修正(個別commit参照)'

# === 独立パターン ===
- id: LK-A14
  title: LG027横展開確認 — grep修正前パターンで残存0件確認必須
  detail: 同パターンが複数ファイルにコピペ散在。修正後にgrep残存確認が不在→12体Cash100%事故。
  source_ids: [LK052]
  created_at: '2026-04-24'
  automated: true
  enforcement: 'レビュー時にdraft/報告の変更パターンをgrep横展開確認'

- id: LK-A15
  title: cmdライフサイクル両端の自動化 — cmd_save.sh pending注入+GATE CLEAR completed自動設定
  detail: status未設定cmd蓄積の根因を両端自動化で解消。新しい仕組みゼロ。
  source_ids: [LK059]
  created_at: '2026-04-24'
  automated: true
  enforcement: 'cmd_save.sh status:pending自動注入+cmd_complete_gate.sh status:completed自動設定'

- id: LK-A16
  title: Step 0無限ループ回避 — 配備後は即思考ステップへ
  detail: idle自走のStep 0(配備最優先)がidle忍者がいる限り無限ループし思考に到達しない。配備=手段、思考=目的。
  source_ids: [LK031]
  created_at: '2026-04-24'
  automated: true
  enforcement: 'karo-operations.md Step 0の後に即Step 1へ進め明記+§0.1判断4問チェック'

- id: LK-A17
  title: 将軍への報告は掲示板経由必須
  detail: inbox_writeだけで将軍に送るな。bulletin_write.shで掲示板(永続記録)+inbox全文通知(即時配信)を両方行う。
  source_ids: [LK075]
  created_at: '2026-04-24'
  automated: true
  enforcement: 'bulletin_write.sh(GP-207 content空BLOCK)+CLAUDE.md Communication Protocol'

- id: LK-A18
  title: revert前に変更元エージェントに通知 + revert後は再計測強制
  detail: revert前に理由通知(代替案が出る可能性)。revert後はbefore/after再計測必須(SG-PRE14)。
  source_ids: [LK062, LK087]
  created_at: '2026-04-24'
  automated: true
  enforcement: 'gate_gunshi_report_precheck.sh SG-PRE14(revert検出gate)'

- id: LK-A19
  title: 情報フィルタは品質軸 — ブロック判定だけでは品質の鎖が切れる
  detail: 軽微指摘を伝えない=10回繰返したら10件手戻り=負の複利。自動転送(1d0a59e)で解決済み。
  source_ids: [LK038]
  created_at: '2026-04-24'
  automated: true
  enforcement: 'inbox_write.sh 軍師→忍者指摘自動転送(1d0a59e)'

- id: LK-A20
  title: PI登録時の原理抽出 — 個別事実→共通根→原理PI昇華
  detail: PI74%が個別事実。複数PIに共通の根があれば原理PIに昇華(PI-020はPI-004/007/009/013/014/019の共通根)。
  source_ids: [LK020]
  created_at: '2026-04-24'
  automated: true
  enforcement: 'projects/{id}.yaml production_invariants登録時に既存PIとの共通根を確認'

- id: LK-A21
  title: 自動化実装時に既存ルール(lessons/karo.md)更新を連動させよ
  detail: コード変更完了しても知識基盤が旧フローのまま→次の家老が旧ルールに従い二重送信。ACに「既存ルール更新」を含めよ。
  source_ids: [LK070, LK091]
  created_at: '2026-04-24'
  automated: true
  enforcement: 'karo-operations.md §5教訓抽出時に既存ルール更新チェック'

- id: LK-A22
  title: depends_onはAC単位で分析 — cmd全体を鵜呑みにするな
  detail: depends_on cmd_Xがあっても全ACが依存するとは限らない。AC単位で依存分析し並列可能な部分を先に配備。idle=最大の無駄。
  source_ids: [LK054]
  created_at: '2026-04-24'
  automated: true
  enforcement: 'karo-operations.md §1配備時のdepends_on分析手順'
- id: 'LK001'
  title: 'バックグラウンドshell残存でninja_monitorの/clearが発動しない'
  detail: '忍者がrun_in_backgroundでbashを起動すると、タスク完了後もシェルプロセスが残存する。ninja_monitorのPSTREE-OVERRIDEがbash subprocessを検出しBUSY扱いにするため、idle+タスクなし→/clearの条件を満たさない。結果: CTX消費継続+予期せぬ復帰時に旧タスク残骸で動くリスク。飛猿cmd_karo_ci_fix_skipで実証(23:51-23:56の5回連続PSTREE-OVERRIDE)。'
  source_cmd: 'cmd_karo_ci_fix_skip'
  created_at: '2026-04-25'
