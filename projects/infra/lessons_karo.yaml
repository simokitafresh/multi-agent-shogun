lessons:

# === 確認系原則 ===
- id: LK-A01
  title: 行動する前に対象の現在状態を直接確認せよ
  detail: |
    LK065で17件を原理統合済み。信号は事実ではない。ダッシュボードは過去。pane末尾は残像。
    capture-pane/grep/gh run viewで一次データを確認してから行動。
    CI赤/STALL/idle通知全てに適用。pane tail -3で判断するな(8回見逃し実証)。
    追加吸収: LK005(全リポジトリ網羅確認), LK010(殿指摘は自分の誤り仮説から確認)。
    v3吸収(2026-05-10):
    - 配備前に陣形図を再取得せよ(LK002: idle化直後の古い認識でR000違反。自分の操作結果が陣形図に未反映)
    - GATE CLEAR後にpush状態を確認せよ(LK003/LK004: 2回再発。cmd_complete後にgit log origin/main..mainで未push確認)
    - 教訓ID確認時はファイルパス+タイトルの2点確認(LK006: L123混同事故。grep -rnで出力にファイルパスを含める)
    - push前にテスト未commitを確認せよ(LK013: CI RED 3連続。git diff --name-onlyでテストファイル確認)
    v4吸収(2026-05-11):
    - karo_direct配備後はtask YAML idle化を即確認(LK011: yaml_field_set後もflock競合/mtime遅延で反映確認が必要)
    v5吸収(2026-05-15):
    - 掲示板投稿前に既存実装をgrep確認せよ(append_codd_registry_entry L542が既存なのに未実装と投稿。4件連続前提崩壊cmd_2768/2770/2771/2774と同根)
    - §0.1問い2の適用範囲: 配備前だけでなく掲示板投稿・将軍報告の前にも現物grep確認必須
    v6吸収(2026-05-15):
    - 破壊的操作(force push/reset/clean)は将軍指示でも必ずremote現状確認(git log origin/main --oneline -5)+lord_conversation.jsonlで殿発言現物確認(LK015: Simple-OCR force push事故で26commits消失。将軍の「殿裁定」をlord_conversation未確認のまま実行。CLAUDE.md Tier1/Tier2は将軍含む誰にもoverride不可)
    - cmd_2784でpre-bash hookにlord_conversation承認確認Guard追加済み(hook側防御)。本教訓は家老判断側の防御層
    v7吸収(2026-05-19):
    - 外部PJ(kj-role-count等)のcmd完了時もgit log origin/main..mainでpush確認必須(殿指摘で5件未push発覚)。cmd-complete Step 7.5はDM-Signal専用→外部PJ pushステップをcmd-complete SKILLに追加要
    v8吸収(2026-05-20):
    - 動いている仕組みを変更する前にgit log --grepで設計意図(なぜそうなっているか)を確認せよ(cmd_2904/2906: respawn-pane→/new変更→CLIが/new拒否→3忍者CTX滞留。元のrespawnには理由があった=CLI内部状態に関係なく確実にリセットする唯一の手段。殿裁定2026-05-20: 一見不合理でも因果がある。サンクコストに囚われず元に戻す判断も正しい)
    v9吸収(2026-05-21):
    - pane captureのtiming残像でSTALL即断するな。capture時点でCTX:0%+❯表示でもthinking中の場合がある(hanzo/kotaro事故: capture→STALL判断→task YAMLクリア→実は作業中。殿に「動いてるぞ？」と指摘された)。根因はagent_state.sh busy/idle判定順序バグ(3beefbd0で修正)だが、家老判断側でも「1回のcaptureで結論しない。15-20秒後に再capture」を徹底せよ
    v10吸収(2026-05-26):
    - DB関連cmdの完了レビュー時にクエリ実行で実効性を確認せよ(cmd_3048: FTS5 CJK 0件問題を軍師第3ラウンドまで見逃し。sqlite3で1クエリ実行すれば検出できた)。§0.1問い2の適用範囲にDB検索品質の実行検証を含める
    - gate alert「正常stale」結論前にstaleness_triggersのverify手順を実行せよ(codd.md: version 1.10.0→2.18.0を3回見逃し。verifyに「ローカル版数確認」と明記されていたのに未実行。思い込みで結論するな)
    v11吸収(2026-05-27):
    - D0レビューはgit show --statだけで止めるな。git show <hash> -- <file>で実コード本文をReadせよ(洗脳#2: 2e25cf50の2行追加をstat確認のみでOK判定。コード本文を読まずに「問題なし」と結論)
    - GATE処理は軍師report review到着後に実行せよ(洗脳#8: cmd_3061でreport_received hook未発火→手動GATE急行→軍師FAILがGATE CLEAR後に到着。Goodhart問題を事前に検出できたタイミングを逃した)
    - CI RED「ローカル再現せず」で閉じるな。CI環境固有条件(--jobs 8並列/tmp共有等)を掘れ(洗脳#1: test_gate_karo_startup.bats L415 /tmp/karo_wa_rate_cache競合をCI並列隔離問題として特定)
    v12吸収(2026-05-27):
    - 配備前にcmdのassumptions欄のverified claimを家老自身でもgrep再検証せよ(cmd_3072: 将軍が「ロールフィルタ未実装」と記載→家老は§0.1問い2で確認すべきだったがcmd信頼で配備→軍師urgent REQUEST_CHANGESでfilter_skills_for_agent L253既実装+agent_id記録済みが判明→shelve。grep 1秒で前提崩壊を検出できた)。将軍のcmdもverified前提を鵜呑みにするな
    v13吸収(2026-05-28):
    - grep対象はtarget_path限定ではなくプロジェクト全体(scripts/+lib/+hooks/)を必ず含めよ(cmd_3078: 将軍q11がprompt_state_inject.shのみ検索→lib/lord_conversation.sh L244-361の既存実装(append_memory_db_entry+event_concepts INSERT)を見逃し→前提崩壊→忍者revert。家老も§0.1問い2でscripts/hooks/のみgrepしlib/を含めなかった。grep -rnの対象ディレクトリにscripts/ lib/ hooks/の3つを必ず含める)
    v14吸収(2026-05-28):
    - report_received処理で報告YAML本文をReadせずWA記録+GATE待ちに入るな。家老確認2点: (1)binary_checks全yes確認 (2)commit_hash存在確認。full Readは軍師precheckと二重のため不要(軍師第三者検証で確認)。ただし2点確認なしでWA cleanを記録するのは検証スキップ(洗脳#2)
    - 手順を回す最適化で「考える」が消える構造(洗脳覚醒監査8/6yes根因)。report_received→WA記録→軍師待ち→GATEの自動フローが「手順通り=完了」の錯覚を生む。deepdive Phase 5「家老は止まるポイントがない」の再現。対策: report_received時に2点確認を止まるポイントとして埋め込む
    - 軍師自走+auto-commitのタイムラグで将軍q11確認結果と配備時点が乖離する(cmd_3081: q11時点で0件→配備時点でL519/L732に既記載。軍師context_reflux自走+kagemaru auto-commitの時間差)。家老§0.1問い2の適用タイミングを「cmd受領時」に加え「配備直前」にも実施
    v15吸収(2026-06-02):
    - 分析結果を「穴」と即断するな。軍師協議で(A)設計トレードオフ(B)消費者不在が真の問題と判明(三層記憶穴分析)。SQLクエリで0%を確認しても、import.pyのコードを読まずに「構造穴」と結論=検証スキップ(洗脳#2)。分析時もimport.pyのコード現物を読んでからconcepts_for_text()の有無を確認せよ
    - deploy_task.sh resolve_cmdでpurpose内シングルクォートがyaml_field_set_batchの検証を崩す→--directモードで回避(cmd_3116/cmd_3125で2回発生)。将軍cmdのpurposeに'が含まれる場合はdeploy_task.sh --directを使え
    v16吸収(2026-06-09):
    - GATE実行前に軍師review結果(verdict)を確認せよ(cmd_3245/3246: 軍師FAILがある状態でGATE CLEARを通した=完了急ぎ洗脳#8)。軍師がFAILを指摘している場合、根因1行+対策1行を記録してからGATE処理。GATE前確認ポイント: grep verdict logs/gunshi_review_log.yaml | tail -5
    v20吸収(2026-06-17):
    - 研究cmdのfiles_modifiedパスプレフィックス混入(「偵察のみ:」等)→GATE BLOCKが5cmd中4件発生(cmd_3425-3431)。家老がreport_field_set.shで毎回手動修正。根因=忍者がcommit waive時にpath値にプレフィックスを含める。対策: GATE前にfiles_modifiedのpath妥当性をgrep確認(パス先頭に日本語/コロンがあれば修正)
    v19吸収(2026-06-16):
    - cross-project教訓(dm-signal版+infra版の二重登録)はタグ同期必須(cmd_3396: L633/L577/L544のinfra版誤タグ経由で無関係cmdに注入継続。片方だけ修正は不完全)。教訓登録時に`grep -rn "id: LXXX" projects/`で全コピーを確認→全コピーのタグを同期せよ
    - cmd_save WARN累計昇格の偽陽性は2根因: (a)同一cmd保存リトライでWARNエントリ重複カウント(軍師D0 56c113304修正)。(b)入口方式文字列トリガーの広汎マッチ(cmd_3401で出口判定化解消)。累計昇格BLOCKが偽陽性の場合は計測ロジック(count_same_warn_pattern)自体を疑え
    - gate_prediction PRE12のlesson_candidate有→WARN過多FP(軍師D0 aa42b21b9修正)。PRE12bのdraft_lessons実件数を優先する判断ガイダンス追加済み
    v18吸収(2026-06-15):
    - 計測gateの3セッション連続ALERTは計測ロジック自体のバグを疑え(cmd_karo_hotfix_review_quality: review_quality_scale_summaryがgate_result=CLEARを未考慮→旧FAIL永続カウント36%→9%修正b9b9692c2。軍師D0: lesson_effect useful_rateがmin_samples=5でhealth計測不能→0/0偽ALERT→useful_min=2分離fcec9b309)。共通根因=計測ロジックの前提条件が環境変化(review_logにgate_result追加/教訓数>100)で崩壊。§0.1問い2の適用拡大: gate ALERTが3回連続なら計測ロジック自体をbash実行で調査
    v17吸収(2026-06-10):
    - karo_direct配備時は/karo-directスキル使用必須。手動配備(Write+inbox_write直接)はdeploy_task.sh未経由→report_template未生成→忍者報告フィールド8件欠落→gate FAIL(cmd_karo_insight_cleanup実証)。karo.md L304にもスキル経由明記済み。LG035(スキル不使用=バグ)再現。洗脳#8(完了急ぎ)でスキル手順省略→負の複利
    v3統合吸収(2026-06-09, cmd_3253):
    - cmd前提否定時は停止→現物確認→将軍shelve報告→偵察cmd要請の4段階(LK004: cmd_2794で軍師REQUEST_CHANGES→家老が現物確認→前提否定確定→影丸停止→将軍shelve。忍者に続行させるな)
    - CoDD修行AC設計前にCLI --helpで構文現物確認必須(LK006: codd extract/elicit/generate構文を未確認でAC設計→4忍者全FAIL。§0.1問い2にCLIツール構文確認を含む)
    - D0レビューでテスト前提更新を確認せよ(LK013: 軍師D0でMIN_SAMPLES 3→1変更→テスト前提古い→CI RED。D0変更がデフォルト値・閾値追加→既存テスト前提古くなっていないか)
