    吸収(2026-07-25, cmd_karo_hotfix_lesson_write_chmod_eperm_20260725, origin: [[karo_misjudgment_20260725]] -> [[secondary_source_transcription]] -> [[LK-A01]]): 2026-07-25、家老は1セッションで6回判断を誤り、全て忍者・軍師に捕捉された: (1)疾風へ達成不能なAC4を発行(cmd_4171のGATE CLEARが発令10分前に完了済みで再実行手段ゼロ。async log 940件中該当0件で実測確認) (2)cmd_4172をdead codeと知らずACCEPT(replay証跡を根拠にし本番経路接続を未確認。非test caller 0件) (3)CI真因を疾風の仮説のまま転記(実際はgit未追跡libのsource。gate_report_format.shは当該libを参照していなかった) (4)未commit差分の帰属を軍師の判定のまま転記(差分内のコメントにcmd_idが明記されており確認すれば即判明した) (5)先行commit担当者の呼称を半蔵/影丸で取り違え(才蔵が指摘) (6)遅延source化の要否をtest互換の観点だけで判断(影丸が本番実行コストの観点を提示)。共通因は『他者の結論を一次確認せず転記する』または『一つの観点だけで結論する』である
    吸収(2026-07-26, cmd_karo_impl_lg051_scope_basename_20260725, origin: [[CI_RED_30161415740]] -> [[3者が写しで誤判定]] -> [[才蔵のA/B単一変数比較で決着]] -> [[LK-A01]]): 2026-07-25〜26のCI RED帰属判定で、家老・軍師・将軍の3者が誤り、忍者1名だけが正解した。【誤った3手法】(1)家老=判定regexをpythonへ書き写して合成テストし tests/test_gate_report_format.bats=False を得て『才蔵は無実』と結論。実体(そのコードを実際に走らせた結果)ではなく自分が作った写しを試した。(2)軍師=CIログの文字列 does not exist を見て『存在しないファイルを実行して失敗』と結論。実際はPASSしているテスト名の一部(ok 47 ... even when file does not exist)であった。さらにファイル名の類似(test_gate_report_format.bats と gate_report_format_main.py)だけで因果を組み立て、tests/unit/固定で存在確認して不在と誤判定し、ローカルWSL2のchmod EPERM由来のFAILをCIの失敗として報告した。(3)将軍=家老の(1)を『今日初めて推論ゼロで組み立てられた診断』と評価。評価者も写しに騙された。【正解した1手法=才蔵】gate_report_format_main.py を親commit(9e8d82346^)版へ一時差し戻し、同一コマンドで比較して T-GP286-2 が 親版=ok / 9e8d82346=not ok を示した。**変更の前後を同一条件で比較する**という最も基本的で最も強い方法である。判定regexの書き写しでも、ファイル名の類似でも、ローカル環境の観測でもない。【原則】ある変更がある事象の原因かを判定するときは、その変更**だけ**を戻して同一条件で再実行せよ。これがgold standardであり、他の全ての手法(コードを読む/regexを書き写す/名前の類似を見る/ログの文字列を読む/ローカルで再現する)はいずれも実体の写しを見ており、単独では帰属を確定できない。【副次教訓】ローカル(WSL2 DrvFs)のbats結果をCI(ubuntu)の結果として報告するな。chmod EPERMでCIでは起きない失敗がローカルで出る。CIの失敗を語るときはCIログを直接読め。
    吸収(2026-07-26, cmd_karo_ci_fix_30161415740_phantom_unit_path_20260725, origin: [[家老の誤指示3件]] -> [[忍者が理由を述べて拒否]] -> [[3件とも家老が誤り]] -> [[LK-A01]]): 2026-07-25〜26、家老は忍者へ3度、実行すれば証跡を歪める指示を出し、3度とも忍者が理由を述べて拒否した。【3件】(1)半蔵へ『節の移動をcommitせよ』→ 半蔵は git status --porcelain=空・HEAD/index/worktree三者一致を実測提示して空commitを拒否。家老が見たgit statusは半蔵が git add で是正する以前の写しであった。(2)半蔵・才蔵へ契約起因のBLOCK→ 両名とも『task YAMLの契約を書き換えて自分でPASSさせるのは契約の自己改変であり行わない』と拒否。(3)才蔵へ『報告のstatusをcompletedへ戻せ』→ 才蔵は『verdictはbinary_checksから自動導出され手動記入できない。実装対象が存在しないcmdなのでnoは達成しようがなく、yesにすれば報告の捻じ曲げになる』と拒否。**家老自身が『貴殿に報告を捻じ曲げさせない』と書いた3時間後に、捻じ曲げを要求する指示を出していた。**【原則】忍者が指示を実行せず理由を述べて止まったとき、それは反抗ではなく**指示側の誤りの検出**である可能性が高い。忍者は現物を触っている側であり、家老は写し(報告・git status・gate出力・自分の起票文)を見ている側である。∴**まず自分の指示の前提を一次確認せよ。**忍者を説得しにいくな。本日3件とも家老が誤っており忍者が正しかった。【関連】家老は同日、契約矛盾を3名4件作り(半蔵2度)、そのうち才蔵の是正ではtask側だけ直して報告側の同期を忘れ、疾風の是正では本人のpathを確認せず推測で書いた。指示・契約・是正のいずれの工程でも同じ機序(確認範囲を自分の仮説に合わせて狭める)が出ている。
