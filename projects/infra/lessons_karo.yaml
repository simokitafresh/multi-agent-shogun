# === 配備技術 ===
  when: 行動する前、状態確認が必要な全場面。CI赤/STALL/idle通知受信時
  how: capture-pane/grep/gh run viewで一次データ確認→行動。pane tail -3で判断するな。配備前陣形図再取得
  origin: "[[LK065]] -> [[確認しない]] -> [[pane残像で誤判断]]"
- id: LK-A02
  title: deploy_task.sh正しい使い方 — cmd_id引数+全フィールドリセット
  detail: |
    (1)deploy_task.sh ninja cmd_XXXX の形式でcmd_id引数を渡す(resolve_cmd_to_task発動)
    (2)再配備前はtask YAMLを全フィールドリセット(3点クリアでは旧ACが残存)
    (3)parent_cmd手動設定ではACが上書きされない
    (4)Codex忍者はCLAUDE.md未読→nudgeにtask YAMLパス付き具体指示を送信
    追加吸収: LK002(YAMLマルチラインresolve), LK008(--direct stale reset), LK011(Codex nudge絶対パス)。
    v3吸収(2026-05-10):
    - YAMLパースエラーでlessons_useful未注入(LK005b: commandフィールドの特殊文字がパーサー崩壊。BLOCKにしfallback注入)
    - AC抽出失敗時は手動ナッジで補足(LK008b: AC_VERIFY SKIP検出→grep description task YAML→空なら即ナッジ)
    v3統合吸収(2026-06-09, cmd_3253):
    - deploy_task.sh exit 1でもnudge送信済みの場合あり(LK010: deploy出力に'codex nudge retry'/'delivery verified'があれば手動nudge不要。殿に指摘されるまで毎回重複送信)
  source_ids: [LK002, LK008, LK011, LK021, LK023, LK028, LK029, LK045, LK053, LK060, LK061, LK063, LK092, LK005b, LK008b, LK010i]
  created_at: '2026-04-24'
  automated: true
  enforcement: 'deploy_task.sh STALE_FIELDS全フィールドクリア+重複ガード(GP-042)+Codex config.toml instruction設定'

  v7吸収(2026-05-19):
    - deploy_task.shのSTALE_FIELDSにscope/contextが含まれず、前taskのscope/contextが残存→忍者が前taskのscopeで作業し新cmdのACを未実施(cmd_2875疾風+cmd_2880半蔵で2件連続FAIL)。根因=STALE_FIELDSリストにscope/context未含。偵察cmd要請済み(掲示板blt_20260519_175410)
  v8吸収(2026-05-21):
    - deploy_task.shがinject_causal_links等のエラーでexit 1→nudge送信に到達しない(全10回配備で100%手動nudge必須)。deploy出力にdeployment completeが出ない場合は即手動nudge。exit 1でもnudge送信済みの場合あり(LK010)→出力のnudge痕跡を確認してから判断
  v9吸収(2026-05-21):
    - ★前ラウンドGATE CLEAR前に次ラウンド配備するな(殿指摘2026-05-21)。即配備→task YAML上書き→忍者/clear→報告YAMLがcommit前に消失。本セッション6件消失(GPT 18.5%/Sonnet 5.6%)。対策: 完了→GATE CLEAR確認→次ラウンド配備の順序厳守。cmd_2951でdeploy_task.shにpending reportチェックBLOCKを追加(構造的防止)
  when: deploy_task.shで忍者に配備する時。再配備時。修行連続ラウンド配備時
  how: cmd_id引数渡し+全フィールドリセット。★前ラウンドGATE CLEAR確認後に次配備(v9)。Codex忍者にはnudgeにtask YAMLパス付き具体指示。deployment complete確認。scope/context stale注意
  origin: "[[LK061]] -> [[cmd_id引数省略]] -> [[旧タスク実行]]"
- id: LK-A03
  title: STALL再配備は検証→クリア→再配備の3段階
  detail: |
    STALL通知は信号であり事実ではない。検証3点:
    (i)task YAML progressに進捗あるか (ii)同一cmd_idが他忍者に配備済みでないか (iii)uncommitted changesがあるか
    Stage 1ガード(assigned/pending/acknowledged/in_progress保護)で構造防御。
    v2吸収(2026-05-20):
    - LK013を吸収。STALL再配備前に(1)pane全体確認(CTX/Working有無) (2)deploy_task.sh出力でnudge送信痕跡確認 (3)クリア後30秒待ちpane再確認(遅延到達)を必須化。hayate/kagemaru/saizoの3回連続誤再配備を同クラスタへ統合。
    v3吸収(2026-05-21):
    - auto-clear後のtask status残留パターン: commit+報告YAML存在だがtask status=in_progress(ninja_monitorがcommit後・inbox_write前にauto-clear発動)。STALL通知が来てもpane全体にcommit hash確認+報告YAML存在→作業完了と判断。task statusを手動doneにしGATE処理を進める(cmd_2931で実証)
    v4吸収(2026-05-21):
    - 1回のpane captureでSTALL即断してtask YAMLクリア+再配備するな。15-20秒後に再captureで確認。agent_state busy判定バグ(3beefbd0)でthinking中がidle表示される場合があった。殿に「動いてるぞ」と指摘されて発覚。deepdive Phase 2「pane末尾だけ見てrespawnした」の再現
    v3統合吸収(2026-06-09, cmd_3253):
    - STALL≠配備不完全。CTX:0%+空プロンプト=STALLと即断するな(LK008: deploy_task.shのdeployment complete+re-nudge sentが出ていなければ配備不完全。STALLではなく配備をやり直せ。2026-05-17にGPT4名連続STALL誤判断→Sonnet誤切替事故)
  source_ids: [LK019, LK032, LK013, LK008i]
  superseded_ids: [LK013]
  created_at: '2026-04-24'
  automated: true
  enforcement: 'ninja_monitor.sh Stage 1ガード+deploy_task.sh重複ガード+karo.md STALL手順'

# === 修行/訓練 ===
  when: ninja_monitorからSTALL通知受信時
  how: 検証3点(progress/重複/uncommitted)→クリア→再配備。Stage 1ガードで構造防御
