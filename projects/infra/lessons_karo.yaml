    吸収(2026-08-17, cmd_karo_hotfix_ga473_context_freshness_202608171419, origin: [[GA-473_context_freshness_ALERT]] -> [[detectorとreflux_guardの契約分離]] -> [[canonical_receipt消費]]): source marker後のdocs/research commitを件数だけでstale判定すると、guardが保存したpath/status/blob fingerprint一致の既反映commitまで再警告する。detectorは同一canonical fingerprintを再計算し、receipt一致だけを除外し、不一致は未反映として残す。修正前4件→修正後2件、真の未反映2件は残してBLOCK。
