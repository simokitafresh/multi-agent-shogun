lessons:

# === 確認系原則 ===
- id: LK-A01
  title: 行動する前に対象の現在状態を直接確認せよ
  detail: |
    LK065で17件を原理統合済み。信号は事実ではない。ダッシュボードは過去。pane末尾は残像。
    capture-pane/grep/gh run viewで一次データを確認してから行動。
    CI赤/STALL/idle通知全てに適用。pane tail -3で判断するな(8回見逃し実証)。
    追加吸収: LK005(全リポジトリ網羅確認), LK010(殿指摘は自分の誤り仮説から確認)。
    v3吸収(2026-05-10):
    - 配備前に陣形図を再取得せよ(LK002: idle化直後の古い認識でR000違反。自分の操作結果が陣形図に未反映)
    - GATE CLEAR後にpush状態を確認せよ(LK003/LK004: 2回再発。cmd_complete後にgit log origin/main..mainで未push確認)
    - 教訓ID確認時はファイルパス+タイトルの2点確認(LK006: L123混同事故。grep -rnで出力にファイルパスを含める)
    - push前にテスト未commitを確認せよ(LK013: CI RED 3連続。git diff --name-onlyでテストファイル確認)
    v4吸収(2026-05-11):
    - karo_direct配備後はtask YAML idle化を即確認(LK011: yaml_field_set後もflock競合/mtime遅延で反映確認が必要)
  source_ids: [LK005, LK006, LK009, LK010, LK012, LK018, LK030, LK037, LK040, LK041, LK043, LK044, LK047, LK048, LK052, LK054, LK065, LK069, LK085, LK002, LK003, LK004, LK006b, LK013, LK011]
  created_at: '2026-04-24'
  automated: true
  enforcement: 'karo-operations.md §0.1判断4問チェック+ninja_monitor idle通知にpane最終3行自動添付+deepdive Phase1-2'

# === 配備技術 ===
  when: 行動する前、状態確認が必要な全場面。CI赤/STALL/idle通知受信時
  how: capture-pane/grep/gh run viewで一次データ確認→行動。pane tail -3で判断するな。配備前陣形図再取得
- id: LK-A02
  title: deploy_task.sh正しい使い方 — cmd_id引数+全フィールドリセット
  detail: |
    (1)deploy_task.sh ninja cmd_XXXX の形式でcmd_id引数を渡す(resolve_cmd_to_task発動)
    (2)再配備前はtask YAMLを全フィールドリセット(3点クリアでは旧ACが残存)
    (3)parent_cmd手動設定ではACが上書きされない
    (4)Codex忍者はCLAUDE.md未読→nudgeにtask YAMLパス付き具体指示を送信
    追加吸収: LK002(YAMLマルチラインresolve), LK008(--direct stale reset), LK011(Codex nudge絶対パス)。
    v3吸収(2026-05-10):
    - YAMLパースエラーでlessons_useful未注入(LK005b: commandフィールドの特殊文字がパーサー崩壊。BLOCKにしfallback注入)
    - AC抽出失敗時は手動ナッジで補足(LK008b: AC_VERIFY SKIP検出→grep description task YAML→空なら即ナッジ)
  source_ids: [LK002, LK008, LK011, LK021, LK023, LK028, LK029, LK045, LK053, LK060, LK061, LK063, LK092, LK005b, LK008b]
  created_at: '2026-04-24'
  automated: true
  enforcement: 'deploy_task.sh STALE_FIELDS全フィールドクリア+重複ガード(GP-042)+Codex config.toml instruction設定'

  when: deploy_task.shで忍者に配備する時。再配備時
  how: cmd_id引数渡し+全フィールドリセット。Codex忍者にはnudgeにtask YAMLパス付き具体指示
- id: LK-A03
  title: STALL再配備は検証→クリア→再配備の3段階
  detail: |
    STALL通知は信号であり事実ではない。検証3点:
    (i)task YAML progressに進捗あるか (ii)同一cmd_idが他忍者に配備済みでないか (iii)uncommitted changesがあるか
    Stage 1ガード(assigned/pending/acknowledged/in_progress保護)で構造防御。
  source_ids: [LK019, LK032]
  created_at: '2026-04-24'
  automated: true
  enforcement: 'ninja_monitor.sh Stage 1ガード+deploy_task.sh重複ガード+karo.md STALL手順'

# === 修行/訓練 ===
  when: ninja_monitorからSTALL通知受信時
  how: 検証3点(progress/重複/uncommitted)→クリア→再配備。Stage 1ガードで構造防御
- id: LK-A04
  title: 修行サイクル設計原則 — テンプレート+環境改善+gate BLOCKは成長機会
  detail: |
    (1)テンプレート設計: 忍者の作業動線に合わせたヒント配置(ヘッダ+フッター挟撃)
    (2)gate BLOCKは成長機会。FP率100%=学習機会ゼロ。BLOCK消し≠改善
    (3)忍者別cmd_idで配備(重複ガード回避)
    (4)修行と実バグ修正の一体化。忍者の目がコードベースを巡回する効果
    (5)pane直接観察→gate_fire_logでは見えない摩擦の発見
    v3吸収(2026-05-10):
    - karo_direct修行cmdはGATE処理対象外(LK007b: stop hook誤検知→task YAML idle化で解消。GP候補)
  source_ids: [LK014, LK015, LK016, LK026, LK027, LK033, LK034, LK007b]
  created_at: '2026-04-24'
  automated: true
  enforcement: 'context/training-cycle.md+deploy_task.sh テンプレート自動生成+gate_fire_log計測'

# === 消火禁止 ===
  when: 修行サイクル設計・配備時。idle忍者への訓練配備時
  how: テンプレート+環境改善+gate BLOCKは成長機会。忍者別cmd_idで配備(重複ガード回避)
- id: LK-A05
  title: 消火禁止 — パターン集計→構造的解決→発火検証の3段階
  detail: |
    個別workaround修正→次へ進む=消火構造(deepdive Phase4)。
    3段階: (1)パターン集計→3件同一で構造的解決cmd起票 (2)gate作成 (3)発火率100%確認。
    代筆禁止: gate BLOCKされた報告は忍者に差し戻せ(免疫応答を妨げるな)。
    教訓L2/L3不在: 記録だけでは行動は変わらない。automated/enforcementフィールド必須。
    v4吸収(2026-05-11):
    - 偵察前に家老がなぜなぜ7回で仮説を立て、偵察結果で更新せよ(LK013: 仮説なしの偵察は焦点が散る)
  source_ids: [LK064, LK013]
  created_at: '2026-04-24'
  automated: true
  enforcement: 'gate_report_format.sh+gate_karo_startup.sh+karo_workaround_log.sh ALERT→PD自動起票(LK049)'

# === 並列配備/競合 ===
  when: workaround記録時。同一category 3件以上の時
  how: パターン集計→構造的解決cmd起票→gate作成→発火率確認。代筆禁止(忍者に差し戻す)
- id: LK-A06
  title: 並列配備の排他ルール — DB/gate系/ビルドは直列必須
  detail: |
    (1)DB操作は直列配備(タイムアウト実証済み)
    (2)gate系(autofix/format/テスト)変更は直列配備(依存関係で衝突)
    (3)Androidビルド(gradlew)は排他(build dir競合実証)
    (4)異なるcmd間のファイル変更競合は家老が手動確認
    (5)R000(Codex→Sonnet→Opus)は優先順位であり排他ではない。idle忍者は即配備
  source_ids: [LK022, LK046, LK050, LK051, LK066, LK067, LK068, LK079]
  created_at: '2026-04-24'
  automated: true
  enforcement: 'deploy_task.sh重複ガード(GP-042)+karo.md §10 DB排他+karo-operations.md並列配備ルール'

# === cmd設計/品質の鎖 ===
  when: 複数忍者への同時配備計画時。DB操作/gate系/ビルド含むcmd
  how: DB=直列。gate系=直列。Androidビルド=排他。R000は優先順位であり排他ではない
- id: LK-A07
  title: 品質の鎖 — cmd→配備→作業→報告→教訓の各環が品質を受け渡す
  detail: |
    cmdが曖昧→タスクYAMLが曖昧→忍者が迷う→報告不完全→教訓が浅い。
    配備品質が忍者の作業品質を決める。効率は品質の結果であり目的ではない(殿厳命)。
    仕組み変更時は3層同時修正必須(テンプレート/忍者ルール/家老ルール)。
    追加吸収: LK007(テンプレートデフォルト値はgate通過値にする)。
  source_ids: [LK007, LK017, LK038]
  created_at: '2026-04-24'
  automated: true
  enforcement: 'deploy_task.sh テンプレート品質+karo-operations.md §1配備+§3レビュー'

  when: cmd分解・タスクYAML作成時。仕組み変更cmd時
  how: 配備品質が忍者品質を決める。仕組み変更は3層同時修正(テンプレート/忍者ルール/家老ルール)
- id: LK-A08
  title: cmdの制約を独自解釈するな — 制約通りに配備
  detail: |
    並列配備禁止→独自解釈で緩和→OOM事故。制約に疑問→将軍に確認。
    途中修正の二択(別CMD or 神速停止)は指示変更を禁止。補足ナッジ(ファクト提供)は許容。
    spec_mismatch防止はengineering_preferencesが最小コスト。
  source_ids: [LK024, LK048, LK076]
  created_at: '2026-04-24'
  automated: true
  enforcement: 'CLAUDE.md途中修正二択+projects/{id}.yaml engineering_preferences自動注入'

  when: cmdの制約に疑問を感じた時。途中修正したい時
  how: 制約通りに配備。疑問→将軍に確認。途中修正の二択(別CMD or 神速停止)
- id: LK-A09
  title: 配備後の軍師レビュー依頼を漏らすな → 自動化済み
  detail: |
    3件連続漏れ(LK081/LK088)+GS直列7本で漏れ(LK089)で意志依存の限界を実証。
    deploy_task.sh配備完了→軍師inbox_write自動送信+report_review自動GATE実行。
    cmd_2207で自動化初稼働、GATE CLEARまで手動ゼロ完走。
    v3吸収(2026-05-10):
    - GATE処理前に軍師report reviewを待て(LK010b: karo_direct配備ではhook未発火の場合あり。手動でreview依頼→結果受領→GATE処理の順)
    v4吸収(2026-05-11):
    - karo_direct配備はreport_received hook未発火の場合があるため、忍者完了後に軍師review依頼を手動送信せよ(LK012)
  source_ids: [LK056, LK081, LK088, LK089, LK091, LK010b, LK012]
  created_at: '2026-04-24'
  automated: true
  enforcement: 'deploy_task.sh自動draft review送信+inbox_write.sh report_review自動GATE実行'

  when: 忍者配備完了直後。deploy_task.sh実行後
  how: deploy_task.shが自動でdraft review+report_review送信。karo_directでは手動review依頼
- id: LK-A10
  title: 研究cmd固有ルール — 成果物現物確認+ファイル名AC明示+context還流
  detail: |
    (1)研究cmdはcommit不要→gate commit checkが効かない→成果物のls+headが唯一の防御
    (2)ACに出力ファイル名プレフィックス(cmd_XXXX_*)を明記
    (3)研究cmd完了時のcontext還流が仕組み化されていない→gate_freshness WARNは遅い
    (4)DC前に既存裁定との重複チェック必須
  source_ids: [LK058, LK069, LK071, LK072]
  created_at: '2026-04-24'
  automated: true
  enforcement: 'gate_gunshi_report_precheck.sh PRE3(ファイル実在)+SG7 context_reflux'

  when: 研究cmd完了時のレビュー。成果物確認時
  how: 成果物のls+headで現物確認。ACに出力ファイル名プレフィックス明記。context還流チェック
- id: LK-A11
  title: AC設計は忍者が物理的に達成可能か事前確認
  detail: |
    gitignore対象ファイルへのcommit ACは達成不可能。推奨事項を必須binary_checkに混入。
    verdict_override 3件の根因。CoDDのACにimplementを入れるな(準備と実装は別cmd)。
    CI完了待ちで忍者を止めるな(報告を先に書かせろ)。
    追加吸収: LK006(既存テスト赤を確認せず全体pytestを必須ACにするな)。
  source_ids: [LK006, LK042, LK020, LK078]
  created_at: '2026-04-24'
  automated: true
  enforcement: 'deploy_task.sh commit check gitignore確認+karo-operations.md §2分解パターン'

