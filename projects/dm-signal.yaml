new_bb_design:  # 殿裁定2026-06-15
  weighted_multi_view:
    name: "WeightedMultiViewMomentumFilter (新四つ目)"
    status: "design_confirmed"
    problem: "既存四つ目はunion(set)で4視点の重複投票情報が消失。全視点選出も1視点選出も同ウェイト"
    solution: "投票数カウント→weight=投票数/Σ全PF投票数で正規化。context.final_weightsに書込み(engine L179が自動伝搬)"
    params: "base_period_months(6/9/12), top_n(1-5) — 既存四つ目と同じ"
    key_decisions:
      - "正規化=Σ投票数(4×top_nはタイブレークで破綻)"
      - "engine/EqualWeight改修不要(ward_two_stage_ewが前例)"
      - "SafeHaven=Cashはナンセンス(殿検証済み。L0で既使用のBBに執着しない)"
    l3_candidates: "追い風★★★(L2 CAGR+34pp/Calmar+3.7) + 加速R★★★(Calmar+3.8/MaxDD-15pp)"
    gist: "a2fc55635a61f5ff0f9c4c221ee0e9f9"
    confirmed_at: "2026-06-15"

