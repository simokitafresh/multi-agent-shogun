    - {name: "朱雀(Suzaku)", uuid: "c55a7f68-6569-4abb-8df5-9acf3dc8e061", family: DM3}
    - {name: "白虎(Byakko)", uuid: "212e9eee-6acc-4f25-8a41-ea9fdf34a4e1", family: DM6}
    - {name: "玄武(Genbu)",  uuid: "8650d48d-c60d-46de-b827-c4d38f276e37", family: "DM7+"}

naming_convention:  # (k) L0/L1/L2定義
  method_codes: {シン: "GS全期間in-sample champion固定(WFは選別に使わない。殿裁定2026-07-06)", ALM: "ディスコン(殿裁定2026-05-10)", wfシン: "WF生成シンBB系列(検証用。選別には不使用)", wfALM: "ディスコン"}
  price_source: "EODHD生値+自前調整(2026-07-05本番移行完了)。設計書→database repo docs/price-data-source-plan.md"
  L0_format: "{方式}{四神名}-{モード}  例: シン青龍-激攻 / ALM青龍-激攻"
  L1_format: "{方式}{忍法名}-{モード}  例: シン加速D-激攻 / wfシン加速D-激攻"
  L2_format: "奥義-{系統コード}-{忍法名}-{モード}  SSS=シン×シン×シン / ASS=ALM×シン×シン"
  max_production: 100体
  protected: "殿の個人PF(standard21体+FoF13体)は削除・変更禁止"
  detail: "→ projects/dm-signal/naming-portfolios.yaml (チャンピオン/パラメータ表/保護リスト全量)"

