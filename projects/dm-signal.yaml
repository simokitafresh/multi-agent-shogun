# DM-Signal 核心知識索引 (圧縮版 2026-04-26 cmd_2295)
# 正規ソース: docs/rule/trade-rule.md | 詳細: context/dm-signal.md | Saxoトレード基盤: context/saxo-trade-engine.md

project:
  id: dm-signal
  name: DM-Signal
  path: /mnt/c/Python_app/DM-signal
  description: "保有シグナル＆バックテストビューワー。FoF=乗り換え戦略。Tier=料金プラン(上位ほど多くのPF/シグナルにアクセス)"

visibility_philosophy:
  product_essence: "保有シグナル(今何を持つべきか)が最も価値のある情報。バックテスト結果は餌(課金動機)"
  vis_L2_hide_pf: "PFの存在自体を隠す。このTierでは見せないPFを丸ごと非表示(404)"
  vis_L3_mask_signal: "保有シグナルを隠しバックテストは見せる。PFの凄さを見せて上位Tier誘導"
  vis_L4_mask_components: "保有シグナルは公開するが構成ticker(=戦略のレシピ/銘柄プール)を隠す。知的財産保護"
  matrix: "docs/research/cmd_2596_visibility_matrix.md"
  deployment_constraint: "Codex(GPT)2名のみ(殿指示2026-04-12)"

engineering_preferences:
  - "prefer trade-rule.md / RULE01-11一致 over ローカル解釈。RULE05/06/08/11を先に照合せよ"
  - "prefer 実API diff全数値フィールド完全一致検証 over 数学的等価推測"
  - "prefer 本番selection block正規判定 over 事前選別・近道ロジック。選抜条件を前段で勝手に削るな"
  - "prefer FoF展開+holding_signal+signal_date規則 over 前月末/当月シグナルの短絡理解"
  - "prefer PostgreSQL直読/直書き+UPSERT+本番コードパス over SQLite/DELETE+INSERT分離"
  - "prefer explicit/minimal diff over clever abstraction。SSOT整合性+SKIP=FAILの検証義務は削るな"
  - "prefer cmd仕様パラメータ値 over 知識辞書/論文/独自判断。矛盾→decision_candidate報告"
  - "prefer .npyキャッシュorpd.read_csv(usecols) over 全量読み。GS CSV=944Kパターン(1.1GB+)"
  - "prefer 均等保有(1/N) over 個別ウェイト指定。L2/奥義/合成PFでウェイトをハードコードするな"
  - "prefer L2 universeは各方式3目的のみ over 6目的混合。シン/ALM等の方式ごとに3目的構成を保て"
  - "prefer 全候補実装・検証 over 事前選別。計算量を理由に候補を削るな"
  - "prefer 検証日+検証方法+出典の明記 over 結論だけの記録。検証トレーサビリティを残せ"
  - "prefer /db-check スキル(2段認証) over db_capability_launcher直接実行。直接実行はGuard14でBLOCKされる"

trade_rules:
  source: "docs/rule/trade-rule.md"  # Level 0 SSOT。RULE01-11。例外なし
  calculation_integrity: "signals/returns/metrics全PF×全期間で許容誤差ゼロ必須。BE変更ACに実API diff検証を含めよ"
  detail: "→ docs/research/dm_signal_trade_rules_full.md (RULE01-11詳細・誤解集・SSOT階層・GS用語)"

database:
  host: "singapore-postgres.render.com"
  connection: "backend/.env の DATABASE_URL"
  rules: ["PostgreSQL経由必須", "SQLite=本番外・書込禁止", "UPSERT維持必須(DELETE+INSERT禁止)", "本番コードパス統一"]
  detail: "→ projects/dm-signal/database-detail.yaml (テーブルスキーマ・排他制御・よくある間違い)"

pipeline:
  standard_flow: "MomentumFilter → AbsoluteMomentumFilter → SafeHavenSwitch → EqualWeight"
  absolute_momentum_band: "reference_asset modeはthreshold_band指定時に三状態(pass/band/fail)。bandは相対選択資産50%+safe_haven_asset50%。未指定PFは従来二値判定のまま不変(cmd_3707)"
  detail: "→ projects/dm-signal/pipeline-blocks.yaml (11 selection + 4 terminal blocks。tiebreak含む)"

shijin:  # L0: 4体×3モード=12体
  detail: "→ projects/dm-signal/shijin-design.yaml (設計原理・DNA制約・SM01-21・指標哲学)"
  objectives: {shin: "CAGR/NHF/MaxDD", alm: "MRU/calmar/UWP"}
  members:
