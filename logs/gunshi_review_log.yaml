# gunshi_review_log.yaml — 軍師レビュー履歴
# 統計 → logs/gunshi_stats.yaml
# GP追跡表+自己研鑽 → logs/gunshi_gp_tracker.yaml
# 詳細エントリ: cmd_1150-1199 → logs/archive/gunshi_review_log_202603a.yaml
# 詳細エントリ: cmd_1200-1254 → logs/archive/gunshi_review_log_archive.yaml
# ─── ★全レビュー最重要原理(毎回読め) ───
# このcmdの各実装選択を10回繰り返したら正の複利か負の複利か？
# (SQL毎回→負。cache1回→正。loop毎回→負。batch1回→正。道具未使用→負。道具活用→正)
# ─── ★報告レビュー セルフゲート(LGTMの前に必ず確認) ───
# SG0: gate_report_format.sh実行(自動化済み。手動チェック不要)
#   bash scripts/gates/gate_report_format.sh <report_path>
#   → PASS: SG2へ進む
#   → FAIL: 軍師がフォーマットを直接修正(report_field_set.sh or Edit)→再gate→PASS後SG2へ
#     修正内容をSG7バンドルに format_corrected: true, corrections: [修正箇所] で記録
#     目的: 家老のworkaround作業ゼロ化。LG006の精神(LGTM=GATE通過保証)は維持
#     注意: フォーマット(機械的)のみ修正。内容(判断必要)はFAILのまま差し戻し
#   (殿裁定 2026-03-23: 原因潰し+すり抜けフォールバック両面作戦)
# SG2: commit確認 (LG003手順化)
#   □ files_modifiedの各ファイルにcmd_idを含むcommitが存在するか(git log --oneline -3 -- <file>)
#   □ verdict=PASSなのにbinary_checksが空/未回答→FAIL (LG005手順化)
#   ※ 偵察タスク(files_modified=[])はスキップ可
# SG3: scope整合 (LG004手順化)
#   □ files_modifiedの各ファイルがACの変更対象に含まれるか。scope外ファイル→FAIL
# SG4: 家老処理可能性
#   □ 「家老がこの報告を受け取ったら、workaroundなしで処理できるか？」
# SG5: 偵察→実装トレーサビリティ (NEW 2026-03-22)
#   □ draftレビュー時: cmdが偵察報告を前提としているか確認
#   □ 前提偵察のCRITICAL GAPsが全てimpl ACで対処されているか
#   □ 対処されていないCRITICAL GAP → REQUEST_CHANGES
# SG6: 状態確認順序 (S5サイクル2: F006/F007軍師版)
#   □ 他エージェントの状態確認時: dashboard.md更新時刻 → inbox既読状態 → capture-pane の順
#   □ capture-paneは過去の残像。ファイルのタイムスタンプが真の現在
#   □ 「止まっている」と断定する前に、ダッシュボード更新時刻を確認せよ
# SG10: 研究基盤統合チェック (NEW 2026-04-03 — 道具を育てる)
#   ■ draft review時（上流で止める = 層1）:
#     □ 研究cmdのACに「再利用可能な関数はresearch_engine.pyに追加」が含まれているか
#     □ 含まれていない + 新規preprocessing_fn or 共通ユーティリティを実装する → REQUEST_CHANGES
#       severity: normal。suggested_changes: AC末尾に「再利用可能関数はresearch_engine.pyに追加+既存study scriptからimport」追加
#     □ 分析特化(相関計算等)で他cmdでの再利用が見込めない → 不要
#   ■ report review時（すり抜けフォールバック = 層2）:
#     □ files_modifiedにresearch_engine.pyが含まれていなければ確認
#     □ study script内に閉じた再利用可能関数 → SG7 context_refluxで補足cmd推奨
#     □ research_engine.pyに既存の同名関数を再実装 → 強く指摘（重複は技術的負債）
#   ■ 判断基準: 他の研究cmdで再利用可能か？ YES→統合必須。NO→study script可
#   □ 目的: 各実験がresearch_engineを育て、次の実験が速くなる(+1点の複利)
#   □ 根拠: cmd_1698(JD→engine統合✓) vs cmd_1699/1700/1701(3連続未統合)。殿指摘2026-04-03
#   □ 自動化候補(層3): gate_research_engine_check.sh — 研究cmd報告でresearch_engine未importを自動WARN
# SG7: 完全パッケージ (NEW 2026-03-23 — 利他サイクル)
#   □ report review verdict=LGTM時、以下を追加バンドル:
#     (a) gate_precheck: gate_report_format.sh結果 + commit確認結果 + GATE通過予測
#     (b) lesson_extraction: lesson_candidateの要約 + 登録推奨判定
#     (c) context_reflux: context索引更新要否の判定（数値・事実・設計決定の有無）
#     (d) dashboard_line: "cmd_XXXX {ninja} {verdict}。{成果1行}。workaround: {yes/no}" 事前ドラフト
#     (e) karo_workaround_needed: yes/no（家老の手動修正が必要か事前判定）
#   □ 目的: 家老の後処理5ステップ→1ステップ(stamp)に圧縮。家老の時間をCMD分解に解放
#   □ 計測: SG7適用前後の家老CMD→配備タイムラグ変化で効果検証
#   □ バンドル出力フォーマット仕様（verdict=LGTM時にinbox_writeメッセージ末尾に付与）:
#     --- SG7 bundle ---
#     gate_precheck:
#       report_format: PASS/FAIL      # gate_report_format.sh結果
#       commit_verified: true/false    # files_modifiedの各ファイルにcmd_idのcommit存在
#       gate_prediction: CLEAR/WARN   # 上記2項からGATE通過を予測
#     lesson_extraction:
#       has_candidate: true/false      # lesson_candidateが存在するか
#       summary: "{教訓の1行要約}"      # has_candidate=true時のみ
#       register_recommended: true/false  # 正式登録を推奨するか(一般論=false, 再利用可能な具体知見=true)
#     context_reflux:
#       needed: true/false             # context索引の更新が必要か
#       target: "{context/*.mdパス}"   # needed=true時のみ。更新すべきcontextファイル
#       content: "{更新内容の1行要約}" # needed=true時のみ
#     dashboard_line: "cmd_XXXX {ninja} PASS。{成果1行要約}。workaround: no"
#     karo_workaround_needed: no       # yes=家老の手動修正が必要, no=スタンプのみで完了
#     --- SG7 bundle end ---
#   □ 運用ルール:
#     - verdict=LGTM時のみ出力。FAIL時はfail_reasonsのみ（バンドル不要）
#     - 家老はバンドルを受領→内容確認→stamp(PASS)+ペースト(dashboard/教訓/context)で完了
#     - gate_precheck.gate_prediction=WARNの場合、家老は自らGATEを確認してから進行
# SG8: 自動消火チェック (2026-03-23 — cmd_1278教訓 + S27遡及検証で4類型追加)
#   □ 全draftレビュー時に以下4類型を順にチェック:
#     TypeA(根本原因推測): 根本原因が「推測」「〜と思われる」のままAPPROVEしていないか？
#       → 推測段階の原因修正は表面処理。根本原因確定cmdを先行させよ
#       → 実例: cmd_1255 — 338SKIPの根本原因が推測段階でCI GREEN復帰
#     TypeB(設計矛盾先送り): 設計上の矛盾を認識しつつ「忍者裁量」「後続で対応」と逃げていないか？
#       → 矛盾解決の別cmdを先行させよ
#       → 実例: cmd_1267 — タイムスタンプ源不在の設計矛盾を忍者裁量に委ねた
#     TypeC(技術債正当化): 「将来清掃候補」「scope外だが」で技術債を正当化していないか？
#       → 技術債は未来形でなく確定スケジュールに。並列cmdで整理を起票
#       → 実例: cmd_1275 — grid_search内の残存スクリプトを「将来清掃候補」で先送り
#     TypeD(構造問題一行削除): 大規模な構造問題を一行の設定変更/削除で隠蔽していないか？
#       → 根源的構造改革(Vercel化等)のcmd化を要求
#       → 実例: cmd_1278 — 7,552行のlessons.yamlを「読むな」1行で隠蔽→Vercel化の動機消滅
#   □ 総合判定: 4類型のいずれか該当 → REQ_CHANGES(根源的対処cmdの並行起票を提案)
# → SG0 FAIL or SG2-SG6のいずれかNG or SG8該当 → verdict: FAIL/REQ_CHANGES（「注記のみ」禁止）
# SG10: 送信前セルフゲート (GP-035 — S102実装)
#   □ report review完了時、inbox_write送信前に全項目確認:
#     (1) SG0実行済み: gate_report_format.sh PASSか？ 未実行なら今すぐ実行
#     (2) SG2実行済み: files_modifiedの各ファイルにcmd_idのcommit存在確認済みか？
#     (3) verdict整合: binary_checks全yes→LGTM / 1つでもno→FAIL か？ 矛盾があればverdictを修正
#     (4) SG7完全性(LGTM時のみ): バンドル全フィールド(gate_precheck/lesson/context/dashboard/wa)記入済みか？
#     (5) WA予測: ninja_weak_pointsのtop_patternが今回の報告に該当していないか？ 該当→重点確認済みか？
#   □ 1つでも未完了 → 送信前に完了させよ。送信後の気づきは遅い
#   □ 目的: 「家老がworkaroundなしで処理できるか」の最終確認。LG006の精神を送信段階で保証
# ─────────────────────────
# ─── エントリ形式(簡略) ───
# draft: cmd_id, verdict, gate_result, findings_summary(1行), timestamp, proposals(optional)
# report: + report_ninja, lesson_quality, proposals(optional)
