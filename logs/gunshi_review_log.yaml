# ★退化計測原理(CoDD#3): GP/改善を入れたら「退化していないか」をbefore/afterで計測せよ。参照率(行動有無)≠有効率(行動効果)。計測対象を間違えると盲点が構造的に生まれる(2026-04-16: useful率26%をreferenced率76%が隠していた)
# ★GP提案前に既存実装grep確認必須(LG033強制)。「自力不可→家老送信」の前に「そもそも必要か？」を現物で確認。未確認→不要提案→家老CTX消費=負の複利(GP-216事故: deploy_task.sh L2261-2278に既存filter→obsolete)
# ★Codex家老STALL検知: Codex CLIは宣言出力後にプロンプト(›)で停止する。レビュー送信後にcapture-pane 2回比較(差分なし=停止)で確認。1回見て「動いている」と判断するな(2026-04-22殿指摘)
# ★スコープ一致原則: 対策のスコープは問題のスコープと一致させよ。一時的問題(cmd固有)に恒久対策(hook)を使うな。自問「この問題はいつまで存在する？この対策はいつまで残る？一致しているか？」(2026-04-22殿指摘: 単発禁止にpre-bash hook設置→外し忘れ→将来の全cmdBLOCK=負の複利)
# Simplicity観点: 既存の仕組みを磨くだけで済むなら新規フラグ/分岐/ファイル/手順を増やすな。複雑さを増やす場合は必要性を明文化せよ
# ★commit attribution確認: files_modifiedのファイルがcommit_hashの`git show --stat`に含まれるか検証。含まれない→auto-commitへのcross-contamination疑い(cmd_2492: kagemaru変更がhayate auto-commitに混入)
# Think Before Coding観点: 忍者が暗黙の前提を置いていないか。ACの前提が曖昧なまま実装していないか。不確実なら止まって聞いたか(Karpathy原則1)
# ★ambiguity観点シフト(将軍承認2026-04-26): 「表現の曖昧性」→「解釈の曖昧性」。(1)AC数値は固定か可変か(並行cmd/時間経過で変動？) (2)推奨と必須の分離(「すべき」がACに？→notesへ) (3)暗黙のデータ前提(取得タイミング/鮮度が明示？)。cmd_save gateが上流で表現曖昧性を除去→残留パターンが軍師固有の検出点
# コード修正の横展開: grep修正前パターンで残存0件確認必須。1箇所修正→コピペ散在ファイル漏れ(cmd_1899: bisect fix 04f74830がTRF/MAF漏れ→12体Cash100%)
# RESEARCH cmd(commit免除): files_modifiedファイルの実在+parent_cmd命名一致を確認せよ。手段の免除≠目的の免除(cmd_1948: 成果物0件がGATE CLEAR。GP-202+PRE3で二重防御)
# golden data検証基準: 生成時のコード状態(commit)を確認。バグ状態で生成されたgolden dataは検証基準にならない(cmd_1899: TRFバグ状態のgolden=全選択≠正しいTop+Worst)
# パリティスクリプトtarget_date: productionと同じ日付で再実行必須。skip_months>0で差が増幅(cmd_1898: 前月末日vs第1営業日→抜き身/四つ目83-99%)
# 「既にBLOCK化済み」判定→git show <commit>:fileで確認せよ。Readはuncommitted変更を含む(cmd_1912: exit 1があると思ったらuncommitted変更だった。LG001の再発形)
# Android gradlew並列競合: 2忍者同時assembleDebug→build dir競合(R.jar/BuildConfig欠落)。Android cmdはDB排他同様に直列配備(cmd_1943+1944で実証)
# waive付きresult:no→gate機械的BLOCK: SG-PRE9で事前WARN→gate_prediction:WARNに設定せよ(cmd_1944で実証。家老override→CLEAR)
# lesson_candidate(found:true)有→gate_prediction: WARN。4回見落とし(cmd_1811/1814/1909/1911)→GP-195 SG-PRE12自動化済み(2026-04-15)
