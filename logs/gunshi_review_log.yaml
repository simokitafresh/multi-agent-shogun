# ─── ★全レビュー最重要原理(毎回読め) ───
# ★★★ レビュー依頼=最優先。自走・分析・高速化より先にinbox処理。他者の仕事をブロックするな(2026-04-15殿指摘)
# このcmdの各実装選択を10回繰り返したら正の複利か負の複利か？
# (SQL毎回→負。cache1回→正。loop毎回→負。batch1回→正。道具未使用→負。道具活用→正)
# 忍者/家老のミスに見える問題はインフラが真因でないか？道具を疑え。
# (2026-04-06実証: task_id/ac_task_id不一致→8スクリプト28箇所。lessons_useful空リスト=awk regex壊。scope_mode未伝搬=偵察フィルタ不発)
# チェックリスト参照cmdは前後Stepの禁則をACに転写済みか？(LG012: cmd_1397で再計算禁止未転写→忍者実行)
# 状態確認: dashboard→inbox→capture-pane。capture-pane=過去の残像。ファイルmtime=現在(LG007)
# cmd分割: AC>4 or 依存ありAC並列 → REQUEST_CHANGES。3基準: 任意忍者可/短完了/依存並列考慮(LG021)
# ★既実装判定はgit show HEAD:ファイルで確認。Read toolはuncommitted含む=忍者作業中変更を既存と誤判定する(LG001: 3回再発)
# 研究cmdにbaselineなし → REQUEST_CHANGES。改善主張には比較対象が必須(LG022)
# ★precheck省略禁止。偵察報告でも必ずgate_gunshi_report_precheck.sh実行(PRE18=adversarial強制、PRE12=lesson_candidate検出)
# gate_prediction廃止(殿裁定2026-05-03): SG7バンドルからgate_prediction削除。家老の行動を変えていなかった。precheckのGATE_PREDICTION表示はレビュー自己参照用に残す
# ★冷え観点自問(2026-05-05): draftレビューでambiguity/adversarialが0件でも「チェックして0件」か「チェック自体を省いた」か区別せよ。チェック済みなら finding_categories に含めよ
# ★ac_phase_mixing(2026-05-07): 将軍のcmdでimpl+testをACに混在させるパターンが累計32回WARN→BLOCK。draftレビューStep3(simulation)でAC分離を確認すべき観点
# ★LG034(殿指摘2026-05-07): 「低ROI/対応不要」は作業量縮小の隠語。優先順位=実行順であり全部やる。一部対処→穴→手戻り増。idle自走でStep完了時に「残件を低ROIで放置していないか」自問
# gate_sync手動廃止(殿裁定2026-05-03): BLOCK/CLEAR通知のreview_log手動更新を廃止。startup gate自動syncに委ねる。APPROVE→FAILの品質分析のみ手動対応
# ★既存判定はgit show HEAD限定。Read toolはuncommitted含む。忍者の成果物を「既存」と誤認する(cmd_2474: LG001違反→false positive REQUEST_CHANGES)
# ★ゲート差替え/削除cmd → North Star Q1強制(症状抑制か根本解消か)。差替え先が品質を計測しているか問え(cmd_2473: exit 0=PASS→品質未計測の消火を承認)
# AC commit check → (a)対象ファイルがgitignore/outputs/なら除外設計か確認 (b)cmd制約にcommit禁止→bc result:noでGATE BLOCK予測(cmd_1897/1900: T1違反)
# ★非致命的(non-fatal)=先送りの隠語(殿指摘2026-05-10)。メリットがあるならバグは修正すべき。「運用影響なし」で放置するな。全件に順番を付けて全部やる
# ★自動生成→手動処理の連鎖はdedup checkで根絶せよ(insight dedup 02c57247)。消火(手動resolve)ではなく根本(生成元のフィルタ)を直す
# ★SG-PRE9 result:no → GATE BLOCK予測。**例外: test_triage=pre_existingはWARN降格でCLEAR**(cmd_2339実証)
# REQUEST_CHANGES verdict → severity: urgent/normal 必須。欠落→家老がurgent/normal判断できず対応遅延(cmd_1836/1841で2件欠落, 2026-04-11検出)
# ★DM-Signalリポ側commitはprecheck「commit not found」が想定内。git -C /mnt/c/Python_app/DM-signal log --oneline -1 -- <file>で確認せよ(cmd_2557/2559実証)
# ★「問題なし」も行動(記録+共有)が必要。分析結果が問題ゼロでもdocs/research永続化+掲示板投稿まで回せ。/clearで消える知見は存在しない知見(なぜなぜ7回 2026-05-04)
# ★気づき→D0判定→即行動(L586): 掲示板投稿で止まるな。D0条件(1ファイル20行以下/scripts対象)を満たすなら即実装。掲示板は実装後の報告(LG018 3回再発の根治)
# ★report_review+報告YAML不在→即FAILするな(L587): karo_direct配備ではYAML不在が正当。task_type/parent_cmdで配備方式を確認してからFAIL判定
# ★因果分析は5W1H+WHO(L588): where(どのファイル/フロー)とwho(誰が送信/実行)を埋めないと根因に到達しない(殿指摘2026-05-10)
# 「既実装」判定 → git show HEAD~1:file で変更前状態を確認。HEADは並行commit影響を受ける(cmd_1860 premature_shelve: LG001違反の変形)
# AC絶対条件(「全期間」「100%」「全ファイル」)→構造的例外の有無を確認。例外あれば除外条件をAC文面に明示(5件verdict_override共通根因, 2026-04-12分析)
# ★idle自走でバグ発見→D0で即修正。分析→記録で止めるな。修正→検証→commitまで回せ(2026-05-03: 3件検出→3件修正→家老LGTM)
# ★draft_lessonsチェックはcmd固有スコープ。プロジェクト全体のdraftで全cmdをBLOCKするのは過剰(2026-05-03修正: cmd_complete_gate.sh WARN降格)
# 全称判定(ゼロ/全て/なし/壊れない)→反証を探せ。反証が見つからなかったらOK。反証を探す前にOKを出すな。著者の物語に乗るな(cmd_1884 kawarimi見落とし: 7段なぜなぜ到達点)
