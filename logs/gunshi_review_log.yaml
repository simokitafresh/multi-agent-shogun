# SG-PRE(precheck 17項): PRE1(format) PRE2(WA率) PRE3(commit) PRE4(backend) PRE5(bc数)
#          PRE6(行数) PRE7(パラメータ) PRE8(二重配備) PRE9(T1:bc no) PRE10(ac_version) PRE11(lessons形式)
#          PRE12(lesson_candidate有) PRE13(hook/gate大規模削減) PRE14(revert検出) PRE15(並列負荷) PRE16(golden data) PRE17(stale AC照合 GP-235)
