# 状態確認: dashboard→inbox→capture-pane。capture-pane=過去の残像。ファイルmtime=現在(LG007)
# cmd分割: AC>4 or 依存ありAC並列 → REQUEST_CHANGES。3基準: 任意忍者可/短完了/依存並列考慮(LG021)
# 研究cmdにbaselineなし → REQUEST_CHANGES。改善主張には比較対象が必須(LG022)
# SG7 gate_prediction: lesson_candidate有→draft_lessons BLOCKリスク。gate_prediction: WARNに設定せよ(cmd_1811/1814/1909/1911/2131で5回miss)
# ★並列配備cmd: 同一cmdの他忍者報告にlesson_candidate有→自分の報告もgate_prediction:WARNに設定(cmd_2261: kagemaru有/hayate無→hayate CLEAR予測→実際BLOCK)
# ★precheck省略禁止。偵察報告でも必ずgate_gunshi_report_precheck.sh実行。SG-PRE12がlesson_candidate自動検出→gate_prediction誤予測の唯一の防御(cmd_2131: 省略→CLEAR→BLOCK)
# AC commit check → (a)対象ファイルがgitignore/outputs/なら除外設計か確認 (b)cmd制約にcommit禁止→report review時にSG7 gate_prediction:WARNでGP-128 BLOCK予測を明記。一律適用=負の複利(cmd_1897 LGTM→BLOCK: T1違反)
# verdict=FAIL報告にLGTM → gate_prediction:BLOCK必須。binary_checks result:noがあればgate機械的BLOCK。報告品質OKでも予測を付記せよ(cmd_1900: T1再発。cmd_1897と同構造)
# ★SG-PRE9 result:no → gate_prediction:BLOCK固定。**例外: test_triage=pre_existingはWARN降格でCLEAR**(cmd_2339で実証。cmd_complete_gate.sh L1962)。waive_reasonの有無に関わらず(GP-190はテンプレート側のみ、gate側にwaive免除なし。cmd_2093で誤予測WARN→実際BLOCK)
# REQUEST_CHANGES verdict → severity: urgent/normal 必須。欠落→家老がurgent/normal判断できず対応遅延(cmd_1836/1841で2件欠落, 2026-04-11検出)
# 「既実装」判定 → git show HEAD~1:file で変更前状態を確認。HEADは並行commit影響を受ける(cmd_1860 premature_shelve: LG001違反の変形)
# AC絶対条件(「全期間」「100%」「全ファイル」)→構造的例外の有無を確認。例外あれば除外条件をAC文面に明示(5件verdict_override共通根因, 2026-04-12分析)
# 全称判定(ゼロ/全て/なし/壊れない)→反証を探せ。反証が見つからなかったらOK。反証を探す前にOKを出すな。著者の物語に乗るな(cmd_1884 kawarimi見落とし: 7段なぜなぜ到達点)
# ★前提崩壊=RC最大原因(79%, 11/14件)。cmdが参照する全数値・パス・状態を現物確認。特にCSV→wc -l、メモリ→実測RSS、CI→run確認(cmd_1896/1825/1806)
# ★dm-signal CSV出力禁止(殿裁定2026-04-28): CSVは汚染の温床。SQLiteのみ出力。「CSV互換」「CSV残す」提案は殿裁定と突合せよ
# 軍師自己コード変更(hooks/gates/CLAUDE.md/instructions/settings)→S0プロトコル必須。docs/research/gunshi_sg_s0_self_code_change_20260412.md(LG026)
# ★blast_radius判定: draft対象がhook/gate/CLAUDE.md/instructions/settings含む→adversarial_review.required:trueを設定(GP-236。changed_lines<200でもblast radius大=adversarial必須)
# 2系統計算パス(batch+sequential/verify)がある場合→両方の更新がACに含まれているか確認(cmd_2193/2197: kawarimi verify FAIL=sequential未同期)
# ★退化計測原理(CoDD#3): GP/改善を入れたら「退化していないか」をbefore/afterで計測せよ。参照率(行動有無)≠有効率(行動効果)。計測対象を間違えると盲点が構造的に生まれる(2026-04-16: useful率26%をreferenced率76%が隠していた)
# ★GP提案前に既存実装grep確認必須(LG033強制)。「自力不可→家老送信」の前に「そもそも必要か？」を現物で確認。未確認→不要提案→家老CTX消費=負の複利(GP-216事故: deploy_task.sh L2261-2278に既存filter→obsolete)
# ★Codex家老STALL検知: Codex CLIは宣言出力後にプロンプト(›)で停止する。レビュー送信後にcapture-pane 2回比較(差分なし=停止)で確認。1回見て「動いている」と判断するな(2026-04-22殿指摘)
# ★スコープ一致原則: 対策のスコープは問題のスコープと一致させよ。一時的問題(cmd固有)に恒久対策(hook)を使うな。自問「この問題はいつまで存在する？この対策はいつまで残る？一致しているか？」(2026-04-22殿指摘: 単発禁止にpre-bash hook設置→外し忘れ→将来の全cmdBLOCK=負の複利)
# Simplicity観点: 既存の仕組みを磨くだけで済むなら新規フラグ/分岐/ファイル/手順を増やすな。複雑さを増やす場合は必要性を明文化せよ
# Think Before Coding観点: 忍者が暗黙の前提を置いていないか。ACの前提が曖昧なまま実装していないか。不確実なら止まって聞いたか(Karpathy原則1)
# ★ambiguity観点シフト(将軍承認2026-04-26): 「表現の曖昧性」→「解釈の曖昧性」。(1)AC数値は固定か可変か(並行cmd/時間経過で変動？) (2)推奨と必須の分離(「すべき」がACに？→notesへ) (3)暗黙のデータ前提(取得タイミング/鮮度が明示？)。cmd_save gateが上流で表現曖昧性を除去→残留パターンが軍師固有の検出点
# コード修正の横展開: grep修正前パターンで残存0件確認必須。1箇所修正→コピペ散在ファイル漏れ(cmd_1899: bisect fix 04f74830がTRF/MAF漏れ→12体Cash100%)
# RESEARCH cmd(commit免除): files_modifiedファイルの実在+parent_cmd命名一致を確認せよ。手段の免除≠目的の免除(cmd_1948: 成果物0件がGATE CLEAR。GP-202+PRE3で二重防御)
# golden data検証基準: 生成時のコード状態(commit)を確認。バグ状態で生成されたgolden dataは検証基準にならない(cmd_1899: TRFバグ状態のgolden=全選択≠正しいTop+Worst)
# パリティスクリプトtarget_date: productionと同じ日付で再実行必須。skip_months>0で差が増幅(cmd_1898: 前月末日vs第1営業日→抜き身/四つ目83-99%)
# 「既にBLOCK化済み」判定→git show <commit>:fileで確認せよ。Readはuncommitted変更を含む(cmd_1912: exit 1があると思ったらuncommitted変更だった。LG001の再発形)
# Android gradlew並列競合: 2忍者同時assembleDebug→build dir競合(R.jar/BuildConfig欠落)。Android cmdはDB排他同様に直列配備(cmd_1943+1944で実証)
# waive付きresult:no→gate機械的BLOCK: SG-PRE9で事前WARN→gate_prediction:WARNに設定せよ(cmd_1944で実証。家老override→CLEAR)
# lesson_candidate(found:true)有→gate_prediction: WARN。4回見落とし(cmd_1811/1814/1909/1911)→GP-195 SG-PRE12自動化済み(2026-04-15)
# 他エージェントのコード変更をrevertする前に変更元に通知せよ(殿裁定2026-04-15)。deploy_task.sh R1+R2がrevert→依存ファイル先commitで解決可能だった。事後通知では手遅れ
# ─── ★SGプロトコル正本 → instructions/gunshi.md §Report Review / §5段階思考プロトコル ───
# SG一覧: SG0(gate自動) SG2(commit) SG3(scope) SG4(家老処理) SG5(偵察トレーサビリティ)
