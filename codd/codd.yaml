# CoDD プロジェクト設定
version: "0.1.0"
codd_required_version: null
codd_required_version_strict: false

project:
  name: "multi-agent-shogun-script-brownfield"
  language: "bash"
  frameworks: []

ai_command: "/home/simokitafresh/bin/claude --print --model claude-opus-4-6 --tools \"\""
coding_principles: null

scan:
  source_dirs:
    - "codd/brownfield_targets/"
  test_dirs:
    - "tests/"
  doc_dirs:
    - "codd/requirements/"
    - "codd/design/"
    - "codd/brownfield/"
  config_files: []
  exclude:
    - "**/node_modules/**"
    - "**/__pycache__/**"
    - "**/dist/**"
    - "docs/research/**"
    - "docs/archive/**"
    - "docs/test/**"

graph:
  store: "jsonl"
  path: "codd/scan"

bands:
  green:
    min_confidence: 0.90
    min_evidence_count: 2
  amber:
    min_confidence: 0.50

propagation:
  max_depth: 10
  stop_at_contract_boundary: true
  command: "bash scripts/semantic_map_generate.sh --body-only"

typecheck:
  enabled: false
  command: null
  max_repair_attempts: 3

ci:
  provider: github_actions
  workflow_glob: .github/workflows/*.yml
  required_triggers:
    - push
    - pull_request
  runtime_check: false
  staleness_days: 14
  default_branch: main

context_acquisition:
  enabled: true
  strategy: web_search_first
  sources:
    - type: official_docs
      priority: high
    - type: github_search
      priority: medium
    - type: web_search
      priority: medium
  cache_ttl_days: 30
  freshness_check_on_startup: false
  fact_check:
    enabled: true
    min_sources: 2
    min_confidence: 0.6
