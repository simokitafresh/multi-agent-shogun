version: 0.1.0
codd_required_version: null
codd_required_version_strict: false
project:
  frameworks: []
  name: multi-agent-shogun-script-brownfield
  language: bash
ai_command: /home/simokitafresh/bin/claude --print --model claude-opus-4-6 --tools
  ""
ai_commands:
  plan_derive: null
  design_doc_extract: null
  criteria_expand: null
coding_principles: null
scan:
  source_dirs:
  - src/
  - codd/brownfield_targets/
  test_dirs:
  - tests/
  doc_dirs:
  - docs/
  - codd/requirements/
  - codd/design/
  - codd/brownfield/
  config_files: []
  exclude:
  - '**/node_modules/**'
  - '**/__pycache__/**'
  - '**/dist/**'
  - docs/research/**
  - docs/archive/**
  - docs/test/**
graph:
  store: jsonl
  path: codd/scan
bands:
  green:
    min_confidence: 0.9
    min_evidence_count: 2
  amber:
    min_confidence: 0.5
propagation:
  max_depth: 10
  stop_at_contract_boundary: true
  command: bash scripts/semantic_map_generate.sh --body-only
coherence:
  capability_patterns: {}
  path_prefix_tolerant:
  - src/
  - lib/
  - app/
hitl:
  mode: cooperative
requirement_completeness:
  project_type: null
  channels:
  - askuserquestion
  - ntfy
  - lexicon
  ntfy_topic: ''
  questions: []
  ai_missing_items: false
  semantic_check: false
  ai_generate_options: false
  ai_timeout_seconds: 30
fix:
  test_command: null
  max_attempts: 3
verify:
  typecheck_command: null
  test_command: null
  report_output: docs/test/verify_report.md
  e2e_setup_command: null
  e2e_command: null
  e2e_deploy_command: null
  e2e_ci_command: null
typecheck:
  enabled: false
  command: null
  max_repair_attempts: 3
conventions: []
extraction:
  frontmatter_alias: {}
ci:
  provider: github_actions
  workflow_glob: .github/workflows/*.yml
  required_triggers:
  - push
  - pull_request
  runtime_check: false
  staleness_days: 14
  default_branch: main
context_acquisition:
  enabled: true
  strategy: web_search_first
  sources:
  - type: official_docs
    priority: high
  - type: github_search
    priority: medium
  - type: web_search
    priority: medium
  cache_ttl_days: 30
  freshness_check_on_startup: false
  fact_check:
    enabled: true
    min_sources: 2
    min_confidence: 0.6
wave_config:
  '1':
  - node_id: test:acceptance-criteria
    output: docs/test/acceptance_criteria.md
    title: Acceptance Criteria
    depends_on:
    - id: req:script:cmd-save
      relation: derives_from
      semantic: governance
    - id: req:script:deploy-task
      relation: derives_from
      semantic: governance
    - id: req:script:inbox-write
      relation: derives_from
      semantic: governance
    - id: req:script:ninja-monitor
      relation: derives_from
      semantic: governance
    - id: req:script:dashboard-auto-section
      relation: derives_from
      semantic: governance
    - id: req:script:restart-watchers
      relation: derives_from
      semantic: governance
    - id: req:deploy-task-refactor-requirements
      relation: derives_from
      semantic: governance
    conventions:
    - targets:
      - module:inbox_write
      - module:cmd_save
      - module:deploy_task
      - module:yaml_helpers
      reason: flock-based atomic YAML writes and inbox-path-only communication are
        release-blocking safety constraints across all agent-facing scripts (SR-3
        inbox_write, SR-1 deploy_task, SR-3 cmd_save).
    - targets:
      - module:yaml_helpers
      - module:deploy_task
      reason: API backward compatibility for yaml_field_set and field_get and zero
        test regressions are release-blocking for the batch refactor (refactor constraints).
    - targets:
      - module:inbox_write
      reason: Ninja-to-shogun direct messaging prohibition is a release-blocking routing
        constraint (SR-2 inbox_write).
    modules:
    - cmd_save
    - deploy_task
    - inbox_write
    - ninja_monitor
    - dashboard_auto_section
    - restart_watchers
    - yaml_helpers
  - node_id: governance:adr-yaml-batch-operations
    output: docs/governance/adr_yaml_batch_operations.md
    title: 'ADR: YAML Batch Operations Design'
    depends_on:
    - id: req:deploy-task-refactor-requirements
      relation: derives_from
      semantic: governance
    - id: req:script:deploy-task
      relation: derives_from
      semantic: governance
    conventions:
    - targets:
      - module:yaml_helpers
      - module:deploy_task
      reason: yaml_field_set_batch must use single flock+awk pass; field_get_multi
        must use single awk pass. Existing API contracts must be preserved; violation
        breaks all queue mutations system-wide.
    modules:
    - yaml_helpers
    - deploy_task
  '2':
  - node_id: design:system-overview
    output: docs/design/system_overview.md
    title: System Overview
    depends_on:
    - id: test:acceptance-criteria
      relation: constrained_by
      semantic: governance
    - id: governance:adr-yaml-batch-operations
      relation: constrained_by
      semantic: governance
    conventions:
    - targets:
      - module:inbox_write
      - module:deploy_task
      - module:cmd_save
      - module:ninja_monitor
      reason: Inbox-path-only communication, flock-based YAML safety, delegated-command
        immutability (SR-2 cmd_save), and ninja-to-shogun prohibition (SR-2 inbox_write)
        are system-wide release-blocking constraints.
    - targets:
      - module:ninja_monitor
      - module:restart_watchers
      reason: Singleton daemon pattern (FR-1 ninja_monitor, FR-1 restart_watchers)
        and two-stage process termination SIGTERM→SIGKILL (SR-1 restart_watchers)
        are release-blocking for process lifecycle safety.
    - targets:
      - module:inbox_write
      - module:deploy_task
      reason: WSL2 /mnt/* lock file compatibility is release-blocking; standard flock
        may not work on Windows-mounted paths (FR-4 inbox_write).
    modules:
    - cmd_save
    - deploy_task
    - inbox_write
    - ninja_monitor
    - dashboard_auto_section
    - restart_watchers
    - yaml_helpers
  '3':
  - node_id: design:communication-protocol
    output: docs/design/communication_protocol.md
    title: Communication Protocol Design
    depends_on:
    - id: design:system-overview
      relation: depends_on
      semantic: technical
    conventions:
    - targets:
      - module:inbox_write
      - module:deploy_task
      - module:ninja_monitor
      reason: All agent communication must transit inbox_write.sh with flock-atomic
        persistence; wake-up nudges are secondary to durable inbox writes (SR-1 inbox_write).
        WSL2 /mnt/* lock compatibility required (FR-4 inbox_write).
    - targets:
      - module:inbox_write
      reason: Ninja-to-shogun direct messaging prohibition (SR-2 inbox_write) and
        duplicate task_assigned blocking for same parent cmd (FR-5 inbox_write) are
        release-blocking routing constraints.
    modules:
    - inbox_write
    - deploy_task
    - ninja_monitor
  - node_id: design:queue-state-management
    output: docs/design/queue_state_management.md
    title: Queue & State Management Design
    depends_on:
    - id: design:system-overview
      relation: depends_on
      semantic: technical
    conventions:
    - targets:
      - module:cmd_save
      - module:deploy_task
      - module:yaml_helpers
      reason: No yaml.dump; all YAML mutations via structured helpers with flock (SR-1
        deploy_task). Delegated-command immutability (SR-2 cmd_save) and gate-state
        blocking (SR-1 cmd_save) are release-blocking.
    - targets:
      - module:deploy_task
      reason: Report template generation must not overwrite completed reports (FR-6
        deploy_task). Duplicate active deployment blocking when completed peer report
        exists (SR-2 deploy_task).
    modules:
    - cmd_save
    - deploy_task
    - yaml_helpers
  - node_id: design:monitoring-daemons
    output: docs/design/monitoring_daemons.md
    title: Monitoring & Daemon Services Design
    depends_on:
    - id: design:system-overview
      relation: depends_on
      semantic: technical
    conventions:
    - targets:
      - module:ninja_monitor
      - module:restart_watchers
      reason: Singleton lock (FR-1 ninja_monitor, FR-1 restart_watchers), two-stage
        termination SIGTERM→SIGKILL (SR-1 restart_watchers), and never-clear-active-pane
        unless report+idle gates pass (SR-2 ninja_monitor) are release-blocking daemon
        safety constraints.
    - targets:
      - module:dashboard_auto_section
      reason: Atomic temp+mv writes (SR-1 dashboard), graceful degradation to dash
        placeholders on missing sources (SR-2 dashboard), and marker-absent exit-1
        (SR-3/SR-4 dashboard) are release-blocking for dashboard integrity.
    - targets:
      - module:dashboard_auto_section
      reason: Cache TTLs (CI 60s, context freshness 120s, git rev-list 60s) and project-scoped
        cache paths via cksum are release-blocking performance constraints (PR-1 through
        PR-4 dashboard).
    modules:
    - ninja_monitor
    - restart_watchers
    - dashboard_auto_section
  '4':
  - node_id: detailed:yaml-library
    output: docs/detailed_design/yaml_library.md
    title: YAML Helper Library Detailed Design
    depends_on:
    - id: design:queue-state-management
      relation: depends_on
      semantic: technical
    - id: governance:adr-yaml-batch-operations
      relation: constrained_by
      semantic: governance
    conventions:
    - targets:
      - module:yaml_helpers
      reason: 'yaml_field_set_batch must perform single flock acquisition + single
        awk pass + single atomic mv; field_get_multi must perform single awk pass.
        Existing yaml_field_set and field_get caller signatures must remain unchanged.
        Performance target: resolve_cmd_to_task 627ms→100ms, inject_ac_version 541ms→80ms.'
    modules:
    - yaml_helpers
  - node_id: detailed:message-flow
    output: docs/detailed_design/message_flow.md
    title: Message Flow Sequence Diagrams
    depends_on:
    - id: design:communication-protocol
      relation: depends_on
      semantic: technical
    - id: design:queue-state-management
      relation: depends_on
      semantic: technical
    conventions:
    - targets:
      - module:inbox_write
      - module:deploy_task
      - module:cmd_save
      reason: Message persistence must precede wake-up nudges (SR-1 inbox_write).
        Duplicate task_assigned blocking (FR-5 inbox_write), lesson-injection safety
        net (FR-6 inbox_write), and report format check triggering (FR-7 inbox_write)
        are release-blocking sequencing constraints.
    modules:
    - inbox_write
    - deploy_task
    - cmd_save
  - node_id: detailed:process-lifecycle
    output: docs/detailed_design/process_lifecycle.md
    title: Process Lifecycle State Machines
    depends_on:
    - id: design:monitoring-daemons
      relation: depends_on
      semantic: technical
    conventions:
    - targets:
      - module:ninja_monitor
      reason: Idle detection must prefer hook state (@agent_state) and explicit busy
        evidence over prompt-only patterns (SR-1 ninja_monitor). Pane clear requires
        both idle confirmation and report-gate pass (SR-2 ninja_monitor). karo_snapshot
        generation must include cmd, ninja, model, context, and report state (FR-5
        ninja_monitor).
    - targets:
      - module:restart_watchers
      reason: Singleton flock -n at /tmp/restart_watchers.lock (FR-1), two-stage kill
        with survivor check (SR-1), inotifywait count verification against started
        watcher count (FR-7), and pane resolution failure as silent skip not error
        (SR-2) are release-blocking.
    modules:
    - ninja_monitor
    - restart_watchers
  - node_id: detailed:component-dependency-map
    output: docs/detailed_design/component_dependency_map.md
    title: Component Dependency Map
    depends_on:
    - id: design:system-overview
      relation: depends_on
      semantic: technical
    - id: design:communication-protocol
      relation: depends_on
      semantic: technical
    - id: design:queue-state-management
      relation: depends_on
      semantic: technical
    - id: design:monitoring-daemons
      relation: depends_on
      semantic: technical
    modules:
    - cmd_save
    - deploy_task
    - inbox_write
    - ninja_monitor
    - dashboard_auto_section
    - restart_watchers
    - yaml_helpers
  '5':
  - node_id: plan:implementation-plan
    output: docs/plan/implementation_plan.md
    title: Implementation Plan
    depends_on:
    - id: detailed:yaml-library
      relation: depends_on
      semantic: technical
    - id: detailed:message-flow
      relation: depends_on
      semantic: technical
    - id: detailed:process-lifecycle
      relation: depends_on
      semantic: technical
    - id: detailed:component-dependency-map
      relation: depends_on
      semantic: technical
    conventions:
    - targets:
      - module:yaml_helpers
      - module:deploy_task
      reason: Implementation sequence must follow R3→R4→R1→R2→full-test order from
        refactor requirements; out-of-order implementation risks regression in 48
        ac_handling tests.
    modules:
    - cmd_save
    - deploy_task
    - inbox_write
    - ninja_monitor
    - dashboard_auto_section
    - restart_watchers
    - yaml_helpers
  - node_id: test:test-strategy
    output: docs/test/test_strategy.md
    title: Test Strategy
    depends_on:
    - id: test:acceptance-criteria
      relation: depends_on
      semantic: governance
    - id: detailed:yaml-library
      relation: depends_on
      semantic: technical
    - id: detailed:message-flow
      relation: depends_on
      semantic: technical
    conventions:
    - targets:
      - module:deploy_task
      - module:yaml_helpers
      reason: All 48 existing ac_handling tests must pass post-refactor with before/after
        profiling verification; zero regressions is release-blocking.
    - targets:
      - module:inbox_write
      - module:cmd_save
      reason: Concurrent flock write safety must be verified under contention; untested
        concurrency paths are release-blocking gaps.
    modules:
    - cmd_save
    - deploy_task
    - inbox_write
    - ninja_monitor
    - dashboard_auto_section
    - restart_watchers
    - yaml_helpers
  - node_id: operations:runbook
    output: docs/operations/runbook.md
    title: Operations Runbook
    depends_on:
    - id: detailed:process-lifecycle
      relation: depends_on
      semantic: technical
    - id: design:monitoring-daemons
      relation: depends_on
      semantic: technical
    conventions:
    - targets:
      - module:ninja_monitor
      - module:restart_watchers
      - module:dashboard_auto_section
      reason: Documented recovery procedures for daemon failures, watcher desync,
        and dashboard marker corruption are release-blocking for operational readiness.
    modules:
    - ninja_monitor
    - restart_watchers
    - dashboard_auto_section
