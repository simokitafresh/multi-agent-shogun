version: 0.1.0
project:
  frameworks: []
  name: shogun-monitor-refactor
  language: bash
ai_command: /home/simokitafresh/bin/claude --print --model claude-opus-4-6 --tools
  ""
coding_principles: null
scan:
  source_dirs:
  - src/
  - scripts/
  - lib/
  test_dirs:
  - tests/
  doc_dirs:
  - docs/
  config_files: []
  exclude:
  - '**/node_modules/**'
  - '**/__pycache__/**'
  - '**/dist/**'
  - 'docs/research/**'
  - 'docs/archive/**'
  - 'docs/future/**'
  - 'docs/investigation-*'
  - 'docs/model-switch-*'
  - 'docs/philosophy*'
graph:
  store: jsonl
  path: codd/scan
bands:
  green:
    min_confidence: 0.9
    min_evidence_count: 2
  amber:
    min_confidence: 0.5
propagation:
  max_depth: 10
  stop_at_contract_boundary: true
fix:
  test_command: null
  max_attempts: 3
verify:
  typecheck_command: null
  test_command: null
  report_output: docs/test/verify_report.md
  e2e_setup_command: null
  e2e_command: null
  e2e_deploy_command: null
  e2e_ci_command: null
conventions: []
wave_config:
  '1':
  - node_id: test:acceptance-criteria
    output: docs/test/acceptance_criteria.md
    title: Acceptance Criteria
    depends_on:
    - id: req:shogun-monitor-refactor-requirements
      relation: derives_from
      semantic: governance
    conventions:
    - targets:
      - module:ninja_monitor
      - module:idle_management
      - module:stall_detection
      - module:health_checks
      - module:karo_monitor
      - module:pane_management
      - module:report_utils
      - module:state_io
      reason: 'FR-4/Constraint: All 854 bats tests must pass with zero SKIP. SKIP
        counts as FAIL. This is the primary release gate.'
    - targets:
      - module:idle_management
      - module:stall_detection
      - module:health_checks
      - module:karo_monitor
      - module:pane_management
      - module:report_utils
      - module:state_io
      reason: 'NFR-3: Each extracted module must be independently sourceable in test
        fixtures with appropriate mocks.'
    modules:
    - ninja_monitor
    - idle_management
    - stall_detection
    - health_checks
    - karo_monitor
    - pane_management
    - report_utils
    - state_io
  - node_id: governance:adr-modular-refactoring
    output: docs/governance/adr_modular_refactoring.md
    title: 'ADR: Modular Refactoring Approach'
    depends_on:
    - id: req:shogun-monitor-refactor-requirements
      relation: derives_from
      semantic: governance
    conventions:
    - targets:
      - module:ninja_monitor
      - module:idle_management
      - module:stall_detection
      - module:health_checks
      - module:karo_monitor
      - module:pane_management
      - module:report_utils
      - module:state_io
      reason: 'NFR-2/Constraint: Bash 5.x only. No Python, Node.js, or new external
        packages. Pure bash source-splitting.'
    - targets:
      - module:state_io
      - module:health_checks
      - module:pane_management
      reason: 'Constraint: Must work on WSL2 with NTFS-mounted /mnt/c paths (no inotify,
        stat-based polling).'
    modules:
    - ninja_monitor
  '2':
  - node_id: design:system-design
    output: docs/design/system_design.md
    title: System Design — Module Split Overview
    depends_on:
    - id: test:acceptance-criteria
      relation: constrained_by
      semantic: governance
    - id: governance:adr-modular-refactoring
      relation: constrained_by
      semantic: governance
    conventions:
    - targets:
      - module:ninja_monitor
      - module:idle_management
      - module:stall_detection
      - module:health_checks
      - module:karo_monitor
      - module:pane_management
      - module:report_utils
      - module:state_io
      reason: 'NFR-1: Modules must be sourced after external libraries (scripts/lib/*.sh).
        Source order violation causes undefined function errors at runtime.'
    - targets:
      - module:ninja_monitor
      reason: 'FR-2: Main loop dispatcher must remain in ninja_monitor.sh. Target
        ~500 lines (globals + main loop + source statements).'
    - targets:
      - module:ninja_monitor
      reason: 'Constraint: Auto-restart hash detection must cover all module files
        under scripts/lib/monitor/, not just ninja_monitor.sh.'
    modules:
    - ninja_monitor
    - idle_management
    - stall_detection
    - health_checks
    - karo_monitor
    - pane_management
    - report_utils
    - state_io
  '3':
  - node_id: detailed_design:module-ownership
    output: docs/detailed_design/module_ownership.md
    title: Module Ownership Boundaries
    depends_on:
    - id: design:system-design
      relation: depends_on
      semantic: technical
    conventions:
    - targets:
      - module:idle_management
      - module:stall_detection
      - module:health_checks
      - module:karo_monitor
      - module:pane_management
      - module:report_utils
      - module:state_io
      reason: 'FR-1: Each module must contain exactly the functions listed in requirements.
        No function may appear in multiple modules (MECE). No function may be lost
        during extraction.'
    - targets:
      - module:ninja_monitor
      - module:idle_management
      - module:stall_detection
      - module:health_checks
      - module:karo_monitor
      - module:pane_management
      - module:report_utils
      - module:state_io
      reason: 'FR-4: Function signatures, return codes, and side effects must be identical
        pre- and post-refactoring. Zero behavior change.'
    modules:
    - idle_management
    - stall_detection
    - health_checks
    - karo_monitor
    - pane_management
    - report_utils
    - state_io
  - node_id: detailed_design:shared-state-model
    output: docs/detailed_design/shared_state_model.md
    title: Shared State Access Model
    depends_on:
    - id: design:system-design
      relation: depends_on
      semantic: technical
    conventions:
    - targets:
      - module:idle_management
      - module:stall_detection
      - module:health_checks
      - module:karo_monitor
      - module:pane_management
      - module:report_utils
      - module:state_io
      reason: 'FR-3: All modules share global variables (NINJA_NAMES[], PANE_TARGETS[],
        STATE_DIR, etc.) and associative arrays (STALL_FIRST_SEEN[], etc.). No module
        may declare its own copy or shadow shared state.'
    modules:
    - ninja_monitor
    - idle_management
    - stall_detection
    - health_checks
    - karo_monitor
    - pane_management
    - report_utils
    - state_io
  - node_id: detailed_design:dispatch-flow
    output: docs/detailed_design/dispatch_flow.md
    title: Main Loop Dispatch Sequence
    depends_on:
    - id: detailed_design:module-ownership
      relation: depends_on
      semantic: technical
    - id: detailed_design:shared-state-model
      relation: depends_on
      semantic: technical
    conventions:
    - targets:
      - module:ninja_monitor
      reason: 'FR-2/FR-4: 20-second poll cycle dispatch order and function call sequence
        must be preserved exactly. Any reordering is a behavior change and release-blocking.'
    modules:
    - ninja_monitor
  '4':
  - node_id: test:test-strategy
    output: docs/test/test_strategy.md
    title: Test Strategy — Zero Regression Verification
    depends_on:
    - id: detailed_design:module-ownership
      relation: depends_on
      semantic: technical
    - id: test:acceptance-criteria
      relation: constrained_by
      semantic: governance
    conventions:
    - targets:
      - module:ninja_monitor
      - module:idle_management
      - module:stall_detection
      - module:health_checks
      - module:karo_monitor
      - module:pane_management
      - module:report_utils
      - module:state_io
      reason: 'FR-4/Constraint: All 854 bats tests must pass with zero SKIP. Each
        extraction step requires full suite verification before proceeding.'
    - targets:
      - module:idle_management
      - module:stall_detection
      - module:health_checks
      - module:karo_monitor
      - module:pane_management
      - module:report_utils
      - module:state_io
      reason: 'NFR-3: Each extracted module must be independently sourceable in bats
        test fixtures with mock setup for external library functions.'
    modules:
    - ninja_monitor
    - idle_management
    - stall_detection
    - health_checks
    - karo_monitor
    - pane_management
    - report_utils
    - state_io
  - node_id: plan:implementation-plan
    output: docs/plan/implementation_plan.md
    title: Implementation Plan — Extraction Sequence
    depends_on:
    - id: detailed_design:module-ownership
      relation: depends_on
      semantic: technical
    - id: detailed_design:shared-state-model
      relation: depends_on
      semantic: technical
    - id: detailed_design:dispatch-flow
      relation: depends_on
      semantic: technical
    - id: test:test-strategy
      relation: constrained_by
      semantic: governance
    conventions:
    - targets:
      - module:ninja_monitor
      reason: 'FR-4: Each module extraction step must be followed by full bats test
        suite run (854 tests, zero SKIP). No batch extraction without intermediate
        verification.'
    - targets:
      - module:ninja_monitor
      - module:idle_management
      - module:stall_detection
      - module:health_checks
      - module:karo_monitor
      - module:pane_management
      - module:report_utils
      - module:state_io
      reason: 'NFR-2: No new external dependencies may be introduced at any extraction
        step.'
    modules:
    - ninja_monitor
    - idle_management
    - stall_detection
    - health_checks
    - karo_monitor
    - pane_management
    - report_utils
    - state_io
  - node_id: operations:daemon-runbook
    output: docs/operations/daemon_runbook.md
    title: Daemon Operations Runbook
    depends_on:
    - id: design:system-design
      relation: depends_on
      semantic: technical
    - id: detailed_design:module-ownership
      relation: depends_on
      semantic: technical
    conventions:
    - targets:
      - module:ninja_monitor
      reason: 'Constraint: Auto-restart script-hash detection must include all module
        files under scripts/lib/monitor/. Missing a file means silent stale code running
        in production daemon.'
    - targets:
      - module:state_io
      - module:health_checks
      reason: 'Constraint: WSL2 NTFS /mnt/c path compatibility. File I/O must handle
        NTFS limitations (stat-based polling, no inotify on cross-filesystem mounts).'
    modules:
    - ninja_monitor
    - state_io
    - health_checks
