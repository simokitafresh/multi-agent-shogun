meta:
  version: v1.1 (2026-09-04 15:01 殿指示『第 3 マガジンで Reach を広げ、上位ブランドを置く』。v1=14:51)
  design_doc: docs/research/x_growth_engine_asis_tobe_5w1h_20260904.md
  principle: Content Engine(何を書くか/本人らしいか/数字は正しいか)と Growth Engine(誰向けか/何をさせるか/どの段階か/いつ出すか/結果はどうか)を分離する。Growth のために Voice を壊さない。Voice のために Growth を無視しない。
  no_optimization_until: サンプルが貯まるまで比率・型の最適化禁止(殿 §22)。初期仮説を固定して forward test。

funnel:
  order: [impression, engagement, profile_visit, follow, re_contact, trust, note, dm_signal, signup, paid]
  rule: 1 投稿に担当させる段階は 1〜2 個まで

funnel_stage:
  reach:
    goal: 非フォロワーを止める。DM を知らなくても分かる
    desired_action: [dwell, reply, quote, profile]
    link_type_default: none
  follow:
    goal: 「次も読みたい」=未来の情報価値を作る(series が主装置)
    desired_action: [profile, follow]
    link_type_default: none
  trust:
    goal: 「ちゃんと調べている」「普通そこまで疑うか」を作る。bookmark を主 proxy
    desired_action: [bookmark, follow, note]
    link_type_default: none_or_note
  convert:
    goal: 信頼済みの人を note / DM-Signal へ送る
    desired_action: [note, dm_signal, signup, paid]
    link_type_default: note_or_dm_signal

audience:
  ladder: [general, investor, systematic, dual_momentum, dm_signal]
  general: 投資に詳しくなくても分かる(お金・格差・複利・確率)
  investor: 一般的な投資家(インデックス・積立・暴落・平均リターン)
  systematic: システム投資・定量投資に関心(バックテスト・OOS・β)
  dual_momentum: DM に既に関心(相対/絶対、退避)
  dm_signal: DM-Signal を認知済み(公開成績・PF)
  rule: 入口ほど広く。全投稿を dual_momentum 以下へ向けない

topic_ladder:
  levels:
    1: お金・格差・複利・確率
    2: 投資の数学(算術/幾何平均、非対称損失、勝率と期待値)
    3: 投資システム(ルールで動く、予測しない)
    4: 検証(IS/OOS、WF、パラメータ面、日付ずらし)
    5: モメンタム
    6: デュアルモメンタム
    7: DM-Signal
  ledger_fields: [topic_level, possible_previous_topic, possible_next_topic]

metadata_schema:
  content_category: A-G(既存。何を話すか)
  audience: general|investor|systematic|dual_momentum|dm_signal
  funnel_stage: reach|follow|trust|convert
  desired_action: [dwell|reply|quote|profile|follow|bookmark|note|dm_signal]
  hook_type: money|contradiction|math|result|question|story|scenario|irony  # v1.1: story=主人公が上手くいく→前提が変わる→数字で詰む→構造が見える / scenario=『もし政策金利 2.5% なら』の時間送り / irony=皮肉の一句で落とす
  content_lane: investing|dm|math_probability|money_inequality|real_estate_mortgage|business_cash|medical_economics|ai_automation|survival_story  # v1.1 3 軸目(何のレーンか)
  conversation_gap: low|medium|high(殿裁定 14:38『少し荒い方が隙』。良い gap=核は正しく全部説明しない。悪い gap=誤り・誤認・重要条件の隠蔽)
  link_type: none|note|dm_signal
  series_id: optional
  series_order: optional
  series_total: optional
  external_context: standalone|reply|quote
  topic_level: 1-7

category_defaults:
  A: {funnel_stage: reach, audience: investor, hook_type: contradiction, topic_level: 1}
  B: {funnel_stage: follow, audience: systematic, hook_type: story, topic_level: 6}
  C: {funnel_stage: trust, audience: systematic, hook_type: question, topic_level: 4}
  D: {funnel_stage: reach, audience: general, hook_type: math, topic_level: 2}
  E: {funnel_stage: trust, audience: systematic, hook_type: result, topic_level: 4}
  F: {funnel_stage: convert, audience: dual_momentum, hook_type: result, topic_level: 7}
  G: {funnel_stage: convert, audience: dm_signal, hook_type: result, topic_level: 7}

initial_allocation_hypothesis:
  source: 殿 §16 の候補値 reach 40 / follow 25 / trust 25 / convert 10 を、slot_calendar v2 の 20 slot(A-E 16, F 3, G 1)に写像した実値
  reach: 8/20 (A 4 + D 4) = 40%
  follow: 4/20 (B 3 + C series 1) = 20%
  trust: 6/20 (C 2 + E 4) = 30%
  convert: 2/20 (F 1 + G 1) = 10%  # F の残 2 本は trust 扱い(数字と検証の投稿で登録語なし)
  fixed_until: 20 slot ×2 周(4 週)=40 投稿の forward test 完了まで固定
  frequency: 平日 2 投稿を維持。増やすなら定時ではなく conversation entry

series:
  - series_id: trust_system
    title: 僕が投資システムを信用するまで
    total: 9
    items:
      1: βを引く
      2: OOS を見る
      3: Walk Forward
      4: パラメータを全部振る
      5: 計算日をずらす
      6: 執行日をずらす
      7: 二次元でずらす
      8: 論文を自分のデータで再検証する
      9: 不採用結果を見る
    rule: 各投稿は単独で意味が通る。「1/9 を読まないと 2/9 が分からない」にしない。末尾に (n/9) を付けてよい
    funnel_stage: follow
    audience: systematic

reach_materials:
  - {key: R01, claim: 「+50% のあと -50% ならトントン」, turn: 違う。100→150→75, level: 2, hook: math, source: R4-D-1 承認済み}
  - {key: R02, claim: 「勝率 90% なら良い戦略」, turn: 違う場合がある。1 回の負けの大きさで決まる, level: 2, hook: contradiction, source: 期待値=勝率×平均利益−敗率×平均損失}
  - {key: R03, claim: 「長期なら上がる」, turn: 上がることと持ち続けられることは別, level: 1, hook: contradiction, source: MaxDD -50.9%(S&P500 1974-2023)}
  - {key: R04, claim: 「平均 10%」, turn: あなたの口座が毎年 10% 増える意味ではない, level: 2, hook: math, source: 算術/幾何平均(R4-A-3)}
  - {key: R05, claim: 「複利は魔法」, turn: リスク額も複利になる, level: 1, hook: money, source: R4-A-4 承認済み(本人 08-30 複利)}
  - {key: R06, claim: 「インデックス投資なら格差は縮まる」, turn: 同じ利回りなら元本比率は縮まらない, level: 1, hook: money, source: R4-A-1 承認済み}
  - {key: R07, claim: 「年率 100% のバックテスト」, turn: まず疑う, level: 4, hook: question, source: R4-C-1 承認済み}
  - {key: R08, claim: 「暴落は買い場」, turn: 買えるのは退避していた人だけ, level: 1, hook: story, source: DM の絶対モメンタム(抽象)}
  - {key: R09, claim: 「-80% から戻すには +80%」, turn: +400% が要る, level: 2, hook: math, source: R4-D-1}
  - {key: R10, claim: 「平均的な医者は高年収」, turn: せいぜい 40 代で 1500〜2500(本人 09-02 quote 83 likes), level: 1, hook: money, source: 本人 X 実績・医療×お金は本アカウント最大の reach 面}
reach_materials_note: 素材は本人 note/X から抽出したもののみ。数字は Content Engine の fail-close に従う

conversation_entry:
  lane: 定時投稿とは別 lane。自動 reply spam 禁止
  targets: [インデックス論, FIRE, 暴落, 積立, 高配当, レバレッジ, モメンタム, バックテスト, 有名論文, 投資系の大きな投稿]
  flow: 候補検出(手動/検索)→ LLM 案(v5.x + 相手の主張を雑に否定しない)→ 人間承認(要操作 ntfy)→ reply/quote
  stance: "相手に同意できる部分を先に認め、本人の数学・検証視点を 1 つ接続する(例: 「十分だと思う。資産形成ならね。ただ市場平均を取り続けても元本比率は縮まらない。『十分』と『追いつける』は別のハナシ」)"
  evidence: 本人 X で reply の like 上位(172/137/87)は全て他人の大きな話題への接続。quote の imp 中央値 1,152 は single の 623 の 1.85 倍

link_strategy:
  reach: X 内完結
  follow: X 内完結
  trust: 必要に応じ note
  convert: note または DM-Signal
  observed: 投資系 single で URL あり n=395 imp_med 786 / なし n=174 imp_med 636。このアカウントでは URL ありの方が中央値が高かった(因果ではない。記事告知投稿が含まれる)

kpi_schema:  # v1.3: 正本は kpi_availability.yaml(4 状態・null/0 規則)。以下は v1.0 の要約
  per_post:
    available_public: [impression_count, like_count, reply_count, retweet_count, quote_count, bookmark_count]
    available_non_public: [user_profile_clicks, url_link_clicks, engagements]
    unavailable:
      - "follows_from_post: 取得不能。account 日次 followers_count の差分のみ"
      - "note_pv_by_post: 取得不能。note 側 UTM 無し"
      - "dm_signal_visit_by_post: 取得不能。LP に UTM を付けた時のみ可"
      - "signup/paid: DM-Signal DB 側で日次数のみ"
  per_account_daily: [followers_count, following_count, tweet_count]
  snapshots: [t24h, t7d]
  ratios: [follow_per_impression(日次近似), profile_click_per_impression, bookmark_per_impression, link_click_per_impression]

# ===== v1.1 追加(2026-09-04 15:01 殿指示) =====
brand:
  hypothesis: 数字を見て、どう生き延びるかを考える人。その中で投資はデュアルモメンタムをかなり深くやっており、その実装が DM-Signal
  thread: [数字, 確率, 検証, キャッシュフロー, 構造, 生存]
  thesis: ["数字を見ずに思い込みで動くと詰む", "平均や肩書きではなく構造を見る", "期待値・リスク・キャッシュフロー・検証を見る", "生き残るために数字を使う"]
  verification: 本人 note 3 マガジン 127 記事と X 3,247 件に整合(設計書 §31)。第 3 マガジン 63 記事の題名で『サヴァイブ/生き延びる/詰む/ﾀﾋぬ』系 8、『数字/年収/キャッシュ/利回り/金利』系 19、医療経済 15、AI/戦国 18。X の imp 平均上位=高所得/年収(39,942)・医師(11,619)・不動産(6,179)・住宅ローン(5,004)。DM 単独は 2,589
  not: [デュアルモメンタムを売っている人, 何でも話す医師]
  dm_signal_role: 商品であり Proof of Work(口だけでなく検証システムを作って運用している証拠)。プロフィールの実績に出してよいが、アカウントを DM-Signal 一色にしない

content_lane:
  rule: 第 3 マガジン 63 記事+既存 64 記事の実集合から MECE に近い最小 9 分類。細分化しない
  investing: インデックス・暴落・積立・期待値・勝率(投資直球)
  dm: デュアルモメンタム・DM-Signal
  math_probability: 算術/幾何平均・非対称損失・複利・確率
  money_inequality: 資産格差・平均リターンでは追いつけない・年収≠資産
  real_estate_mortgage: 住宅ローン・不動産投資・金利・相続対策アパート
  business_cash: 事業・粗利と真水のキャッシュ・法人・元本返済
  medical_economics: 医師の給与・開業・診療報酬・社会保険・二重累進
  ai_automation: AI・自動化・戦国 AI 列伝(Reach というより Follow/Story 素材)
  survival_story: 主人公型ストーリー(タワマン/表面利回り 8%/フルレバ大家/相続アパート)。lane 横断の器
  lane_of_13: {R4-A-1: money_inequality, R4-A-3: math_probability, R4-A-4: math_probability, R4-B-1: dm, R4-B-3: dm, R4-B-4: dm, R4-C-1: investing, R4-C-2: investing, R4-C-4: investing, R4-D-1: math_probability, R4-D-3: math_probability, R4-D-5: math_probability, R4-F-3: dm}

entry_lanes:
  A_money_inequality: [資産格差, 平均リターン, 複利, 投資数学, DM, DM-Signal]
  B_real_estate_mortgage: [住宅ローン/不動産/金利上昇/相続, キャッシュフロー, リスク管理, 数字で判断する思想, 投資システム, DM-Signal]
  C_medical_high_income: [高年収/住宅/開業/病院経営/働き方, 年収≠資産, キャッシュフロー, 資産形成, 投資, DM-Signal]
  D_business_ai: [事業/利益/キャッシュ/AI/自動化, 数字で検証, 再現性, 投資システムの検証, DM-Signal]
  E_investing_direct: [インデックス/暴落/期待値/勝率/モメンタム, DM, DM-Signal]
  rule: 複数入口から同じ思想へ収束。Reach 投稿単体で DM-Signal へつなげない(§5 殿)。橋は profile と次の投稿が担う

cross_topic_bridges:
  - {from: real_estate_mortgage, hook: 金利が 1% 上がるだけで(1.4 億タワマン 0.8%→…), bridge: 大事なのは年収ではなくキャッシュフロー, to: 投資も期待リターンだけでは足りない→MaxDD→DM, source: n6ae69b4a1947}
  - {from: real_estate_mortgage, hook: 表面利回り 8%, bridge: 表面の数字と手残りは違う, to: バックテストの年率も同じ→β/MaxDD/OOS→DM-Signal, source: n9ab9e12adee4}
  - {from: business_cash, hook: 利益が出ていても現金がない(元本返済は経費にならない), bridge: 平均値ではなく経路を見る, to: 幾何平均/ドローダウン→投資数学, source: na68b0cd82b9c}
  - {from: medical_economics, hook: 高年収でも資産が増えない(名目固定収入), bridge: フローとストックは別, to: 資本格差→市場平均→DM, source: n938cc77f66bb}
  - {from: real_estate_mortgage, hook: 相続税対策のアパートが負の遺産になる(NOI 864→700、金利 1.5→5%), bridge: 金利は返済額だけでなく次の買い手の値段まで下げる, to: 前提が変わった時に降りるルール→絶対モメンタム, source: n48651b71f146}
  - {from: medical_economics, hook: 大学病院の給与均衡点は年収 800 万, bridge: 平均や肩書きではなく構造, to: 平均狙いでは上のステージに行けない→A-1, source: n1d77aaf8e3ef}

series_candidates_from_magazine3:
  items:
    - {series_id: interest_world, title: 金利のある世界, evidence: 本人の定型句『これは金利のある世界の話』が 4 記事(タワマン/表面利回り/フルレバ/相続アパート)+X 投稿『金利のある世界』, lane: real_estate_mortgage, hook: story}
    - {series_id: survive, title: 俺たちはどう生き延びるか, evidence: マガジン名+X『俺たちはどう生き延びるか。新しい記事を書きました』(imp 145,944), lane: survival_story, hook: story}
    - {series_id: income_vs_asset, title: 年収と資産は別物, evidence: 『年収 2000 万でも貧しくなる』『世帯年収 2000 万でタワマン』『年収⇄手取り』(bm 2,499), lane: medical_economics, hook: money}
    - {series_id: paper_vs_cash, title: 見かけの数字と真水, evidence: 『表面利回り 8%』『真水のキャッシュを直視しろ』『黒字なのに金がない』, lane: business_cash, hook: contradiction}
    - {series_id: doctor_money_trap, title: 医師のお金の罠, evidence: 二重累進課税/iDeCo/社会保険料/厚生年金要件/大学病院給与 800 万(like 46), lane: medical_economics, hook: irony}
  rule: 想像で増やさない。上記 5 本は全て本人記事の題名・定型句から取った

story_hook_pattern:
  structure: [主人公は最初うまくいっている(数字を列挙: 年収/価格/金利/利回り), 『これは金利のある世界の話』で前提転換を宣言, 前提が段階的に変わる(金利 0.8→2.5→3.5→4.5→5%), 数字を再計算すると詰んでいる(NOI 864→700、手残り 313→−100), 構造が見える(金利は次の買い手の値段まで下げる), 説教せず皮肉の一句で終える(『表面利回りは、8% だった。』『「不動産は長期目線が大事。」すぐに 87 件のいいねが付いた。』)]
  x_compression: 1 投稿=構造の 1 段だけ。数字 2 組(前提前/後)+皮肉の一句。全話を 1 投稿に入れない。root に前提、リプに転換(本人の二段目型)
  voices_measured: {story: 短文改行・一人称『僕』または三人称 A 氏・です/ます ほぼ無し・数字列挙, persona_bam: 『ヤーマン、今日も生きてるか？俺はバムだ』ゾンビ/荒野/ラムコーク/アディオスアミーゴ(2025-10〜2026-07 の 3 記事), argument: 医療経済の論説(です/ます・数字・制度名)}
  x_use: story と irony は X 向き。persona_bam は note 専用(X 3,247 件に『ヤーマン』0 件)

note_three_layers:
  reach: {magazine: m8357970d6430, name: 俺たちはどう生き延びるか, from_x: Reach 投稿}
  education: {magazine: mb4377418b422, name: How to, from_x: DM 教育(B)}
  proof: {magazine: m6557263f0241, name: 検証ショートコラム, from_x: 検証投稿(C/E)}
  product: {dest: dm-signal.com, from_x: Trust が十分な convert 投稿のみ}

reach_mix_hypothesis:
  within_reach: {money_social_survival: 40, investment_math: 30, investment_common_sense: 20, dm_intro: 10}
  basis: X 反応(高所得/医師/不動産/住宅ローンの imp 平均が DM 単独の 2〜15 倍)と素材数(第 3 マガジン Reach 向き 30 記事、投資数学 12)。固定しない。40 投稿後に見直す

kpi_v1_1_additions:
  available: [profile_visits(np_user_profile_clicks), follows(日次差分), replies, quotes, bookmarks, topic_breadth(台帳の content_lane 分布)]
  unavailable_via_api: [non_follower_impressions(X Analytics 画面のみ), repeat_engagers(user 単位の反応履歴は API で取れない), cross_topic_migration(user 単位)]
  proxy_design_v1_2: reply/quote を付けた user id を投稿ごとに取得(GET /2/tweets/search/recent conversation_id、Basic tier 可)し、lane を跨いで同じ user が現れる件数を cross_topic_migration の代理指標にする

profile_pinned_rule: 殿裁定 2026-09-04 17:11 — bio・固定投稿は Growth Engine の可変対象外。変える時は殿の意志と判断。将軍は提案も実施もしない
prohibitions_v1_1: [DM-Signal へ無理につなげる, 全投稿を投資へ着地させる, 住宅/医療/不動産投稿を商品広告にする, 雑多垢化, 恐怖だけで釣る, 煽りを本人実績以上に強くする, Reach のために本人 Voice を壊す, 数字の正確性を落とす]

# ===== v1.2 追加(2026-09-04 15:11 殿裁定『投稿フォーマット × 投稿量』) =====
format:
  rule: 4 つは別の商品。短いか長いかで分類しない。Short=発見される / Long=信頼される / Thread=深く読まれ会話される / Series=次を期待されフォローされる
  short:
    definition: 短い単独投稿。違和感・数字・主張・疑問・ツッコミを 1 つだけ置く。全部説明しない。conversation gap を残してよい
    length: 全角 140 字以内目安(承認 13 本は 104〜147 字=全て short)
    roles: [reach, follow]
    audience: [general, investor]
    fits: [+50/-50, 勝率, 複利, 格差, インデックス, 金利, 住宅ローン, 不動産, キャッシュフロー, 短い数学, 強い検証結果, 一言の違和感]
    kpi: [np_impression_count(非フォロワー分は取得不能), np_user_profile_clicks, follows(日次), reply_count, quote_count]
    cost: 低。大量試行=Right Tail 狙い。低反応は許容
  long:
    definition: X 内でまとまった説明をする長文単独投稿(note_tweet)。Short の水増しではない。本人 Reasoning(疑い→検証→数字→短い解釈→次の疑い)を X 内で体験させる。note より浅く Short より深い
    length: 300〜1,000 字目安(長文投稿 slot)
    roles: [trust, follow]
    audience: [investor, systematic, dual_momentum]
    fits: [OOS, Walk Forward, β/α, パラメータ全面, 論文再検証, 不採用実験, 投資数学, 住宅ローン計算, 不動産 CF, 社会構造, Story]
    kpi: [bookmark_count, np_user_profile_clicks, follows, reply_count, np_url_link_clicks(note)]
    note: dwell/read は API で取得不能。推測しない
  thread:
    definition: 親 1 本+自己リプで段階的に掘る。Long の細切れではなく、一段ごとに新しい疑問・数字・検証を置く。各段が単独でも意味を持つ
    roles: [trust, conversation, follow]
    fits: [検証工程, 数学の段階説明, 論文レビュー, Story, どう壊れるかの検証, 1 記事を複数角度で読む]
    kpi: [parent np_impression_count, continuation(自己リプ imp 平均 / 親 imp), reply_count, bookmark_count, np_user_profile_clicks, follows, total_thread_engagement]
    rule: 毎日量産しない。段階的に読むこと自体に意味があるテーマだけ。自己リプは必要な長さだけ(機械的に 10 個付けない)
    implementation: x_post.sh post <draft> --reply-to <parent_id>
  series_entry:
    definition: 複数日にまたがる独立投稿シリーズ。各回は独立して TL に流れ、単独で価値を持ち、『続きがある』ことが分かる。過去回を読まないと分からない構造にしない
    roles: [follow, repeat_engagement, trust]
    kpi: [follows, repeat_engagers(取得不能→v1.2 代理), np_user_profile_clicks, bookmark_count, series_continuation(後半回 imp / 初回 imp), later_entry_impressions]
    ids: [series_id, series_order, series_total]
  thread_vs_series: Thread=同じ conversation_id・同テーマ・同時刻付近・自己リプ / Series=別々の独立投稿・複数日・各回単独成立・未来への期待。両方を別 format として記録
  same_source_ok: 同じ検証記事から Short(結論 1 個)/Long(疑い→検証→結果)/Thread(検証工程)/Series(信用するまでの 1 回)を作ってよい。同じ文章の言い換え連投は禁止(役割が違うこと)

format_metadata:
  format: short|long|thread|series_entry
  thread: [thread_id, thread_position, thread_total(optional), parent_id]
  series: [series_id, series_order, series_total(optional)]
  precommit_rule: 事前登録が正本。『伸びたから Reach 投稿だったことにする』は禁止

volume:
  content_units_per_day: 1 Short=1 / 1 Long=1 / 1 Series Entry=1 / 1 Thread(親+自己リプ全部)=1
  physical_posts_per_day: 実 tweet 数(Thread は親+リプを全部数える)
  example: {short: 1, series_entry: 1, thread_parent_plus_3: 1, content_units: 3, physical_posts: 6}
  current: v1.4(2026-09-04 16:23 殿レビュー裁定)=7 日運用・3 content_units/日(08:30/12:30/18:30)、週 21 units。Conversation Entry は別 lane で units に数えない

format_x_funnel_hypothesis:
  short: reach
  long: trust
  thread: [trust, conversation]
  series_entry: [follow, repeat]
  rule: 全 format を likes で比較しない。それぞれの仕事(Short=Reach/Profile、Long=Trust/Bookmark/Follow、Thread=Conversation/Trust、Series=Follow/Repeat、Convert=note/DM-Signal)で評価

format_x_lane_record: Short×money / Short×math / Short×mortgage / Long×verification / Long×story / Thread×verification / Series×investment_math 等を台帳に保存するだけ。初期段階で Grid Search しない(SNS 版過学習)

initial_format_mix_4w:  # v1.4(16:23 殿レビュー裁定: 7 日運用・3 units/day)
  short: 週 13(08:30 全日、12:30 月火木土、18:30 水金)
  long: 週 3(月木土 18:30)
  thread: 週 2(火日 18:30。検証工程・Story のみ)
  series_entry: 週 3(水金日 12:30。trust_system と interest_world)
  weekly_units: 21 content_units(7 日×3)。physical_posts は Thread 分だけ増える。土日も停止しない
  rule: 毎日同じ mix にしない。4 週固定、最適化しない

depth_and_retention:
  depth: [Short, Long/Thread, note, DM-Signal]
  retention: [Series Entry, Series Entry, Series Entry]

