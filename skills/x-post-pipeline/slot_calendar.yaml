meta:
  version: v2 (2026-09-04 12:50 殿裁定『X 自動投稿の方針を根本から見直す』)
  doctrine: docs/research/x_editorial_doctrine_20260904.md
  source_ledger: skills/x-post-pipeline/stock_ledger.yaml
  schedule: 平日 1 日 2 回(JST 08:30 / 18:30)×5 日=週 10 slot。2 週 20 slot で 1 周(殿裁定 2026-09-04 10:47)
  ratio: 分類 A-E を 80%(16/20)、F=DM-Signal 検証・実績を 15%(3/20)、G=直接誘導を 5%(1/20)
  rotation: 同じ分類が連続しない。F は各週 1〜2、G は 2 週に 1 回(第 2 週 金 18:30)
  categories:
    A: 投資常識を壊す — 読者の投資観に小さな違和感を置く
    B: デュアルモメンタムの啓蒙 — 予測しない、今強いものを持つ、弱くなったら降りる
    C: 検証至上主義 — 検証の基準の厳しさ
    D: 数学・確率・投資の小ネタ — DM-Signal と無関係でも価値
    E: 普通そこまで疑うか検証 — 疑い→設計→結論(最重要)
    F: DM-Signal の検証・実績・設計思想 — 儲かると言わず強さを感じさせる
    G: 直接誘導 — 5% のみ
  figure_policy: 全投稿に図 1 枚。A/D=概念図(数式・棒 2 本など)、B=fig1 仕組み(抽象)、C/E=検証の結果図、F=公開成績/DD/履歴の図、G=dm-signal 公開表 capture
  growth: Growth Engine v1(2026-09-04 14:51 殿指示)。各 slot に funnel_stage/audience を付与。初期配分仮説(固定、4 週)=reach 8/follow 4/trust 6/convert 2。定義=skills/x-post-pipeline/growth_schema.yaml
  format_mix_v1_2: 殿裁定 2026-09-04 15:11『投稿フォーマット×投稿量』。08:30=Short、火木 18:30=Long、水 18:30=Thread、金 18:30=Series Entry、月 18:30=Short。週 10 content_units 不変。定義=growth_schema.yaml format
  old_slots_superseded: 旧 A 教材再掲/B 検証の一切れ/C 運用の形/D 月次/E ガイド告知(マニュアル §5/§6)は廃止。旧 seed は stock_ledger の shift に吸収

