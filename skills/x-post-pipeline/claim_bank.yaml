meta:
  purpose: 投資ネタの自動生成用「主張の銀行」(殿 2026-09-04 18:29『俺が何もしなくても無限に生成し続けるから意味がある』)。記事の抜粋ではなく、多くの人が信じる前提を 1 つ壊す構造的な主張を種にする。数字は verified_numbers のみ
  rule: 各 claim=(belief 壊す前提, claim 主張, why 1 行の理由, number 任意=verified_numbers のキー)。生成器は 1 claim→1 投稿。既存承認文との類似(同じ belief+同じ claim)は生成しない
  verified_numbers:
    gem_1974_2023: "GEM(本家デュアルモメンタム)1974〜2023 年 CAGR 14.5% / MaxDD -22.7% / Sharpe 0.78、S&P500 CAGR 10.8% / MaxDD -50.9% / Sharpe 0.45"
    plus50_minus50: "+50%→-50% で 100→150→75。交互で 100→150→75→112→56"
    recover_asym: "-50% を戻すには +100%、-80% なら +400%"
    inflation_3pct_10y: "年 3% のインフレが 10 年で現金の価値は 74%"
  origin_rule: 上記以外の数字を本文に入れない(fail-close)
  schema_20260904_1855: 殿指示 18:55 §2/§14。必須 4 項=belief(壊す前提=counter_claim)/claim(主張)/why(裏付け=evidence。数字は number で verified_numbers を指す)/audience(刺さる読者)。任意=number/hook_pattern(hook_candidate)/source(出典=記事・repo。証拠としてのみ)/confidence(high/mid)。4 項が揃わない claim は x_claim_gen.py が SKIP する(記事が余っているから生成、は無い)
  generation_order: claim/neta → 必要なら記事・repo・検証資料で裏付け(source) → X 本文。article→summary→X には戻さない(殿 18:55 §1)
  context_rule: 殿 18:55 §4 Voice match≠Context match。claim は投資中心 TL で『今日突然言っても自然か』を満たす投資ネタのみ収録する。不動産・医療・住宅ローン・事業の claim はここに入れない(Long/Thread/Series/手動へ)
  viral_rule: 殿 18:55 §5/§15。外部バズから借りるのは hook 構造(対比・引用反証・VS・数字の置き方・常識→違和感)と『今みんなが反応している話題』まで。語尾・煽り・キャラ・スラング・www は本人 Voice へ移植しない。外部の言い換えではなく、その話題への本人独自の claim(違和感)を作る
  lord_voice_priority: 1 最新 human rewrite → 2 本人 X → 3 本人 note → 4 system prompt → 5 外部バズ(最下位)
