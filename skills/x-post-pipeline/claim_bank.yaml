hook_patterns_from_viral:
  quote_rebut: よくある発言「」→数字で反証(bm 20/like 360、フォロワー 875 でも届く)
  amount_contrast: 額の対比(1 億 vs 100 万。like 712・フォロワー 1,026)
  vs_frame: VS 構図(bm 152)
  monthly_results: 月次実績公開(FIRE 収支・NISA 実績。bm は低く like 中)
  metaphor_sting: 別ジャンルの比喩(パチンコ)
