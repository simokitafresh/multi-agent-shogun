meta:
  purpose: イベント lane(殿 2026-09-04 19:30『投資アカウントとして投資イベントに振れなくていいのか』→19:33『event-driven も設計して実装しよう』)。イベントは context(なぜ今言うか)であって claim ではない。claim は claim_bank からのみ。相場予測・未検証数字・その場の claim 捏造は禁止
  flow: 予定イベント=plan に事前登録(event 欄)→その日の slot の claim をイベント対応 claim に寄せる / 突発イベント=毎朝 07:05 x_event_scan.py が価格データ(yfinance)で検知→queue/x_events/ に提案+ntfy→x_claim_gen が Short 生成(gate)→殿承認(.approved)→当日の空 slot か 12:30 の event slot で投稿(poster v1.8)。fallback ではない(空 slot を埋める目的で発火しない。イベントが無ければ何も起きない)
  guard: 同一 claim は 7 日以内に再発火しない。1 日 1 event unit まで。イベント検知は数値規則のみ(LLM 判断なし)。イベント文は本文に数字を入れる時 verified_numbers 以外は当日の実測(source に yfinance の値と日付を記録)だけ許可
