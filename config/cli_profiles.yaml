# cli_profiles.yaml — CLI動作差異のSSOT (Single Source of Truth)
# cmd_143 Phase 1: Profile SSOT基盤
#
# 各CLIの動作差異をデータ化。
# 値はソースコード(ninja_monitor.sh, inbox_watcher.sh)から正確に抽出。
#
# 参照元:
#   scripts/lib/cli_lookup.sh (本ファイルを読み取る)
#   inbox_watcher.sh, ninja_monitor.sh がこのファイルを参照

defaults:
  effort: high
  agents:
    shogun:
      type: claude
      model_name: claude-opus-4-6
      launch_cmd: "~/bin/claude --dangerously-skip-permissions"
    karo:
      type: codex
      model_name: gpt-5.6-sol-medium
      launch_cmd: "${SHOGUN_CODEX_BIN:-codex} --dangerously-bypass-approvals-and-sandbox --no-alt-screen"
    gunshi:
      type: claude
      model_name: claude-opus-4-6
      launch_cmd: "~/bin/claude --dangerously-skip-permissions"
    hayate:
      type: codex
      model_name: gpt-5.6-sol-low
      launch_cmd: "${SHOGUN_CODEX_BIN:-codex} --dangerously-bypass-approvals-and-sandbox --no-alt-screen"
    kagemaru:
      type: codex
      model_name: gpt-5.6-sol-low
      launch_cmd: "${SHOGUN_CODEX_BIN:-codex} --dangerously-bypass-approvals-and-sandbox --no-alt-screen"
    hanzo:
      type: codex
      model_name: gpt-5.6-sol-low
      launch_cmd: "${SHOGUN_CODEX_BIN:-codex} --dangerously-bypass-approvals-and-sandbox --no-alt-screen"
    saizo:
      type: codex
      model_name: gpt-5.6-sol-low
      launch_cmd: "${SHOGUN_CODEX_BIN:-codex} --dangerously-bypass-approvals-and-sandbox --no-alt-screen"
    kotaro:
      type: codex
      model_name: gpt-5.6-sol-low
      launch_cmd: "${SHOGUN_CODEX_BIN:-codex} --dangerously-bypass-approvals-and-sandbox --no-alt-screen"
    tobisaru:
      type: codex
      model_name: gpt-5.6-sol-low
      launch_cmd: "${SHOGUN_CODEX_BIN:-codex} --dangerously-bypass-approvals-and-sandbox --no-alt-screen"
profiles:
  claude:
    # 表示名 (sync_pane_vars.sh → tmux @model_name)
    display_name: "Opus"
    # 起動コマンド (lib/cli_adapter.sh L137-138)
    launch_cmd: "~/bin/claude --dangerously-skip-permissions"
    # CTXパース正規表現 (ninja_monitor.sh L181, L518)
    ctx_pattern: "CTX:[0-9]+%"
    # CTX解釈モード: "usage"=使用率(Claude), "remaining"=残量(Codex)
    ctx_mode: "usage"
    # idleプロンプト判定 (ninja_monitor.sh L154)
    idle_pattern: "❯"
    # ビジー判定パターン (ninja_monitor.sh L149)
    busy_patterns:
      - "esc to interrupt"
      - "Running"
      - "Streaming"
    # セッションリセットコマンド (ninja_monitor.sh L69)
    clear_cmd: "/clear"
    # clear方式: "command"=clear_cmdを送信, "restart"=Ctrl-C+launch_cmdで再起動
    clear_method: "command"
    # /modelコマンド対応 (inbox_watcher.sh: claude=pass through)
    supports_model_switch: true
    # idle確認待ち秒数 (ninja_monitor.sh L34: CONFIRM_WAIT=5)
    confirm_wait: 5
    # 同一忍者の再通知抑制秒数 (ninja_monitor.sh L33: DEBOUNCE=60)
    debounce: 60
    # auto-clear再送信抑制秒数 (ninja_monitor.sh L88: CLEAR_DEBOUNCE=300)
    clear_debounce: 300

  codex:
    # 表示名 (sync_pane_vars.sh → tmux @model_name) — CLI type単位のフォールバック用
    display_name: "Codex"
    # 起動コマンド (lib/cli_adapter.sh L142)
    launch_cmd: "${SHOGUN_CODEX_BIN:-codex} --dangerously-bypass-approvals-and-sandbox --no-alt-screen"
    # CTXパース正規表現 (ninja_monitor.sh get_context_pct)
    ctx_pattern: 'Context [0-9]+%'
    # CTX解釈モード: usage=使用率(Codex "Context 4% used" テキスト形式。旧バー形式は廃止)
    ctx_mode: "usage"
    # idleプロンプト判定 (ninja_monitor.sh L154)
    idle_pattern: "›"
    # ビジー判定パターン (ninja_monitor.sh L149)
    busy_patterns:
      - "esc to interrupt"
      - "Running"
      - "Streaming"
      - "background terminal running"
    # セッションリセットコマンド (ninja_monitor.sh L70: /new)
    clear_cmd: "/new"
    # clear方式: "command"=clear_cmdを送信, "restart"=Ctrl-C+launch_cmdで再起動
    clear_method: "command"
    # /modelコマンド非対応 (inbox_watcher.sh: skip)
    supports_model_switch: false
    # idle確認待ち秒数 (ninja_monitor.sh L35: CODEX_CONFIRM_WAIT=20)
    confirm_wait: 20
    # 同一忍者の再通知抑制秒数 (ninja_monitor.sh L36: CODEX_DEBOUNCE=180)
    debounce: 180
    # auto-clear再送信抑制秒数 (ninja_monitor.sh L89: CODEX_CLEAR_DEBOUNCE=600)
    clear_debounce: 600
    # DEPLOY-STALL検知デバウンス秒数 (clear_debounceより短い。Codexの応答遅延を考慮)
    stall_debounce: 180
    # in_progress停滞検知しきい値（分）— 未設定時はninja_monitor側で20分fallback
    in_progress_stall_min: 20
    # inbox_watcher BUSY判定時の最大defer秒数（超過後は強制nudge）
    inbox_busy_max_defer_sec: 30
    # /new後に自動送信するコマンド（cmd_583: /fastモード有効化）
    # ninja_monitor.shが/new送信後にidle検知→このコマンドを送信
    post_clear_cmd: ""
    # 静的追加起動引数 (launch_cmdに追加。model_reasoning_effortはmodel_nameから自動生成)
    # effortはsettings.yamlのmodel_name接尾辞(gpt-X.X-{effort})で per-agent 指定。
    # service_tierはconfig.toml(fast)を継承。殿裁定2026-06-11: 忍者=low+fast、家老=medium+fast
    # Autonomous tmux panes cannot answer the interactive /hooks trust UI.
    # Project hooks are pre-validated by hook/schema gates before launch, so
    # use Codex's documented automation escape hatch instead of deadlocking
    # every pane whenever the tracked hook definition hash changes.
    launch_args: "--dangerously-bypass-hook-trust"
