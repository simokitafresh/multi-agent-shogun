# lesson_tags.yaml — 教訓タグ辞書
# deploy_task.sh L300-312の既存11タグ + 追加11タグ
# 使用元: scripts/lesson_auto_tag.sh, scripts/deploy_task.sh
# 設計原則: パターンはドメイン固有語のみ。一般英語(test/report/process等)の
#   単体マッチは多義語誤タグの根因(2026-05-07分析: 28件中15件誤タグ)。
#   単語境界(\b)・複合語・日本語専門語でフィルタ精度を確保する。
tag_rules:
  # --- 既存11タグ (deploy_task.sh L300-312由来、多義語排除版) ---
  - tag: db
    patterns: ['(?i)\bDB\b|\bdatabase\b|\bSQL\b|PostgreSQL|テーブル.*カラム']
  - tag: api
    patterns: ['(?i)\bAPI\b|\bendpoint\b|REST.*API|GraphQL']
  - tag: frontend
    patterns: ['(?i)\bfrontend\b|\bui\b|\bcss\b|\breact\b|\bcomponent\b|Next\.js']
  - tag: deploy
    patterns: ['(?i)\bdeploy\b|本番.*デプロイ|本番.*投入|Render.*service|Render.*deploy']
  - tag: pipeline
    patterns: ['(?i)\bpipeline\b|\bbatch\b|\bcron\b|\bscheduler\b|PipelineEngine']
  - tag: testing
    patterns: ['(?i)\btests?\b|\btesting\b|検証|parity|backtest|\bbats\b|pytest']
  - tag: review
    patterns: ['(?i)\breview\b|査読|レビュー']
  - tag: recon
    patterns: ['(?i)\brecon\b|偵察|調査']
  - tag: process
    patterns: ['(?i)手順|運用|workflow']
  - tag: communication
    patterns: ['(?i)通信|notification']
  - tag: gate
    patterns: ['(?i)\bgate\b|門番|\bBLOCK\b|\bCLEAR\b|gate_.*\.sh']
  # --- 追加11タグ (多義語排除版) ---
  - tag: bash
    patterns: ['(?i)\bbash\b|\bshell\b|シェル|\.sh\b']
  - tag: yaml
    patterns: ['(?i)\byaml\b|\byml\b']
  - tag: git
    patterns: ['(?i)\bgit\b|\bcommit\b|\bbranch\b|\bmerge\b']
  - tag: wsl2
    patterns: ['(?i)WSL[2\b上環]|/mnt/c|Windows.*(venv|font|encoding|環境|YAML)']
  - tag: security
    patterns: ['(?i)\bsecurity\b|\binjection\b|脆弱']
  - tag: monitor
    patterns: ['(?i)\bmonitor\b|監視|\bstall\b|ninja_monitor']
  - tag: inbox
    patterns: ['(?i)\binbox\b|メッセージ|\bwatcher\b']
  - tag: tmux
    patterns: ['(?i)\btmux\b|\bpane\b|tmux.?window|tmux.?session']
  - tag: oauth
    patterns: ['(?i)\boauth\b|認証|API[._]key']
  - tag: lesson
    patterns: ['(?i)\blesson\b|教訓']
  - tag: reporting
    patterns: ['(?i)報告|\bdashboard\b|YAML.*report']
  # --- GS/研究タグ (忍者成長速度改善: GS実行タスクの教訓マッチング) ---
  - tag: grid_search
    patterns: ['(?i)grid.?search|GS\b|gs_|忍法|champion|WF\b|wf_|run_077|results_fast|\.npy|cache.*npy|l1_alm']
  # --- 不変量検出タグ (2026-03-17追加) ---
  - tag: production_invariant
    patterns: ['(?i)本番.*解像度|本番.*日次|production.*daily|production.*resolution|本番.*挙動|本番コード.*確認|パリティ.*破壊|パリティ.*不一致']
