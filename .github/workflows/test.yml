# semantic-links: [[忍者報告品質プロトコル]]
name: Multi-CLI Test Suite

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit Tests (bats shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - {shard: 0, compatibility: false}
          - {shard: 1, compatibility: false}
          - {shard: 2, compatibility: false}
          - {shard: 3, compatibility: false}
          - {shard: 4, compatibility: false}
          - {shard: 5, compatibility: false}
          - {shard: 6, compatibility: false}
          - {shard: 7, compatibility: false}
          - {shard: compatibility, compatibility: true}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          # test_cmd_skeleton.bats exercises a historical baseline commit.
          # A shallow checkout makes that explicit fixture unavailable.
          fetch-depth: 0

      - name: Install bats-core
        run: |
          sudo npm install -g bats

      - name: Setup bats helpers
        run: |
          mkdir -p tests/test_helper
          git clone --depth 1 https://github.com/bats-core/bats-support tests/test_helper/bats-support
          git clone --depth 1 https://github.com/bats-core/bats-assert tests/test_helper/bats-assert

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pytest python3-yaml python3-websocket parallel ripgrep tmux

      - name: Setup compatibility runtime fixtures
        if: matrix.compatibility == true
        run: |
          set -euo pipefail
          python3 -c 'import pytest; print("PYTEST_AVAILABLE=" + pytest.__version__)'
          mkdir -p "$HOME/bin"
          printf '#!/usr/bin/env bash\nif [ "${1:-}" = "--version" ]; then echo "2.1.87 (Claude Code)"; else exit 0; fi\n' > "$HOME/bin/claude"
          chmod +x "$HOME/bin/claude"
          sudo mkdir -p /home/simokitafresh/bin
          sudo sh -c 'printf "#!/usr/bin/env bash\\nif [ \"\${1:-}\" = \"--version\" ]; then echo \"2.1.87 (Claude Code)\"; else exit 0; fi\\n" > /home/simokitafresh/bin/claude'
          sudo chmod +x /home/simokitafresh/bin/claude
          tmux new-session -d -s shogun -n agents -x 240 -y 80
          agents=(karo gunshi hayate kagemaru hanzo saizo kotaro tobisaru shogun)
          for agent in "${agents[@]:1}"; do
            tmux split-window -d -t shogun:agents
            tmux select-layout -t shogun:agents tiled
          done
          mapfile -t panes < <(tmux list-panes -t shogun:agents -F '#{pane_id}')
          test "${#panes[@]}" -eq "${#agents[@]}"
          now="$(date +%s)"
          for index in "${!agents[@]}"; do
            pane="${panes[$index]}"
            agent="${agents[$index]}"
            group=codex
            [ "$agent" = karo ] && group=karo
            tmux set-option -p -t "$pane" @agent_id "$agent"
            tmux set-option -p -t "$pane" @agent_cli codex
            tmux set-option -p -t "$pane" @agent_state idle
            tmux set-option -p -t "$pane" @model_name gpt-5.6-sol
            tmux set-option -p -t "$pane" @agent_group "$group"
            tmux set-option -p -t "$pane" @last_active "$now"
            tmux set-option -p -t "$pane" @context_pct 0
            tmux set-option -p -t "$pane" @current_task none
            tmux set-option -p -t "$pane" @inbox_count 0
          done
          printf 'TMUX_PANE=%s\n' "${panes[0]}" >> "$GITHUB_ENV"
          printf 'TMUX_WINDOW=shogun:agents\n' >> "$GITHUB_ENV"
          tmux list-panes -t shogun:agents -F '#{pane_id} #{@agent_id} #{@agent_cli} #{@agent_state} #{@model_name}'

      - name: Install tracked git hooks
        run: |
          git config core.hooksPath "$PWD/.git/hooks"
          bash scripts/sync_git_hooks.sh
          test "$(git config --get core.hooksPath)" = "$PWD/.git/hooks"
          cmp -s scripts/hooks/git-pre-commit.sh .git/hooks/pre-commit
          cmp -s .githooks/pre-push .git/hooks/pre-push

      - name: Assign measured test files to shard
        id: shard_assignment
        run: |
          set -euo pipefail
          if [ ! -d tests/unit ]; then
            echo "::error::tests/unit directory not found"
            exit 1
          fi
          mkdir -p test-results
          python3 - <<'PY'
          import json
          from pathlib import Path

          shard_name = "${{ matrix.shard }}"
          compatibility = "${{ matrix.compatibility }}" == "true"
          shard = int(shard_name) if not compatibility else None
          shard_count = 8
          compatibility_files = [
              "tests/unit/test_cdp_session_contract.bats",
              "tests/unit/test_ninja_monitor_clear_guard.bats",
              "tests/unit/test_deploy_task_semantic_context_cache.bats",
              "tests/unit/test_respawn_recovery.bats",
              "tests/unit/test_ninja_monitor_stall.bats",
              "tests/unit/test_heavy_job_admission.bats",
              "tests/unit/test_report_commit_identity.bats",
              "tests/unit/test_gate_karo_startup.bats",
              "tests/unit/test_shogun_cli_switch_probe.bats",
              "tests/unit/test_cmd_skeleton.bats",
              "tests/unit/test_review_approval_fail_close_filter.bats",
              "tests/unit/test_dm_signal_cdp_adapters.bats",
              "tests/unit/test_gate_vercel_phase.bats",
              "tests/unit/test_retro_answer_type_parity.bats",
              "tests/unit/test_send_wakeup.bats",
              "tests/unit/test_deploy_task_self_snapshot.bats",
              "tests/unit/test_cmd_complete_gate_convergence.bats",
          ]
          timing_path = Path("logs/cmd_4392_local-test-timing.json")
          timing_source = "live_ledger"
          if not timing_path.is_file():
              timing_path = Path("config/ci_unit_test_timing.json")
              timing_source = "committed_snapshot"
          if not timing_path.is_file():
              raise SystemExit("timing ledger and committed timing snapshot are both missing")
          timing_payload = json.loads(timing_path.read_text(encoding="utf-8"))
          measurement = timing_payload.get("measurement", timing_payload)
          print(f"SHARD_TIMING_SOURCE source={timing_source} path={timing_path}")
          all_inventory = sorted(str(path) for path in Path("tests/unit").glob("*.bats"))
          inventory_set = set(all_inventory)
          if len(inventory_set) != len(all_inventory):
              raise SystemExit(f"unit inventory invariant failed: {len(all_inventory) - len(inventory_set)} duplicate files")
          if len(set(compatibility_files)) != len(compatibility_files):
              raise SystemExit("compatibility inventory invariant failed: duplicate entry")
          missing_compatibility = sorted(set(compatibility_files) - set(all_inventory))
          if missing_compatibility:
              raise SystemExit(f"compatibility file missing from unit inventory: {missing_compatibility}")
          inventory = [path for path in all_inventory if path not in set(compatibility_files)]
          records = measurement.get("records", [])
          measured = {}
          duplicates = []
          for record in records:
              path = record.get("path")
              if path in measured:
                  duplicates.append(path)
              measured[path] = float(record.get("duration_sec", 0.0))
          ledger_paths = sorted(measured)
          missing_from_ledger = sorted(inventory_set - set(ledger_paths))
          stale_ledger_paths = sorted(set(ledger_paths) - inventory_set)
          if duplicates or inventory_set != set(ledger_paths):
              raise SystemExit(json.dumps({
                  "inventory_count": len(all_inventory),
                  "ledger_selected": measurement.get("selected_files"),
                  "ledger_discovered": measurement.get("discovered_files"),
                  "ledger_records": measurement.get("record_count"),
                  "ledger_duplicate_count": measurement.get("duplicate_count"),
                  "ledger_missing_count": measurement.get("missing_count"),
                  "duplicate_paths": sorted(set(duplicates)),
                  "missing_from_ledger": missing_from_ledger,
                  "stale_ledger_paths": stale_ledger_paths,
              }, sort_keys=True))

          if compatibility:
              Path(f"test-results/shard-{shard_name}.paths").write_text(
                  "".join(f"{path}\n" for path in compatibility_files), encoding="utf-8"
              )
              print(
                  f"SHARD_COMPATIBILITY shard={shard_name} files={len(compatibility_files)} "
                  "order=manifest deterministic=1"
              )
              print(
                  f"SHARD_PARTITION total={len(all_inventory)} "
                  f"compatibility={len(compatibility_files)} normal={len(inventory)}"
              )
              raise SystemExit(0)

          # Longest-processing-time first assignment keeps the measured shard
          # totals close while retaining one deterministic, auditable mapping.
          buckets = [(0.0, index, []) for index in range(shard_count)]
          for path in sorted(inventory, key=lambda item: (-measured[item], item)):
              total, index, paths = min(buckets, key=lambda item: (item[0], item[1]))
              paths.append(path)
              buckets[index] = (total + measured[path], index, paths)
          total, _, paths = buckets[shard]
          Path(f"test-results/shard-{shard}.paths").write_text(
              "".join(f"{path}\n" for path in paths), encoding="utf-8"
          )
          print(f"SHARD_ASSIGNMENT shard={shard} files={len(paths)} measured_seconds={total:.3f}")
          print(
              f"SHARD_PARTITION total={len(all_inventory)} "
              f"compatibility={len(compatibility_files)} normal={len(inventory)}"
          )
          for bucket_total, bucket_index, bucket_paths in buckets:
              print(f"SHARD_TOTAL shard={bucket_index} files={len(bucket_paths)} measured_seconds={bucket_total:.3f}")
              print(f"SHARD_FILES shard={bucket_index} paths={','.join(bucket_paths)}")
          assigned = [path for _, _, bucket_paths in buckets for path in bucket_paths]
          if sorted(assigned) != inventory or len(assigned) != len(set(assigned)):
              raise SystemExit("shard assignment invariant failed: inventory is not a partition")
          PY

      - name: Run unit and root-level tests
        id: run_shard
        run: |
          # The legacy aggregate contract remains documented for callers and
          # tests; this matrix invokes the equivalent file-isolated mode.
          # bash scripts/run_tests.sh push
          set -o pipefail
          mkdir -p test-results
          receipt="$GITHUB_WORKSPACE/test-results/shard-${{ matrix.shard }}.json"
          # run_tests.sh derives its canonical TAP path from the receipt path;
          # keep the requested-output copy distinct so a passing shard does
          # not fail on cp(source == destination).
          tap="$GITHUB_WORKSPACE/test-results/shard-${{ matrix.shard }}-requested.tap"
          if [ "${{ matrix.compatibility }}" = "true" ]; then
            # These 17 files share host-global fixtures. Keep the default
            # runner environment and use the legacy aggregate root contract;
            # the normal eight shards retain their existing parallelism.
            export BATS_FILE_JOBS=1
            export BATS_SPLIT_FILES=0
            export BATS_JOBS=1
            export BATS_INNER_JOBS=1
            export BATS_FILE_TIMEOUT_SECONDS=900
          else
            export BATS_FILE_JOBS=32
            export BATS_INNER_JOBS=1
            export BATS_FILE_TIMEOUT_SECONDS=300
          fi
          set +e
          if [ "${{ matrix.compatibility }}" = "true" ]; then
            BATS_CACHE=0 \
            RUN_TESTS_RECEIPT_PATH="$receipt" \
            BATS_TAP_OUTPUT="$tap" \
              bash scripts/run_tests.sh file $(<"test-results/shard-${{ matrix.shard }}.paths") 2>&1 | tee "test-results/shard-${{ matrix.shard }}.log"
          else
            BATS_CACHE=0 \
            BATS_INNER_JOBS=1 \
            BATS_FILE_TIMEOUT_SECONDS=300 \
            RUN_TESTS_RECEIPT_PATH="$receipt" \
            BATS_TAP_OUTPUT="$tap" \
              bash scripts/run_tests.sh file $(<"test-results/shard-${{ matrix.shard }}.paths") 2>&1 | tee "test-results/shard-${{ matrix.shard }}.log"
          fi
          rc=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$rc" > "test-results/shard-${{ matrix.shard }}.rc"
          if [ "$rc" -ne 0 ]; then
            echo "::error::Unit tests failed in shard ${{ matrix.shard }} (rc=$rc); aggregate step will fail the matrix"
          fi

      - name: Verify zero SKIPs (SKIP=FAIL policy)
        if: always()
        run: |
          set -euo pipefail
          receipt="test-results/shard-${{ matrix.shard }}.json"
          rc_file="test-results/shard-${{ matrix.shard }}.rc"
          if [ ! -s "$receipt" ] || [ ! -s "$rc_file" ]; then
            echo "::error::missing shard receipt or return code"
            exit 1
          fi
          python3 - "$receipt" "$rc_file" <<'PY'
          import json
          import sys

          receipt_path, rc_path = sys.argv[1:]
          receipt = json.load(open(receipt_path, encoding="utf-8"))
          rc = int(open(rc_path, encoding="utf-8").read().strip())
          skip_count = int(receipt.get("skip_count", 0))
          declared = int(receipt.get("declared_test_count", 0))
          observed = int(receipt.get("observed_test_count", 0))
          result = receipt.get("result")
          print("SHARD_RESULT " + json.dumps({
              "declared": declared,
              "observed": observed,
              "skip": skip_count,
              "result": result,
              "rc": rc,
          }, sort_keys=True))
          if rc != 0 or result != "PASS":
              raise SystemExit(f"shard failed: rc={rc} result={result!r}")
          if skip_count != 0:
              raise SystemExit(f"SKIP=FAIL: shard reported {skip_count} skipped tests")
          if declared != observed:
              raise SystemExit(f"test count mismatch: declared={declared} observed={observed}")
          PY
          echo "All tests in shard ${{ matrix.shard }} executed (0 skips)"

      - name: Report bounded test failure evidence
        if: failure()
        run: |
          receipt="$(find test-results -maxdepth 1 -type f -name 'shard-*.json' -printf '%T@ %p\n' 2>/dev/null | sort -nr | head -n 1 | cut -d' ' -f2-)"
          if [ -z "$receipt" ]; then
            receipt="$(find logs/test_receipts -maxdepth 1 -type f -name '*.json' -printf '%T@ %p\n' 2>/dev/null | sort -nr | head -n 1 | cut -d' ' -f2-)"
          fi
          if [ -z "$receipt" ]; then
            echo "::error::No test receipt JSON found after unit-test failure"
            exit 1
          fi
          artifact="$(python3 - "$receipt" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          print(data.get("artifact", ""))
          PY
          )"
          if [ -z "$artifact" ] || [ ! -f "$artifact" ]; then
            echo "::error::Receipt output artifact is missing"
            exit 1
          fi
          python3 - "$receipt" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          safe = {key: data.get(key) for key in (
              "version", "complete", "result", "rc", "duration_ms",
              "declared_test_count", "observed_test_count", "skip_count",
          )}
          print("TEST_RECEIPT_SUMMARY " + json.dumps(safe, sort_keys=True))
          PY
          echo "TEST_RECEIPT_OUTPUT_TAIL_BEGIN"
          tail -n 120 "$artifact"
          echo "TEST_RECEIPT_OUTPUT_TAIL_END"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results-shard-${{ matrix.shard }}
          # Legacy artifact contract: path: test-results/*.tap
          path: |
            test-results/*
            test-results/*.tap
          if-no-files-found: error

      - name: Upload test receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-receipts-shard-${{ matrix.shard }}
          path: |
            test-results/shard-*.json
            test-results/shard-*.output
            logs/test_receipts/*.json
            logs/test_receipts/*.output
          if-no-files-found: error

  build-check:
    name: Build Instructions Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Configure git for consistent line endings
        run: |
          git config core.autocrlf input
          git config core.eol lf

      - name: Check if build script exists
        id: check_script
        run: |
          if [ -f scripts/build_instructions.sh ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Run build_instructions.sh
        if: steps.check_script.outputs.exists == 'true'
        run: |
          bash scripts/build_instructions.sh

      - name: Check for uncommitted changes
        if: steps.check_script.outputs.exists == 'true'
        run: |
          if [ ! -d instructions/generated ]; then
            echo "::warning::instructions/generated directory not found. Skipping diff check."
            exit 0
          fi

          git diff --exit-code instructions/generated/ || {
            echo "::error::Generated instructions files are out of sync!"
            echo "::error::Run 'bash scripts/build_instructions.sh' and commit the changes."
            git diff instructions/generated/
            exit 1
          }

          echo "✓ Generated instructions are in sync with source templates"

      - name: Skip build check
        if: steps.check_script.outputs.exists == 'false'
        run: |
          echo "::warning::scripts/build_instructions.sh not found. Skipping build check."
          echo "This check will be enabled once template generation is implemented (Phase 2)"

  shellcheck:
    name: Shell Script Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run shellcheck on lib/
        run: |
          if [ -d lib ]; then
            find lib -name '*.sh' -type f -exec shellcheck -x -S error {} +
          else
            echo "::warning::lib/ directory not found"
          fi

      - name: Run shellcheck on scripts/
        run: |
          if [ -d scripts ]; then
            find scripts -name '*.sh' -type f -exec shellcheck -x -S error {} +
          else
            echo "::warning::scripts/ directory not found"
          fi

      - name: Block set -e test-and short-circuit regressions (LG041)
        run: bash scripts/gates/gate_set_e_short_circuit.sh

  e2e-tests:
    name: E2E Tests
    needs: [unit-tests, shellcheck]
    runs-on: ubuntu-latest
    # Dependency installation is network-bound and consumed the former 10-minute
    # job budget before the E2E suite could start (run 32300748166).
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y tmux inotify-tools
          sudo npm install -g bats
          python3 -m venv .venv && .venv/bin/pip install pyyaml

      - name: Run E2E tests
        run: bats tests/e2e/ --timing --jobs 1

      - name: Dump debug info on failure
        if: failure()
        run: |
          for session in $(tmux list-sessions -F '#{session_name}' 2>/dev/null); do
            for pane in $(tmux list-panes -t "$session" -F '#{pane_id}' 2>/dev/null); do
              echo "=== $session/$pane ==="
              tmux capture-pane -t "$pane" -p -J 2>/dev/null || true
            done
          done
          cat /tmp/e2e_inbox_watcher_*.log 2>/dev/null || true

  codd-verify:
    name: CoDD Design Consistency Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install codd-dev
        run: |
          pip install codd-dev

      - name: Run codd dag verify
        run: |
          codd dag verify --path . --format json || {
            echo "::error::CoDD design consistency violations detected. Run 'codd dag verify --path . --format json' locally to inspect."
            exit 1
          }

  integration-tests:
    name: Integration Tests (Claude only)
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install bats-core
        run: |
          sudo npm install -g bats

      - name: Setup bats helpers
        run: |
          mkdir -p tests/test_helper
          git clone --depth 1 https://github.com/bats-core/bats-support tests/test_helper/bats-support
          git clone --depth 1 https://github.com/bats-core/bats-assert tests/test_helper/bats-assert

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-yaml tmux inotify-tools

      - name: Run integration tests
        run: |
          set -o pipefail
          mkdir -p test-results
          if [ ! -d tests/integration ]; then
            echo "::error::tests/integration directory not found. SKIP = FAIL policy."
            exit 1
          fi
          bats tests/integration/ --filter-tags '!copilot,!codex' --formatter tap --timing | tee test-results/integration.tap || {
            echo "::error::Integration tests failed"
            exit 1
          }

          SKIP_COUNT=$(bash scripts/count_bats_skips.sh test-results/integration.tap)
          if [ "$SKIP_COUNT" -gt 0 ]; then
            echo "::error::$SKIP_COUNT integration tests were SKIPPED. SKIP = FAIL policy."
            exit 1
          fi
          echo "Integration tests executed (0 skips)"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-results
          path: test-results/integration.tap
          if-no-files-found: ignore
