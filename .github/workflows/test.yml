# semantic-links: [[忍者報告品質プロトコル]]
name: Multi-CLI Test Suite

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit Tests (bats)
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install bats-core
        run: |
          sudo npm install -g bats

      - name: Setup bats helpers
        run: |
          mkdir -p tests/test_helper
          git clone --depth 1 https://github.com/bats-core/bats-support tests/test_helper/bats-support
          git clone --depth 1 https://github.com/bats-core/bats-assert tests/test_helper/bats-assert

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-yaml parallel ripgrep

      - name: Install tracked git hooks
        run: |
          git config core.hooksPath "$PWD/.git/hooks"
          bash scripts/sync_git_hooks.sh
          test "$(git config --get core.hooksPath)" = "$PWD/.git/hooks"
          cmp -s scripts/hooks/git-pre-commit.sh .git/hooks/pre-commit
          cmp -s .githooks/pre-push .git/hooks/pre-push

      - name: Run unit and root-level tests
        run: |
          set -o pipefail
          mkdir -p test-results
          if [ ! -d tests/unit ]; then
            echo "::warning::tests/unit directory not found. Skipping unit tests."
            exit 0
          fi
          # Each bats file owns mutable setup/teardown fixtures. Keep tests
          # inside a file serial; run_tests.sh schedules independent files up
          # to the detected CPU count, with eight as the hard ceiling.
          BATS_CACHE=0 \
          BATS_INNER_JOBS=1 \
          BATS_FILE_TIMEOUT_SECONDS=300 \
          BATS_TAP_OUTPUT=test-results/all.tap \
            bash scripts/run_tests.sh push || {
            echo "::error::Unit or root-level tests failed"
            exit 1
          }

      - name: Verify zero SKIPs (SKIP=FAIL policy)
        run: |
          SKIP_COUNT=$(bash scripts/count_bats_skips.sh test-results/*.tap)
          if [ "$SKIP_COUNT" -gt 0 ]; then
            echo "::error::$SKIP_COUNT tests were SKIPPED. SKIP = FAIL policy (FR-054)."
            exit 1
          fi
          echo "All tests executed (0 skips)"

      - name: Report bounded test failure evidence
        if: failure()
        run: |
          receipt="$(find logs/test_receipts -maxdepth 1 -type f -name '*.json' -printf '%T@ %p\n' 2>/dev/null | sort -nr | head -n 1 | cut -d' ' -f2-)"
          if [ -z "$receipt" ]; then
            echo "::error::No test receipt JSON found after unit-test failure"
            exit 1
          fi
          artifact="$(python3 - "$receipt" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          print(data.get("artifact", ""))
          PY
          )"
          if [ -z "$artifact" ] || [ ! -f "$artifact" ]; then
            echo "::error::Receipt output artifact is missing"
            exit 1
          fi
          python3 - "$receipt" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          safe = {key: data.get(key) for key in (
              "version", "complete", "result", "rc", "duration_ms",
              "declared_test_count", "observed_test_count", "skip_count",
          )}
          print("TEST_RECEIPT_SUMMARY " + json.dumps(safe, sort_keys=True))
          PY
          echo "TEST_RECEIPT_OUTPUT_TAIL_BEGIN"
          tail -n 120 "$artifact"
          echo "TEST_RECEIPT_OUTPUT_TAIL_END"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: test-results/*.tap
          if-no-files-found: ignore

      - name: Upload test receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-receipts
          path: |
            logs/test_receipts/*.json
            logs/test_receipts/*.output
          if-no-files-found: error

  build-check:
    name: Build Instructions Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Configure git for consistent line endings
        run: |
          git config core.autocrlf input
          git config core.eol lf

      - name: Check if build script exists
        id: check_script
        run: |
          if [ -f scripts/build_instructions.sh ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Run build_instructions.sh
        if: steps.check_script.outputs.exists == 'true'
        run: |
          bash scripts/build_instructions.sh

      - name: Check for uncommitted changes
        if: steps.check_script.outputs.exists == 'true'
        run: |
          if [ ! -d instructions/generated ]; then
            echo "::warning::instructions/generated directory not found. Skipping diff check."
            exit 0
          fi

          git diff --exit-code instructions/generated/ || {
            echo "::error::Generated instructions files are out of sync!"
            echo "::error::Run 'bash scripts/build_instructions.sh' and commit the changes."
            git diff instructions/generated/
            exit 1
          }

          echo "✓ Generated instructions are in sync with source templates"

      - name: Skip build check
        if: steps.check_script.outputs.exists == 'false'
        run: |
          echo "::warning::scripts/build_instructions.sh not found. Skipping build check."
          echo "This check will be enabled once template generation is implemented (Phase 2)"

  shellcheck:
    name: Shell Script Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run shellcheck on lib/
        run: |
          if [ -d lib ]; then
            find lib -name '*.sh' -type f -exec shellcheck -x -S error {} +
          else
            echo "::warning::lib/ directory not found"
          fi

      - name: Run shellcheck on scripts/
        run: |
          if [ -d scripts ]; then
            find scripts -name '*.sh' -type f -exec shellcheck -x -S error {} +
          else
            echo "::warning::scripts/ directory not found"
          fi

      - name: Block set -e test-and short-circuit regressions (LG041)
        run: bash scripts/gates/gate_set_e_short_circuit.sh

  e2e-tests:
    name: E2E Tests
    needs: [unit-tests, shellcheck]
    runs-on: ubuntu-latest
    # Dependency installation is network-bound and consumed the former 10-minute
    # job budget before the E2E suite could start (run 32300748166).
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y tmux inotify-tools
          sudo npm install -g bats
          python3 -m venv .venv && .venv/bin/pip install pyyaml

      - name: Run E2E tests
        run: bats tests/e2e/ --timing --jobs 1

      - name: Dump debug info on failure
        if: failure()
        run: |
          for session in $(tmux list-sessions -F '#{session_name}' 2>/dev/null); do
            for pane in $(tmux list-panes -t "$session" -F '#{pane_id}' 2>/dev/null); do
              echo "=== $session/$pane ==="
              tmux capture-pane -t "$pane" -p -J 2>/dev/null || true
            done
          done
          cat /tmp/e2e_inbox_watcher_*.log 2>/dev/null || true

  codd-verify:
    name: CoDD Design Consistency Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install codd-dev
        run: |
          pip install codd-dev

      - name: Run codd dag verify
        run: |
          codd dag verify --path . --format json || {
            echo "::error::CoDD design consistency violations detected. Run 'codd dag verify --path . --format json' locally to inspect."
            exit 1
          }

  integration-tests:
    name: Integration Tests (Claude only)
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install bats-core
        run: |
          sudo npm install -g bats

      - name: Setup bats helpers
        run: |
          mkdir -p tests/test_helper
          git clone --depth 1 https://github.com/bats-core/bats-support tests/test_helper/bats-support
          git clone --depth 1 https://github.com/bats-core/bats-assert tests/test_helper/bats-assert

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-yaml tmux inotify-tools

      - name: Run integration tests
        run: |
          set -o pipefail
          mkdir -p test-results
          if [ ! -d tests/integration ]; then
            echo "::error::tests/integration directory not found. SKIP = FAIL policy."
            exit 1
          fi
          bats tests/integration/ --filter-tags '!copilot,!codex' --formatter tap --timing | tee test-results/integration.tap || {
            echo "::error::Integration tests failed"
            exit 1
          }

          SKIP_COUNT=$(bash scripts/count_bats_skips.sh test-results/integration.tap)
          if [ "$SKIP_COUNT" -gt 0 ]; then
            echo "::error::$SKIP_COUNT integration tests were SKIPPED. SKIP = FAIL policy."
            exit 1
          fi
          echo "Integration tests executed (0 skips)"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-results
          path: test-results/integration.tap
          if-no-files-found: ignore
