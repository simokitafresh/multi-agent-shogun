  summary: Ward FoFは1/N EWに対しリスク調整後指標で非優位。Sharpeのみ微優位(2.0035 vs 1.9803,+0.023)だがMaxDD/Sortino/CalmarはいずれもEW優位。特にMaxDDはWard
    22.56% vs EW 21.59%でEWが低い
  details: '【AC1】本番DB(PostgreSQL)からWard FoF(0012f956)のmonthly_returns 141ヶ月(2014-07〜2026-03)を取得。旧忍法15体(全てFoFタイプ:
    加速/四つ目/変わり身/抜き身/追い風 × 激攻/鉄壁/常勝)の各monthly_returnsを取得し、15体均等加重(1/N)のEW系列を月ごとに再計算した。全15体とも2014-07以前にデータ開始のため141ヶ月全てで15体揃う。

    【AC2】指標比較(年率化、全141ヶ月):

    | 指標 | Ward FoF | 1/N EW | 差 | 優位 |

    |------|----------|--------|-----|------|

    | Ann.Return | 60.47% | 59.49% | +0.98pp | Ward |

    | Ann.Volatility | 30.18% | 30.04% | +0.14pp | EW |

    | Monthly StdDev | 8.71% | 8.67% | +0.04pp | EW |

    | Sharpe | 2.0035 | 1.9803 | +0.023 | Ward |

    | MaxDD | 22.56% | 21.59% | +0.97pp | EW |

    | Sortino | 5.4847 | 5.4963 | -0.012 | EW |

    | Calmar | 2.6805 | 2.7559 | -0.075 | EW |

    Top5(Sharpe順): 抜き身-激攻(2.04), 抜き身-鉄壁(1.85), 加速-激攻(1.74), 四つ目-激攻(1.73), 抜き身-常勝(1.67)

    Bottom5: 変わり身-常勝(1.51), 四つ目-常勝(1.51), 加速-常勝(1.45), 追い風-常勝(1.40), 加速-鉄壁(1.39)

    【AC3】二値判定: 非優位。Ward FoF優位はSharpeのみ(1/4指標)。MaxDD/Sortino/Calmarは全てEW優位。特にMaxDDはWardが0.97pp悪い(22.56%
    vs 21.59%)。R-seriesでのMaxDD優位率86-96%はローリング窓分析であり、全期間通算では逆転する可能性がある。Ward法のクラスタリングによるウェイト配分は、全期間リスク調整指標で1/N均等加重に対して明確な優位性を示せていない'
