  details: '## AC1: FoF累積パフォーマンスランキング (experiments.db, Open-to-Open)


    experiments.dbに格納されたFoFは35体(本番DB突合による型判定)。

    計算方法: monthly_returnsのreturn_open列を月次複利合成 Π(1+r)-1。


    ### 12ヶ月累積トップ10

    1. 激攻-白虎: +127.60% (全期間+38,112%)

    2. 鉄壁-白虎: +126.96% (全期間+27,564%)

    3. 常勝-白虎: +100.41% (全期間+32,951%)

    4. 激攻-青龍: +91.37% (全期間+59,479%)

    5. 加速-激攻: +80.56% (全期間+360,553%)

    6. 変わり身-激攻: +74.05% (全期間+38,080%)

    7. 追い風-常勝: +72.70% (全期間+31,751%)

    8. bam-6: +70.05% (全期間+26,962%)

    9. 追い風-鉄壁: +68.65% (全期間+19,138%)

    10. 変わり身-常勝: +67.11% (全期間+8,691%)


    ### 全期間累積トップ5

    1. 加速-激攻: +360,553% (12M+80.56%, 171ヶ月)

    2. 抜き身-激攻: +96,719% (12M+65.39%, 150ヶ月)

    3. 激攻-青龍: +59,479% (12M+91.37%, 175ヶ月)

    4. 抜き身-常勝: +51,363% (12M+60.18%, 150ヶ月)

    5. 追い風-激攻: +45,791% (12M+65.39%, 150ヶ月)


    ## AC2: Standard PF累積パフォーマンスランキング


    experiments.dbに格納されたstandardは23体。


    ### 12ヶ月累積トップ5

    1. DM6-5: +152.45% (全期間+35,789%)

    2. DM4: +72.93% (全期間+14,027%)

    3. DM2-60%: +58.49% (全期間+31,679%)

    4. DM-safe-2: +57.91% (全期間+3,047%)

    5. DM6: +52.24% (全期間+48,104%)


    ### 全期間累積トップ5

    1. DM6: +48,104% (12M+52.24%, 193ヶ月)

    2. DM6-5: +35,789% (12M+152.45%, 189ヶ月)

    3. DM2-60%: +31,679% (12M+58.49%, 175ヶ月)

    4. DM2-top: +26,599% (12M+11.41%, 181ヶ月)

    5. DM2-test: +25,690% (12M+19.88%, 181ヶ月)


    ### FoF vs Standard比較

    12Mトップ: DM6-5(standard)+152.45% > 激攻-白虎(FoF)+127.60%

    全期間トップ: 加速-激攻(FoF)+360,553% > DM6(standard)+48,104%

    FoF上位は概してstandardを上回る傾向(特に忍法系FoF)。


    ## AC3: Ward FoF(+54.93%)を上回るFoF/PF


    ### Ward FoF情報

    - 本番DB名: 旧忍法-Ward (0012f956-123d-4e15-84c5-7731ca00ecde)

    - experiments.dbには未格納

    - 本番DB 12M累積: +54.93% (2025-04~2026-03)

    - 本番DB全期間累積: +25,333% (2014-07~2026-03, 141ヶ月)


    ### 12Mで+54.93%を上回るPF/FoF (計21体)

    FoF 17体: 激攻-白虎(+127.60%), 鉄壁-白虎(+126.96%), 常勝-白虎(+100.41%), 激攻-青龍(+91.37%), 加速-激攻(+80.56%),
    変わり身-激攻(+74.05%), 追い風-常勝(+72.70%), bam-6(+70.05%), 追い風-鉄壁(+68.65%), 変わり身-常勝(+67.11%),
    抜き身-激攻(+65.39%), 抜き身-鉄壁(+65.39%), 追い風-激攻(+65.39%), 抜き身-常勝(+60.18%), 激攻-玄武(+59.78%),
    加速-常勝(+59.06%), 激攻-朱雀(+55.10%)

    Standard 4体: DM6-5(+152.45%), DM4(+72.93%), DM2-60%(+58.49%), DM-safe-2(+57.91%)


    ### 殿の記憶する好成績候補の推定

    白虎系FoF(3体とも+100%超)が最有力候補。特に激攻-白虎(+127.60%)は12M最強FoF。

    standard単体ではDM6-5(+152.45%)が突出。DM6のlookback=15D変種。

    加速-激攻は全期間+360,553%で歴代最高だが12M=+80.56%。


    ### analysis_runs/配下のWard関連バックテスト

    analysis_runs/配下にWard名称のバックテスト結果ファイルなし(pipeline-troubleshooting.mdにWard言及あるのみ)。


    ### 注意事項

    - experiments.dbのmonthly_returnsはreturn_open(Open-to-Open)で計算。return_closeも存在するが本システムのデフォルトはOpen-to-Open(PI-008,
    誤解14)

    - シンv2系FoF(21体)はexperiments.dbに未格納。本番DBのみに存在

    - L0-*プレフィックスのGSチャンピオンPF群もexperiments.dbに未格納'
