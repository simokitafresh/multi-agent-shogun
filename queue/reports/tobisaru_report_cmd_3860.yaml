lesson_candidate:
  found: true
  no_lesson_reason: このタスクでは新規教訓候補なし
  title: 多cmd累積branchは統合直前に一度も実CI全量を通っていないと隠れた回帰が可視化されない
  detail: 'cmd_3849〜cmd_3859の各cmdは個別にGATE CLEARされたが、統合された79 commit全体をGitHub Actions実CI(全1790テスト)に通したのはcmd_3860が初めてだった。結果24件(→21件)のpre-existing
    failureが発覚。cmd_3856の時点で既にfull backend suite参考計測(baseline 38 failed)を記録していたが『環境起因』として深掘りされず次cmdへ持ち越されていた。教訓:
    複数cmdが同一branchへ積み増す構成では、各cmd個別GATE CLEARに加えて統合branch全体を定期的(N cmdごと、または push前必須として)実CIに通すチェックポイントを設けるべき。特にpush=本番自動デプロイに直結するrepo(Render
    Auto-Deploy: On Commit)では、push直前の全量CI一発勝負ではなく早期に定期実施することでtriage cmdの発見・修正時間を確保できる'
  project: dm-signal
  origin: '[[cmd_3859_AC2安全停止]] -> [[live=P1a以前+分岐でP4本番run前提不成立]] -> [[統合+CI+deploy+live一次確認でP4再実行前提を回復]]'
