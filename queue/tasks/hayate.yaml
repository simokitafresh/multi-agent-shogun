  growth_loop_defense:
  - ゲートの成功=未熟さの証拠。発火しないシステムが完成系。
  - 'Level1(事後検出): 間違えた後にgateが検出'
  - 'Level2(事前予防(doc)): ドキュメントに「こうせよ」と記載'
  - 'Level3(事前強制(auto-gen)): テンプレートを自動生成して正しい構造を強制'
  - 'Level4(フロー内BLOCK): 間違ったら即停止。先に進めない'
  - 'Level5(事前コンテキスト提供): 正しい入力を自動生成して渡す。間違える余地がない'
  - 'Level6(学習速度最大化): 間違いから学ぶ速度を最大化。下限が切り上がる'
  - '新規gate/hook設計時: 最初からLevel 5を目指せ。Level 4で止めるな'
  - 'BLOCKされたら**: 修正してCLEARするだけでなく「同じBLOCKが二度と起きない仕組み」を環境に埋め込め'
  never_stop_for:
  - CDPポート未応答 — preflight_cdp_flowが自動起動する。まず実行せよ
  - 既存インフラの自動対処機能があるエラー — まず実行→失敗なら報告
  - 自明な修正（typo等） — 実行→事後報告
  - 9p stall/hang疑い — まず独立検証（別ペイン/短いコマンド）で環境起因か切り分けよ
