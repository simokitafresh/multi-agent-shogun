  command: |
    目的関数 max_run_up に絞ってALM L1 OOS検証を実行せよ。

    ■ 入力
    - ALM L0月次リターン: /mnt/c/Python_app/DM-signal/outputs/analysis/alm_research/cmd_1747_alm_l0_returns_6obj.csv
      → max_run_up__DM2, max_run_up__DM3, max_run_up__DM6, max_run_up__DM7+ の4列を使用
    - in-sample結果: /mnt/c/Python_app/DM-signal/outputs/analysis/alm_research/cmd_1747_cross_comparison.yaml
    - シン忍法v2チャンピオンパラメータ(固定使用)
    - 研究エンジン: /mnt/c/Python_app/DM-signal/scripts/analysis/standard_pf_preprocessing/research_engine.py

    ■ 手順
    1. cmd_1747_alm_l0_returns_6obj.csv から max_run_up の4列をロード
    2. 各4ファミリーL0を忍法7種(bunshin/oikaze/nukimi/kawarimi/kasoku_diff/kasoku_ratio/yotsume)に入力
       - シン忍法v2チャンピオンパラメータを固定使用
    3. WF各窓でIS/OOSメトリクス(38指標)を算出
       - WFパラメータ: IS=60ヶ月, OOS=12ヶ月, step=12ヶ月
    4. full-sample vs OOS劣化率を算出
       - Calmar基準: <30%=ROBUST, 30-50%=SUSPECT, >50%=OVERFIT
    5. シン忍法OOSベースライン(R30-shin cmd_1604)との差分算出(可能なら)

    ■ 出力
    - /mnt/c/Python_app/DM-signal/outputs/analysis/alm_research/cmd_1748_partial_max_run_up.yaml
      内容: 7パターン(max_run_up×7忍法)のWF-OOS劣化率テーブル+overfit判定
    - commit

    制約: 他の目的関数は処理しない。max_run_upのみ。
