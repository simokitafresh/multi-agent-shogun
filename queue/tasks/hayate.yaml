task:
  parent_cmd: "cmd_training_speed_hayate"
  task_id: "cmd_training_speed_hayate_impl"
  task_type: "training"
  scout_exempt: true
  project: "infra"
  command: |
    修行: cmd_complete_gate.sh の実行速度改善。
    現在10.7秒。目標5秒未満。
    1. time bash scripts/cmd_complete_gate.sh cmd_test_speed でbefore計測
    2. bash -x で重い関数/走査を特定
    3. ボトルネック箇所を高速化(tail -N制限/キャッシュ/不要走査削除等)
    4. after計測で改善確認
    5. CoDD台帳に書き込み: codd extract --path scripts/cmd_complete_gate.sh (timeout 1200)
    6. bats関連テスト実行(test_select.shで選択: bash scripts/test_select.sh scripts/cmd_complete_gate.sh)
  status: done
  acceptance_criteria:
    - id: AC1
      description: "before計測: time bash scripts/cmd_complete_gate.sh でbefore値を記録"
      binary_checks:
        - check: "before計測値が記録されているか"
          result: ""
    - id: AC2
      description: "bash -xでボトルネック特定+高速化実装"
      binary_checks:
        - check: "after計測値がbefore値の50%以下か"
          result: ""
    - id: AC3
      description: "codd extract --path scripts/cmd_complete_gate.sh を実行しCoDD台帳に書き込み(timeout 1200)"
      binary_checks:
        - check: "codd extractが完了しdesign docs更新されたか"
          result: ""
    - id: AC4
      description: "関連batsテスト全PASS"
      binary_checks:
        - check: "テストPASS/SKIP 0か"
          result: ""
  stop_for:
    - "本番DB操作エラー"
  context_files:
    - "scripts/cmd_complete_gate.sh"
