purpose: "Step 0e: L1 ALM WFエンジンcmd C — 検証+baseline比較+事後分類。ランブック§3"
command: |
  軍師ランブック /mnt/c/Python_app/DM-signal/docs/research/gunshi_l1_alm_wf_engine_design.md §3に厳密に従え。
  cmd_1766成果物(l1_alm_wf_engine.py)と出力CSV(selection_timeline/alm_returns)を使う。

  AC1: 検証ゲート V1-V7
    - V1: IS/OOS非重複(全foldでis_end < oos_start)
    - V2: OOSギャップなし(ALMリターン月数=期待OOS月数)
    - V3: Look-ahead biasなし(IS窓内データのみで選出)
    - V4: 全パターン対象(df.columns=119,493)
    - V5: タイムボックスPASS(60秒以内)
    - V6: fold数検算(floor((166-36-12)/4)+1=30)
    - V7: baseline比較あり
    - binary_check: V1-V7全PASS

  AC2: baseline比較
    - 固定GS champion(全期間最良パターン)のOOSリターンを計算
    - WF dynamic vs fixed championの38メトリクス比較
    - 出力: outputs/analysis/alm_research/cmd_1767_l1_wf_baseline_comparison.csv
    - decision_candidate: found: true(動的選出の本番組込みは殿裁定)

  AC3: 事後分類(Pattern A/B/C)
    - fold間選出パターン: A=num変動/den固定, B=den変動/num固定, C=両方変動
    - 出力: outputs/analysis/alm_research/cmd_1767_l1_wf_pattern_classification.yaml
    - binary_check: 6 objectives全てにA/B/C分類記載
    - commit
target_path: /mnt/c/Python_app/DM-signal/outputs/scripts/l1_alm_wf_engine.py
