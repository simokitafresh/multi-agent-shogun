  AC1:
    description: "V1-V7検証ゲート全PASS"
    binary_checks:
      - "V1: 全foldでis_end < oos_startか？ yes/no"
      - "V2: ALMリターン月数が期待OOS月数と一致するか？ yes/no"
      - "V3: IS窓内データのみで選出しているか？ yes/no"
      - "V4: 全119,493パターンが対象か？ yes/no"
      - "V5: 60秒以内に完了したか？ yes/no"
      - "V6: fold数=30か？ yes/no"
      - "V7: baseline比較が含まれるか？ yes/no"
  AC2:
    description: "baseline比較CSV+decision_candidate"
    binary_checks:
      - "固定champion OOSリターンが計算されたか？ yes/no"
      - "38メトリクス比較テーブルが出力されたか？ yes/no"
      - "decision_candidate found: trueが記載されたか？ yes/no"
  AC3:
    description: "Pattern A/B/C分類+commit"
    binary_checks:
      - "6 objectives全てにA/B/C分類が記載されたか？ yes/no"
      - "commitされているか？ yes/no"
