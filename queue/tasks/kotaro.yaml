ninja: kotaro
project: infra
status: done
command: |
  GP-131を実装せよ。gate_report_format.shにbinary_checks項目数整合チェックを追加する。

  仕様:
  - task YAML(queue/tasks/{ninja}.yaml)のbinary_checksテンプレート項目数を取得
  - 報告YAMLのbinary_checks項目数と比較
  - report項目数 < task項目数 * 0.5 → errors.append + hints.append (FAIL)
  - report項目数 < task項目数 → warnings（WARNのみ、BLOCKしない）
  - task YAMLにbinary_checksがない場合はスキップ（チェックしない）

  実装箇所: scripts/gates/gate_report_format.sh 内のpython3 -c ブロック
  参考: 既存のbinary_checks形式チェック(L168-188付近)の直後に追加

  テスト:
  - 項目数一致: PASS
  - 項目数半分未満: FAIL+ヒント表示
  - 項目数不足(半分以上): WARN
  - task YAMLにbc未設定: スキップ
  commit後にbash scripts/gates/gate_report_format.sh <適当な既存報告>でテスト

  ★ 既存のチェックロジックは変更するな。追加のみ。
