task:
  ac_checkpoint: '各AC完了後に checkpoint: 次ACの前提条件確認 → scope drift検出 → progress更新'
  ac_priority: ''
  acceptance_criteria:
    AC1:
      binary_checks:
      - '改善点を3つ特定したか: yes/no'
      - '各改善点に対象ファイル・根拠を添えたか: yes/no'
      description: 指定スクリプトの改善点を3つ特定し、根拠付きで報告する
    AC2:
      binary_checks:
      - '最高インパクト1件を実装したか: yes/no'
      - '関連テストまたは明示的な検証を実行したか: yes/no'
      description: 改善点のうち最高インパクト1件を実装し、必要な検証を実行する
    AC3:
      binary_checks:
      - 'lesson_candidate found=trueでtitle/detail/projectを記入したか: yes/no'
      - 'AC1/AC2/AC3/AC4のbinary_checksを全てyes/noで記入したか: yes/no'
      - 'verdictがbinary_checksと矛盾していないか: yes/no'
      description: lesson_candidate found=true、AC1/AC2のbinary_checks全記入、verdict整合を含む報告YAMLを完成させる
    AC4:
      binary_checks:
      - 'task.related_lessonsの注入教訓を1件以上参照したか: yes/no'
      - '参照した教訓IDのusefulとreasonをlessons_usefulに記入したか: yes/no'
      description: 注入教訓から1件以上を作業判断に参照し、lessons_usefulに有用性と理由を記入する
  engineering_preferences:
  - prefer 指揮系統 + inbox_write/report YAML経路 over 直接割込み。通信は仕組みで残せ
  - prefer queue/ YAMLなど一次データ over dashboard要約や推測状態。二次データは必ず照合せよ
  - prefer 正本編集 + build_instructions.sh再生成 over generatedファイル直編集
  - prefer flock/atomic helper（inbox_mark_read.sh, yaml_field_set等）over 共有運用ファイルの手編集
  - prefer safe defaults / non-destructive ops over 強制reset・広域cleanup・履歴改変
  - prefer gateと状態遷移で強制する運用 over 口約束や人間依存の手順
  - prefer 実テスト実行+結果確認 over 推論だけでbinary_checksを記入。体験は抽象を校正する
  never_stop_for:
  - CDPポート未応答 — preflight_cdp_flowが自動起動する。まず実行せよ
  - 既存インフラの自動対処機能があるエラー — まず実行→失敗なら報告
  - 自明な修正（typo等） — 実行→事後報告
  - 9p stall/hang疑い — まず独立検証（別ペイン/短いコマンド）で環境起因か切り分けよ
