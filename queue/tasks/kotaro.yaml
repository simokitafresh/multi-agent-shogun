    - fullrecalculateの実行頻度と影響範囲


    【追加確認】

    - recalculate_fof.py側のHook Aは不要か、FoF連携で必要か

    - ALM PF用のテスト設計


    偵察5要件:

    (1) 変更対象ファイル+行番号 (2) 波及先 (3) テスト有無+修正要否

    (4) エッジケース (5) 依存関係・順序制約


