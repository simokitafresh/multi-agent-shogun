  task_id: cmd_1761_nukimi_kawarimi
  _ac_task_id: cmd_1761_nukimi_kawarimi
  _ac_worker_id: kotaro
  status: assigned
  project: dm-signal
  task_type: impl
  scout_exempt: true
  purpose: |
    cmd_1761分割。担当忍法: 抜き身(nukimi) + 身代(kawarimi)の3世代(旧/シン/ALM)38メトリクス算出。
  command: |
    担当忍法: 抜き身(nukimi) + 身代(kawarimi)

    ★★★ 追加指示(将軍cmd_update): 旧忍法も含め3世代比較 ★★★
    旧忍法(旧四神ベースL2) + シン忍法(L1) + ALM忍法(L1) の3世代で38メトリクスを算出せよ。
    Layer列は不要。旧/シン/ALMを忍法名で並べるだけでよい。

    ■ 手順:
    1. ALM L0月次リターンCSV読み込み:
       - 激攻(max_run_up): outputs/analysis/alm_research/cmd_1747_alm_l0_returns_6obj.csv のmax_run_up列
       - 常勝(calmar): outputs/analysis/alm_research/cmd_1760_calmar_ratio_l0_returns.csv
       - 鉄壁(UWP): outputs/analysis/alm_research/cmd_1760_underwater_period_alm_l0_returns.csv

    2. 各ALM L0から抜き身・身代の忍法をL1月次リターンに変換
       - cmd_1747/cmd_1760のchampionパラメータ(GS結果CSV参照)を固定使用

    3. research_engine.pyのcompute_metrics_from_returns()で38メトリクス算出
       - dtb3_cache/benchmark_returns(SPY)も渡すこと

    4. シン抜き身・シン身代も同じ38メトリクスで算出
       - 本番DB monthly_returnsから取得

    5. 旧抜き身・旧身代(旧四神ベースL2)も同じ38メトリクスで算出
       - 旧忍法は旧四神(L1 FoF)をベースにしたL2忍法
       - 本番DB monthly_returnsから取得(旧忍法PF名はportfoliosテーブルで確認)
       - 旧忍法が5忍法×3モードの場合、担当忍法に該当する旧PFのみ算出

    6. 出力:
       - outputs/analysis/alm_research/cmd_1761_kotaro_nukimi_kawarimi.yaml
       - 各体の38メトリクスを格納。旧/シン/ALMの3世代を含む

    7. commit

    ■ 制約:
    - パス: /mnt/c/Python_app/DM-signal で作業
    - 38メトリクス = research_engine.pyのcompute_metrics_from_returns出力(34+IR+UWP+DDLength+RecoveryTime)
    - CSVパスや旧忍法PFが見つからない場合はdecision_candidateに報告
  acceptance_criteria:
    - ac: "AC1: 抜き身・身代のALM版(3目的×2忍法)38メトリクス算出+YAML保存"
    - ac: "AC2: 抜き身・身代のシン版(2体)38メトリクス算出+YAML保存"
    - ac: "AC3: 抜き身・身代の旧版(旧四神ベースL2)38メトリクス算出+YAML保存+commit"
