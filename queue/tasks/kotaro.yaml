task:
  parent_cmd: cmd_training_L4_r14_kotaro
  task_id: cmd_training_L4_r14_kotaro_impl
  command: "parity_check.shを精査し改善点3つ特定、最高インパクト1件を実装、報告YAMLを完全に記入せよ"
  type: impl
  project: infra
  scout_exempt: true
  acceptance_criteria:
    - id: AC1
      description: "scripts/parity_check.shを読み、改善点を3つ特定し、各改善点にimpact評価(high/medium/low)を付けて報告せよ"
      binary_checks:
        - check: 改善点を3つ以上特定したか
          result: FILL_YES_OR_NO
        - check: 各改善点にimpact評価を付けたか
          result: FILL_YES_OR_NO
    - id: AC2
      description: "最もインパクトの高い改善点1件を実装し、git commitせよ。コミットメッセージにcmd_training_L4_r14_kotaroを含めること"
      binary_checks:
        - check: 実装をcommitしたか
          result: FILL_YES_OR_NO
        - check: コミットメッセージにcmd IDを含めたか
          result: FILL_YES_OR_NO
    - id: AC3
      description: "lesson_candidate found=trueで教訓を1つ記入し、全ACのbinary_checksを記入し、verdictをPASS/FAILで記入せよ"
      binary_checks:
        - check: lesson_candidate found=trueで記入したか
          result: FILL_YES_OR_NO
        - check: 全ACのbinary_checksを記入したか
          result: FILL_YES_OR_NO
        - check: verdictをPASS/FAILで記入したか
          result: FILL_YES_OR_NO
  stop_for:
    - 本番DB操作エラー
  never_stop_for:
    - gate BLOCK(自力修正してリトライ)
    - テストエラー
