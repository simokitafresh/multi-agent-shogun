task:
  task_id: cmd_training_L4_R15_kotaro
  parent_cmd: cmd_training_L4_R15
  task_type: impl
  project: infra
  status: assigned
  target_path: tests/unit/test_deploy_task_ac_version.bats
  command: |
    テスト速度改善チャンク4: グループC(レポート4本)用ヘルパーinject_report_only作成。
    レポートテンプレート生成に必要な関数だけ抽出。-2s見込み。
    AC1: グループCテスト特定+計測  AC2: ヘルパー作成+commit  AC3: PASS+LC+BC+verdict
    ★ bc構造維持。bats全量禁止。一部改善で十分。長引くなら途中commitで終了。
  acceptance_criteria:
