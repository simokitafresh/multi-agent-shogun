    現状: L1498-1530で月初リバランス判定後、L1526-1528でvectorized_pipeline_signalsからO(1) lookup。

    ALM PFは月初に「過去IS窓のmonthly_returnsで候補評価→最良lookback選出→そのlookbackのシグナルを使用」が必要。

    - 日次ループ内のどの位置にALM選出ロジックを挿入するか（行番号）

    - vectorized_pipeline_signalsのdict構造をどう拡張するか

    - 月初判定(month_changed && is_reb_month)との連携方法


    【課題3: fullrecalculate時の鶏と卵問題】

    現状: Phase 4で全日のシグナルを生成→Phase 4.5で全monthly_returnsを一括生成。

    ALMは過去のmonthly_returnsが必要だが、fullrecalculate時にはまだ存在しない。

