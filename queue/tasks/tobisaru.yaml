task:
  ac_checkpoint: '各AC完了後に checkpoint: 次ACの前提条件確認 → scope drift検出 → progress更新'
  ac_priority: AC1 > AC2 > AC3
  acceptance_criteria:
  - checks:
    - check: before_ms bash -n baseline is read from script_speed_training_ledger as syntax-only reference
    - check: before_real_ms is measured with a safe runtime command chosen for this script (time bash script.sh <args>, --help, dry-run, or sandboxed equivalent)
    id: AC1
  - checks:
    - check: implementation improves runtime without reducing behavior or safety
    - check: script-specific verification passes with SKIP=0
    id: AC2
  - checks:
    - check: after_real_ms is measured with the same command as before_real_ms
    - check: after_real_ms is strictly lower than before_real_ms
    - check: real_measurement_command/test_result/commit are written back to script_speed_training_ledger
    id: AC3
  engineering_preferences:
  - prefer 指揮系統 + inbox_write/report YAML経路 over 直接割込み。通信は仕組みで残せ
  - prefer queue/ YAMLなど一次データ over dashboard要約や推測状態。二次データは必ず照合せよ
  - prefer 正本編集 + build_instructions.sh再生成 over generatedファイル直編集
  - prefer flock/atomic helper（inbox_mark_read.sh, yaml_field_set等）over 共有運用ファイルの手編集
  - prefer safe defaults / non-destructive ops over 強制reset・広域cleanup・履歴改変
  - prefer gateと状態遷移で強制する運用 over 口約束や人間依存の手順
  - prefer 実テスト実行+結果確認 over 推論だけでbinary_checksを記入。体験は抽象を校正する
  never_stop_for:
  - CDPポート未応答 — preflight_cdp_flowが自動起動する。まず実行せよ
  - 既存インフラの自動対処機能があるエラー — まず実行→失敗なら報告
  - 自明な修正（typo等） — 実行→事後報告
  - 9p stall/hang疑い — まず独立検証（別ペイン/短いコマンド）で環境起因か切り分けよ
  parallel_ok:
  - AC1
  - AC2
  - AC3
