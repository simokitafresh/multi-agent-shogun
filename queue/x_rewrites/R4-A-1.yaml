original_llm: |
    「S&P500に毎月積立、淡々と続けるだけ」。正しい。低コストで市場平均をそのまま受け取れる。

    ただ同じ市場平均を同じ比率で受け取り続ける限り、元本の比率は縮まらない。1千万と1億の差は30年後も10倍のまま。

    リターンだけで追いつくなら市場平均を上回るしかない。その代償を何で払うか、が本題なんよ。
human_rewrite: |
    「S&P500に毎月積立、淡々と続けるだけ」。まあ正しいよね。

    ただ平均を狙っても、格差は縮まらない。1千万と1億の差は30年後は拡大する。勝ち組だけが勝つのが平均狙い。

    追いつくなら市場平均を上回るしかない。そういうハナシ。
delta_notes: |
    - 「正しい。低コストで〜」の説明文を「まあ正しいよね。」の相槌 1 文へ
    - 数学の言い換え(同じ比率で受け取り続ける限り)を捨て、結論『格差は縮まらない』へ直行。『10倍のまま』→『拡大する』(元本差の絶対額は拡大=正しい)
    - 『勝ち組だけが勝つのが平均狙い』=短い断定の一句を追加(対句ではなく皮肉)
    - 締め『〜が本題なんよ』→『そういうハナシ。』(片仮名で軽く落とす)
