original_llm: |
    僕が投資システムを信用するまで 2/9
    
    「年率90%のバックテストです」。すごいね。で、それはどの期間の話？
    
    パラメータを決めた期間(IS)の成績なら見ない。見るのはその外側、OOS。決めた後に来た相場で同じ成績が残るか。
    
    ISで輝いてOOSで消える。そればっかり。消えたらそれはそれでハッピーなんよ。次を探せる。
