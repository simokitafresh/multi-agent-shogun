    僕が投資システムを信用するまで 9/9
    
    「採用した戦略はこれです」。で、落とした戦略はどこ？
    
    僕が見たいのは不採用の山のほう。何本試して、何本捨てて、なぜ捨てたか。
    
    捨てた理由が言えない人は、次に壊れた時も言えない。
    
    だめだった実験を隠さない人しか信用しないんよ。
