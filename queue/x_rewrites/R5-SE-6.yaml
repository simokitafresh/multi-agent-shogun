original_llm: |
    僕が投資システムを信用するまで 6/9
    
    「月末に判定して月初に買う」。その執行日、ずらしたら？
    
    月末だけよくて、数日ずらすと崩れるなら、トレンドじゃなくカレンダーの癖を拾ってるだけ。
    
    だから執行日を全部ずらして並べる。どこで切っても似た形なら信用していい。
    
    崩れたらオシマイ。それはそれでスッキリするんよ。
