original_llm: |
    「年率90%のバックテストです」と言われたら、驚く前に市場の追い風を引く。

    リターンを市場に回帰してβを出して、βの分を引く。残ったのがα。

    追い風を引いてもαが残るか。これが第一関門で、関門はあと4つある。
human_rewrite: |
    「年率90%のバックテストです」と言われたら？
    驚いたり疑ったり喜んだりする前にやることがある。

    β調整後リターンをWFで分析しろ。

    それでもαが残るか。
    これでふるい落とされるような投資戦略はもろい。
