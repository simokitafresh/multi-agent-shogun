      q8_why_what: "WHY: LP は別オリジンなので CORS 無しでは帯の client fetch と event POST が失敗する / WHAT: origins に dm-signal.com 系 2 件+env LP_ORIGINS、step に lp_view と lp_cta_click と lang、無関係オリジン許可 0、既存 7 step 不変、選択実行 FAIL 0 SKIP 0 / WHEN: 今セッション、4417/4418 と並走 / WHERE: /mnt/c/Python_app/DM-signal/backend / WHO: 忍者 1 名(idle) / HOW: origins 追加+Literal 追加+contract test / 複利: env でドメイン追加できる型を 1 度作れば app のドメイン移行時も 1 行で済む=正の複利"
