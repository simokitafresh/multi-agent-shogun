commands:
  cmd_4451:
    title: "単一 publisher U3: publisher daemon(scripts/publisher.sh)を dry-run 既定で実装。dequeue→lock-run --bound 600→fetch→isolated tree@tip→C2a 検査→apply→commit-tree(trailer Published-By: publisher)→dry-run は log のみ→root ff 同期。rc=210 requeue と D15 counter、daemon_watchdog 監視 1 関数"
    status: delegated
    project: infra
    purpose: "殿裁定 2026-09-02 20:44『捨てる壁に時間をかけるのは原理原則に反していないか』→設計書 §14.4: 第 2 波は U3 を dry-run で先頭に前倒す。U3 が origin へ publish し始めた時点で ancestry WAIT・push lane・GA-PUSH1 の壁(今日の hotfix 15 本の主対象=§10 で捨てる file)が主線から消える。§3 の U5→U3 順は『U5 admit が無い間は enqueue 側で migration_ack を要求しない dry-run』で代替。U1(cmd_4445 publisher_queue+lock_run_shim+publisher_event)は origin 到達済みで、本 unit はその上に載る"
    scope_mode: FULL
    target_path: scripts
    acceptance_criteria:
      AC1:
        description: "scripts/publisher.sh を新規作成し、PUBLISHER_MODE=dry-run(既定)|active で loop{publisher_queue.sh dequeue→lock-run --bound 600{timeout 120 git fetch origin→$STATE_DIR 配下の isolated tree を origin/main tip で作成→C2a(全 paths で git rev-parse tip:<path> == manifest の base blob、不一致は request を rc/ へ移動+scripts/lib/publisher_event.sh append c2a_rc+家老 inbox 1 通)→publish_artifact.sh restore で patch 適用→git commit-tree(親 1、trailer Published-By: publisher)→dry-run は events.jsonl に kind=dry_run_publish 1 行のみ(origin 更新 0)/active は §9.1 U3 行の origin 送出経路(timeout 120 秒)→root で git merge --ff-only origin/main(§9.1 U3 の同期条件: tracked porcelain 0 ∧ untracked と差分 path の交差 0。非 0 なら同期せず家老 inbox 1 通)}}。lock-run rc=210 は isolated tree 破棄+request を queue 先頭へ戻し request の publish_attempts を yaml_field_set で +1(D15 state table: 0→1→2→3 requeue、4 で kind=retry_exhausted+家老 inbox 1 通で停止)。rc=124 等の固有失敗は rc/ へ(requeue しない)。root 配下に queue/artifacts/tree を作った時点で FAIL(§9.0)。選択実行 bash scripts/run_tests.sh file tests/unit/test_publisher.bats で FAIL 0・SKIP 0。中断再開時の成果物引継ぎ: 未 commit の worktree 差分と最終 bats 出力 log を報告 YAML の progress に path で残し、再開者はそこから継続する"
        binary_check: "dry-run fixture で events.jsonl に dry_run_publish 1 行 ∧ origin 更新 0 ∧ isolated tree が $STATE_DIR 配下 ∧ C2a 不一致 fixture で rc/ 1 件+c2a_rc 1 行+家老 inbox 1 通 ∧ rc=210 fixture で publish_attempts 0→1 と queue 先頭復帰 ∧ 4 回目で retry_exhausted 1 行 ∧ root ff 同期条件(tracked 差分あり)で同期 0+inbox 1 通 ∧ 選択実行 FAIL 0 ∧ SKIP 0 ∧ 新規 test に非空 test_necessity か?"
      AC2:
        description: "scripts/daemon_watchdog.sh に既存の ninja_monitor 監視関数と同型の watchdog_publisher_healthy 1 関数を追加(publisher.sh の pid file と events.jsonl の最終 ts で生死判定、死亡時は再起動せず家老 inbox 1 通=意志依存でなく通知)。tests/unit/test_publisher.bats に生死判定 fixture 1 本。変更 file は scripts/publisher.sh(新規)・tests/unit/test_publisher.bats(新規)・scripts/daemon_watchdog.sh(1 関数追加)の 3 つのみ。git diff -U0 -- scripts/daemon_watchdog.sh の hunk が 1 関数の追加のみで既存関数への差分 0"
        binary_check: "daemon_watchdog.sh の diff hunk が watchdog_publisher_healthy 追加のみ ∧ 生死 fixture で healthy/dead の 2 値が出る ∧ dead 時に inbox 1 通・再起動 0 ∧ 変更 file が上記 3 つのみ か?"
    command: |
      1. 設計書 §9.0 共通則と §9.1 U3 行・§6 D14 D15・§2.3 C2a・§13 H9 を読み、origin/main を base に scripts/publisher.sh と tests/unit/test_publisher.bats を作り、選択実行 bash scripts/run_tests.sh file tests/unit/test_publisher.bats で FAIL 0・SKIP 0 を確認する。
      2. scripts/daemon_watchdog.sh に watchdog_publisher_healthy を 1 関数追加して同 bats に生死 fixture を足し、bash scripts/ninja_scope_commit.sh -m "<msg>" -- scripts/publisher.sh tests/unit/test_publisher.bats scripts/daemon_watchdog.sh で commit し、報告 YAML に source_sha と実行 log path を書く。
    assumptions:
      claim: "U1 の scripts/publisher_queue.sh(enqueue/dequeue/peek/lock-run の 4 subcommand)・scripts/lib/lock_run_shim.sh・scripts/lib/publisher_event.sh は commit 0e8d1b6d9 で origin/main に到達済み(git merge-base --is-ancestor 0e8d1b6d9 origin/main = yes、2026-09-02 20:50)。U2 の scripts/publish_artifact.sh restore は cmd_4449 が『manifest 未申告 path を適用する』欠陥を検出しており修正 lane 待ちだが、本 unit は restore を呼ぶだけで restore の内部は触らない(修正は U2 lane)。scripts/publisher.sh は未存在(ls → no、設計書内の参照 4)"
      source: "docs/research/single_publisher_asis_tobe_5w1h_20260902.md §9.0 §9.1 U3 §6 D14 D15 §2.3 C2a §13 H9 §14.4、git show 0e8d1b6d9:scripts/publisher_queue.sh(case 分岐 enqueue/dequeue/peek/lock-run L161-164)、scripts/daemon_watchdog.sh(watchdog_*_healthy 関数 1 本を型として参照)"
      trust: verified
    depends_on: cmd_4445
    timeout_minutes: 60
    estimated_minutes: 45
    execution_env:
      runtime_constraints: "bats は $BATS_TEST_TMPDIR の bare remote と SHOGUN_STATE_DIR を指す一時 dir で完結(実 origin へ push 0、root 配下に queue/tree を作らない)。daemon は fixture 内で 1 loop だけ回す"
      long_runtime_reason: "AC1(daemon loop+C2a+rc210 requeue+D15 counter+root 同期条件)と AC2(watchdog 1 関数)は同じ publisher.sh の状態機械を共有し、分割すると requeue と同期の境界で fixture が二重になる。同型の U1(cmd_4445: queue+shim+events の 3 script)は配備 14:44:58→報告 15:33 の実測 2880s"
      measured_runtime_sec: 2880
    split_decision:
      boundary_ac_ids: [AC1, AC2]
      integration_tasks: 1
    serial_dependency_evidence: "AC2 の watchdog 関数は AC1 が書く pid file と events.jsonl の最終 ts を読む(AC1 の出力が AC2 の入力)。AC1 内の requeue/同期/C2a は同一 lock-run ブロックの分岐で、別忍者に分けると lock の所有が分裂する(§9.0『直列化は flock だけ』)"
    quality_gate:
      q1_firefighting: "品質向上。理由: 単一 publisher の本体。dry-run で origin を触らずに queue→commit-tree→root 同期の全経路を bats で固め、active 切替は別 cmd(canary D9)にする"
      q2_learning: "奪わない。理由: 忍者は設計書 §9.1 U3 行の契約から実装と fixture を組む。判断は C2a/D15/同期条件の 3 点で、全て設計書に二値で書いてある"
      q3_next_quality: "上がる。理由: U3 が動けば U7(runtime push の flag 下流化)と U8(§10 削除)へ進め、今日の壁(ancestry WAIT/push lane/GA-PUSH1)が構造的に消える"
      q4_depth: "deep — 理由: daemon・lock・retry counter・root 同期条件の 4 契約を 1 unit で実装する。fixture は 7 本以上"
      q5_verified_source: "structure_verified — 対象を実行して確認(2026-09-02 20:50): git merge-base --is-ancestor 0e8d1b6d9 origin/main → yes、git show 0e8d1b6d9:scripts/publisher_queue.sh | grep -nE 'enqueue\\)|dequeue\\)|peek\\)|lock-run\\)' → L161-164 の 4 分岐、ls scripts/publisher.sh → no、rg -c 'watchdog_.*_healthy\\(\\)' scripts/daemon_watchdog.sh → 1(型あり)"
      q6_not_hiding: "隠していない。理由: dry-run 既定で push 0 を bats で固定。active は本 cmd の対象外(別 cmd で canary)。restore の既知欠陥は U2 lane の責務として明記"
      q7_definition_verified: "publisher daemon・C2a・D14・D15・root 同期条件の定義は設計書 v3.7 §9.1 U3 行と §6 で確認(確認日: 2026-09-02、家老 APPROVE v3.5 blt_143800 の骨格)"
      q8_why_what: "WHY: 殿 20:44『捨てる壁に時間をかけるな』→捨てる壁を消す本体(U3)を前倒す / WHAT: scripts/publisher.sh dry-run+test_publisher.bats+daemon_watchdog 1 関数 / WHEN: cmd_4445 CLEAR 後(U1 API 到達済み) / WHERE: scripts, tests/unit / WHO: 家老配備(Claude または Codex 1 名、検証は他 CLI の別 cmd) / HOW: §9.1 U3 行の 6 欄を契約に / 複利: U7/U8 が着手可能になり旧経路の hotfix が不要になる"
      q9_firefighting_root_cause: "根本対応。理由: 今日の 15 本の hotfix は §10 で捨てる file への対症。U3 を先に立てるのが唯一の根治"
      q10_knowledge_boundary: "検証済み: U1 API 到達、publisher_queue の subcommand、watchdog の型。スコープ外: active 切替と canary(D9、別 cmd)、U3b deploy check(別 cmd)、restore 欠陥の修正(U2 lane)"
      q11_not_already_done: "既存代替の現物確認(2026-09-02 20:50): ls scripts/publisher.sh → 存在しない。rg -c 'publisher.sh' scripts/ docs/research/single_publisher_asis_tobe_5w1h_20260902.md → 4(全て設計書内の参照、実装 0)。rg -c 'cmd_4451' queue/shogun_to_karo.yaml → 0(起票前)。旧経路 scripts/ninja_monitor.sh の check_push_lane は §10 M2 で削除対象であり代替にならない"
      q_ambiguity: "曖昧さ: U5 admit が無い間の enqueue 側の扱い。解消: 本 cmd は dry-run で admit を呼ばず、U5(cmd_4453)が enqueue 前に admit を挿す。root 同期の所有者解決は §9.1 U3 行の (1)-(3) をそのまま実装"
      q12_lord_30min_cost: "no — 殿裁定 20:44 で確定、判定は bats"
      diagnosis: "BLOCK理由: 該当なし(新規起票) / 対策: 新規 file 2(publisher.sh・test_publisher.bats)+既存 1 関数追加。depends_on=cmd_4445 は実依存(U1 API の origin 到達)であり起票ゲート回避の流用ではない(LS-A04(47))"
    environment_change: "type=lesson; file=projects/infra/lessons_shogun.yaml; pattern=cmdテンプレートルール"
    delegated_at: "\"2026-09-02T21:29:20\""
    origin: "[[殿裁定_捨てる壁凍結_20260902_2044]] -> [[設計書§14.4_U3前倒し]] -> [[cmd_4451_U3_dryrun]]"
  cmd_4453:
    title: "単一 publisher U5: scripts/publisher_admit.sh(承認 2 file の存在で admit、doc kind は将軍 identity+path allowlist、R13 db_migration は migration_ack 必須)と review_approval.sh karo ACCEPT --migration-ack(唯一の enqueue caller・唯一の ack writer)"
    status: delegated
    project: infra
    purpose: "殿裁定 2026-09-02 20:44(§14.4: U5 は U3 dry-run と並走)。設計書 §9.1 U5・§4 R13(backend/app/db/ 配下の変更は逆 migration の path か irreversible_accepted の ack が無ければ admit しない)・観点 22/26(ACCEPT が enqueue の唯一の caller、karo.yaml の migration_ack は review_approval.sh だけが書く)。U3 dry-run は admit 無しで動くため、U5 完了時に enqueue 前へ admit を 1 行挿す"
    scope_mode: FULL
    target_path: scripts
    acceptance_criteria:
      AC1:
        description: "scripts/publisher_admit.sh admit <request.yaml> を新規作成: review_approvals/reports/<key>/{gunshi,karo}.yaml の両方存在で rc=0、不足なら rc=5+不足名を stderr。kind=doc(将軍投入)は将軍 identity+path allowlist(docs/ context/ queue/shogun_todo_map.md)で rc=0、allowlist 外 path 混入は rc=6。R13: request の paths に backend/app/db/ 配下が 1 つでもあれば request に db_migration: true を yaml_field_set で書き、karo.yaml に migration_ack: が無ければ rc=11+scripts/lib/publisher_event.sh append r13_reject+家老 inbox 1 通。承認 file を自分で作らない。scripts/publisher_queue.sh の enqueue 前に admit 呼出しを 1 行挿す(rc≠0 なら enqueue しない)。選択実行 bash scripts/run_tests.sh file tests/unit/test_publisher_admit.bats で FAIL 0・SKIP 0。中断再開時の成果物引継ぎ: 未 commit の worktree 差分と最終 bats 出力 log を報告 YAML の progress に path で残し、再開者はそこから継続する"
        binary_check: "未承認 N 件で admitted 0 ∧ 承認 N 件で admitted N ∧ doc allowlist 外 admitted 0(rc=6) ∧ db_migration=true∧ack 無しで admitted 0 かつ events に r13_reject 1 行+家老 inbox 1 通 ∧ publisher_queue.sh の diff が enqueue 前 1 行の追加のみ ∧ 選択実行 FAIL 0 ∧ SKIP 0 ∧ 新規 test に非空 test_necessity か?"
      AC2:
        description: "scripts/review_approval.sh の karo:ACCEPT 分岐の末尾で scripts/publisher_queue.sh enqueue <request> を呼ぶ 1 行を追加(=ACCEPT が enqueue の唯一の caller)、および karo ACCEPT <report> --migration-ack <逆 migration path|irreversible_accepted> option を追加して review_approvals/reports/<key>/karo.yaml に migration_ack: を書く(唯一の writer)。option 無し ACCEPT は migration_ack を書かない。tests/unit/test_publisher_admit.bats に『ack 有りで admitted 1』『option 無し ACCEPT は ack を書かない』を含め @test 8 本。変更 file は scripts/publisher_admit.sh(新規)・tests/unit/test_publisher_admit.bats(新規)・scripts/publisher_queue.sh(1 行)・scripts/review_approval.sh(ACCEPT 分岐+option)の 4 つのみ"
        binary_check: "--migration-ack で書いた ack 有りで admitted 1 ∧ option 無し ACCEPT で karo.yaml に migration_ack 0 ∧ rg -c 'publisher_queue.sh enqueue' scripts/ の caller が review_approval.sh の 1 箇所のみ ∧ @test 8 本以上 ∧ 変更 file が上記 4 つのみ か?"
    command: |
      1. 設計書 §9.0 共通則と §9.1 U5 行・§4 R13・§5 観点 22/26 を読み、origin/main を base に scripts/publisher_admit.sh と tests/unit/test_publisher_admit.bats を作り、publisher_queue.sh の enqueue 前に admit を 1 行挿して、選択実行 bash scripts/run_tests.sh file tests/unit/test_publisher_admit.bats で FAIL 0・SKIP 0 を確認する。
      2. scripts/review_approval.sh の karo:ACCEPT 分岐に enqueue 呼出し 1 行と --migration-ack option を追加し、同 bats に ack 2 fixture を足して再実行し、bash scripts/ninja_scope_commit.sh -m "<msg>" -- scripts/publisher_admit.sh tests/unit/test_publisher_admit.bats scripts/publisher_queue.sh scripts/review_approval.sh で commit し、報告 YAML に source_sha と実行 log path を書く。
    assumptions:
      claim: "scripts/review_approval.sh に karo ACCEPT 分岐が存在(rg -c 'ACCEPT' → 18、2026-09-02 20:50)。scripts/publisher_queue.sh の enqueue は case 分岐 L161(git show 0e8d1b6d9)。scripts/publisher_admit.sh は未存在(ls → no)。review_approvals/reports/<key>/{gunshi,karo}.yaml の配置は本日の cmd_4445/4447 の gate で実在(queue/gates/cmd_4445/review_approvals/reports/)"
      source: "docs/research/single_publisher_asis_tobe_5w1h_20260902.md §9.0 §9.1 U5 §4 R13 §5 観点 22/26 §14.4、scripts/review_approval.sh、git show 0e8d1b6d9:scripts/publisher_queue.sh、queue/gates/cmd_4445/review_approvals/"
      trust: verified
    depends_on: cmd_4445
    timeout_minutes: 45
    estimated_minutes: 35
    execution_env:
      runtime_constraints: "bats は一時 SHOGUN_STATE_DIR と一時 review_approvals dir で完結(本番 queue/gates を触らない)。review_approval.sh の fixture は --dry-run 相当の一時 report path を使い本番 report を書かない"
      long_runtime_reason: "AC1(admit の rc 表 0/5/6/11+enqueue 前 1 行)と AC2(review_approval の ACCEPT 分岐+--migration-ack writer)は『ACCEPT が enqueue の唯一の caller』『karo.yaml の ack は review_approval だけが書く』という 2 つの唯一性を同時に満たす必要があり、片方だけ先に入れると唯一性の bats が書けない。同型の U1 実測 2880s の約 7 割"
      measured_runtime_sec: 2100
    split_decision:
      boundary_ac_ids: [AC1, AC2]
      integration_tasks: 1
    serial_dependency_evidence: "AC2 の『ack 有りで admitted 1』fixture は AC1 の admit と AC2 の writer の両方を呼ぶ(観点 22/26 の唯一性は 2 file を同時に見ないと検証できない)。別忍者に分けると caller/writer の唯一性が commit 境界で一時的に破れる"
    quality_gate:
      q1_firefighting: "品質向上。理由: 承認無し publish を構造で不可能にし、DB migration(R13)の逆 migration を ack で強制する。時間依存・意志依存のどちらも作らない(§13 H9)"
      q2_learning: "奪わない。理由: 忍者は §9.1 U5 行の rc 表(0/5/6/11)を fixture にする。判断点は allowlist の 3 path のみで設計書に固定"
      q3_next_quality: "上がる。理由: U5 が入ると U3 を active に切り替える前提(承認→enqueue→publish の一本道)が揃う"
      q4_depth: "medium — 理由: rc 4 種と ack writer の 2 契約。fixture 8 本"
      q5_verified_source: "structure_verified — 対象を実行して確認(2026-09-02 20:50): rg -c 'ACCEPT' scripts/review_approval.sh → 18、git show 0e8d1b6d9:scripts/publisher_queue.sh | grep -n 'enqueue)' → L161、ls scripts/publisher_admit.sh → no、ls queue/gates/cmd_4445/review_approvals/ → reports/"
      q6_not_hiding: "隠していない。理由: 承認 file を admit が自分で作らない禁止を AC に明記。ack の writer を review_approval.sh の 1 箇所に限定し rg で証明"
      q7_definition_verified: "admit・R13・migration_ack・唯一の caller の定義は設計書 v3.7 §9.1 U5 行・§4 R13・§5 観点 22/26 で確認(確認日: 2026-09-02)"
      q8_why_what: "WHY: 殿 20:44→U3 と並走で第 2 波を今夜起票 / WHAT: publisher_admit.sh+bats 8 本+publisher_queue 1 行+review_approval ACCEPT 分岐 / WHEN: cmd_4445 CLEAR 後 / WHERE: scripts, tests/unit / WHO: 家老配備(U3/U1b と別の忍者) / HOW: §9.1 U5 行の 6 欄 / 複利: U3 active 切替(canary)の前提が揃う"
      q9_firefighting_root_cause: "根本対応。理由: 承認と publish の結合を構造(唯一の caller)で作り、意志依存を排除する"
      q10_knowledge_boundary: "検証済み: review_approval の ACCEPT 分岐、publisher_queue の enqueue 分岐、approvals 配置。スコープ外: U3 active 切替、doc kind の将軍側投入 script(U1b/U7)"
      q11_not_already_done: "既存代替の現物確認(2026-09-02 20:50): ls scripts/publisher_admit.sh → 存在しない。rg -c 'publisher_admit' scripts/ docs/research/single_publisher_asis_tobe_5w1h_20260902.md → 1(設計書内参照のみ)。rg -c 'migration_ack' scripts/ → 0(writer 未実装)。rg -c 'cmd_4453' queue/shogun_to_karo.yaml → 0(起票前)"
      q_ambiguity: "曖昧さ: doc kind の将軍 identity の判定方法。解消: request の from フィールド== shogun ∧ paths が allowlist 内、で判定(§9.1 U5 行)。他の identity 機構は作らない"
      q12_lord_30min_cost: "no — 殿裁定で確定、判定は bats"
      diagnosis: "BLOCK理由: 該当なし(新規起票) / 対策: 新規 file 2+既存 2 file へ各 1 箇所。depends_on=cmd_4445 は実依存(enqueue API の origin 到達)であり起票ゲート回避の流用ではない(LS-A04(47))"
    environment_change: "type=lesson; file=projects/infra/lessons_shogun.yaml; pattern=cmdテンプレートルール"
    delegated_at: "\"2026-09-02T21:33:02\""
    origin: "[[殿裁定_捨てる壁凍結_20260902_2044]] -> [[設計書§14.4_第2波並走]] -> [[cmd_4453_U5_admit]]"
  cmd_4454:
    title: "単一 publisher U6: 台帳 writer scripts/ledger_writer.sh(append/update/resolve op を $STATE_DIR/ledger_inbox へ、可変 field allowlist と CAS)と insight/bulletin/lesson/workaround 4 writer の op 経路への付替え"
