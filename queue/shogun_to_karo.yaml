        binary_check: "M1 関数定義 0(rg -c '^source_only_' scripts/cmd_complete_gate.sh → 0)∧ .gitattributes の merge rule 5 本 0 ∧ M7 の 4 検査が publisher receipt 経路のみ ∧ 残存参照 0 または blocked ∧ 選択実行 FAIL 0 ∧ SKIP 0 ∧ commit 1 ∧ wc -l scripts/cmd_complete_gate.sh が減少 か?"
