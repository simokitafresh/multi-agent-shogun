      q3_next_quality: 上がる。ledgerの正がバンドなしに揃い、以後の確定月不変保証と全PF突合が安定する
      q4_depth: medium — cmd_3817の前例手順のバンドなし版適用+棚卸し
      q5_verified_source: production_verified — Renderログ実物でDRIFT BLOCK大量発火(全て月初日付)を確認、DBでthreshold_band残存ゼロ+recalc
        id=206 runningを直接照会、再構築スクリプトの実在をlsで確認(2026-07-10 13:11-13:15)
      q6_not_hiding: 何も隠していない。ledger機構は設計どおり動作しており、凍結基準の古さが問題であることを明記
