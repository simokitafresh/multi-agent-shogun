commands:
  cmd_4469:
    title: "単一 publisher U10: watchdog による publisher daemon の code-reload(旧 daemon 入替)と §11 after 計測 script、24 時間クローズ検証(trailer 率・root 3 値・自壊 0)の集計 script を実装し、設計書 §15 のクローズ条件を機械判定にする"
    status: delegated
    project: infra
    purpose: "殿 2026-09-03 09:16『追加 4 点を起票してクローズまで持っていけ』。設計書 §15: 稼働 daemon(pid 2581118、05:46 起動)は旧コードで stop flag/ledger 消費/root drain を持たず、家老と将軍が手動で 1 周ずつ回している。D006 により agent は kill せず、F009 により殿にも依頼しない=入替は infra(watchdog)の役目として構造化する。§11 after 計測は before snapshot(単一 publisher before snapshot 20260902、SHA256SUMS 付き)と同窓で未実施。クローズ条件 5 点(§15)は手集計のため、script 1 本で二値化して家老が周期で回せるようにする"
    scope_mode: FULL
    target_path: scripts
    acceptance_criteria:
      AC1:
        description: "scripts/daemon_watchdog.sh に publisher code-reload を追加: 稼働 daemon の起動時刻(pid の起動 epoch)より scripts/publisher.sh・scripts/lib/publisher_*.sh・scripts/ledger_writer.sh のいずれかの mtime(または git blob)が新しければ (1) $STATE_DIR/publish_queue/publisher.stop を置く (2) 猶予 PUBLISHER_RELOAD_GRACE_SEC(既定 120)待つ (3) まだ pid が生きていれば watchdog が supervisor として SIGTERM→5 秒後 SIGKILL(watchdog は infra であり D006 の agent 手動 kill には当たらない。event に kind=reload を記録) (4) 既存の自動再起動(c3fdc90aa)で新コード起動+ntfy。契約 bats tests/unit/test_daemon_watchdog.bats に『fixture daemon の script を更新→stop flag→再起動され pid が変わる』@test 1 と『script 不変なら reload しない』@test 1(test_necessity 非空)。選択実行コマンド=bash scripts/run_tests.sh file tests/unit/test_daemon_watchdog.bats で FAIL 0・SKIP 0。中断再開時の成果物引継ぎ: 未 commit の worktree 差分と最終 bats 出力 log を報告 YAML の progress に path で残し、再開者はそこから継続する"
        binary_check: "fixture で script 更新→reload event 1・新 pid ≠ 旧 pid ∧ 不変なら reload 0 ∧ 選択実行 FAIL 0 ∧ SKIP 0 か?"
      AC2:
        description: "scripts/single_publisher_close_check.sh を新規作成: 引数=入替時刻(ISO)、出力=§15 の 5 条件を二値で 1 行ずつ+総合 PASS/FAIL。(1) trailer 率=git log --since=<入替時刻> --format=%B origin/main の Published-By 行数 と git rev-list --count --since=<入替時刻> origin/main の一致 (2) root=git status --porcelain -uno の行数 0 かつ origin/main..HEAD と HEAD..origin/main が 0 (3) 自壊 0=watchdog log の publisher 自動再起動行が入替時刻以降 0(reload による再起動は除外) (4) §11 after=scripts/single_publisher_after_snapshot.sh(新規、before と同じ抽出=push_lane/pre_push の log 窓・merges・commits・bats_files を $HOME/.local/share/multi-agent-shogun/single_publisher_after_snapshot_<date>/ に SHA256SUMS 付きで保存し、before との件数差を表で stdout)の snapshot 存在 (5) root 直 push 呼出し 0=rg で scripts/ から『git push』の実行行が publisher.sh/publish_direct_commit.sh/publisher_root_drain.sh 以外に 0。契約 bats tests/unit/test_single_publisher_close_check.bats: fixture repo で 5 条件 PASS/FAIL の各 1 @test 以上(計 6 本以上、test_necessity 非空)。選択実行=bash scripts/run_tests.sh file tests/unit/test_single_publisher_close_check.bats で FAIL 0・SKIP 0。bash scripts/ninja_scope_commit.sh -m \"<msg>\" -- scripts/daemon_watchdog.sh scripts/single_publisher_close_check.sh scripts/single_publisher_after_snapshot.sh tests/unit/test_daemon_watchdog.bats tests/unit/test_single_publisher_close_check.bats で 1 commit"
        binary_check: "close_check が 5 条件を各 1 行で出し総合判定 ∧ after_snapshot が SHA256SUMS 付き dir を作り before との差を表で出す ∧ bats 6 本以上 FAIL 0 ∧ SKIP 0 ∧ 変更 file 5 以内 か?"
    production_proof:
      owner: monitor
      description: "着地後、家老が watchdog の reload event(旧 pid 2581118→新 pid)と新 daemon の ledger 消費/root drain の自動稼働(手動 1 周なしで ledger_inbox 0・root ahead 0)を確認して掲示板 1 行。入替時刻から 24 時間後に bash scripts/single_publisher_close_check.sh <入替時刻> を実行し PASS なら将軍が設計書 §15 に『クローズド』を明記。忍者は待たない"
      binary_check: "reload event 1 ∧ 手動 1 周なしで ledger_inbox 0・root ahead 0 ∧ 24h 後 close_check 総合 PASS か?"
    command: |
      1. scripts/daemon_watchdog.sh(watchdog_publisher_healthy L344、自動再起動 L702)と scripts/publisher.sh の stop flag(L424)を読み、code-reload を足して fixture daemon で reload を確認、bats を選択実行して結果を報告 YAML に生貼付する。
      2. close_check と after_snapshot の 2 script と bats を書き、選択実行し、ninja_scope_commit で 1 commit する(本番の入替確認と 24h 判定は production_proof=家老)。
    assumptions:
      claim: "稼働 daemon pid 2581118 は 05:46:14 起動で旧コード(pgrep/ps lstart)。stop flag は c3fdc90aa で publisher.sh L424 に実装済(旧 daemon は認識しない)。watchdog の自動再起動は L702(PUBLISHER_MODE=active setsid nohup)。before snapshot=$HOME/.local/share/multi-agent-shogun/single_publisher_before_snapshot_20260902/(SHA256SUMS bats_files.txt commits.window.txt merges.window.txt pre_push.window.log push_lane.window.log、窓 09-01T13:25〜09-02T13:25)。§15 の集計 5 点は 09:15 に将軍が手で実行(trailer 67/101)"
      source: "ps -o lstart -p 2581118、grep -n publisher.stop scripts/publisher.sh、sed -n 344,360p と 702p scripts/daemon_watchdog.sh、ls before snapshot dir、docs/research/single_publisher_asis_tobe_5w1h_20260902.md §11 §15"
      trust: verified
    depends_on: none
    timeout_minutes: 90
    estimated_minutes: 60
    execution_env:
      runtime_constraints: "本番 daemon の kill は忍者が行わない(fixture daemon のみ)。本番の reload は着地後に watchdog が行う。before snapshot は読取りのみ。bats は選択実行のみ"
      long_runtime_reason: "watchdog の reload 分岐と fixture daemon の起動/更新/再起動 test、close_check 5 条件と after_snapshot の抽出 5 種、bats 8 本"
      measured_runtime_sec: 3600
    split_decision:
      boundary_ac_ids: [AC1, AC2]
      integration_tasks: 1
    serial_dependency_evidence: "AC2 の close_check 条件(3)は AC1 の reload event を『自壊』から除外する定義に依存するため同一忍者で AC1→AC2 の順に書く"
    quality_gate:
      q1_firefighting: "品質向上。理由: daemon 入替を『自壊待ち』や殿依頼(F009)から watchdog の責務へ構造化し、クローズ判定を手集計から script の二値へ"
      q2_learning: "奪わない。理由: 判断点は『reload=stop flag→猶予→supervisor が終了→再起動』の順序と『自壊と reload の区別』で AC に固定"
      q3_next_quality: "上がる。理由: 以後の publisher 変更は着地即反映、クローズ判定は家老が script 1 本で回せる"
      q4_depth: "deep — 理由: supervisor の reload 契約と 5 条件の機械化、before/after の同窓計測"
      q5_verified_source: "structure_verified — 対象を実行して確認(2026-09-03 09:25): ps -o lstart -p 2581118 → 05:46:14、grep -n publisher.stop scripts/publisher.sh → L424、grep -n 'PUBLISHER_MODE=active setsid' scripts/daemon_watchdog.sh → L702、ls before snapshot dir → 6 file、git log --since=04:37 trailer 67/101"
      q6_not_hiding: "隠していない。理由: reload は event に記録し自壊と区別、close_check は 5 条件を個別に出す(総合だけで隠さない)"
      q7_definition_verified: "クローズ条件 5 点と §11 の before 抽出定義は設計書 §11/§15 原文で確認。D006 は『agent が kill』を禁じ、watchdog(infra)の supervisor 動作は cli_profiles/reset_layout の respawn と同型(確認日: 2026-09-03)"
      q8_why_what: "WHY: 殿 09:16『クローズまで』、旧 daemon が新コードを実行せず手動運用が続く / WHAT: watchdog reload+close_check+after_snapshot / WHEN: 即(4468 と並走可、file 重複なし) / WHERE: scripts/daemon_watchdog.sh, scripts/single_publisher_*.sh, tests/unit / WHO: 家老配備(Codex 可) / HOW: reload 分岐→fixture→close_check→bats→1 commit→家老が本番 reload と 24h 判定 / 複利: 以後の daemon 更新と §15 判定が無人"
      q9_firefighting_root_cause: "根本対応。理由: 『次に自壊するまで待つ』を supervisor の reload に置換"
      q10_knowledge_boundary: "検証済み: daemon 状態・stop flag・watchdog 再起動・before snapshot。スコープ外: cmd_4468(root 直書き)、U8、24h の実運用判定(production_proof)"
      q11_not_already_done: "rg -c 'reload' scripts/daemon_watchdog.sh → 0(09:25)。ls scripts/single_publisher_close_check.sh scripts/single_publisher_after_snapshot.sh → 無し。rg -c cmd_4469 queue/shogun_to_karo.yaml → 0(起票前)"
      q_ambiguity: "曖昧さ: reload と自壊の区別。解消: reload は watchdog が event kind=reload を先に記録してから終了させる。event 無しの pid 死亡=自壊"
      q12_lord_30min_cost: "no — 殿 09:16 で確定、判定は event 数・pid 変化・bats・close_check の 5 行"
      diagnosis: "BLOCK理由: 該当なし(新規起票。4468 の BLOCK『観測窓を AC に置くな』を先取りして production_proof に分離) / 対策: 2 AC・5 file・production_proof=家老"
    environment_change: "type=lesson; file=projects/infra/lessons_shogun.yaml; pattern=cmdテンプレートルール"
    delegated_at: "\"2026-09-03T09:33:06\""
    origin: "[[single_publisher_§15_クローズ判定_20260903_0915]] -> [[旧daemon入替_D006とF009の板挟み]] -> [[cmd_4469_U10_watchdog_reload_close_check]]"
  cmd_4468:
    title: "単一 publisher U9: root 直書き・直 commit の生産者 4 経路(insights auto-commit / semantic_index_update / bulletin 系 / ninja_monitor の runtime integrate)を ledger route か U1b へ寄せ、root の tracked dirty と trailer 無し commit を 0 にする"
    status: delegated
    project: infra
    purpose: "殿 2026-09-03 09:16『追加 4 点を起票してクローズまで持っていけ』。設計書 §15(v3.19): flag ON 04:37 以降の origin 101 commit 中 Published-By trailer 67=66%(ToBe 100%)。trailer 無しの出所=insights auto-commit 7・runtime integrate 4・D012 merge 2・reflux 直 1。家老 09:13/09:19 実測: root 直書き生産者の残存=semantic_index_update(commit 直後に index.md を再追記)と bulletin 系(bulletin_write.sh:619 の archive trim が root で HEAD 66 vs worktree 30 の恒久乖離を作っていた→65f52c33a で ON 時 skip)、root の台帳 dirty が ledger batch と衝突して ff 不能(09:10 behind 1)。root が dirty を持たなければ ff は常に通り §15 の field-aware merge は不要になる=本 cmd で B(root sync)も同時に解ける"
    scope_mode: FULL
    target_path: scripts
    acceptance_criteria:
      AC1:
        description: "root 直書き生産者を ledger route へ: (a) scripts/insight_write.sh の auto-commit 経路(git commit が 2 箇所)を PUBLISHER_SINGLE ON 時は ledger_writer append のみ(root file を書かず commit も作らない)にする (b) scripts/semantic_index_update.sh の INS status 書換えと docs/semantic-index/index.md 再生成を ON 時は ledger op(kind=semantic_index、ledger_writer に apply を追加)へ (c) bulletin_write.sh は既に ledger route(06:50 以降)だが bulletin_confirm/bulletin_action/bulletin_archive の root board 直書きを ledger op(update/resolve)へ。3 経路とも OFF 時は従来どおり。ledger_writer.sh の apply に semantic_index 種別を追加(index.md は apply 時に再生成)。契約 bats: tests/unit/test_ledger_writer.bats に semantic_index/bulletin update の @test 各 1、tests/unit/test_insight_write.bats に『ON 時 root 不変・ledger_inbox に op』@test 1。選択実行コマンド=bash scripts/run_tests.sh file tests/unit/test_ledger_writer.bats tests/unit/test_insight_write.bats tests/unit/test_semantic_index_update.bats で FAIL 0・SKIP 0。中断再開時の成果物引継ぎ: 未 commit の worktree 差分と最終 bats 出力 log を報告 YAML の progress に path で残し、再開者はそこから継続する"
        binary_check: "flag ON fixture で insight_write/semantic_index_update/bulletin_confirm を実行後 git status --porcelain -uno が空 ∧ ledger_inbox に op 3 種 ∧ publisher --process-ledger 1 周で origin fixture に 3 種の変更が載る ∧ OFF fixture は従来の直書き ∧ 選択実行 FAIL 0 ∧ SKIP 0 か?"
      AC2:
        description: "scripts/ninja_monitor.sh の push_lane integrate(『runtime: integrate <ref> (push_lane auto)』merge commit を root に作る経路、L475 付近)を PUBLISHER_SINGLE ON 時は作らない(root は publisher の root drain/sync が ff するだけ)。root sync(scripts/publisher.sh sync_root と scripts/lib/publisher_root_drain.sh)は tracked dirty が 0 でないとき『dirty path 一覧』を event に記録して fail-close(現状維持)。ON fixture(一時 STATE_DIR+fixture repo)で integrate が commit を作らないことを bats で固定。契約 bats tests/unit/test_push_lane_integrate.bats に『ON 時 integrate commit 0』@test 1。選択実行=bash scripts/run_tests.sh file tests/unit/test_push_lane_integrate.bats tests/unit/test_publisher_root_drain.bats で FAIL 0・SKIP 0。bash scripts/ninja_scope_commit.sh -m \"<msg>\" -- <変更 path> で 1 commit(AC1 と合わせて 1〜2 commit)"
        binary_check: "ON fixture で integrate commit 0 ∧ OFF fixture で従来の integrate ∧ 選択実行 FAIL 0 ∧ SKIP 0 ∧ 変更 file が insight_write/semantic_index_update/bulletin 3 script/ledger_writer/ninja_monitor/bats 4 の 10 以内 か?"
    production_proof:
      owner: monitor
      description: "着地後の本番で 3 周期(各周期=publisher の request か ledger batch 1 回)連続で root の tracked dirty 0・ahead 0・behind 0 を家老が集計(git status --porcelain -uno の行数、git rev-list --count origin/main..HEAD、git rev-list --count HEAD..origin/main)し掲示板へ 1 行。忍者は待たない"
      binary_check: "本番 3 周期で dirty 0・ahead 0・behind 0(集計行 3 組)か?"
    command: |
      1. 4 経路の現物(rg -n で git commit と git push と ninja_scope_commit の呼出しを scripts/insight_write.sh scripts/semantic_index_update.sh scripts/bulletin_*.sh scripts/ninja_monitor.sh から列挙)を読み、AC1 の 3 経路を ledger route へ寄せ、ledger_writer に semantic_index apply を足し、fixture で ON/OFF 両方を実行して結果を報告 YAML に生貼付する。
      2. AC2 の integrate を ON 時に抑止し、bats を選択実行、ninja_scope_commit で commit する(本番 3 周期観測は production_proof=家老)。
    assumptions:
      claim: "rg -n で git commit と ninja_scope_commit と publish_direct_commit の呼出しを数えると insight_write.sh 2 箇所、ninja_monitor.sh 4 箇所(うち L475 が runtime: integrate)。semantic_index_update.sh と bulletin_*.sh は root file 直書き(commit は auto-commit 経路が拾う)。ledger_writer.sh は append/update/resolve と apply を持つ(cmd_4454/4465)。bulletin_write は 06:50 以降 ledger route、archive trim は 65f52c33a で ON 時 skip。家老実測 09:19: 残 dirty=docs/semantic-index/index.md(commit 直後に再追記)。origin 101 commit 中 trailer 67(09:15 将軍集計)"
      source: "rg 出力(09:16)、docs/research/single_publisher_asis_tobe_5w1h_20260902.md §15、家老掲示板 blt_20260903_091357/091751、git log --since=04:37 origin/main の trailer 集計"
      trust: verified
    depends_on: none
    timeout_minutes: 120
    estimated_minutes: 90
    execution_env:
      runtime_constraints: "本番 publisher daemon と queue/flags/publisher_single は触らない。fixture は一時 STATE_DIR。OFF 時の挙動は不変(可逆=flag OFF で戻る)。bats は選択実行のみ"
      long_runtime_reason: "4 script の経路特定と ON/OFF 分岐、ledger_writer の新 kind、bats 4 本、本番 3 周期の観測(周期は数分〜)"
      measured_runtime_sec: 5400
    split_decision:
      boundary_ac_ids: [AC1, AC2]
      integration_tasks: 1
    serial_dependency_evidence: "AC2 の本番 3 周期観測は AC1 の 3 経路が着地して root dirty が消えることを前提にする。別忍者では観測の前提が揃わない"
    quality_gate:
      q1_firefighting: "品質向上。理由: root 直書き生産者を 0 にして『root は publisher の ff 先』という設計(§2)を成立させる。field-aware merge という追加機構を不要にする"
      q2_learning: "奪わない。理由: 判断点は『ON 時は ledger op、OFF 時は従来』の 1 つで AC に固定。新 kind は既存 apply の型に従う"
      q3_next_quality: "上がる。理由: trailer 率 100% と root dirty 0 が §15 クローズ条件(1)(2)(5)を直接満たす"
      q4_depth: "deep — 理由: 4 経路の分岐と ledger_writer の kind 追加、本番観測 3 周期"
      q5_verified_source: "structure_verified — 対象を実行して確認(2026-09-03 09:16): rg -n で git commit と ninja_scope_commit と publish_direct_commit の呼出しを 4 script から数え insight_write 2/ninja_monitor 4、grep -n 'runtime: integrate' scripts/ninja_monitor.sh → L475、git log --since=04:37 origin/main trailer 67/101"
      q6_not_hiding: "隠していない。理由: OFF 時の挙動は不変、ON 時の root dirty 0 は本番 3 周期の集計行で証明させる"
      q7_definition_verified: "ledger op の種別と apply 契約は ledger_writer.sh 現物(cmd_4454/4465)、trailer 率の定義は設計書 §15 で確認(確認日: 2026-09-03)"
      q8_why_what: "WHY: 殿 09:16『クローズまで持っていけ』、trailer 66% の出所=root 直書き経路 / WHAT: 3 経路の ledger route 化+integrate 抑止 / WHEN: 即 / WHERE: scripts/insight_write.sh, semantic_index_update.sh, bulletin_*.sh, ledger_writer.sh, ninja_monitor.sh, tests/unit / WHO: 家老配備(Codex 可、publisher/ledger 実装者=半蔵 推奨) / HOW: 経路特定→ON 分岐→kind 追加→bats→本番 3 周期観測 / 複利: root dirty 0 で ff が常に通り、手動 checkpoint と D012 merge が消える"
      q9_firefighting_root_cause: "根本対応。理由: root sync を賢くする(消火)のではなく root を汚す生産者を消す"
      q10_knowledge_boundary: "検証済み: 4 経路の位置・trailer 集計・家老実測。スコープ外: 旧 daemon 入替(cmd_4469)、§11 after(cmd_4469)、U8"
