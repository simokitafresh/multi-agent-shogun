  cmd_4419:
    title: "LP 別サイト P3 — backend の CORS 許可に LP ドメインを追加し showcase event の step enum に lp_view と lp_cta_click を加える"
    status: delegated
    project: dm-signal
    purpose: "殿裁定 2026-08-30 16:42『別サイトでやろう』+17:14『.jp にこだわらない』(LP=dm-signal.com 予定、設計書 v2 §9)。LP は別オリジンから GET /api/public/showcase(ビルド時 fetch と帯の client fetch)と POST /api/public/showcase/event を呼ぶため、backend の CORS origins に LP オリジンを追加し、event の step enum に lp_view と lp_cta_click を加える(§9 計測)。cmd_4417(lp 配下)・cmd_4418(frontend)とは変更ファイルが分離"
    scope_mode: FULL
    target_path: /mnt/c/Python_app/DM-signal/backend
    acceptance_criteria:
      AC1:
        description: "main.py の origins に LP オリジン(https://dm-signal.com と https://www.dm-signal.com、および LP の onrender オリジンを env LP_ORIGINS で追加可)を加え、隔離 clone の TestClient で Origin ヘッダを LP オリジンにした GET /api/public/showcase と POST /api/public/showcase/event が CORS 許可ヘッダ付きで応答し、無関係オリジンには許可ヘッダが付かないことを確認する"
        binary_check: "LP オリジン 2 件+env 追加分で access-control-allow-origin が一致 ∧ 無関係オリジンで許可ヘッダ 0 ∧ 既存 origins の順序と値が不変 か?"
      AC2:
        description: "public_showcase の event step Literal に lp_view と lp_cta_click を追加し、body に lang(en か ja、任意)を受けて保存し、既存 7 step の挙動が不変であることを contract test(既存 test ファイルへ追加、test_necessity 付き)で確認する"
        binary_check: "lp_view と lp_cta_click の POST が 2xx ∧ 未知 step が 4xx のまま ∧ 既存 7 step の test が全て PASS ∧ lang が en か ja 以外なら 4xx か?"
      AC3:
        description: "【将軍訂正 17:52: AC2 の lang 永続化に model と migration が必要なため許可 scope を広げる】変更が backend 配下の main.py と showcase の api と contract test と showcase の model と migrations 1 本のみで、既存 test の削除 0 であり、変更対象に限定した pytest 選択実行で FAIL 0 SKIP 0 を確認する"
        binary_check: "変更ファイルが 5 本以内(main.py・api・contract test・model・migration) ∧ 既存 test 削除 0 ∧ 選択実行 FAIL 0 SKIP 0 か?"
    command: |
      1. main.py の origins に LP オリジンと env LP_ORIGINS を加え、TestClient で許可/非許可オリジンの応答ヘッダを確認する
      2. event step に lp_view と lp_cta_click と lang を追加し、contract test で既存 7 step 不変と新 2 step の 2xx を確認する
      3. 変更ファイル 3 本以内・既存 test 削除 0・選択実行 FAIL 0 SKIP 0 を報告 YAML に生貼付する
    assumptions:
      claim: "origin/main の backend/app/main.py L182 に origins リスト、L197 で CORSMiddleware に渡し L217 で origin in origins 判定(2026-08-30 16:46 git show)。public_showcase.py L63 に step Literal 7 値(login_view/input_focus/submit/ok/expired/wrong/note_click)。LP ドメインは dm-signal.com 予定(殿 17:14『.jp にこだわらない』、未購入)のため env で追加可にする"
      source: "docs/research/dm-login-showcase-asis-tobe_v2_20260830.md §9、backend/app/main.py L182-217、backend/app/api/public_showcase.py L63、backend/tests/test_public_showcase_contract.py"
      trust: verified
    depends_on: none
    serial_dependency_evidence: "AC1(CORS)→AC2(event enum は同じ api ファイル)→AC3(選択実行は AC1/AC2 の完成後)。同一 backend の 2 ファイルで小さく、分割すると test の重複が増えるため 1 名直列"
    environment_change: "type=lesson; file=docs/research/dm-login-showcase-asis-tobe_v2_20260830.md; pattern=lp_cta_click"
    timeout_minutes: 30
    estimated_minutes: 10
    split_decision: "AC3 本=1 道具(backend の LP 対応 1 組、origins 追加と Literal 追加と contract test の 3 手で 10 分)。LP 本体は cmd_4417、docs/faq 公開は cmd_4418 に分離済み"
