commands:
  cmd_4436:
    title: "LP に月次シグナル頁を追加 — /signals/2026-08 (EN/JA) を公開集計 EP から build 時に静的生成し sitemap へ lastmod 付きで載せる"
    status: delegated
    project: dm-signal
    purpose: "SEO 案 §2 P1-1(月次シグナル頁=毎月 2 URL 増で索引面積と鮮度)。殿指示 2026-08-31 14:56『P1-1 も起票しよう。8 月も作成したほうがいいのでは』=9 月を待たず当月(2026-08)分から生成する。データは公開集計 EP(showcase)の既存契約のみを使い、個別 PF 名・Secret 数値は出さない(§2.3 契約)"
    scope_mode: FULL
    target_path: /mnt/c/Python_app/DM-signal/lp
    acceptance_criteria:
      AC1:
        description: "LP に月次シグナル頁ルート(EN=/signals/<year-month>、JA=/ja/signals/<year-month>)を追加し、build 時に公開 showcase EP から当月分(初回=2026-08)を静的生成する。内容=当月の Basic-DualMomentum 保有シグナル・プラン集計(平均/ベスト、既存 up to 表記)・SPY/TQQQ 比較で、全て showcase EP 応答の既存フィールドのみから構成する"
        binary_check: "隔離 build の出力に EN/JA の 2026-08 頁が各 1 ∧ 頁内の数値・保有が showcase EP 応答の独立 curl と一致 ∧ 個別 PF 名(hero 以外)・Secret 数値 0 件 か?"
      AC2:
        description: "sitemap に月次頁 URL(EN/JA)を lastmod 付きで自動追加し、既存 2 URL(/、/ja/)が維持されることを確認する。月が替われば build だけで新月分が増える生成構造にする(月をハードコードしない)"
        binary_check: "sitemap の loc が 4 件以上(既存 2+月次 2) ∧ 月次 URL に lastmod あり ∧ 生成コードに 2026-08 のハードコード 0 件 か?"
      AC3:
        description: "月次頁の title/description に検索語(EN=dual momentum signals+年月、JA=デュアルモメンタム シグナル+年月)と canonical・hreflang を含め、既存トップ頁の meta と重複しないことを grep で確認する"
        binary_check: "EN/JA 月次頁に検索語入り title ∧ canonical/hreflang あり ∧ トップ頁 title との完全一致 0 か?"
      AC4:
        description: "隔離 build(npm typecheck + build)を exit 0 で通し、AC1-AC3 の grep/curl 結果を報告 YAML に生貼付する"
        binary_check: "typecheck exit 0 ∧ build exit 0 ∧ AC1-AC3 の生貼付あり か?"
    command: |
      1. LP に月次シグナル頁の動的ルート(build 時静的生成、月ハードコードなし)を実装し、公開 showcase EP から当月データを取得して EN/JA を生成する
      2. sitemap 生成へ月次 URL+lastmod を追加する
      3. 月次頁の meta(検索語 title/description・canonical・hreflang)を実装する
      4. 隔離 build と grep/curl で AC1-AC3 を検証し報告 YAML に生貼付する
    assumptions:
      claim: "公開 showcase EP は未認証で hero(Basic-DM)集計・プラン集計(sharpe/cagr/up to 系)・benchmarks(SPY/TQQQ)を返す契約(cmd_4413/4414/4425 系譜、v3.1 §5 起票分全終端)。本番 sitemap は現在 2 URL(2026-08-31 14:50 curl 実測)。LP 実体は external repo worktree で解決(cmd_4431 実績)。latest signal の公開可否は showcase EP 既存応答に含まれる範囲のみ使用"
      source: "本番 sitemap curl 14:50(loc 2 件) + docs/research/dm-signal-lp-seo-plan_20260830.md §2 P1-1 + docs/research/dm-login-showcase-asis-tobe_v3_20260830.md §5 + 殿指示 14:56"
      trust: verified
    depends_on: cmd_4434
    serial_dependency_evidence: "LP repo の build 系(sitemap 生成・ルーティング)を触るため、同 repo を直列変更中の cmd_4432→4433→4434 の最後尾に接続。showcase EP のデータ契約は既存(4413/4425)のみ使用で backend 依存なし"
    measurement_source: "本番 sitemap/showcase EP curl 実測(2026-08-31 14:50 JST)。ローカル計測は含まない"
    environment_change: "type=lesson; file=projects/infra/lessons_shogun.yaml; pattern=cmd_4154初回preflightで数値絶対値WARN"
    timeout_minutes: 40
    estimated_minutes: 25
    execution_env:
      runtime_constraints: "external repo worktree で npm typecheck/build。backend 変更なし(公開 EP の読取のみ)"
      long_runtime_reason: "頁生成・sitemap・meta の 3 要素が同一ルーティング実装を共有する単一変更系で、分割すると月次 URL の形が別実装になる"
      measured_runtime_sec: 1500
    split_decision:
      boundary_ac_ids: [AC1, AC2, AC3, AC4]
      integration_tasks: 1
      review_round_trips: 0
    origin: "[[殿指示_月次シグナル頁_8月から_20260831_1456]] -> [[SEO案v3_P1-1]] -> [[cmd_4436_monthly_signals_page]]"
    quality_gate:
      q1_firefighting: "品質向上。理由: SEO の索引面積・鮮度を増やす新規頁でありin障害対応ではない"
      q2_learning: "奪わない。理由: ルーティング設計と頁レイアウトは忍者判断に残る(データ契約と meta 要件のみ AC で固定)"
      q3_next_quality: "上がる。理由: 月が替われば build だけで新月分が増える構造=以後の月次 SEO 運用が 0 手になる"
      q4_depth: "medium。P1-1 の設計を SEO 案の契約(§2.3 秘匿・§4 計測)と本番 sitemap 実測で裏取りし、月ハードコード禁止を AC 化した"
