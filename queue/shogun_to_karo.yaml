      AC3:
        description: "変更ファイルが login 配下(page・login-experience・login-copy・showcase 系の削除)のみで、route-access-boundary・viewer-auth・auth-state-reset・api-client・既存 test の diff が 0 であり、変更対象に限定した選択実行で FAIL 0 SKIP 0 を確認する"
