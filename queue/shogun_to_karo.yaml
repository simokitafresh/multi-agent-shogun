  cmd_3827:
    title: signal_decision_ledgerのバンドなし判定での再構築 — 確定月凍結の基準をバンド適用前の正へ戻す
    status: canceled
    project: dm-signal
    scope_mode: FULL
    target_path: /mnt/c/Python_app/DM-signal
    purpose: 殿確認(2026-07-10 13:13「そうだな。ledgerの問題点がでている」)。現行ledgerはバンド期に再構築(cmd_3817)されたためバンド期の確定判定を正として凍結しており、cmd_3826のバンドなし再計算をDRIFT
      BLOCKで拒否し確定月シグナルがバンド期の値のまま残る。ledgerを退避した上でバンドなしsignalsから確定月判定を再登録し、凍結基準をバンドなしの正へ戻してDRIFT
      BLOCKを解消する
