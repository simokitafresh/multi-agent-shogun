      AC2:
        description: 再構築後にfullrecalculateを実行してrecalculation_status completedをDB行で確認し、DRIFT
          BLOCKログ(confirmed decision blocked write)が系統的に再発しないことをRenderログ照会で確認して結果をdocs/research/cmd_3827_ledger_rebuild.mdへ記録する
