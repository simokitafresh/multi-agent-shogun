      q10_knowledge_boundary: "境界内。lp build/copy は 4430-4434、showcase EP 契約は 4413/4425 の直近系譜"
      q11_not_already_done: "未実施を確認: 本番 sitemap curl 14:50 → loc 2 件のみ(signals 頁 0 件)、本番 /signals/2026-08 は未存在"
