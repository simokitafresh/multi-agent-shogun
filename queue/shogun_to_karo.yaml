        L260)。確定月=月次リバランス確定判定(月初日付)。日次シグナルはledger対象外(確認日: 2026-07-10)'
      q8_why_what: 'WHY: ledgerがバンド期判定を正として凍結しバンドなし復帰を拒否している / WHAT: 退避→バンドなしsignals先行のledger再構築→再計算でDRIFT系統的再発なし+未登録月棚卸し
        / WHEN: cmd_3826完了後(depends_on) / WHERE: 本番signal_decision_ledger+再計算 / WHO:
