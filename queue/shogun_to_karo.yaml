commands:
  cmd_4426:
    title: "LP og:image hotfix — dm-signal.com の EN/JA で og:image が 404 のため、静的 PNG(1200×630)を lp/public に置き metadata で明示参照して 200 にする"
    status: delegated
    project: dm-signal
    purpose: "cmd_4421(SEO P0-4、21:35 CLEAR)で og/twitter meta は完備したが、og:image=https://dm-signal.com/opengraph-image.png が EN/JA とも 404(2026-08-30 22:02 curl、content-type text/html)。lp/app/opengraph-image.tsx は next/og ImageResponse で、next.config は output:'export'+trailingSlash:true のため静的出力に PNG が含まれていない疑い。SNS 共有カードに画像が出ず LP 流入の e2e を損なう(SEO 案 v2 §0/§6、gist 5edb5f6d)。本 cmd は ImageResponse 依存を外し、静的 PNG を明示参照する"
    scope_mode: FULL
    target_path: /mnt/c/Python_app/DM-signal/lp
    acceptance_criteria:
      AC1:
        description: "lp 直下に public ディレクトリを新規作成し、その中に og-en.png と og-ja.png(1200×630、ブランド+タイトル文言のみ、数値なし=SEO 案 §5-3 既定)を生成して置き、lp/app/page.tsx と lp/app/ja/page.tsx の metadata.openGraph.images と twitter.images を各言語の絶対 URL(site-url helper 経由)に差し替え、lp/app/opengraph-image.tsx と lp/app/ja/opengraph-image.tsx を削除する。next build(output export)の出力先(out)配下に og-en.png と og-ja.png が存在し、EN/JA の index の og:image が各 PNG を指すことを確認する"
        binary_check: "出力先 out 配下の og-en.png と og-ja.png が存在し PNG ヘッダ(89 50 4E 47)で 1200×630 ∧ EN と JA の index の property=og:image content が各 PNG の絶対 URL 各 1 件 ∧ twitter:image も同 URL ∧ opengraph-image.tsx が 0 本 か?"
      AC2:
        description: "ローカル static serve(出力先 out)で /og-en.png と /og-ja.png が 200 かつ content-type が PNG の MIME(image と png)で返り、EN/JA の og:image:width と height が 1200 と 630 のまま、JSON-LD 3 型と hreflang 3 本と title(cmd_4421 の成果)が不変であることを確認する"
        binary_check: "ローカル curl で 2 PNG が 200 ∧ content-type が PNG の MIME ∧ og:image:width=1200・height=630 各 1 件 ∧ EN/JA の @type Organization/WebSite/FAQPage 各 1 件 ∧ hrefLang 3 種 か?"
      AC3:
        description: "変更が public ディレクトリ(lp 直下、新規)の PNG 2 枚、lp/app/page.tsx、lp/app/ja/page.tsx、opengraph-image.tsx 2 本の削除(と site-url helper の関数 1 本まで)に限られ、cmd_4424 が触る landing-page.tsx と copy/*.ts の diff が 0 行、tsc と next build が exit 0 であることを確認する"
        binary_check: "git diff --name-only の集合が上記に含まれる ∧ landing-page.tsx・copy/en.ts・copy/ja.ts の diff 0 行 ∧ tsc exit 0 ∧ next build exit 0 か?"
    command: |
      1. 静的 PNG 2 枚を生成して lp 直下の public ディレクトリ(新規)に置き、page.tsx(EN/JA)の metadata.openGraph.images/twitter.images を絶対 URL に差し替え、opengraph-image.tsx 2 本を削除して出力先 out の og:image を確認する
      2. ローカル static serve で 2 PNG の 200 と PNG MIME、JSON-LD・hreflang・title の不変を確認する
      3. 変更ファイル集合・landing-page/copy の diff 0・tsc/next build exit 0 を報告 YAML に生貼付する
    assumptions:
      claim: "本番 https://dm-signal.com/ の og:image content=https://dm-signal.com/opengraph-image.png、curl -o /dev/null -w %{http_code} で 404、content-type text/html(2026-08-30 22:02)。/ja/opengraph-image.png も 404。origin/main の lp/app/opengraph-image.tsx と lp/app/ja/opengraph-image.tsx は next/og ImageResponse(cmd_4421 71e0b94d で追加、各 28 行)。lp/next.config.mjs は output:'export'・trailingSlash:true・images.unoptimized:true。lp/lib/site-url.ts に絶対 URL helper。数値の算出元: curl -s -o /dev/null -w %{http_code} https://dm-signal.com/opengraph-image.png → 404、git ls-tree origin/main lp | grep -c opengraph-image → 2 件"
      source: "docs/research/dm-signal-lp-seo-plan_20260830.md §0・§6(hotfix 行)、lp/app/opengraph-image.tsx、lp/next.config.mjs、lp/lib/site-url.ts"
      trust: verified
    depends_on: cmd_4424
    timeout_minutes: 30
    estimated_minutes: 10
    estimated_minutes_note: "PNG 生成はスクリプト(node canvas or python PIL)でよい。デザインは背景 #0b1220・文字 #f8fafc・ブランド行 #93c5fd(現 ImageResponse と同じ)"
    split_decision: "AC3 本=1 道具(og 画像 1 組: 静的 PNG・metadata 参照・不変確認の 3 手で 10 分)。cmd_4424(landing-page/copy)とは触るファイルが交わらないため並走可"
    quality_gate:
      q1_firefighting: "消火ではない。静的 export で成立しない生成方式を、成立する静的資産へ置き換える構造対応"
      q2_learning: "忍者は Next 静的 export と metadata image route の制約、SNS カードの検証手順を学ぶ"
      q3_next_quality: "SNS/検索の共有カードに画像が出る。SEO 案 §2 P0-4 が終端(画像 200)に到達"
      q4_depth: "shallow — 変更 2 ページ+資産 2 枚、原因は config 制約で明確"
      q5_verified_source: "production_verified — https://dm-signal.com/ と /opengraph-image.png を 2026-08-30 22:02 curl(404)。code_reading — git show origin/main:lp/app/opengraph-image.tsx・lp/next.config.mjs を 22:04 読了"
      q6_not_hiding: "画像が出ない事実を meta 削除で隠さず、画像を実在させる。数値を載せない既定(SEO 案 §5-3)を守る"
      q7_definition_verified: "『og:image 404』=本番 curl の http_code(確認日 2026-08-30 22:02)。『静的 PNG』=lp/public 配下の実ファイル(next 生成物ではない)。『1200×630』=OG 推奨サイズ(SEO 案 §2 P0-4)"
      q8_why_what: "WHY: 静的 export で ImageResponse の画像が出力されず共有カードが空 / WHAT: PNG 2 枚が 200 と PNG MIME、og:image が各 PNG、opengraph-image.tsx 0 本、JSON-LD/hreflang/title 不変、tsc/next build exit 0 / WHEN: 今セッション、4424 と並走 / WHERE: DM-signal lp / WHO: 忍者 1 名 / HOW: 静的資産+metadata 明示 / 複利: 以後の LP 変更で画像経路が壊れない"
      q9_firefighting_root_cause: "root_cause: next output export+trailingSlash 構成では next/og ImageResponse の metadata image route が out に PNG を出力せず、cmd_4421 の AC が本番 URL の 200 を含まなかった(隔離 clone の out 検査で画像の存在を見ていない) / prevention: 静的資産(public ディレクトリ)を明示参照する方式に変え、AC に out の PNG 実在と local serve の PNG MIME を二値で置く(以後の metadata image 追加も同じ AC 型)"
      q10_knowledge_boundary: "検証済み: 404 の事実、config、tsx の現物。スコープ外: 画像デザインの殿確認(deploy 後に殿実機)、Render deploy(家老)"
      q11_not_already_done: "git ls-tree origin/main lp | grep -c public → 0 件(2026-08-30 22:04、public ディレクトリ自体が未作成) / curl https://dm-signal.com/og-en.png → 404 / semantic_search.sh 'og:image 静的 PNG lp' → 該当 cmd なし"
      q_ambiguity: "画像の文言は EN=en.title・JA=ja.title(現 ImageResponse と同じ)に固定。数値は載せない(SEO 案 §5-3 既定)。曖昧さは 2 値に閉じる"
      q12_lord_30min_cost: "no — SEO 案 §5-3 既定案(画像に数値を載せない)で進める。表現は deploy 後に殿実機で確認"
      diagnosis: "BLOCK理由: 該当なし(新規起票) / 対策: 該当なし"
    environment_change: "type=lesson; file=docs/research/dm-signal-lp-seo-plan_20260830.md; pattern=og:image"
    delegated_at: "\"2026-08-30T23:44:27\""
    origin: "[[cmd_4421_SEO_P0]] -> [[og:image_404_20260830_2202]] -> [[静的export制約]] -> [[cmd_4426_og_image_hotfix]]"
  cmd_4414:
    title: "/login ショーウィンドウ P1b — 公開集計 EP に Sharpe(プラン平均/ベスト)・SPY/TQQQ 比較行・Secret 集計値を追補する"
    status: void
    project: dm-signal
    purpose: "殿裁定 2026-08-30 12:30『一番下に比較として S&P500(SPY)と TQQQ を入れよう。Sharpe ratio も同じように入れよう』+12:32『secret の数値も入れよう』。cmd_4413(P1)は 12:25 に発令済みのため、契約追補を本 cmd に分離する(cmd 途中修正の二択=別 CMD)。設計書 v2 §2.3(plans[].sharpe_avg/best、benchmarks[]、secret 集計)・§3.1 v3(Sharpe 列+SPY/TQQQ 2 行+Secret 数値)が契約"
    scope_mode: FULL
    target_path: /mnt/c/Python_app/DM-signal/backend
    acceptance_criteria:
      AC1:
        description: "GET /api/public/showcase の plans[] に sharpe_avg/sharpe_best/sharpe_best_name(metrics_json.metrics の『Sharpe Ratio』close.portfolio、集合は cmd_4413 と同一関数)を、secret に n/avg_total_return/best_total_return/avg_multiple/best_multiple/cagr_min/cagr_max/sharpe_avg/sharpe_best(best_name は null 固定)を追加し、未認証 curl の値を readonly_query からの独立再計算と全項目一致で確認する"
        binary_check: "plans 3 行+secret の追加フィールドが独立再計算と不一致 0 ∧ secret.best_name が null ∧ 応答に Secret PF の名前文字列 0 件 か?"
      AC2:
        description: "benchmarks[] に SPY(2003-10〜series_end)と TQQQ(2010-03〜series_end)の total_return/multiple/cagr/sharpe を ticker_monthly_returns から算出して追加し(Sharpe は PF 計算と同じ Rf 系列・同じ式 metrics_impl.py:977-983 を共用)、SPY の sharpe が Basic-DualMomentum 行の metrics『Sharpe Ratio』close.benchmark と小数 2 桁で一致することを確認する"
        binary_check: "benchmarks が 2 件 ∧ SPY.sharpe == Basic-DM benchmark Sharpe(2 桁) ∧ TQQQ.since == 2010-03 ∧ 各 total_return が ticker_monthly_returns からの独立再計算と一致 か?"
      AC3:
        description: "追加フィールドの contract test(test_necessity: Sharpe の出所が metrics『Sharpe Ratio』であること、benchmarks の Sharpe が PF と同じ Rf 系列であること、secret.best_name が常に null であること)を追加し、選択実行(pytest で cmd_4413 の contract test ファイル+本 cmd の追加 test のみ)で FAIL 0 SKIP 0 を確認する"
        binary_check: "選択実行 pytest が FAIL 0 ∧ SKIP 0 ∧ 新規 test に非空 test_necessity ∧ 削除 test 0 か?"
    command: |
      1. cmd_4413 の visible_signal_portfolios()/集計関数を拡張して plans[].sharpe_* と secret 集計(best_name null)を返し、未認証 curl と独立再計算の全項目一致を確認する
      2. ticker_monthly_returns から SPY/TQQQ の benchmarks[] を算出(Sharpe は metrics_impl の Sharpe 式・Rf 系列を共用)し、SPY.sharpe が Basic-DM の benchmark Sharpe と 2 桁一致することを確認する
      3. contract test 3 本(test_necessity 付き)を追加し、選択実行 pytest で FAIL 0 SKIP 0 を報告 YAML に生貼付する
    assumptions:
      claim: "本番 DB 実測(2026-08-30 12:33/12:35 readonly_query): metrics_json.metrics に『Sharpe Ratio』(close.portfolio/benchmark)が全 PF にあり、Basic-DM=0.89/benchmark 0.63。signals 集合の Sharpe 平均/ベスト Basic 0.95/1.11、NewStandard 0.96/1.28、premium 1.03/1.40。Secret 73 本は全て metrics あり(平均 +535,294%、Sharpe 平均 1.71/ベスト 2.48)。ticker_monthly_returns(symbol/year_month/monthly_return)に SPY 1993-01〜2026-08、TQQQ 2010-02〜2026-08。Sharpe 式は metrics_impl.py:977-983(monthly_excess.mean()/std*sqrt(12))"
      source: "docs/research/dm-login-showcase-asis-tobe_v2_20260830.md §2.3/§3.1 v3、backend/app/services/metrics_impl.py:977-983、本番 readonly_query 2026-08-30 12:33/12:35"
      trust: verified
    depends_on: cmd_4413
    measurement_source: "production 本番 DB readonly_query 実測 evidence(db_capability_launcher.py、2026-08-30 JST 12時33分〜12時35分、metrics Sharpe Ratio・Secret 73 本 metrics・ticker_monthly_returns SPY/TQQQ 範囲)。ローカル計測は含まない"
    serial_dependency_evidence: "AC1(集計関数の拡張)→AC2(benchmarks は同 EP の同一応答に同居し Sharpe 式を共用)→AC3(contract test が AC1/AC2 の関数を参照)。cmd_4413 の集合定義関数を再利用するため depends_on cmd_4413"
    environment_change: "type=lesson; file=projects/infra/lessons_shogun.yaml; pattern=cmd_4154初回preflightで数値絶対値WARN"
    timeout_minutes: 45
    estimated_minutes: 30
    execution_env:
      runtime_constraints: "DM-signal backend venv で pytest。本番 DB は readonly_query のみ。新テーブルなし(既存 metrics/ticker_monthly_returns の読取のみ)"
      long_runtime_reason: "cmd_4413 の EP/関数を拡張する 3 AC が同一応答契約に同居し、分割すると Sharpe/benchmarks/secret で集合定義や Rf 系列が別実装になる"
      measured_runtime_sec: 1200
    split_decision: "AC3 本=1 道具(cmd_4413 契約の追補)。cmd_4413 CLEAR 後に配備(depends_on)"
    quality_gate:
      q1_firefighting: "消火ではない。殿裁定 12:30/12:32 で確定した比較軸(Sharpe・SPY/TQQQ・Secret 数値)を、発令済み cmd_4413 を止めずに別 cmd で追補する品質向上"
      q2_learning: "忍者は Sharpe の出所(metrics 配列)と Rf 系列の共用、ベンチマーク期間の明示(2003-10/2010-03)を実装で学ぶ。設計書 §2.3/§3.1 に契約と実測値が明文化済み"
      q3_next_quality: "P2b(frontend 表)が本追補を含む完成契約に乗れるため、表の列追加で frontend を作り直す往復が消える"
      q4_depth: "shallow — 既存 EP のフィールド追加と算出。深堀りは設計書側で完了"
      q5_verified_source: "production_verified — 2026-08-30 12:33 readonly_query で metrics Sharpe Ratio 45 行・12:35 で Secret 73 行を実測、ticker_monthly_returns の SPY/TQQQ 範囲を実測。code_reading — metrics_impl.py:977-983 を 12:33 に読了"
      q6_not_hiding: "Secret の best_name を null にするのは殿裁定 12:32(正体は伏せ数字で示す)であり隠蔽ではない。TQQQ Sharpe の将軍概算(Rf=0、0.90)は設計書に†で明記し EP は Rf 込みで再計算する"
      q7_definition_verified: "『Sharpe』= metrics_json.metrics[name=Sharpe Ratio].close.portfolio(年率・Rf 控除、確認日: 2026-08-30 12:33)。『比較期間』= SPY 2003-10〜series_end(Basic-DM と同期間)、TQQQ 2010-03〜series_end(上場来)。『Secret 集計』= どの tier にも hide_portfolio=false が無い active 73 本の years=0 metrics"
      q8_why_what: "WHY: 表に Sharpe と市場比較(SPY/TQQQ)と Secret の数字が無いと『どれだけ良いか』が伝わらない(殿 12:30/12:32) / WHAT: plans[].sharpe_*・benchmarks[] 2 件・secret 集計 9 フィールドを 2026-08-30 実測値どおり返し、SPY.sharpe が Basic-DM benchmark と 2 桁一致 / WHEN: cmd_4413 CLEAR 後 / WHERE: /mnt/c/Python_app/DM-signal/backend / WHO: 家老配備の忍者 1 名 / HOW: cmd_4413 の集合関数と metrics_impl の Sharpe 式を共用 / 複利: Sharpe 式と Rf 系列を 1 か所で共用する選択を 10 回繰り返せば比較指標を増やすたびに整合が自動で保たれる=正の複利。EP 内で別式を書けば指標ごとに乖離が積み上がる負の複利"
      q9_firefighting_root_cause: "根本対応。比較指標の乖離の根因=式と Rf 系列の重複実装。metrics_impl の Sharpe 式を共用し、SPY.sharpe==Basic-DM benchmark Sharpe を AC で固定する"
      q10_knowledge_boundary: "検証済み: metrics Sharpe の所在と値、Secret 73 本の metrics、ticker_monthly_returns 範囲。スコープ外: frontend 表示(P2b)、TQQQ の Rf 込み Sharpe 正確値(EP 実装で確定)、未決 2/5"
      q11_not_already_done: "rg -c 'benchmarks' /mnt/c/Python_app/DM-signal/backend/app/api → 0件 / rg -c 'sharpe_avg' /mnt/c/Python_app/DM-signal/backend → 0件(2026-08-30 12:36) / cmd_4413 の AC1 に sharpe/benchmarks/secret 集計は含まれない(queue/shogun_to_karo.yaml 現物)"
      q_ambiguity: "『同じように』= プラン行と同じ平均/ベスト形式で Sharpe を出す(殿 12:30)。比較行の期間は各行に明記し単純比較でないことを注記(設計書 §3.1)。曖昧さは解消済み"
      q12_lord_30min_cost: "no — 殿裁定 3 本は反映済み"
      diagnosis: "BLOCK理由: 該当なし(cmd_4413 の preflight で判明した 4 フィールドを雛形時点で記入) / 対策: 該当なし"
