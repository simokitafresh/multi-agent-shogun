commands:
  cmd_4455:
    title: "LP SEO: 月次シグナル頁 554 本の孤立解消 — /signals/ 年別一覧頁(EN/JA)+LP からの導線 1 本+月次頁の前月/翌月/一覧リンク+最新月の lastmod を data-through 日付に"
    status: draft
    project: dm-signal
    purpose: "殿 2026-09-02 22:44『sitemap 554 に増えている。ページのインデックス登録にはまだ進んでいない』→22:53『起票せよ』。本番 curl 22:45 一次: LP(/)から /signals/ への href 0、/signals/ は 404、月次頁に前月/翌月リンク 0、lastmod は全月『月初 00:00Z』(2003 年含む)。∴ 月次頁 554 本は sitemap 以外から到達できない孤立頁で、Google の crawl 優先度が最下位に落ちる構造。内部リンクで到達可能にし、最新月の更新日を正しく申告する(SEO 案 v4 P1-1 の後段。docs/research/dm-signal-lp-seo-plan_20260830.md)"
    scope_mode: FULL
    target_path: lp
    acceptance_criteria:
      AC1:
        description: "lp/app/signals/page.tsx と lp/app/ja/signals/page.tsx を新規作成(静的、canonical+hreflang en/ja/x-default、title/description は lp/copy/{en,ja}.ts に追加した key から): monthlySignalMonths(getShowcase()) を年で group し、各月へ siteUrl(`/signals/<month>/`)(JA は /ja/ 前置)のリンクを全件出す(月ハードコード禁止、月が増えれば自動で増える)。lp/components/landing-page.tsx の lp-footer nav(L117-118 付近の header nav でも可、どちらか 1 箇所)に /signals/(JA は /ja/signals/)への href を 1 本追加。lp/components/monthly-signal-page.tsx に『一覧へ』『前月』『翌月』の 3 リンク(前月/翌月は monthlySignalMonths の隣接要素、端は非表示)を追加。lp/app/sitemap.ts に /signals/ と /ja/signals/ の 2 entry を追加。cd lp && npm ci && npm run typecheck && npm run build が exit 0。中断再開時の成果物引継ぎ: 未 commit の worktree 差分と build log を報告 YAML の progress に path で残し、再開者はそこから継続する"
        binary_check: "build 後の out に signals/index.html と ja/signals/index.html が存在 ∧ signals/index.html 内の href='/signals/<YYYY-MM>/' 件数 == monthlySignalMonths の件数(277) ∧ out/index.html と out/ja/index.html に /signals/ への href が各 1 以上 ∧ out/signals/2026-08/index.html に /signals/2026-07/ への href 1 かつ /signals/ への href 1 かつ翌月 href 0(端) ∧ out/sitemap.xml の <loc> が 554+2=556 ∧ typecheck/build exit 0 か?"
      AC2:
        description: "lp/app/sitemap.ts の lastModified を『最新月(monthlySignalMonths の末尾)は showcase の data-through 日付(lp/lib/showcase.ts の ShowcaseData にある最終データ日。無ければ build 時刻 new Date())、それ以外の月は従来どおり月初』に変更。/signals/ 一覧 2 entry の lastModified も同じ最新日付。変更 file は lp/app/signals/page.tsx(新規)・lp/app/ja/signals/page.tsx(新規)・lp/components/landing-page.tsx・lp/components/monthly-signal-page.tsx・lp/app/sitemap.ts・lp/copy/en.ts・lp/copy/ja.ts・(必要なら)lp/app/globals.css の 8 つ以内。LP 本文の価格・無料期間の文言追加は禁止(SEO 案 §3)"
        binary_check: "out/sitemap.xml で /signals/2026-08/ の <lastmod> が 2026-08-01T00:00:00.000Z ではなく data-through 日付(または build 日) ∧ /signals/2003-09/ の <lastmod> は 2003-09-01T00:00:00.000Z のまま ∧ 変更 file が上記 8 つ以内 ∧ rg -i 'free trial|first month free|初月無料' lp/ → 0 か?"
    command: |
      1. docs/research/dm-signal-lp-seo-plan_20260830.md §0/§2 P1-1 と origin/main の lp/app/sitemap.ts・lp/components/monthly-signal-page.tsx(monthlySignalMonths/monthlySignalPoint)・lp/components/landing-page.tsx L105-134・lp/copy/{en,ja}.ts を読み、origin/main を base に AC1 の一覧頁 2 file+導線+前後リンク+sitemap 2 entry を実装し、cd lp && npm ci && npm run typecheck && npm run build を通し、out/ 配下を grep で binary_check どおりに数える。
      2. AC2 の lastModified を実装して再 build し、out/sitemap.xml の lastmod 2 点を確認して、bash scripts/ninja_scope_commit.sh -m "<msg>" -- lp/app/signals/page.tsx lp/app/ja/signals/page.tsx lp/components/landing-page.tsx lp/components/monthly-signal-page.tsx lp/app/sitemap.ts lp/copy/en.ts lp/copy/ja.ts で commit し、報告 YAML に source_sha・build log path・out/ の件数 6 点を書く。deploy(Render dm-signal-lp)と本番 curl(/signals/ 200、/ に /signals/ href、/signals/2026-08/ に前月 href、sitemap 556)は家老 lane の post_deploy_check で行う。
    assumptions:
      claim: "origin/main(60336747 cmd_4436)に lp/app/signals/[month]/page.tsx・lp/app/ja/signals/[month]/page.tsx・lp/app/sitemap.ts(monthlySignalMonths で 277 月×2 entry)・lp/components/monthly-signal-page.tsx(export monthlySignalMonths/monthlySignalPoint/MonthlySignalPage、footer L128)・lp/components/landing-page.tsx(footer/header nav L117-118、note CTA L105)が存在(git show origin/main で 2026-09-02 22:55 確認)。lp/app/signals/page.tsx は未存在(本番 /signals/ 404 で確認)。lp/package.json scripts: build/typecheck のみ(test 無し)"
      source: "git show origin/main:lp/app/sitemap.ts, lp/components/monthly-signal-page.tsx, lp/components/landing-page.tsx, lp/package.json(DM-signal origin/main 4ad5ddf9)、本番 curl https://dm-signal.com/sitemap.xml(<loc> 554)・/signals/(404)・/(signals href 0) 2026-09-02 22:45、docs/research/dm-signal-lp-seo-plan_20260830.md v4"
      trust: verified
    timeout_minutes: 45
    estimated_minutes: 30
    execution_env:
      runtime_constraints: "npm ci+next build は lp/ 配下で完結(本番 API への fetch は getShowcase のビルド時 fetch のみ=読み取り)。本番 deploy は本 cmd の範囲外(家老 lane)"
      long_runtime_reason: "next build が showcase fetch+554 静的頁生成で 1 回 3-5 分、AC1/AC2 で最低 2 回 build する(同型の cmd_4436 実測 14:57 配備→15:48 CLEAR)。AC1 の一覧頁と前後リンクは monthlySignalMonths の同一配列を共有するため 1 忍者で一貫させる"
      measured_runtime_sec: 1800
    split_decision:
      boundary_ac_ids: [AC1, AC2]
      integration_tasks: 1
    serial_dependency_evidence: "AC2 の lastModified は AC1 で追加する /signals/ 2 entry にも適用するため、AC1 の sitemap 変更の上に AC2 を重ねる(同一 file lp/app/sitemap.ts の 2 段変更)。別忍者に分けると sitemap.ts の commit 競合が起きる"
    quality_gate:
      q1_firefighting: "品質向上。理由: 孤立頁 554 本を内部リンクで到達可能にする構造の是正であり、索引されない現象への場当たりではない。月ハードコード禁止で今後の月も自動で載る"
      q2_learning: "奪わない。理由: 忍者は monthlySignalMonths の既存配列を使い、判断点は『前後リンクの端の扱い』のみで AC に固定"
      q3_next_quality: "上がる。理由: 索引が進めば Search Console の表示/クリック計測(SEO 案 §4)が初めて意味を持つ"
      q4_depth: "medium — 理由: 新規頁 2+既存 5 file の小変更、binary は out/ の件数 6 点"
      q5_verified_source: "structure_verified — 対象を実行して確認(2026-09-02 22:45-22:55): curl sitemap.xml | grep -c '<loc>' → 554、curl -o /dev/null -w %{http_code} /signals/ → 404、curl / | grep -o 'href=\"[^\"]*signals' → 0 行、git show origin/main:lp/app/sitemap.ts → lastModified=new Date(`${month}-01T00:00:00.000Z`)"
      q6_not_hiding: "隠していない。理由: 索引未登録の原因を『時間』で片付けず、構造(孤立頁・lastmod)を本番 curl で特定して直す。価格文言の禁則を binary に入れた"
      q7_definition_verified: "孤立頁・lastmod・hreflang の定義は docs/research/dm-signal-lp-seo-plan_20260830.md §0/§2 と Next.js 14 MetadataRoute.Sitemap 型(lp/app/sitemap.ts 現物)で確認(確認日: 2026-09-02)"
      q8_why_what: "WHY: 殿 22:44 索引未登録→構造原因 3 点 / WHAT: /signals/ 一覧 EN/JA+LP 導線+前後リンク+lastmod / WHEN: 今夜 / WHERE: DM-signal lp/ / WHO: 家老配備(Claude または Codex どちらでも可) / HOW: monthlySignalMonths を共有し out/ を数える / 複利: 月が増えるたび一覧と sitemap が自動で伸びる"
      q9_firefighting_root_cause: "根本対応。理由: 検索エンジンが辿れない構造そのものを直す。URL 検査の手動リクエストは殿の 4 本のみで、それ以外を手作業にしない"
      q10_knowledge_boundary: "検証済み: LP の file 構成と sitemap 生成、本番 curl の 3 事実。スコープ外: Google 側の索引時期、用語頁(P1-4)、/ja 末尾スラッシュ統一(P2)"
      q11_not_already_done: "既存代替の現物確認(2026-09-02 22:45): curl /signals/ → 404、git ls-tree origin/main lp/app/signals/ → [month] のみ(page.tsx 無し)、rg -c 'signals' lp/components/landing-page.tsx(origin/main) → 0"
      q_ambiguity: "曖昧さ: data-through 日付の取得元。解消: lp/lib/showcase.ts の ShowcaseData に最終データ日 field があればそれ、無ければ build 時刻。どちらを使ったかを報告 YAML に書く"
      q12_lord_30min_cost: "no — 殿 22:53『起票せよ』で確定、判定は out/ の件数"
      diagnosis: "BLOCK理由: 該当なし(新規起票) / 対策: 新規 2 file+既存 5 file の小変更、build 2 回"
    environment_change: "type=lesson; file=projects/infra/lessons_shogun.yaml; pattern=cmdテンプレートルール"
    origin: "[[殿指摘_索引未登録_20260902_2244]] -> [[月次頁554本が孤立_内部リンク0]] -> [[cmd_4455_signals_index_internal_links]]"
  cmd_4453:
    title: "単一 publisher U5: scripts/publisher_admit.sh(承認 2 file の存在で admit、doc kind は将軍 identity+path allowlist、R13 db_migration は migration_ack 必須)と review_approval.sh karo ACCEPT --migration-ack(唯一の enqueue caller・唯一の ack writer)"
    status: delegated
    project: infra
    purpose: "殿裁定 2026-09-02 20:44(§14.4: U5 は U3 dry-run と並走)。設計書 §9.1 U5・§4 R13(backend/app/db/ 配下の変更は逆 migration の path か irreversible_accepted の ack が無ければ admit しない)・観点 22/26(ACCEPT が enqueue の唯一の caller、karo.yaml の migration_ack は review_approval.sh だけが書く)。U3 dry-run は admit 無しで動くため、U5 完了時に enqueue 前へ admit を 1 行挿す"
    scope_mode: FULL
    target_path: scripts
    acceptance_criteria:
      AC1:
        description: "scripts/publisher_admit.sh admit <request.yaml> を新規作成: review_approvals/reports/<key>/{gunshi,karo}.yaml の両方存在で rc=0、不足なら rc=5+不足名を stderr。kind=doc(将軍投入)は将軍 identity+path allowlist(docs/ context/ queue/shogun_todo_map.md)で rc=0、allowlist 外 path 混入は rc=6。R13: request の paths に backend/app/db/ 配下が 1 つでもあれば request に db_migration: true を yaml_field_set で書き、karo.yaml に migration_ack: が無ければ rc=11+scripts/lib/publisher_event.sh append r13_reject+家老 inbox 1 通。承認 file を自分で作らない。scripts/publisher_queue.sh の enqueue 前に admit 呼出しを 1 行挿す(rc≠0 なら enqueue しない)。選択実行 bash scripts/run_tests.sh file tests/unit/test_publisher_admit.bats で FAIL 0・SKIP 0。中断再開時の成果物引継ぎ: 未 commit の worktree 差分と最終 bats 出力 log を報告 YAML の progress に path で残し、再開者はそこから継続する"
        binary_check: "未承認 N 件で admitted 0 ∧ 承認 N 件で admitted N ∧ doc allowlist 外 admitted 0(rc=6) ∧ db_migration=true∧ack 無しで admitted 0 かつ events に r13_reject 1 行+家老 inbox 1 通 ∧ publisher_queue.sh の diff が enqueue 前 1 行の追加のみ ∧ 選択実行 FAIL 0 ∧ SKIP 0 ∧ 新規 test に非空 test_necessity か?"
      AC2:
        description: "scripts/review_approval.sh の karo:ACCEPT 分岐の末尾で scripts/publisher_queue.sh enqueue <request> を呼ぶ 1 行を追加(=ACCEPT が enqueue の唯一の caller)、および karo ACCEPT <report> --migration-ack <逆 migration path|irreversible_accepted> option を追加して review_approvals/reports/<key>/karo.yaml に migration_ack: を書く(唯一の writer)。option 無し ACCEPT は migration_ack を書かない。tests/unit/test_publisher_admit.bats に『ack 有りで admitted 1』『option 無し ACCEPT は ack を書かない』を含め @test 8 本。変更 file は scripts/publisher_admit.sh(新規)・tests/unit/test_publisher_admit.bats(新規)・scripts/publisher_queue.sh(1 行)・scripts/review_approval.sh(ACCEPT 分岐+option)の 4 つのみ"
        binary_check: "--migration-ack で書いた ack 有りで admitted 1 ∧ option 無し ACCEPT で karo.yaml に migration_ack 0 ∧ rg -c 'publisher_queue.sh enqueue' scripts/ の caller が review_approval.sh の 1 箇所のみ ∧ @test 8 本以上 ∧ 変更 file が上記 4 つのみ か?"
    command: |
      1. 設計書 §9.0 共通則と §9.1 U5 行・§4 R13・§5 観点 22/26 を読み、origin/main を base に scripts/publisher_admit.sh と tests/unit/test_publisher_admit.bats を作り、publisher_queue.sh の enqueue 前に admit を 1 行挿して、選択実行 bash scripts/run_tests.sh file tests/unit/test_publisher_admit.bats で FAIL 0・SKIP 0 を確認する。
      2. scripts/review_approval.sh の karo:ACCEPT 分岐に enqueue 呼出し 1 行と --migration-ack option を追加し、同 bats に ack 2 fixture を足して再実行し、bash scripts/ninja_scope_commit.sh -m "<msg>" -- scripts/publisher_admit.sh tests/unit/test_publisher_admit.bats scripts/publisher_queue.sh scripts/review_approval.sh で commit し、報告 YAML に source_sha と実行 log path を書く。
    assumptions:
      claim: "scripts/review_approval.sh に karo ACCEPT 分岐が存在(rg -c 'ACCEPT' → 18、2026-09-02 20:50)。scripts/publisher_queue.sh の enqueue は case 分岐 L161(git show 0e8d1b6d9)。scripts/publisher_admit.sh は未存在(ls → no)。review_approvals/reports/<key>/{gunshi,karo}.yaml の配置は本日の cmd_4445/4447 の gate で実在(queue/gates/cmd_4445/review_approvals/reports/)"
      source: "docs/research/single_publisher_asis_tobe_5w1h_20260902.md §9.0 §9.1 U5 §4 R13 §5 観点 22/26 §14.4、scripts/review_approval.sh、git show 0e8d1b6d9:scripts/publisher_queue.sh、queue/gates/cmd_4445/review_approvals/"
      trust: verified
    depends_on: cmd_4445
    timeout_minutes: 45
    estimated_minutes: 35
    execution_env:
      runtime_constraints: "bats は一時 SHOGUN_STATE_DIR と一時 review_approvals dir で完結(本番 queue/gates を触らない)。review_approval.sh の fixture は --dry-run 相当の一時 report path を使い本番 report を書かない"
      long_runtime_reason: "AC1(admit の rc 表 0/5/6/11+enqueue 前 1 行)と AC2(review_approval の ACCEPT 分岐+--migration-ack writer)は『ACCEPT が enqueue の唯一の caller』『karo.yaml の ack は review_approval だけが書く』という 2 つの唯一性を同時に満たす必要があり、片方だけ先に入れると唯一性の bats が書けない。同型の U1 実測 2880s の約 7 割"
      measured_runtime_sec: 2100
    split_decision:
      boundary_ac_ids: [AC1, AC2]
      integration_tasks: 1
    serial_dependency_evidence: "AC2 の『ack 有りで admitted 1』fixture は AC1 の admit と AC2 の writer の両方を呼ぶ(観点 22/26 の唯一性は 2 file を同時に見ないと検証できない)。別忍者に分けると caller/writer の唯一性が commit 境界で一時的に破れる"
    quality_gate:
      q1_firefighting: "品質向上。理由: 承認無し publish を構造で不可能にし、DB migration(R13)の逆 migration を ack で強制する。時間依存・意志依存のどちらも作らない(§13 H9)"
      q2_learning: "奪わない。理由: 忍者は §9.1 U5 行の rc 表(0/5/6/11)を fixture にする。判断点は allowlist の 3 path のみで設計書に固定"
      q3_next_quality: "上がる。理由: U5 が入ると U3 を active に切り替える前提(承認→enqueue→publish の一本道)が揃う"
      q4_depth: "medium — 理由: rc 4 種と ack writer の 2 契約。fixture 8 本"
      q5_verified_source: "structure_verified — 対象を実行して確認(2026-09-02 20:50): rg -c 'ACCEPT' scripts/review_approval.sh → 18、git show 0e8d1b6d9:scripts/publisher_queue.sh | grep -n 'enqueue)' → L161、ls scripts/publisher_admit.sh → no、ls queue/gates/cmd_4445/review_approvals/ → reports/"
      q6_not_hiding: "隠していない。理由: 承認 file を admit が自分で作らない禁止を AC に明記。ack の writer を review_approval.sh の 1 箇所に限定し rg で証明"
      q7_definition_verified: "admit・R13・migration_ack・唯一の caller の定義は設計書 v3.7 §9.1 U5 行・§4 R13・§5 観点 22/26 で確認(確認日: 2026-09-02)"
      q8_why_what: "WHY: 殿 20:44→U3 と並走で第 2 波を今夜起票 / WHAT: publisher_admit.sh+bats 8 本+publisher_queue 1 行+review_approval ACCEPT 分岐 / WHEN: cmd_4445 CLEAR 後 / WHERE: scripts, tests/unit / WHO: 家老配備(U3/U1b と別の忍者) / HOW: §9.1 U5 行の 6 欄 / 複利: U3 active 切替(canary)の前提が揃う"
      q9_firefighting_root_cause: "根本対応。理由: 承認と publish の結合を構造(唯一の caller)で作り、意志依存を排除する"
      q10_knowledge_boundary: "検証済み: review_approval の ACCEPT 分岐、publisher_queue の enqueue 分岐、approvals 配置。スコープ外: U3 active 切替、doc kind の将軍側投入 script(U1b/U7)"
      q11_not_already_done: "既存代替の現物確認(2026-09-02 20:50): ls scripts/publisher_admit.sh → 存在しない。rg -c 'publisher_admit' scripts/ docs/research/single_publisher_asis_tobe_5w1h_20260902.md → 1(設計書内参照のみ)。rg -c 'migration_ack' scripts/ → 0(writer 未実装)。rg -c 'cmd_4453' queue/shogun_to_karo.yaml → 0(起票前)"
      q_ambiguity: "曖昧さ: doc kind の将軍 identity の判定方法。解消: request の from フィールド== shogun ∧ paths が allowlist 内、で判定(§9.1 U5 行)。他の identity 機構は作らない"
      q12_lord_30min_cost: "no — 殿裁定で確定、判定は bats"
      diagnosis: "BLOCK理由: 該当なし(新規起票) / 対策: 新規 file 2+既存 2 file へ各 1 箇所。depends_on=cmd_4445 は実依存(enqueue API の origin 到達)であり起票ゲート回避の流用ではない(LS-A04(47))"
