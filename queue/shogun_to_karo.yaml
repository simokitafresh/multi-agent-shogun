      claim: '再構築ロジックはapp/services/signal_decision_ledger.py(insert_initial_ledger_events)に一元化済みでbackend/scripts配下にbuild_signal_decision_ledger_initial.pyとbuild_signal_decision_ledger_historical_backfill.pyが実在。cmd_3817で順序(signals先行→ledger再構築)の前例あり。cmd_3826でthreshold_band残存ゼロ・recalc
        id=206実行中(確認日: 2026-07-10)'
