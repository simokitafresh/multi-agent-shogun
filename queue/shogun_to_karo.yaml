      3. login 配下以外 diff 0・認証 4 ファイル diff 0・選択実行 FAIL 0 SKIP 0 を報告 YAML に生貼付する
    assumptions:
      claim: "origin/main の frontend/app/login 配下は page.tsx(19 行)・login-experience.tsx・login-copy.ts・showcase.tsx・showcase-types.ts・sign-in-card.tsx・__tests__(2026-08-30 18:06 git ls-tree)。cmd_4416 は 17:16 に live、client 状態配線の hotfix v2(半蔵)が同 login 配下で走行中=本 cmd は v2 CLEAR 後に配備(同 target 直列)。LP は https://dm-signal.com/ と /ja が live(17:44)。frontend は output:export の静的 export"
