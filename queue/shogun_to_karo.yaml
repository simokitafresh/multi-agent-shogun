    assumptions:
      - claim: "現行 LP は cmd_4430 適用済みで、プラン行は EN=up to・JA=最大 表記、Premium 左列に招待制注記が併記されている(2026-08-31 12:24 殿スクショと 11:02 の本番 curl で確認済み)"
        trust: verified
        date: "2026-08-31"
      - claim: "閲覧列の遷移挙動・リンク先は本 cmd で変更しない(殿 12:32『リンク先にはこの後で考える』)"
