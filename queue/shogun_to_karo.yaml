    project: dm-signal
    purpose: "cmd_4244偵察(context/dm-signal-ops.md §89)で確定した根因の恒久修正。mode='portfolio'再計算がPF単位DELETE→INSERTで狭い計算結果により広い既存履歴を上書きし、monthly_returnsの過去履歴が切り詰められる(秘奥義-抜き身-激攻の全行消失も同一機構の極端ケース)。既存の0件生成時ガードを『既存履歴より狭い結果での上書き』防止へ拡張する"
    scope_mode: FULL
    target_path: /mnt/c/Python_app/DM-signal
    acceptance_criteria:
      AC1:
        description: "偵察正本(docs/research/cmd_4244_compare_na_recon_20260809.md)が特定したmonthly_returnsのPF単位DELETE→INSERT箇所のガードを、新規計算結果の期間が既存保存履歴の期間より狭い場合に既存行を消さない(狭い結果は該当期間のみ更新するか、警告して全削除を拒否する)よう拡張し、退行を再現する回帰テスト(狭い結果で広い履歴が消えないこと)を追加して選択実行コマンド=backend側の対象テストでFAIL0・SKIP0を確認しcommitする"
        binary_check: "ガード拡張と退行再現の回帰テストが追加され、対象テストFAIL0・SKIP0でcommitされているか"
      AC2:
        description: "本番デプロイ後にmode='portfolio'の再計算を1回実行し、monthly_returnsの最古year_monthとPF当たり行数が実行前後で減少しないことをDB一次データの前後比較で確認し、比較値を報告YAMLへ記録する"
        binary_check: "本番でportfolio再計算後もmonthly_returns履歴が減少しないことがDB前後比較の現物で確認されているか"
    command: |
      1. 偵察正本特定箇所のガードを拡張し退行再現の回帰テストを追加、対象テストで検証してcommitする
      2. 本番デプロイ後にportfolio再計算を実行し、履歴が減少しないことをDB前後比較で確認して報告する
    assumptions:
      claim: "根因はcmd_4244偵察がコード現物と本番実測(mode切替による履歴縮小→再復元の直接観測)で確定済み(context/dm-signal-ops.md §89、確認日2026-08-09)。現行本番はrun230のfull再計算で全履歴復元済みだが、次のportfolio再計算で再退行する。暫定運用=mode='full'のみ実行"
      source: "context/dm-signal-ops.md §89+docs/research/cmd_4244_compare_na_recon_20260809.md+backend/app/jobs/monthly_returns.py"
      trust: verified
    depends_on: none
    timeout_minutes: 60
    estimated_minutes: 15
    split_decision:
      boundary_ac_ids:
      - AC2
      integration_tasks: 1
      review_round_trips: 1
