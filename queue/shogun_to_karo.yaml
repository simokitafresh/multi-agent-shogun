      AC1:
        description: 現行ledger全件を退避してから、バンドなしsignals(cmd_3826復元後の再計算結果)を先行させてledgerを再構築し、退避件数・再構築件数・照合結果をdocs/research/cmd_3827_ledger_rebuild.mdへ記録しls
          -l + head -40で現物確認する(最終結論はcontext/dm-signal.mdへ還流する)
        binary_check: 退避が存在し、再構築後のledger登録内容がバンドなしsignalsの確定月判定と一致し、cmd_3827_ledger_rebuild.mdをls
