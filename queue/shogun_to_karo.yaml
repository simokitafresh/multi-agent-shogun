      q9_firefighting_root_cause: 'root_cause: ledger再構築(cmd_3817)がバンド適用期間中に実行され凍結基準がバンド期判定になった
        / prevention: config系の一括変更cmdにはledger基準の追従要否をACで問う(本cmdのlesson_candidate対象)'
      q10_knowledge_boundary: '検証済み空間: Renderログ実物・DB照会・スクリプト実在・cmd_3817前例。スコープ外: DRIFTログの集約改善(別cmd)、GS再実行、バンド再導入'
      q11_not_already_done: rg -c 'ledger_rebuild' context/cmd-chronicle.md → 0件。cmd_3817はバンド期の再構築でありバンドなし基準への再構築は未実施
