      AC1:
        description: "migrations に viewer_tiers へ name=Free・password_env_key=VIEWER_PASS_FREE・display_order=既存最大の次 の行を冪等に挿入(既存行があれば更新しない)し、同 tier の TierVisibilitySettings を Basic-DualMomentum 以外の全 portfolio hide(hide_portfolio と hide_signal と hide_components の各段を helper の契約どおり)で初期化し、隔離 clone の SQLite で migration を二度実行して Free 行が単一・既存 tier の行と password_env_key が不変であることを確認する。本番 DB 書込みの契約: restore 手順=Free 行と対応 tier_visibility_settings 行を name=Free で DELETE する SQL を migration のコメントと報告 YAML に記載、実行 identity=backend 起動時の run_migrations(Render backend サービス)のみで忍者は本番 DB に接続しない、破壊時復元証跡=隔離 SQLite で実行前後の viewer_tiers 全行 SELECT を報告 YAML に生貼付し既存行の差分が空であること、変更前バックアップ実行済みであること(本番適用は家老 lane: deploy 前に Render Postgres の復元点(PITR 時刻または手動 snapshot ID)を取得して掲示板に記載、忍者は隔離 SQLite のみ)"
        binary_check: "migration 二度実行後 viewer_tiers の name=Free の行数が実行前の既存 tier 行数に対して一つ増のみ(算出元: SELECT count(*) FROM viewer_tiers を実行前後で生貼付) ∧ 既存 tier の password_env_key 集合が実行前後で同一 ∧ Free の visibility で is_public_signal_portfolio が真の portfolio が Basic-DualMomentum のみ ∧ restore SQL・実行 identity・実行前後 SELECT が報告 YAML にある か?"
      AC2:
        description: "public_showcase の router に GET /api/public/free-coupon を追加し、Authorization Bearer の Supabase access token を SUPABASE_JWT_SECRET(HS256)で検証(iss と exp と aud=authenticated を確認)して、Free tier の password_env_key の値(coupon)と password_expires_at(expires_at)と plan=Free と scope=Basic-DualMomentum を返し、token 無しと不正 token と期限切れ token は 401、Free tier 未設定または env 未設定は 503 とし、rate limit は既存 GET /api/public/showcase と同じ limiter 文字列(算出元: git show origin/main:backend/app/api/public_showcase.py | grep -c '30/minute' → 1、2026-08-30 20:22)を付け、contract test を既存 test ファイルへ追加(test_necessity 付き)して確認する"
        binary_check: "正しい HS256 token で 200 かつ応答キーが coupon・expires_at・plan・scope の集合と一致(算出元: 設計書 v3 §2 項目 3 の返却キー列挙) ∧ token 無し/不正/期限切れが 401 ∧ env 未設定で 503 ∧ 応答に他 tier の password 文字列が含まれない ∧ contract test FAIL 0 SKIP 0 か?"
      AC3:
        description: "変更が backend 配下の migrations と public_showcase の api と contract test と、必要なら visibility helper の呼出しのみで、既存 test の削除が無く、既存の verify_viewer(auth.py)と showcase GET/event の挙動が不変(既存 contract test PASS)であることを、変更対象に限定した pytest 選択実行 FAIL 0 SKIP 0 で確認する"
        binary_check: "変更ファイルが migrations・public_showcase・contract test・helper 呼出しの集合内のみ(算出元: git diff --name-only を生貼付) ∧ auth.py の diff が空 ∧ 既存 test 削除が無い ∧ 選択実行 FAIL 0 SKIP 0 か?"
    command: |
