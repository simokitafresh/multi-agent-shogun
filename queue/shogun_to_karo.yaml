      AC2:
        description: "/login に robots noindex(metadata robots index:false)を付け、LP(dm-signal.com)が検索評価を受ける側になるようにし、既存のログイン 3 経路(正しいパスワード→/、誤り→エラー文、期限切れ→expired 文+note 導線)が Playwright(ローカル)で従来どおり通ることを確認する"
