commands:
  cmd_4425:
    title: "showcase 契約 v3 — GET /api/public/showcase から best_name/sharpe_avg/*_best_name/until_hint を除去し、mdd_best(plans/secret/hero)・benchmarks mdd・blackout{active,month_closed,n_signals}・meta.skipped を追加する(cmd_4415 未到達分の再実装)"
    status: draft
    project: dm-signal
    purpose: "殿裁定 2026-08-30 12:46『MDD も追加』12:48『表内にベスト PF 名は不要』12:49『Sharpe/MDD はベストだけ』12:58『日時は書かない』で確定した公開契約 v3(設計書 v3 §2.4、gist 901c36a5)が、cmd_4415 GATE CLEAR(16:30)にもかかわらず origin/main に到達していない(22:40 一次: git show origin/main:backend/app/api/public_showcase.py で mdd/drawdown 0 件、best_name・sharpe_avg・until_hint 残存。4415 最終 commit f8a33e00 は 3 行差分)。本番 EP(22:02 curl)も同じ v1 形。LP の表は EP の現物に従うため MDD 列が出せず、契約外キー(best_name)が公開されている。本 cmd は契約 v3 を backend に実装し contract test で固定する"
    scope_mode: FULL
    target_path: /mnt/c/Python_app/DM-signal/backend
    acceptance_criteria:
      AC1:
        description: "public_showcase.py の showcase レスポンスから best_name・sharpe_avg・sharpe_best_name・mdd_best_name・until_hint を削除し、hero に mdd、plans[] と secret に mdd_best(metrics『Maximum Drawdown』close.portfolio の最浅=最大値)、benchmarks[] に mdd(SPY/TQQQ の月次系列から算出)を追加し、blackout を {active, month_closed, n_signals} にする(active は auth.py の is_password_expired と同じ JST 判定、month_closed=signals 最新 date ≥ 前月末 ∧ series_end == 前月末、n_signals=basic/standard/premium のシグナル公開 PF 数の合計)。meta.skipped(metrics 欠落 PF 数)を追加する"
        binary_check: "TestClient の GET /api/public/showcase JSON を文字列化して best_name・sharpe_avg・sharpe_best_name・mdd_best_name・until_hint の出現 0 件 ∧ mdd_best が plans 3 件+secret 1 件=4 件 ∧ hero.mdd が数値 ∧ benchmarks の mdd が 2 件 ∧ blackout のキー集合が {active, month_closed, n_signals} と一致 ∧ meta.skipped が整数 か?"
      AC2:
        description: "mdd_best・benchmarks mdd・n_signals を DB から独立に再計算する contract test(SQLite fixture、既存 test_public_showcase_contract.py に追記)が EP の値と一致し、集合の定義(hide_portfolio=false ∧ hide_signal=false)は visibility_helpers の同じ関数を EP と test の両方が通ることを確認する。各 test に test_necessity を 1 行で宣言する"
        binary_check: "独立再計算 test で mdd_best 4 件・benchmarks mdd 2 件・n_signals の一致が全て assert PASS ∧ EP と test が visibility_helpers の同一関数を呼ぶ(grep で関数名が両ファイルに各 1 件以上) ∧ 追加 test 全件に非空の test_necessity ∧ pytest -q backend/tests/test_public_showcase_contract.py が PASS SKIP 0 か?"
      AC3:
        description: "変更が backend/app/api/public_showcase.py と backend/tests/test_public_showcase_contract.py(と必要なら backend/app/api の新規 helper 1 本)のみで、auth.py・visibility_helpers.py・既存 EP・既存 test の diff が 0 行であり、既存 test の選択実行(backend/tests/test_auth*.py と test_public_showcase_contract.py)が PASS することを確認する"
        binary_check: "git diff --name-only の集合が public_showcase.py・test_public_showcase_contract.py(+api 配下の新規 helper 最大 1 本)のみ ∧ auth.py と visibility_helpers.py の diff 0 行 ∧ 選択実行 pytest が PASS SKIP 0 か?"
    command: |
      1. public_showcase.py の plans/secret/hero/benchmarks/blackout を契約 v3 に合わせ、除去 5 キーの出現 0 と mdd_best 4 件・benchmarks mdd 2 件・blackout キー集合・meta.skipped を TestClient で確認する
      2. 独立再計算 contract test(mdd_best/benchmarks mdd/n_signals、visibility_helpers 同一関数)を追記し、test_necessity 付きで pytest PASS SKIP 0 を確認する
      3. 変更ファイル集合と auth.py/visibility_helpers.py の diff 0 行、選択実行 PASS を報告 YAML に生貼付する
    assumptions:
      claim: "origin/main の backend/app/api/public_showcase.py に best_name(L141 付近)・until_hint(L331)・sharpe_avg が残存し mdd/drawdown は 0 件(2026-08-30 22:40 git show | grep -c)。本番 GET /api/public/showcase(22:02 curl)の plans[0] は {n:2, best_name:'Ave-X', sharpe_avg:0.98, sharpe_best_name:'Ave-X'}、blackout={active:false, until_hint:null}、benchmarks に mdd なし。metrics_json.metrics に『Maximum Drawdown』(close.portfolio/benchmark)が全 PF にある(設計書 v2 §0 12:46 実測: Basic-DM −41.0%、SPY −52.9%、TQQQ −80.1%)。ticker_monthly_returns に SPY(1993-01〜)・TQQQ(2010-02〜)。visibility_helpers.check_hide_portfolio_or_folder が存在(v2 §6.5 H1)。数値の算出元: git show origin/main:backend/app/api/public_showcase.py | grep -c -iE 'mdd|drawdown' → 0 件、grep -c best_name → 1 件以上、grep -c until_hint → 1 件以上"
      source: "docs/research/dm-login-showcase-asis-tobe_v3_20260830.md §1.2・§2.4、docs/research/dm-login-showcase-asis-tobe_v2_20260830.md §0(12:46/12:48/12:49/12:58)・§3.1・§6.5 H1/H3/H4/H13、backend/app/api/public_showcase.py、backend/app/api/auth.py(is_password_expired)"
      trust: verified
    depends_on: none
    timeout_minutes: 40
    estimated_minutes: 15
    split_decision: "AC3 本=1 道具(公開 EP 1 本の契約変更: フィールド差替え・独立再計算 test・境界 diff 0 の 3 手)。LP 表への MDD 列追加は別 cmd(EP 到達後に LP lane)。cmd_4422 と同 target(backend)だが触るファイルは public_showcase.py の showcase 関数のみで free-coupon EP と分離=家老が 4422 CLEAR 後に直列配備"
    quality_gate:
      q1_firefighting: "消火ではない。GATE CLEAR≠ToBe 到達(型六弾-3)を grep で検出した契約未到達の根本実装"
      q2_learning: "忍者は契約駆動の EP 変更、独立再計算 contract test、可視性 helper の共有を学ぶ"
      q3_next_quality: "LP の表に MDD 列と blackout n_signals が出せる。契約外キーの公開 0。4415 型の偽 CLEAR を contract test が二度と通さない"
      q4_depth: "medium — 設計書 v2 §0 の裁定 4 本と §6.5 の穴 H1/H3/H4/H13 を全て契約に写す"
      q5_verified_source: "code_reading — git show origin/main:backend/app/api/public_showcase.py を 2026-08-30 22:40 に grep(mdd 0・best_name/until_hint 残存)。production_verified — https://dm-signal-backend.onrender.com/api/public/showcase を 22:02 curl(plans[0] に best_name/sharpe_avg、blackout に until_hint)"
      q6_not_hiding: "契約外キーを LP 側で隠すのではなく EP から削る(設計書 v3 §2.4 最終行)。4415 の CLEAR を取り消さず、未到達の事実を設計書 §1.2 に残す"
      q7_definition_verified: "『契約 v3』=設計書 v3 §2.4 のキー集合(確認日 2026-08-30)。『mdd_best』=metrics『Maximum Drawdown』close.portfolio の最浅(v2 §0 12:46)。『blackout.active』=auth.py is_password_expired と同判定(v2 §6.5 H3)。『month_closed』=v2 §6.5 H4"
      q8_why_what: "WHY: 裁定済み契約が本番に届かず、契約外キーが公開され MDD 列が出せない / WHAT: 除去 5 キー 0 件、mdd_best 4 件、benchmarks mdd 2 件、hero.mdd、blackout {active,month_closed,n_signals}、meta.skipped、独立再計算 test PASS、境界 diff 0 / WHEN: 今セッション、4422 CLEAR 後に直列 / WHERE: DM-signal backend / WHO: 忍者 1 名 / HOW: showcase 関数のフィールド差替え+test 追記 / 複利: 契約を test が固定するため以後の EP 変更で退行しない"
      q9_firefighting_root_cause: "根本対応。4415 が『reintegrate latest main』で契約変更を落とした構造(merge で hunk 消失)に対し、contract test で契約を固定する"
      q10_knowledge_boundary: "検証済み: EP の現物キー、metrics の MDD 格納、裁定 4 本。スコープ外: LP 表の MDD 列(別 cmd)、free-coupon EP(4422)、deploy(家老)"
      q11_not_already_done: "git show origin/main:backend/app/api/public_showcase.py | grep -c -iE 'mdd|drawdown' → 0 件(2026-08-30 22:40) / curl showcase | grep -c best_name → 1 件以上(22:02) / semantic_search.sh 'showcase mdd_best 契約 v3' → cmd_4415 のみ(未到達)"
      q_ambiguity: "benchmarks mdd の期間は SPY=2003-10〜・TQQQ=2010-03〜(v2 §3.1)に固定。n_signals の集合は basic/standard/premium のシグナル公開 PF(重複なし)に固定。曖昧さは 2 値に閉じる"
      q12_lord_30min_cost: "no — 殿裁定 12:46/12:48/12:49/12:58 で確定済み、設計書 v3 §6-3 の既定案=起票"
      diagnosis: "BLOCK理由: 該当なし(新規起票) / 対策: 該当なし"
    environment_change: "type=lesson; file=docs/research/dm-login-showcase-asis-tobe_v3_20260830.md; pattern=GATE CLEAR ≠ ToBe 到達"
    origin: "[[殿裁定_MDD追加_20260830_1246]] -> [[cmd_4415_契約未到達_f8a33e00]] -> [[設計書v3_§1.2_偽CLEAR検出]] -> [[cmd_4425_showcase_契約v3]]"
  cmd_4426:
    title: "LP og:image hotfix — dm-signal.com の EN/JA で og:image が 404 のため、静的 PNG(1200×630)を lp/public に置き metadata で明示参照して 200 にする"
    status: draft
    project: dm-signal
    purpose: "cmd_4421(SEO P0-4、21:35 CLEAR)で og/twitter meta は完備したが、og:image=https://dm-signal.com/opengraph-image.png が EN/JA とも 404(2026-08-30 22:02 curl、content-type text/html)。lp/app/opengraph-image.tsx は next/og ImageResponse で、next.config は output:'export'+trailingSlash:true のため静的出力に PNG が含まれていない疑い。SNS 共有カードに画像が出ず LP 流入の e2e を損なう(SEO 案 v2 §0/§6、gist 5edb5f6d)。本 cmd は ImageResponse 依存を外し、静的 PNG を明示参照する"
    scope_mode: FULL
    target_path: /mnt/c/Python_app/DM-signal/lp
    acceptance_criteria:
      AC1:
        description: "lp/public/og/en.png と lp/public/og/ja.png(1200×630、ブランド+タイトル文言のみ、数値なし=SEO 案 §5-3 既定)を生成して置き、lp/app/page.tsx と lp/app/ja/page.tsx の metadata.openGraph.images と twitter.images を各言語の絶対 URL(site-url helper 経由)に差し替え、lp/app/opengraph-image.tsx と lp/app/ja/opengraph-image.tsx を削除する。next build(output export)の out に og/en.png と og/ja.png が存在し、out の EN/JA index の og:image が各 PNG を指すことを確認する"
        binary_check: "out/og/en.png と out/og/ja.png が存在し PNG ヘッダ(89 50 4E 47)で 1200×630 ∧ out/index.html と out/ja/index.html の property=og:image content が各 PNG の絶対 URL 各 1 件 ∧ twitter:image も同 URL ∧ opengraph-image.tsx が 0 本 か?"
      AC2:
        description: "ローカル static serve(out)で /og/en.png と /og/ja.png が 200 かつ content-type image/png で返り、EN/JA の og:image:width/height が 1200/630 のまま、JSON-LD 3 型と hreflang 3 本と title(cmd_4421 の成果)が不変であることを確認する"
        binary_check: "ローカル curl で 2 PNG が 200 ∧ content-type image/png ∧ og:image:width=1200・height=630 各 1 件 ∧ EN/JA の @type Organization/WebSite/FAQPage 各 1 件 ∧ hrefLang 3 種 か?"
      AC3:
        description: "変更が lp/public/og/*、lp/app/page.tsx、lp/app/ja/page.tsx、opengraph-image.tsx 2 本の削除(と site-url helper の関数 1 本まで)に限られ、cmd_4424 が触る landing-page.tsx と copy/*.ts の diff が 0 行、tsc と next build が exit 0 であることを確認する"
        binary_check: "git diff --name-only の集合が上記に含まれる ∧ landing-page.tsx・copy/en.ts・copy/ja.ts の diff 0 行 ∧ tsc exit 0 ∧ next build exit 0 か?"
    command: |
      1. 静的 PNG 2 枚を生成して lp/public/og に置き、page.tsx(EN/JA)の metadata.openGraph.images/twitter.images を絶対 URL に差し替え、opengraph-image.tsx 2 本を削除して out の og:image を確認する
      2. ローカル static serve で 2 PNG の 200/image/png と、JSON-LD・hreflang・title の不変を確認する
      3. 変更ファイル集合・landing-page/copy の diff 0・tsc/next build exit 0 を報告 YAML に生貼付する
    assumptions:
      claim: "本番 https://dm-signal.com/ の og:image content=https://dm-signal.com/opengraph-image.png、curl -o /dev/null -w %{http_code} で 404、content-type text/html(2026-08-30 22:02)。/ja/opengraph-image.png も 404。origin/main の lp/app/opengraph-image.tsx と lp/app/ja/opengraph-image.tsx は next/og ImageResponse(cmd_4421 71e0b94d で追加、各 28 行)。lp/next.config.mjs は output:'export'・trailingSlash:true・images.unoptimized:true。lp/lib/site-url.ts に絶対 URL helper。数値の算出元: curl -s -o /dev/null -w %{http_code} https://dm-signal.com/opengraph-image.png → 404、git ls-tree origin/main lp | grep -c opengraph-image → 2 件"
      source: "docs/research/dm-signal-lp-seo-plan_20260830.md §0・§6(hotfix 行)、lp/app/opengraph-image.tsx、lp/next.config.mjs、lp/lib/site-url.ts"
      trust: verified
    depends_on: none
    timeout_minutes: 30
    estimated_minutes: 10
    estimated_minutes_note: "PNG 生成はスクリプト(node canvas or python PIL)でよい。デザインは背景 #0b1220・文字 #f8fafc・ブランド行 #93c5fd(現 ImageResponse と同じ)"
    split_decision: "AC3 本=1 道具(og 画像 1 組: 静的 PNG・metadata 参照・不変確認の 3 手で 10 分)。cmd_4424(landing-page/copy)とは触るファイルが交わらないため並走可"
    quality_gate:
      q1_firefighting: "消火ではない。静的 export で成立しない生成方式を、成立する静的資産へ置き換える構造対応"
      q2_learning: "忍者は Next 静的 export と metadata image route の制約、SNS カードの検証手順を学ぶ"
      q3_next_quality: "SNS/検索の共有カードに画像が出る。SEO 案 §2 P0-4 が終端(画像 200)に到達"
      q4_depth: "shallow — 変更 2 ページ+資産 2 枚、原因は config 制約で明確"
      q5_verified_source: "production_verified — https://dm-signal.com/ と /opengraph-image.png を 2026-08-30 22:02 curl(404)。code_reading — git show origin/main:lp/app/opengraph-image.tsx・lp/next.config.mjs を 22:04 読了"
      q6_not_hiding: "画像が出ない事実を meta 削除で隠さず、画像を実在させる。数値を載せない既定(SEO 案 §5-3)を守る"
      q7_definition_verified: "『og:image 404』=本番 curl の http_code(確認日 2026-08-30 22:02)。『静的 PNG』=lp/public 配下の実ファイル(next 生成物ではない)。『1200×630』=OG 推奨サイズ(SEO 案 §2 P0-4)"
      q8_why_what: "WHY: 静的 export で ImageResponse の画像が出力されず共有カードが空 / WHAT: PNG 2 枚が 200/image/png、og:image が各 PNG、opengraph-image.tsx 0 本、JSON-LD/hreflang/title 不変、tsc/next build exit 0 / WHEN: 今セッション、4424 と並走 / WHERE: DM-signal lp / WHO: 忍者 1 名 / HOW: 静的資産+metadata 明示 / 複利: 以後の LP 変更で画像経路が壊れない"
      q9_firefighting_root_cause: "根本対応。生成方式を export 制約に合う方式へ変える(config を変えない)"
      q10_knowledge_boundary: "検証済み: 404 の事実、config、tsx の現物。スコープ外: 画像デザインの殿確認(deploy 後に殿実機)、Render deploy(家老)"
      q11_not_already_done: "git ls-tree origin/main lp/public 2>/dev/null | grep -c og → 0 件(2026-08-30 22:04) / curl https://dm-signal.com/og/en.png → 404 / semantic_search.sh 'og:image 静的 PNG lp' → 該当 cmd なし"
      q_ambiguity: "画像の文言は EN=en.title・JA=ja.title(現 ImageResponse と同じ)に固定。数値は載せない(SEO 案 §5-3 既定)。曖昧さは 2 値に閉じる"
      q12_lord_30min_cost: "no — SEO 案 §5-3 既定案(画像に数値を載せない)で進める。表現は deploy 後に殿実機で確認"
      diagnosis: "BLOCK理由: 該当なし(新規起票) / 対策: 該当なし"
    environment_change: "type=lesson; file=docs/research/dm-signal-lp-seo-plan_20260830.md; pattern=og:image"
    origin: "[[cmd_4421_SEO_P0]] -> [[og:image_404_20260830_2202]] -> [[静的export制約]] -> [[cmd_4426_og_image_hotfix]]"
  cmd_4427:
    title: "FAQ EN 版 — app の /faq(JA 459 行)に EN 版を追加し、言語切替と hreflang/metadata を付けて LP EN からの導線先を英語にする"
    status: draft
    project: dm-signal
    purpose: "殿方向性 2026-08-30 13:25『Docs/FAQ をログインページからのリンクに』→cmd_4418 で /docs /faq を公開したが、/faq は JA のみ(22:35 curl: lang=ja、hreflang 0)。LP EN(dm-signal.com/)の FAQ 抜粋と Read the docs は英語読者を app の JA FAQ へ送っており、設計書 v3 §2.2(app /docs /faq=公開ドキュメント、FAQ は JA→EN 追加)と SEO 案 v2 §1(検索意図 dual momentum signals)に反する。本 cmd は FAQ の EN 版を追加する"
    scope_mode: FULL
    target_path: /mnt/c/Python_app/DM-signal/frontend
    acceptance_criteria:
      AC1:
        description: "frontend/app/faq の文言を EN/JA の 2 ファイル(faq-copy.en.ts / faq-copy.ja.ts など)に分離し、/faq を EN 主(既定)・/faq/ja(または ?lang=ja)を JA とし、各ページに metadata(title/description 言語別)と hreflang(en/ja/x-default)を付ける。全 Q&A が EN/JA で同数であることを確認する"
        binary_check: "EN と JA の Q&A 件数が一致(算出元: 各 copy の配列 length を生貼付) ∧ EN ページの lang=en・JA ページの lang=ja ∧ 両ページに hreflang 3 種 ∧ metadata title が言語別 か?"
      AC2:
        description: "EN 訳は JA の各 Q&A に 1:1 対応し、禁則語(毎営業日/today/¥/円/yen/first month free/初月無料/free trial)が EN/JA とも 0 件、note 導線 URL は marketing-info.md 現物(tokyojibika)のみであることを確認する"
        binary_check: "禁則語 grep が EN/JA とも 0 件 ∧ note URL が tokyojibika 以外 0 件 ∧ EN の Q 見出しと JA の Q 見出しの数が一致 か?"
      AC3:
        description: "変更が frontend/app/faq 配下(と route-access-boundary の public 判定リストに /faq/ja を足す 1 行まで)に限られ、boundary の認証分岐の diff が 0 行、既存 test の削除がなく、tsc と next build(output export)が exit 0 で out に faq と faq/ja の index が生成されることを確認する"
        binary_check: "git diff --name-only の集合が app/faq/** と boundary の public リスト 1 行以内 ∧ boundary の認証分岐関数の diff 0 行 ∧ tsc exit 0 ∧ next build exit 0 ∧ out/faq/index.html と out/faq/ja/index.html が存在 か?"
    command: |
      1. faq 文言を EN/JA の copy 2 ファイルに分離し、/faq(EN)と /faq/ja(JA)を metadata・hreflang 付きで生成して Q&A 件数一致を確認する
      2. EN 訳の 1:1 対応、禁則語 grep 0、note URL の現物一致を確認する
