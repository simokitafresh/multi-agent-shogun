      claim: "現行チャートは hero 単独線(cmd_4433 live、本番 svg 1 件を 17:55 実測)。SPY 月次は ticker_monthly_returns に実在(cmd_4414 設計時の本番実測: SPY 1993-01〜2026-08)。目標形式はスクショ Image #14(frontend comparison-chart の見た目: 2 系列・対数 x 表記・年月軸・凡例%)。LP 実体は external repo worktree(cmd_4431-4434 実績)。cmd_4438(runner 根治)CLEAR 後なら lp scope の receipt も正規生成される"
