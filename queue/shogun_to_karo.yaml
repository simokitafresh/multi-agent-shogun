  cmd_4439:
    title: "LP static チャートを比較形式へ — SPY 破線系列を追加し対数 x 表記目盛・年月 x 軸・凡例に累積%を表示する"
    status: delegated
    project: dm-signal
    purpose: "殿裁定 2026-08-31 17:58(スクショ Image #14=frontend comparison chart)『チャートはこの形式にしよう』。現行(cmd_4433 live)は hero 単独線のみ。目標形式=Basic-DualMomentum(青実線)+SPY(グレー破線)の 2 系列、対数目盛ラベル x 表記(20x/10x/5.0x/2.0x/1.0x)、x 軸に年月(2003-09 等)、凡例に系列名+累積リターン%(例 Basic-DualMomentum: +3058.0% / SPY: +1023.2%)。static(interactivity なし)は維持し、トグル・tooltip 等は対象外"
    scope_mode: FULL
    target_path: /mnt/c/Python_app/DM-signal/backend
    acceptance_criteria:
      AC1:
        description: "GET /api/public/showcase に SPY の月次累積系列(hero.series と同形式 year_month+multiple、hero と同一起点に正規化=共通期間開始を 1.0x)を追加し、未認証 curl で hero.series と同月数・最終値が benchmarks 系集計(cmd_4425 系譜の SPY 値)と整合することを確認する。Secret・個別 PF 情報は増やさない"
        binary_check: "未認証 curl に SPY 系列あり ∧ hero.series と同月数 ∧ 最終 multiple が独立再計算と一致 ∧ Secret 情報 0 件 か?"
      AC2:
        description: "showcase contract test に SPY 系列の不変量(同形式・同起点・昇順)を test_necessity 付きで追加し、選択実行コマンド=bash scripts/run_tests.sh file backend/tests/test_public_showcase_contract.py で FAIL 0・SKIP 0 を確認する"
        binary_check: "選択実行 FAIL 0 ∧ SKIP 0 ∧ 新規 test に非空 test_necessity ∧ 削除 test 0 か?"
      AC3:
        description: "LP の static チャートをスクショ Image #14 の形式へ変更する: (a)SPY をグレー破線・hero を現行青実線の 2 系列 (b)y 軸目盛ラベルを x 表記(1-2-5 系列、例 20x/10x/5.0x/2.0x/1.0x) (c)x 軸に年月ラベル(始点・終点含む 5-6 点) (d)チャート下に凡例=系列名+開始以来累積リターン%(hero と SPY、色マーカー付き)。EN/JA 両ページ、interactivity なし維持"
        binary_check: "隔離 build の EN・JA index でチャート SVG 内に path 2 本(破線属性 1 本) ∧ x 表記目盛ラベルあり ∧ 年月 x 軸ラベルあり ∧ 凡例に 2 系列名+% あり か?"
      AC4:
        description: "隔離 build(npm typecheck + build)を exit 0 で通し、AC1-AC3 の curl/grep 結果を報告 YAML に生貼付する"
        binary_check: "typecheck exit 0 ∧ build exit 0 ∧ AC1-AC3 の生貼付あり か?"
    command: |
      1. backend showcase に SPY 月次累積系列(hero 同形式・同起点正規化)を追加し curl と独立再計算で確認する
      2. contract test に SPY 系列不変量を追加し選択実行で FAIL 0 SKIP 0 を確認する
      3. LP static チャートを 2 系列+x 表記目盛+年月軸+累積%凡例の比較形式へ変更し、隔離 build と grep で確認する
