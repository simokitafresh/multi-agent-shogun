      source: "docs/research/dm-free-tier-google-auth-asis-tobe_v3_20260830.md §1-§2、backend/app/db/models.py、backend/app/db/migrations.py、backend/app/api/auth.py、backend/app/api/public_showcase.py、backend/requirements.txt"
      trust: verified
