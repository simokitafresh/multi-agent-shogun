commands:
  cmd_4465:
    title: "単一 publisher U6b: publisher daemon に ledger 消費者(ledger_inbox の op を seq 順に isolated clone へ apply→1 commit→publish→applied へ移動)を実装し、ledger_writer.sh を実行 bit 付きで追跡して writer route を本番で生かす"
    status: delegated
    project: infra
    purpose: "家老が 04:58 deepdive 追体験で発見(blt_045610): cmd_4454(U6)の ledger route は本番で一度も動いていない。理由 2 層=(a) 4 caller(insight/lesson/bulletin/workaround)の `[[ -x ledger_writer.sh ]]` 検査が file mode 644 のため常に偽で legacy 直書きへ沈黙フォールバック (b) `$STATE_DIR/ledger_inbox` の op を origin へ apply する消費者が publisher.sh に未実装(grep -c apply → 0)。PUBLISHER_SINGLE ON(04:37)以後は legacy auto-commit が no-op のため、ledger 4 種の origin 到達経路は本 route しか無く、root の tracked dirty が 14 に溜まり publisher の root sync が fail-closed(tracked_dirty)し続ける。将軍裁定 04:56: route 撤去ではなく消費者を実装。cmd_4464(削除)と触る file が重ならず並走可"
    scope_mode: FULL
    target_path: scripts
    acceptance_criteria:
      AC1:
        description: "scripts/publisher.sh に ledger 消費(kind=ledger)を追加: daemon の各周期で `$STATE_DIR/ledger_inbox/<ledger>/*.yaml`(applied/ を除く)を name(UTC 時刻+seq)昇順に読み、既存 flock 1 本の下で isolated clone(origin/main tip)に対し `bash scripts/ledger_writer.sh apply <op file>` を op ごとに実行し、全 op 成功なら 1 commit(message『publisher: ledger batch n=<件数> ledgers=<種別>』+Published-By trailer)→既存 publish 経路(push→sync_root)→op file を ledger_inbox/<ledger>/applied/ へ移動。1 op でも apply 失敗なら commit せず isolated を捨て、失敗 op だけ ledger_inbox/<ledger>/rc/ へ移し残りは次周期へ(fail-close、他 op を巻き込まない)。code request(既存 kind)と ledger の順序は queue の到着順、同一周期では code→ledger。events.jsonl に kind=ledger の event 1 行。既存 bats tests/unit/test_publisher.bats は選択実行コマンド=bash scripts/run_tests.sh file tests/unit/test_publisher.bats tests/unit/test_ledger_writer.bats で FAIL 0・SKIP 0。中断再開時の成果物引継ぎ: 未 commit の worktree 差分と最終 bats 出力 log を報告 YAML の progress に path で残し、再開者はそこから継続する"
        binary_check: "publisher.sh に ledger 消費関数 1 つ以上(rg -c 'ledger_inbox' scripts/publisher.sh ≥ 1)∧ fixture で op 3 件→isolated commit 1 つ・origin fixture に 3 entry・applied/ に 3 file ∧ 失敗 op 1 件混在で commit 0・rc/ に 1 file・残 2 は次周期で applied ∧ 既存 2 bats 選択実行 FAIL 0 ∧ SKIP 0 か?"
      AC2:
        description: "scripts/ledger_writer.sh を git mode 100755 で追跡する(git update-index --chmod=+x、bash scripts/ninja_scope_commit.sh で commit)。4 caller(scripts/insight_write.sh L463/L473/L493 の -x 判定と lesson/bulletin/workaround の同型箇所)は判定を変えず、-x が偽かつ file が存在する場合に stderr へ『LEDGER-ROUTE-SKIP: ledger_writer.sh exists but not executable』を 1 行出す(沈黙フォールバックの可視化のみ、分岐は不変)。tests/unit/test_publisher_ledger_consumer.bats を新規作成(test_necessity 非空): (1) ledger_writer.sh の実行 bit が git tree で 100755 (2) insight_write を fixture で実行→legacy file 不変・ledger_inbox に op 1 件→publisher 1 周期→origin fixture に entry・root porcelain 0。選択実行=bash scripts/run_tests.sh file tests/unit/test_publisher_ledger_consumer.bats で FAIL 0・SKIP 0。変更 file は publisher.sh・ledger_writer.sh(mode)・4 caller・新規 bats 1 の 7 つ以内"
        binary_check: "git ls-tree HEAD scripts/ledger_writer.sh の mode が 100755 ∧ 4 caller に LEDGER-ROUTE-SKIP 出力 1 行ずつ(rg -c 'LEDGER-ROUTE-SKIP' scripts → 4)∧ 新規 bats @test 2 本以上・test_necessity 非空 ∧ 選択実行 FAIL 0 ∧ SKIP 0 ∧ 変更 file ≤7 か?"
    command: |
      1. scripts/publisher.sh(process_request/run_one/daemon_main と sync_root)と scripts/ledger_writer.sh(write_op/apply_op、L185)を読み、ledger 消費関数を publisher.sh に足し、fixture(正常 3 op/失敗混在)で確認して既存 2 bats を選択実行し、報告 YAML に fixture の origin 側 entry 数と applied/rc の file 数を生貼付する。
      2. ledger_writer.sh を 100755 で追跡し 4 caller に LEDGER-ROUTE-SKIP 1 行を足し、新規 bats を書いて選択実行し、bash scripts/ninja_scope_commit.sh -m "<msg>" -- scripts/publisher.sh scripts/ledger_writer.sh scripts/insight_write.sh <他 3 caller> tests/unit/test_publisher_ledger_consumer.bats で commit、報告 YAML に本番 STATE_DIR の ledger_inbox 件数(着地前後)を書く。
    assumptions:
      claim: "scripts/ledger_writer.sh は mode 644(ls -la → -rw-r--r--、04:56)で apply サブコマンド(L185 apply_op、L263 dispatch)を既に持つ。scripts/publisher.sh に ledger_inbox の参照 0(rg)。本番 ledger_inbox は insights/ のみ(.seq=1、applied/ 空、滞留 1 op は家老が手動 apply 済)。insight_write.sh の -x 判定は L463/L473/L493。root tracked dirty 14(git status --porcelain -uno、04:56)。cmd_4464(削除 lane)の対象は cmd_complete_gate/ninja_monitor/safe_shared_main_ff/pre-push/gate_report_format/ninja_scope_commit で publisher.sh・ledger_writer.sh・insight_write.sh と重ならない"
      source: "ls -la scripts/ledger_writer.sh、grep -n apply_op scripts/ledger_writer.sh、rg -c ledger_inbox scripts/publisher.sh → 0、ls ~/.local/share/multi-agent-shogun/ledger_inbox/、grep -n -e '-x ' scripts/insight_write.sh、git status --porcelain -uno | wc -l、家老掲示板 blt_20260903_045610"
      trust: verified
    depends_on: none
    timeout_minutes: 60
    estimated_minutes: 40
    execution_env:
      runtime_constraints: "本番 publisher daemon(pid 3399892)と本番 STATE_DIR は触らない(fixture は一時 STATE_DIR)。着地後の daemon 再読込は家老 lane。既存 4 caller の分岐ロジックは変えない(出力 1 行のみ)。bats は選択実行のみ"
      long_runtime_reason: "publisher.sh の flock/isolated/sync_root 経路への統合と fixture 2 種(正常・失敗混在)、新規 bats 1 本。code と ledger の順序制御を同一 daemon 内で保つため 1 忍者"
      measured_runtime_sec: 2400
    split_decision:
      boundary_ac_ids: [AC1, AC2]
      integration_tasks: 1
    serial_dependency_evidence: "AC2 の e2e bats(writer→inbox→publisher→origin)は AC1 の消費者が無いと PASS しないため同一忍者で AC1→AC2 の順に実装する"
    quality_gate:
      q1_firefighting: "品質向上。理由: U6 の設計意図(§13 H3 台帳ノイズの分離)を本番で初めて成立させる。flag ON 後に ledger が origin へ届かない構造欠陥の根治"
      q2_learning: "奪わない。理由: 判断点は『失敗 op は隔離し他を巻き込まない』の 1 つで AC に固定。4 caller の分岐は不変"
      q3_next_quality: "上がる。理由: root tracked dirty が 0 に収束し publisher の root sync が通る。台帳ノイズ commit(『insights: auto-commit』等)が publisher の ledger batch 1 本に置き換わる"
      q4_depth: "deep — 理由: daemon への新 kind 追加+fail-close 隔離+実行 bit の契約化。可逆=消費関数を呼ばなければ現状(legacy)へ戻る"
      q5_verified_source: "structure_verified — 対象を実行して確認(2026-09-03 04:56): ls -la scripts/ledger_writer.sh → -rw-r--r--、grep -n apply_op scripts/ledger_writer.sh → L185、rg -c ledger_inbox scripts/publisher.sh → 0、ls ledger_inbox → insights/(applied 空)、git status --porcelain -uno | wc -l → 14"
      q6_not_hiding: "隠していない。理由: 失敗 op は rc/ に残し件数を報告させる。沈黙フォールバックは LEDGER-ROUTE-SKIP で可視化"
      q7_definition_verified: "U6 の入出力(ledger_inbox/op/append-update-resolve)は設計書 §9.1 U6 行と ledger_writer.sh 現物、publisher の request 契約は publisher.sh 現物で確認(確認日: 2026-09-03)"
      q8_why_what: "WHY: 家老発見=U6 route が本番で未稼働、flag ON 後は ledger の到達経路が無い / WHAT: publisher に ledger 消費者+実行 bit 追跡+可視化 1 行 / WHEN: 即(4464 と並走) / WHERE: scripts/publisher.sh, scripts/ledger_writer.sh, 4 caller, tests/unit / WHO: 家老配備(Codex/Claude どちらでも、publisher.sh は半蔵 Codex が実装) / HOW: 消費関数→fixture→bats→commit→家老が daemon 再読込 / 複利: 台帳 commit が 1 経路に収束し root dirty 0"
      q9_firefighting_root_cause: "根本対応。理由: -x を -f に変える消火(家老が試して死路に落ちた)ではなく、消費者の欠落という真因を埋める"
      q10_knowledge_boundary: "検証済み: writer の apply API・publisher の構造・本番 inbox 状態・root dirty 数。スコープ外: 4464 の削除対象、gate_skill_script_refs/auto_failure_lesson の -x 修正(家老が済)、daemon 再読込手順"
      q11_not_already_done: "rg -c ledger_inbox scripts/publisher.sh → 0(04:56)。rg -c 'LEDGER-ROUTE-SKIP' scripts → 0。git ls-tree HEAD scripts/ledger_writer.sh → 100644。rg -c cmd_4465 queue/shogun_to_karo.yaml → 0(起票前)"
      q_ambiguity: "曖昧さ: code request と ledger op の同一周期での順序。解消: code→ledger の固定順(code の commit に ledger が乗ることを防ぐ)。ledger 種別間は name 昇順"
      q12_lord_30min_cost: "no — 家老発見+将軍裁定 04:56、判定は fixture 件数・mode・bats"
      diagnosis: "BLOCK理由: 該当なし(新規起票) / 対策: 2 AC・7 file 以内・fail-close 隔離"
    environment_change: "type=lesson; file=projects/infra/lessons_shogun.yaml; pattern=cmdテンプレートルール"
    delegated_at: "\"2026-09-03T05:03:03\""
    origin: "[[cmd_4454_U6_ledger_writer]] -> [[家老発見_ledger_route未稼働_20260903_0458]] -> [[cmd_4465_publisher_ledger消費者]]"
  cmd_4464:
    title: "単一 publisher U8 AC2: PUBLISHER_SINGLE ON(04:37)の下で cleanup manifest の M1-M11 を batch 4 回(各 1 commit・10 file 以内)で物理削除し、census は同 batch で消える file を除いて数える"
    status: delegated
    project: infra
    purpose: "cmd_4461 AC1 の台帳(docs/research/single_publisher_cleanup_manifest_20260902.md、a7b41bc64)は M2-M8 を『surviving references が非 0』で blocked にしたが、その参照元の大半は同時に消す旧 test(M10/M11)と旧経路どうしの相互参照であり、cmd_4461 の census 定義(『削除対象 path を除く全 file』)が同 batch の削除対象を除外していなかったための見かけの blocked。flag ON は 04:37 に家老が確認(queue/flags/publisher_single、helper ENABLED、publisher pid 3399892 active、初 publish d42b62a90)。殿 09-03 01:30『先に進んでから戻ればいい』=canary 待ち無しで削除に入る。可逆=各 batch 1 commit、forward restore(git revert)で戻る。cmd_4461 は将軍裁定 04:40 (b) で void 済"
    scope_mode: FULL
    target_path: scripts
    acceptance_criteria:
      AC1:
        description: "batch 1: 台帳の M3(scripts/safe_shared_main_ff.sh 本体)+M5(.githooks/pre-push の GA-PUSH1 dirty-tree guard 区間)+M10(旧 test 5 file: test_push_lane_integrate/test_push_lane_settle_age/test_safe_shared_main_ff/test_cmd_complete_gate_source_publish と台帳 M10 行の 5 つ目)を git rm/区間削除する。census 規則(以後の batch 共通): rg -n -F '<関数名 or option 名 or file 名>' scripts .githooks skills tests/unit から (a) 同 batch で削除する file (b) コメント行(先頭が # または //) (c) docs/ を除いた残存参照数。0 でない対象はその file だけ残し台帳を blocked(参照元 path 付き)にして次へ進む(止まらない)。残る bats を選択実行コマンド=bash scripts/run_tests.sh file <M3/M5 を参照していた残存 bats と tests/unit/test_publisher_single_flag.bats> で FAIL 0・SKIP 0。bash scripts/ninja_scope_commit.sh -m \"<msg。deletion_justification: を含む>\" -- <削除 path> で 1 commit。中断再開時の成果物引継ぎ: 未 commit の worktree 差分と最終 bats 出力 log を報告 YAML の progress に path で残し、再開者はそこから継続する"
