      q6_not_hiding: "隠さない。理由: 公開 EP の既存フィールドのみ使用し、個別 PF 名・Secret 数値 0 件を AC1 で検証する"
      q7_definition_verified: "月次頁=EN/JA の /signals/<year-month>。内容=hero シグナル+プラン集計+SPY/TQQQ(showcase EP 既存契約)。8 月分=初回生成対象"
      q8_why_what: "WHY: 索引 2 URL のみで面積・鮮度が不足(SEO 案 §2) / WHAT: 月次頁 EN/JA+sitemap lastmod / WHEN: cmd_4434 CLEAR 後 / WHERE: lp のみ / WHO: 忍者 1 名 / HOW: build 時静的生成→隔離 build 検証 / 複利: 毎月 2 URL が 0 手で増える"
