commands:
  cmd_4367:
    title: "Track A単独偵察 — PF間低相関のSelection・FoF構築利用価値の現物確認+設計レビュー報告書(実装禁止)"
    status: delegated
    project: dm-signal
    purpose: "殿下問2026-08-22 21:55『候補PF同士の低相関をPortfolio Selection・FoF構築に利用する価値があるか。実装はせず現物確認と設計レビューだけを行い、現状→仮説→最小実験→必要な新規指標→既存指標で代用できる部分→実装する価値があるか、の順で報告せよ』への独立検討Track A。旧cmd_4366はtask_id衝突の機構バグ露出でcanceled、家老合意(掲示板blt_20260822_223649)により1系統1cmdへ分割。本cmdはTrack A単独で完結し、Track B(cmd_4368)の成果物・報告を参照しない。将軍一次確認済みの境界: 相関計算はfof/correlation.py(観測用metadata保存)とward_two_stage_ew.py(weighting用Ward block)に実在し、selection側は相関を参照していない"
    scope_mode: RESEARCH
    target_path: /mnt/c/Python_app/DM-signal/backend/app/services
    acceptance_criteria:
      AC1:
        description: "PF間return correlationの計算・保存・利用の全実在箇所を現物で特定し(fof/correlation.py、recalculate_fof.pyの保存点、ward_two_stage_ew.py、その他をrgで網羅)、各箇所についてlookback・計算頻度・保存先・利用目的(観測か配分か選択か)を表にし、selectionロジック(selection.py・各filter block)が相関・共分散を参照していないことのrg証跡とともに報告書へ記載する"
        binary_check: "相関の実在箇所表(lookback・頻度・保存先・利用目的つき)とselection側不使用のrg証跡が報告書にあるか"
      AC2:
        description: "殿下問の六項構成(現状・仮説・最小実験・必要な新規指標・既存指標で代用できる部分・実装する価値)で設計レビュー報告書をdocs/research配下に作成し、候補設計の比較(平均pairwise correlation最小化・最大相関抑制・inverse volatility・equal risk contribution・minimum variance・高ECR×低相関の二段階selection)と、批判的検討六論点(低相関だが低期待リターンPF混入によるCAGR低下・correlation regime shift・crisis時の相関上昇・FoF階層化による相関低下効果の内包可能性・派生PF同士の見かけ相関・短lookbackでの推定不安定)を、Point-in-Time厳守(t時点までの情報のみで選択しt+1以降で評価、MTD・未来情報混入禁止)の前提で全て含める。既存理論資産docs/research/knowledge-base/portfolio/nested-clustered-optimization.md(López de PradoのNCO=相関クラスタリング2段階最適化)を読み、代用できる部分と現物適用のギャップを設計比較へ反映する"
        binary_check: "六項構成+候補設計比較+批判的検討六論点+PIT厳守記述+NCO資産とのギャップ整理が報告書に全て存在するか"
      AC3:
        description: "殿提示の最小実験案(月次rebalance、相関lookbackは過去36Mまたは60Mのmonthly returns、既存selection ruleで上位候補へ絞った中から平均pairwise correlationが低い組合せを選ぶ、weightはequal weight、Controlは従来FoF、forward複数期間で比較、パラメータ最適化禁止)の実行可能性を既存資産(monthly_returnsの可用性・候補PF数・履歴月数・既存metricsのVolatility/MaxDD/Avg UWP/CAGR/Sharpe/Calmar/VDrag/ECR算出経路)と突合し、実行可能か・修正が要る点はどこかの判定を報告書へ記載する。実装・本番書込み・新規run起動は行わない"
        binary_check: "最小実験案の実行可能性判定(既存データ・metrics経路との突合根拠つき)が報告書にあり、コード変更diffが0か"
    command: |
      1. backend/app/services配下と関連jobsを読み、相関の計算・保存・利用箇所とselection側不使用をrg証跡つきで確定する
      2. 六項構成の設計レビュー報告書をdocs/research配下へ作成し、候補設計比較と批判的検討六論点とPIT厳守設計を記載する
      3. 最小実験案を既存monthly returnsデータと既存metrics算出経路に突合し、実行可能性判定を報告書へ記載する
    assumptions:
      claim: "相関実在箇所は将軍が2026-08-22 21:56に一次確認: fof/correlation.pyはlookback_months=12・最短6ヶ月でnp.corrcoef、recalculate_fof.py L1522-1529で月初のみmomentum_data.component_correlationsへ保存、ward_two_stage_ew.pyはlookback_months既定36でsqrt(0.5*(1-rho))距離のWard clustering。selection.pyとfilter blockに相関参照なし(grep -rniE 'correlation|covariance' で確認)"
      source: "backend/app/services/fof/correlation.py・backend/app/jobs/recalculate_fof.py・backend/app/services/pipeline/blocks/ward_two_stage_ew.py・backend/app/services/pipeline/selection.py の現物"
      trust: verified
    depends_on: none
    timeout_minutes: 30
    estimated_minutes: 15
    split_decision:
      boundary_ac_ids: [AC1, AC2, AC3]
      integration_tasks: 1
      review_round_trips: 1
    quality_gate:
      q1_firefighting: "品質向上。理由: 障害対応ではなく、選択ロジックの次期改良判断のための知識基盤を作る偵察であり、殿の裁定材料を事実で固める"
      q2_learning: "奪わない。理由: 現物読解・設計比較・実行可能性判定は忍者が自力で完結できる読み取り作業であり、将軍は境界の一次確認のみで深掘りを委ねている"
      q3_next_quality: "上がる。理由: 相関利用の実在境界(観測用と配分用はあるが選択用はない)が報告書で固定され、後続の実験cmd・実装cmdのACを事実に基づいて書ける"
      q4_depth: "deep — 理由: 殿が批判的検討六論点とPIT厳守まで指定した設計レビューであり、浅い機能列挙では下問に答えられない"
      q5_verified_source: "structure_verified — 将軍が2026-08-22 21:56に実行: grep -rniE 'correlation|covariance' backend/app → 6ファイル(exit 0)、grep -rn '_calculate_component_correlations' backend/app → 定義+利用2箇所(recalculate_fof.py L19・L1523)、fof/correlation.py全文・ward_two_stage_ew.py L20-110・recalculate_fof.py L1505-1545を現物Readし、相関=観測用保存(月初のみmomentum_dataへ)+weighting用block(Ward)のみでselection.py・filter block側の参照0件という構造境界を確認"
      q6_not_hiding: "何も隠していない。実装・実験実行・本番書込みは範囲外であること、Ward blockの本番稼働実態は本cmdで確認すべき未検証点であること、Track B(cmd_4368)と同一ACの独立二重検討であることを明記"
      q7_definition_verified: "低相関selection=候補PF群からPF間monthly return相関が低い組合せを選ぶこと(殿下問の定義)。ECR・VDrag・Avg UWPはα6指標の既存定義(確認日: 2026-08-22。semantic alpha_6_metricsにvolatility drag実在)"
      q8_why_what: "WHY: 殿下問2026-08-22 21:55『低相関は独立したselection signalとして価値があるのか、既存metricsやFoF構造で既に吸収されているのか判断したい』 / WHAT: 相関実在箇所の全特定+六項構成設計レビュー報告書+最小実験案の実行可能性判定(Track A単独) / WHEN: 今セッション / WHERE: backend/app/services現物+docs/research報告書 / WHO: 忍者(家老分解) / HOW: rg証跡つき現物確認+設計比較 / 複利: 選択ロジック改良の全後続cmdがこの境界事実の上に立つ"
      q9_firefighting_root_cause: "根本対応。理由: 場当たりの実装ではなく、実装価値の有無自体を現物と設計レビューで先に確定させる順序であり、殿の指定順序(調査→レビュー→判断)そのもの。分割起票自体もtask_id衝突機構バグへのシンプル解"
      q10_knowledge_boundary: "検証済み=将軍一次確認の相関実在箇所とselection未使用。スコープ外=実装・実験実行・パラメータ探索・本番書込み・新規run起動・Track B成果物の参照。未検証=Ward blockの本番稼働実態、monthly returns履歴長、component_correlationsの保存データ実在量(本cmdで確認する)"
      q11_not_already_done: "rg -c '低相関' context/cmd-chronicle.md → 0件。旧cmd_4366は同一ACだがtask_id衝突機構バグで配備が4回とも途中停止しcanceled(queue/reports現物は生成済みテンプレートのみで成果物0件)。本cmdは同一ACの分割再起票であり成果物の重複はない"
      q_ambiguity: "曖昧さなし。実装禁止・報告書のみ・六項構成・PIT厳守・Track A単独完結は固定"
      q12_lord_30min_cost: "no — 報告書受領後の価値判断のみ殿"
      diagnosis: "BLOCK理由: 旧cmd_4366で初回preflight2件(q5表記+split_decision欠落)を是正済みの同型再起票 / 対策: 是正済みフィールドを引き継いで起票"
    environment_change: "type=lesson; file=docs/research/nested-fof-hrp-herc-implementation.md; pattern=pairwise correlation"
    delegated_at: "\"2026-08-22T22:40:59\""
    origin: "[[殿下問_低相関selection価値_20260822_2155]] -> [[cmd_4366_task_id衝突canceled]] -> [[cmd_4367_TrackA分割起票]]"
