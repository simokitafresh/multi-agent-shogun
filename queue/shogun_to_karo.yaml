commands:
  cmd_4473:
    title: "dm-signal.com Agent Readiness Level3 2-6+2-7: LP の well-known 配下に Web Bot Auth 公開鍵 directory(Ed25519 JWKS、HTTP Message Signatures)を配置し、LP に WebMCP(navigator.modelContext polyfill+プラン表照会 tool 1 本)を最小実装して、Cloudflare 診断の 2 項目を ✅ にする"
    status: delegated
    project: dm-signal
    purpose: "殿指示 08-31 05:22『Level3 まで全て完了させるロードマップ』(docs/research/agent_readiness_level3_roadmap_20260831.md v1.3、gist da1b7617)。現状(将軍 curl 13:40 本番): 2-2 PRM・2-3/2-4 Agent Card+skills(cmd_4444)・2-8 DNS-AID(TXT 投入済)は done。未着手=2-5(backend /mcp、2 cmd・直列)・2-6(Web Bot Auth 鍵 directory)・2-7(LP WebMCP)。本 cmd は LP のみで完結し可逆な 2-6 と 2-7 を並走で先に閉じ、2-5 は別 cmd(backend)へ。T212 は 09-02 18:45 から起票 0 で 2 日止まっていた"
    scope_mode: NORMAL
    target_path: lp
    acceptance_criteria:
      AC1:
        description: "2-6 Web Bot Auth。Ed25519 鍵ペアを生成(秘密鍵は DM-signal backend の .env 系と同じ扱いで repo に入れない。生成手順と保存先を DM-signal repo の docs 配下 research ディレクトリに web_bot_auth_keys という名の md で残す、値は書かない)し、公開鍵を JWKS 形式(kty=OKP、crv=Ed25519、kid、x)で LP repo の public 配下 well-known ディレクトリに http-message-signatures-directory として配置(Cloudflare Web Bot Auth 仕様: Content-Type application/http-message-signatures-directory+json、Cache-Control 付与は next.config の headers で)。検証 script(verify_web_bot_auth、curl で 200・content-type・JWKS parse・kid 一致)を DM-signal repo の scripts 配下に level3 ディレクトリを設けて追加。署名運用(outbound bot)は対象外=directory 公開まで"
        binary_check: "LP の static export 出力(next build)に well-known の http-message-signatures-directory が含まれ、検証 script を export 出力へ向けて実行すると JWKS parse OK(keys 1、crv Ed25519)∧ next.config の headers に content-type 宣言 ∧ 手順書に秘密鍵値 0 ∧ 選択実行コマンド=bash scripts/run_tests.sh task queue/tasks/<ninja>.yaml で FAIL0・SKIP0 か?(本番 URL の 200 は production_proof)"
      AC2:
        description: "2-7 WebMCP。Cloudflare の『Let AI agents run in-browser tools』ガイドに従い、LP(Next static export)に navigator.modelContext の polyfill(公式 or webmcp polyfill を npm 依存でなく public 配下の script 1 枚として同梱、出典 URL と版を script 先頭コメントに)と tool 宣言 1 本(name=get_plans、説明=プラン表の照会、入力なし、出力=無料 Basic と有料上級の 2 段の JSON、値は LP のプラン表 copy から生成し保有・ticker・up to 数値は含めない)を追加。EN/JA 両 LP で登録される。ブラウザ console で navigator.modelContext の tool 一覧に get_plans 1 件が出ることを Playwright(既存 e2e 基盤)で固定"
        binary_check: "ローカルの static export を next start 相当で配信し、Playwright が EN と JA の両ページで navigator.modelContext の tools に get_plans 1 件を検出 ∧ script に出典と版 ∧ 出力 JSON に ticker と up to の文字列 0 ∧ 選択実行コマンド=bash scripts/run_tests.sh task queue/tasks/<ninja>.yaml で FAIL0・SKIP0 か?(本番 LP での検出は production_proof)"
      numeric_provenance: "AC 内の数値の算出元(将軍 13:40 実測): well-known 既存 file 数 6=git ls-tree --name-only -r origin/main で grep well-known → 6 行。本番 404 の 2 件=curl -o /dev/null -w %{http_code} で http-message-signatures-directory → 404、mcp.json → 404。keys 1・tool 1 件・プラン 2 段は仕様値(roadmap v1.3 §2C の AC『JWKS valid』『tool 登録 1 件』、公開面のプラン語『無料 Basic / 有料上級』=マニュアル v4 §2)であり実測値ではない"
    production_proof:
      owner: monitor
      description: "LP autoDeploy 後に家老が本番 curl(directory 200+JWKS)と Playwright(get_plans 1 件)を再実行し、殿に Cloudflare AI Crawl Control の Rescan を依頼せず、次回殿がスクショを共有した時に 2-6/2-7 ✅ を突合して掲示板に記録"
    command: |
      1. AC1: 鍵生成→JWKS 配置→headers→検証 script→手順書(値なし)。
      2. AC2: polyfill 同梱→tool 宣言→EN/JA 両方→Playwright 固定。報告 YAML→家老レビュー→publish(DM-signal は LP autoDeploy)。
    assumptions:
      claim: "LP は DM-signal repo の lp ディレクトリ(Next static export、Render dm-signal-lp autoDeploy)。well-known は lp の public 配下に agent-card.json/api-catalog/auth.md/oauth-authorization-server/oauth-protected-resource/skills.json が既に存在(origin/main ls-tree で確認)。http-message-signatures-directory と mcp.json は本番 404。2-8 DNS TXT は 09-02 01:17 投入済(record e1fa9b06)。Cloudflare 診断は殿の画面でしか Rescan できない"
      source: "curl 13:40: agent-card.json 200 application/json、http-message-signatures-directory 404、mcp.json 404。git ls-tree origin/main lp/public/.well-known → 6 file。roadmap v1.3 §2C と進捗表(2-5〜2-7 open)"
      trust: verified
    depends_on: none
    timeout_minutes: 120
    estimated_minutes: 80
    execution_env:
      runtime_constraints: "task_worktree 必須(DM-signal repo)。秘密鍵を repo・報告・手順書に書かない。LP 以外(backend)は触らない。本番反映は autoDeploy(可逆=revert で戻る)"
      long_runtime_reason: "鍵生成+JWKS+headers+検証 script と polyfill+tool+Playwright の 2 塊"
      measured_runtime_sec: 4800
    split_decision:
      boundary_ac_ids: [AC1, AC2]
      integration_tasks: 2
      parallel_ok: true
    serial_dependency_evidence: "AC1(well-known 静的 file+headers)と AC2(LP script+tool)は触る file が別(public/.well-known と next.config vs public/js と layout)で並列可。next.config の headers 追記は AC1 のみ"
    quality_gate:
      q1_firefighting: "品質向上。理由: Level3 の未着手 3 項目のうち LP で閉じる 2 項目を先に本番へ出す。診断の残りは 2-5 のみになる"
      q2_learning: "奪わない。理由: 判断点は『仕様どおりの file 配置と tool 1 本』で、AC が二値"
      q3_next_quality: "上がる。理由: 検証 script と Playwright が本番 URL を固定し、以後の LP 変更で退行を検知する"
      q4_depth: "medium — 理由: 仕様準拠の静的配置+script 1 枚。設計判断は少なく検証を厚くする"
      q5_verified_source: "structure_verified — 本番を実測して確認(2026-09-03 13:40、bash で curl と git を実行): git ls-tree で well-known 既存 file → 6 件、curl 404 → 2 件。curl https://dm-signal.com/.well-known/agent-card.json → 200 application/json、curl .../http-message-signatures-directory → 404、curl .../mcp.json → 404、curl https://dm-signal.com/ → 302(geo redirect)。git ls-tree origin/main lp/public/.well-known → 6 file(directory と mcp.json は無し)"
      q6_not_hiding: "隠していない。理由: 診断 ✅ は殿の画面でしか取れないため production_proof に分離し、cmd は本番 curl と Playwright で二値化"
      q7_definition_verified: "Web Bot Auth=HTTP Message Signatures(RFC 9421)+JWKS directory、WebMCP=navigator.modelContext。定義は roadmap v1.3 §2C と Cloudflare ガイド(確認日: 2026-09-03、ガイド URL は忍者が script 先頭に記録)"
      q8_why_what: "WHY: T212 が 09-02 18:45 から起票 0 で停止 / WHAT: 2-6+2-7 を LP で実装 / WHEN: 即 / WHERE: DM-signal repo lp/public/.well-known、lp/public、next.config、scripts/level3、docs/research / WHO: 家老配備(2 忍者並列) / HOW: 実装→本番 autoDeploy→curl と Playwright→殿の次回スクショで ✅ 突合 / 複利: Level3 残りが 2-5 のみになり、診断 8/8 の終端が見える"
      q9_firefighting_root_cause: "根本対応。理由: 起票停止の解消と、検証 script による恒久化"
      q10_knowledge_boundary: "検証済み: 本番 404/200、repo 配置、DNS 済。スコープ外: 2-5 backend /mcp(別 cmd)、outbound bot の署名運用、Rescan 実行(殿)"
      q11_not_already_done: "git ls-tree origin/main lp/public/.well-known で http-message-signatures-directory 0 件・mcp.json 0 件。grep -rl modelContext lp(origin/main ls-tree -r で js/ts を検索) → 0 件(13:40)。rg -c cmd_4473 queue/shogun_to_karo.yaml → 0(起票前)"
      q_ambiguity: "none。2-5 は含めない。秘密鍵の保管先は backend .env 系と同じ(値は書かない)"
      q12_lord_30min_cost: "no"
      diagnosis: "BLOCK理由: 初回起票(想定=AC 内の本番 URL 検証が phase 混在と判定されうる)。対策: 診断 ✅ 突合は production_proof に分離、AC は本番 curl と Playwright の二値のみ"
    measurement_source: "本番 live 実測 evidence=curl 13:40 timestamp(agent-card 200、directory 404、mcp.json 404)と git ls-tree origin/main の log"
    environment_change: "type=gate; file=docs/research/agent_readiness_level3_roadmap_20260831.md; pattern=2-5〜2-7"
    origin: "[[agent_readiness_level3_roadmap_20260831]] -> [[T212_起票停止]] -> [[cmd_4473_level3_2-6_2-7]]"
  cmd_4470:
    title: "偵察(全ロール・第 3 回): PUBLISHER_SINGLE ON(09-03 04:37)以降の便を止める『つまり』を 8 分類(偽陽性/過剰 BLOCK/構造バグ/循環拘束/遅い script・test/Claude↔Codex 仕組み差/サンクコスト過剰複雑化/影響範囲・依存未解明の浅い対応)で全数リストアップし、忍者 6 名は領域分担で queue/notes/tsumari_r3_<name>.md に、軍師・家老は各節を書き、将軍が tsumari_root_causes_20260901.md 第 3 回へ統合する"
    status: in_progress
    project: infra
    purpose: "殿 2026-09-03 10:46『前提とする環境が変わったはずだ。もう一度 8 分類で全員で探索。tsumari_root_causes_20260901.md を更新しよう』。第 1 回(09-01 cmd_4442、27 事例)・第 2 回(09-03 02:53 将軍単独、24 事例+T2-27)は旧 push 経路の時代。04:37 の flag ON、09:23 の daemon 入替、U9(root 直書き 0)・U10(watchdog reload/close_check)着地で、つまりの発生源が『旧経路の衝突』から『publisher/ledger 経路・root sync・gate の単一 publisher 未対応(precheck の worktree 不在 FILE NOT FOUND、fallback_gate_status 偽 BLOCK、SG-PRE35 既存 test 混入)』へ移った。close_check 初回(10:42)=trailer 45/50、root dirty 9。第 3 回は新環境の一次 log(publisher events.jsonl/ledger_inbox rc/gate_metrics/hook_artifacts/inbox_watcher/daemon_watchdog)から全数を取る"
    scope_mode: SCOUT
    target_path: queue/notes
    acceptance_criteria:
      AC1:
        description: "忍者 6 名の領域分担(家老が配備時に名を割当): (a) publisher/ledger 経路(publish_queue/events.jsonl の c2a_rc・root_sync_skipped・ledger rc/、publisher_daemon.log) (b) gate 系(logs/gate_metrics.jsonl・queue/gates/*/cmd_complete_gate.trigger.log の BLOCK/WAIT 理由、precheck SG-PRE の ERROR) (c) monitor/watchdog/inbox_watcher(ninja_monitor.log の WAKE-DEFER/HOOK-TRUST/CLEAR-LOOP、daemon_watchdog.log、inbox_watcher_*.log) (d) reflux/insights/semantic_index(reflux task の FAIL・C2a・dirty-guard) (e) hook/CLI 摩擦(logs/hook_artifacts の pre-push reject、pre-bash BLOCK 文言、Claude と Codex の差) (f) X 運用 lane と doc lane(cmd_4467 gate・U1b ff-only 失敗・bulletin『entry not found』)。各忍者は自領域の 09-03 04:37〜配備時刻の一次 log を機械抽出(コマンドと件数を生貼付)し、事例を『ID(T3-<name>-NN)・時刻・事象・主分類(8 分類の 1 つ)・副分類・真因・根治済/未根治・次の一手』の表で queue/notes/tsumari_r3_<name>.md に書く。推測禁止、log 行の引用必須、事例 0 なら『0 件、探索したコマンドと件数』を書く。中断再開時の成果物引継ぎ: 未 commit の worktree 差分と抽出 log を報告 YAML の progress に path で残し、再開者はそこから継続する"
        binary_check: "note 6 file が存在 ∧ 各 file に抽出コマンドと件数の生貼付 ∧ 各事例に主分類(8 分類のいずれか)と log 引用 ∧ 推測語(おそらく/と思われる)0 ∧ 未根治には次の一手 か?"
      AC2:
        description: "軍師節: 軍師は review/precheck 側の視点(review_feedback で出た偽陽性、SG-PRE の ERRORS、bundle 再実行、review_log の欠落・上書き)を同じ表形式で queue/notes/tsumari_r3_gunshi.md に書く(cmd_4442_gunshi_view と同型、家老が review_draft 経由で依頼)。家老節: 家老は配備・merge・checkpoint・hotfix の視点(D012 merge の回数と理由、checkpoint 回数、hotfix 列と §14.4 例外の適用、CI RED の真因)を queue/notes/tsumari_r3_karo.md に書く。両節とも 8 分類の主分類と『根治済/未根治・次の一手』必須。各 note は bash scripts/ninja_scope_commit.sh(忍者)/publish_direct_commit.sh(家老)で commit"
        binary_check: "tsumari_r3_gunshi.md と tsumari_r3_karo.md が存在 ∧ 各事例に主分類と根治状態 ∧ 全 8 note が origin 到達(publisher/U1b)か?"
    command: |
      1. 家老が 6 領域を忍者へ割当(1 忍者 1 領域、同時配備)、各忍者は一次 log を機械抽出して表を書き ninja_scope_commit で commit、報告 YAML に事例数と未根治数を書く。
      2. 軍師節・家老節を同時に書き、8 note の origin 到達を家老が確認して掲示板 1 行。将軍が第 3 回として tsumari_root_causes_20260901.md へ統合し gist 更新(将軍 doc lane)。
    assumptions:
      claim: "第 1 回=cmd_4442(27 事例、S/R/G/K 節)、第 2 回=将軍単独 T2-01〜T2-27(25 事例、09-03 02:53 起票+04:58 追記)。新環境の一次 log: ~/.local/share/multi-agent-shogun/publish_queue/events.jsonl(seq 78 まで、kind=c2a_rc/root_sync_skipped/ledger/already_published)、ledger_inbox/*/rc/(退避 19+)、logs/gate_metrics.jsonl、queue/gates/*/cmd_complete_gate.trigger.log、logs/ninja_monitor.log、logs/daemon_watchdog.log、logs/inbox_watcher_*.log、logs/hook_artifacts/、logs/publisher_daemon.log。close_check 10:42: trailer 45/50・root dirty 9。queue/notes は忍者 commit 可(docs/ は将軍 doc lane)"
      source: "docs/research/tsumari_root_causes_20260901.md、ls ~/.local/share/multi-agent-shogun/publish_queue/、tail events.jsonl、ls logs/、bash scripts/single_publisher_close_check.sh 2026-09-03T09:23:18+09:00(10:42)"
      trust: verified
    depends_on: none
    timeout_minutes: 60
    estimated_minutes: 40
    execution_env:
      runtime_constraints: "読取りと note 作成のみ(本番 file・daemon・gate を変更しない)。log は機械抽出(grep/jq/awk)で件数付き。忍者 6 名同時配備"
      long_runtime_reason: "6 領域×log 抽出+表化(各 20-30 分)、軍師・家老節の並走"
      measured_runtime_sec: 2400
    split_decision:
      boundary_ac_ids: [AC1, AC2]
      integration_tasks: 6
      parallel_ok: true
    serial_dependency_evidence: "AC1 の 6 領域は log source が互いに独立(events.jsonl/gate_metrics/monitor log/reflux/hook_artifacts/X lane)で並列可。AC2 は AC1 と独立(視点が review/配備側)。統合のみ将軍が直列"
    quality_gate:
      q1_firefighting: "品質向上。理由: 新環境のつまりを一次 log で全数化し、8 分類で発生源の移動(旧経路→publisher/gate)を可視化する。個別 hotfix の連打を止める"
      q2_learning: "奪わない。理由: 判断点は『主分類 1 つを選ぶ』『根治済/未根治』で、基準は第 1・2 回の表と同じ"
      q3_next_quality: "上がる。理由: 未根治×分類の一覧から次の hotfix 列と §15 クローズ阻害要因が直接出る"
      q4_depth: "deep — 理由: 8 log source の機械抽出、6 領域+2 視点、全数(サンプリング禁止)"
      q5_verified_source: "structure_verified — 対象を実行して確認(2026-09-03 10:48): grep -n '^## ' tsumari_root_causes_20260901.md → 第 1 回 4 節+第 2 回 3 節、tail events.jsonl → seq 78 root_sync_skipped root_dirty=8、close_check → trailer 45/50 root dirty 9、ls queue/notes → 書込み可"
      q6_not_hiding: "隠していない。理由: 事例 0 の領域も探索コマンドと件数を書かせる。推測禁止、log 引用必須"
      q7_definition_verified: "8 分類の定義は殿 09-02 20:44 の原文と tsumari 第 1 回の分類表、事例の列は第 2 回 T2 表で確認(確認日: 2026-09-03)"
      q8_why_what: "WHY: 殿 10:46『環境が変わった、もう一度全員で』 / WHAT: 6 領域+2 視点の全数表→将軍統合 / WHEN: 即 / WHERE: queue/notes/tsumari_r3_*.md→docs/research/tsumari_root_causes_20260901.md 第 3 回 / WHO: 家老配備(忍者 6 同時、Claude/Codex 混在可)+軍師+家老 / HOW: log 機械抽出→表→commit→将軍統合→gist / 複利: つまりの発生源の移動が見え、hotfix 列が根拠付きで並ぶ"
      q9_firefighting_root_cause: "根本対応。理由: 個別事象の消火でなく発生源の分布を測る"
