        binary_check: "M2 の 17 関数と M8 群の定義行が 0(rg -c '^push_lane_' scripts/ninja_monitor.sh → 0 および rg -c '^check_push_lane' → 0 および rg -c '^auto_commit_' → 0)∧ 残存参照 0 または blocked ∧ 選択実行 FAIL 0 ∧ SKIP 0 ∧ commit 1 ∧ 台帳更新 か?"
