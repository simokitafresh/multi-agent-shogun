commands:
  cmd_4462:
    title: "LP build の showcase fetch を cache 無しにする(static export の build 時 fetch が Next data cache+Render build cache で旧 API 形を焼く再発防止)+build 後の holding 存在 assert"
    status: delegated
    project: dm-signal
    purpose: "殿 2026-09-03 02:40『起票してしまおう』。cmd_4459 で backend(59b7b679)は 17:20Z に live し API series に holding が入ったが、17:24Z に再 build した LP(dm-signal-lp、static export)は /ja/signals/2008-10/ と /2026-08/ の保有欄が『—』のまま。真因: lp/lib/showcase.ts getShowcase の fetch が next.revalidate=3600 で Next の data cache に入り、Render static site の build cache(.next/cache)が次 build へ持ち越すため、backend が更新されても build は前回の API 応答を再利用する。将軍が 02:38 に clearCache 再 deploy(dep-dac5spnavr4c738mbo60)で止血した。恒久策=build 時 fetch を cache: no-store にし、build 直後に生成 HTML の保有欄が『—』だけでないことを assert して build を fail させる"
    scope_mode: FULL
    target_path: lp
    acceptance_criteria:
      AC1:
        description: "lp ディレクトリ配下の lib/showcase.ts で getShowcase の fetch option を next.revalidate から cache: 'no-store' に変える(static export では revalidate は無意味で data cache 汚染だけ残る)。getShowcase の呼び出し 12 箇所(rg -c 'getShowcase(' lp → 12)は変更しない。lp で npm run build がローカルで成功し、out 配下の ja/signals/2026-08/index.html に monthly-holding の値が『—』以外で 1 件以上ある(本番 API を fetch)"
        binary_check: "rg -c 'no-store' lp/lib/showcase.ts == 1 ∧ rg -c 'revalidate' lp/lib/showcase.ts == 0 ∧ npm run build rc 0 ∧ rg -c 'monthly-holding\">[A-Z]' out/ja/signals/2026-08/index.html >= 1 か?"
      AC2:
        description: "lp の package.json の build script を『next build && node scripts/assert-holding.mjs』にし、scripts/assert-holding.mjs を新規作成: out/ja/signals/*/index.html のうち monthly-holding が『—』でない file 数を数え、0 件なら exit 1(message に件数)、1 件以上なら exit 0 で件数を stdout。API に holding が無い月(signal 無し月)は『—』で正当なので全 file 一致は要求しない。Render の build command は package.json 経由なので render.yaml は変更しない"
        binary_check: "scripts/assert-holding.mjs 存在 ∧ package.json build に assert-holding 含む ∧ out を holding 全『—』に書換えた fixture で exit 1 ∧ 正常 out で exit 0 ∧ 変更 file が lib/showcase.ts・package.json・scripts/assert-holding.mjs の 3 つのみ か?"
    command: |
      1. lp/lib/showcase.ts の getShowcase fetch option を cache: "no-store" に変え、lp で npm ci && npm run build を実行し、out/ja/signals/2026-08/index.html の monthly-holding 値を rg で報告 YAML に生貼付する。
      2. lp/scripts/assert-holding.mjs を作り package.json の build に連結、正常 out と全『—』fixture の 2 回実行結果(exit code)を報告 YAML に書き、bash scripts/ninja_scope_commit.sh -m "<msg>" -- lp/lib/showcase.ts lp/package.json lp/scripts/assert-holding.mjs で commit。push 後 Render dm-signal-lp の自動 deploy が live になったら /ja/signals/2008-10/ と /2026-08/ の保有欄が異なることを curl で確認して報告(家老 post_deploy_check と同値)。
    assumptions:
      claim: "lp/next.config.mjs は output: export(2026-09-03 02:41 origin/main で確認)。lp/lib/showcase.ts L46-59 getShowcase は fetch(apiUrl('/api/public/showcase'), { next: { revalidate: 3600 } })。getShowcase( の呼出は lp 配下 12 箇所。本番 API https://dm-signal-backend.onrender.com/api/public/showcase の data.hero.series 277 要素は全て holding キーを持つ(02:35 curl: 2003-09 QQQ / 2026-09 XLU)。Render dm-signal-lp=srv-da9uon8n74is739a1uhg static_site、17:24Z build(59b7b679)後も本番頁は『—』、02:38 clearCache 再 deploy で止血中。lp に test file 無し"
      source: "git show origin/main:lp/next.config.mjs、git show origin/main:lp/lib/showcase.ts、git grep 'getShowcase(' origin/main -- lp | wc -l → 12、curl 本番 API/LP 2 頁、Render API deploys 一覧"
      trust: verified
    depends_on: none
    timeout_minutes: 40
    estimated_minutes: 25
    execution_env:
      runtime_constraints: "lp 配下のみ。backend・LP コンポーネントは触らない。npm run build は本番 API を読むだけ(書込み無し)。push は 1 commit"
      long_runtime_reason: "npm ci+next build 2 回(修正後+fixture 検証)で各 2-3 分、assert script 1 本"
      measured_runtime_sec: 1500
    split_decision:
      boundary_ac_ids: [AC1, AC2]
      integration_tasks: 1
    serial_dependency_evidence: "AC2 の assert は AC1 の build 出力(out/)に対して動くため同一忍者・同一 worktree で連続実行する"
    quality_gate:
      q1_firefighting: "品質向上。理由: 止血(clearCache 再 deploy)は将軍が済ませた。本 cmd は build の cache 依存を断ち、旧形を焼いた build を fail させる構造"
      q2_learning: "奪わない。理由: 判断点は fetch option 1 箇所と assert 閾値(1 件以上)で AC に固定"
      q3_next_quality: "上がる。理由: 以後 backend の contract 変更が LP build に確実に反映され、反映漏れは build 失敗で見える"
      q4_depth: "medium — 理由: 1 option 変更+assert script 1 本。真因(Next data cache×Render build cache)は将軍が本番 3 点(API に holding あり/LP 頁『—』/build 時刻が backend live 後)で確定済"
      q5_verified_source: "structure_verified — 対象を実行して確認(2026-09-03 02:41): git show origin/main:lp/next.config.mjs → output: export、git show origin/main:lp/lib/showcase.ts | grep -n revalidate → L48、git grep -c getShowcase( → 12、curl 本番 API series[0]/[-1] に holding、curl LP 2 頁 monthly-holding → 『—』"
      q6_not_hiding: "隠していない。理由: signal 無し月の『—』は正当として全一致を要求せず、0 件のみ fail。cache 無効化で build 時間が伸びるなら報告させる"
      q7_definition_verified: "Next.js 14 の fetch cache: 'no-store' と output: export の組合せは公式 docs(Data Fetching/caching)で build 時 fetch の cache 回避手段として確認(確認日: 2026-09-03)"
      q8_why_what: "WHY: cmd_4459 の修正が LP build で消えた(殿 00:52 のバグが本番で直っていない) / WHAT: fetch no-store+build 後 assert / WHEN: 即(4459 の本番反映の一部) / WHERE: lp/lib/showcase.ts, lp/package.json, lp/scripts / WHO: 家老配備(Claude/Codex どちらでも) / HOW: option 変更→build→assert→commit→Render 自動 deploy→2 頁 curl / 複利: contract 変更のたびの clearCache 手動対応が消える"
      q9_firefighting_root_cause: "根本対応。理由: cache 経路そのものを断つ。clearCache は今回限りの止血"
      q10_knowledge_boundary: "検証済み: config・fetch option・呼出数・本番 API/LP 状態・deploy 時刻。スコープ外: backend、Render build cache 設定(render.yaml は変更しない)"
      q11_not_already_done: "rg -c 'no-store' lp/lib/showcase.ts → 0(origin/main 02:41)。lp/scripts/assert-holding.mjs → 無し。rg -c cmd_4462 queue/shogun_to_karo.yaml → 0(起票前)"
      q_ambiguity: "曖昧さ: assert の閾値。解消: 『—』でない月次頁が 1 件以上=PASS、0 件=FAIL。signal 無し月は『—』で正当"
      q12_lord_30min_cost: "no — 殿 02:40 で確定、判定は rg 件数と exit code と curl"
      diagnosis: "BLOCK理由: 該当なし(新規起票) / 対策: 変更 3 file・AC 二値"
    environment_change: "type=lesson; file=projects/infra/lessons_shogun.yaml; pattern=cmdテンプレートルール"
    delegated_at: "\"2026-09-03T02:45:38\""
    origin: "[[cmd_4459_月次頁holding]] -> [[LP_build_fetch_cache_持越し_20260903]] -> [[cmd_4462_LP_build_no_store]]"
  cmd_4461:
    title: "単一 publisher U8: cleanup manifest(§10 M1-M11)を実行結果台帳として起こし、flag ON 後に旧 push 経路(autopush/push_lane/safe_shared_main_ff/GA-PUSH1/merge driver/旧 test)を 1 batch 10 file 以内で物理削除する"
    status: delegated
    project: infra
    purpose: "殿 2026-09-03 01:30『あまりに遅すぎる。先に進んでから戻ればいい』01:31『無駄な複雑化や不要な検証に時間をかけるな』。設計の最終ゴールは §11『commit→push→deploy が詰まらない』であり、旧経路(cmd_complete_gate 12k 行の autopush 区間、ninja_monitor push_lane、safe_shared_main_ff、GA-PUSH1、merge driver 6 rule、旧 test 群)が残る限り 09-02 の壁(root index 後退 6 回・push lane 停止・偽 BLOCK 6 例)は再発する。U7(cmd_4460)の flag ON で旧経路が no-op になった直後に、§10 manifest の順で削る。canary 7 日は撤回(殿 01:30)。可逆=各 batch は 1 commit、forward restore で戻す"
    scope_mode: FULL
    target_path: scripts
    acceptance_criteria:
      AC1:
        description: "docs/research/single_publisher_cleanup_manifest_20260902.md を新規作成: 設計書 §10 M1-M11 の各行を『対象 file/関数・削除/縮退・移植先 contract test・移植先 test の現在の PASS 証跡(選択実行 log path)・削除後の参照数(rg)・batch 番号・状態』の列で台帳化する。移植先 contract test が未 GREEN の行は削除せず『blocked』と理由を書く(自分で test を足さない)。各行の rg census(削除対象の関数名/option 名/file 名を参照する他 file の件数)を取り、参照 0 でない行は blocked。台帳は忍者が書き、家老が承認してから AC2 へ進む。中断再開時の成果物引継ぎ: 未 commit の worktree 差分と最終 bats 出力 log を報告 YAML の progress に path で残し、再開者はそこから継続する"
        binary_check: "台帳の行数 == §10 の M 行数(11)∧ 全行に移植先 test の log path または blocked 理由 ∧ 全行に rg 参照数 ∧ 家老承認の記録 1 か?"
      AC2:
        description: "PUBLISHER_SINGLE=1 が本番で ON(家老が cmd_4460 着地後に切替、掲示板に記録)であることを確認した上で、台帳の非 blocked 行を batch 1(M3 safe_shared_main_ff+M5 GA-PUSH1 区間+M10 の旧 test 5 file=10 file 以内)→batch 2(M2 push_lane 関数群+M8 auto_commit 群)→batch 3(M1 cmd_complete_gate autopush 関数群+M4 merge driver+M7 縮退)→batch 4(M6 ninja_scope_commit option 縮退+M9 SKILL 縮退+M11 旧 test)の順に削除する。各 batch ごとに: 削除→rg で削除対象の参照 0 を確認→影響 bats を選択実行(bash scripts/run_tests.sh file <残る bats>)で FAIL 0・SKIP 0→bash scripts/ninja_scope_commit.sh で 1 commit→台帳の状態を done に更新→報告 YAML progress に batch 番号と commit を追記。batch 途中で参照 0 にならない file が出たら、その file だけ残して blocked にし次へ進む(止まらない)。削除は git rm のみ(rm -rf 禁止)。1 batch 10 file 以内"
        binary_check: "各 batch で削除対象の rg 参照 0 ∧ 残る bats 選択実行 FAIL 0 ∧ SKIP 0 ∧ 1 batch 1 commit ∧ 台帳の done+blocked == 11 ∧ deletion_justification が各 batch の commit message にある ∧ scripts の総行数が変更前(33,221)より減っている か?"
    command: |
      1. 設計書 §10 M1-M11・§9.1 U8 行・§13 H3 を読み、各行の移植先 test を選択実行して log path を取り、rg で参照 census を取り、docs/research/single_publisher_cleanup_manifest_20260902.md を起こして bash scripts/ninja_scope_commit.sh -m "<msg>" -- docs/research/single_publisher_cleanup_manifest_20260902.md で commit し、家老へ承認依頼(報告 YAML progress)。
      2. 家老承認+flag ON 確認後、batch 1→4 の順に削除・rg 0・選択実行・commit・台帳更新を繰り返し、報告 YAML に batch ごとの commit と行数差分(wc -l 変更前→後)を書く。
    assumptions:
      claim: "§10 manifest は M1-M11 の 11 行(設計書 v3.10、2026-09-03 01:35 grep で確認)。scripts/cmd_complete_gate.sh+ninja_monitor.sh+safe_shared_main_ff.sh+.githooks/pre-push の総行数 33,221(wc -l)。tests/unit に test_cmd_complete_gate* が 12 file。移植先 contract test は U1-U6 の bats(test_publisher_queue 9/test_publish_artifact 13/test_gate_dual_read/test_publisher 4+7/test_publisher_admit 8/test_ledger_writer)が origin/main に実在。cleanup manifest file は未存在(ls 01:32)。U7=cmd_4460 は 01:33 委任"
      source: "docs/research/single_publisher_asis_tobe_5w1h_20260902.md §10 §9.1 U8 §13 H3、wc -l scripts/cmd_complete_gate.sh scripts/ninja_monitor.sh scripts/safe_shared_main_ff.sh .githooks/pre-push、ls tests/unit/、ls docs/research/single_publisher_cleanup_manifest_20260902.md → 無し"
      trust: verified
    depends_on: cmd_4460
    timeout_minutes: 90
    estimated_minutes: 60
    execution_env:
      runtime_constraints: "削除は flag ON(旧経路 no-op)後にのみ行う。各 batch は 1 commit で forward restore 可能。bats は選択実行のみ(フルスイート禁止)。本番 daemon(publisher)は触らない"
      long_runtime_reason: "11 行の census+移植先 test 選択実行(AC1 20 分)、batch 4 回の削除・rg・選択実行・commit(AC2 40 分)。batch 間で参照が消える順序(M3/M5→M2/M8→M1/M4/M7→M6/M9/M11)を 1 忍者で追う"
      measured_runtime_sec: 3600
    split_decision:
      boundary_ac_ids: [AC1, AC2]
      integration_tasks: 1
    serial_dependency_evidence: "AC2 の batch 順序は AC1 の参照 census(どの file が他から参照されているか)で決まり、batch 2 以降は前 batch の削除で参照が 0 になることを前提にする。別忍者に分けると参照の消え方が追えず blocked が増える"
    quality_gate:
      q1_firefighting: "品質向上。理由: 壁の発生源(旧 push 経路 4 本)を物理的に消す。09-02 の hotfix 15 本が当たっていた file がなくなる"
      q2_learning: "奪わない。理由: 判断点は『参照 0 でない file を blocked にして進む』の 1 つで AC に固定。移植先 test を自分で足さない"
      q3_next_quality: "上がる。理由: gate/monitor の行数が減り、§11 after 計測(cmd 別)が意味を持つ"
      q4_depth: "deep — 理由: 33k 行の中から 11 行分の関数群を batch 4 回で消す。可逆(1 batch 1 commit)"
      q5_verified_source: "structure_verified — 対象を実行して確認(2026-09-03 01:35): sed -n '/^## §10/,/^## §11/p' 設計書 | grep -c '^| M' → 11、wc -l 4 file → 33,221、ls tests/unit | grep -c test_cmd_complete_gate → 12、ls docs/research/single_publisher_cleanup_manifest_20260902.md → 無し"
      q6_not_hiding: "隠していない。理由: 参照 0 にならない file は消さず blocked として台帳に残す。削除は git rm のみで rm -rf を禁止。行数差分を報告させる"
      q7_definition_verified: "M1-M11・移植先 contract test・deletion_justification の定義は設計書 §10 と CLAUDE.md Test Rules(既存 test 削除には deletion_justification)で確認(確認日: 2026-09-03)"
      q8_why_what: "WHY: 殿 01:30 遅すぎる→旧経路を残したまま壁を直し続けるのをやめる / WHAT: manifest 台帳+batch 4 回の物理削除 / WHEN: cmd_4460 flag ON 直後 / WHERE: scripts, .githooks, tests/unit, docs/research / WHO: 家老配備(Claude 推奨、cmd_complete_gate の読解) / HOW: census→batch→rg 0→選択実行→1 commit / 複利: 以後の hotfix 対象が publisher 系 6 file に収束"
      q9_firefighting_root_cause: "根本対応。理由: 壁を塞ぐのではなく壁の発生源を消す(§14.4 の『捨てる壁』を捨てる)"
      q10_knowledge_boundary: "検証済み: manifest 行数、対象行数、移植先 test の実在。スコープ外: dm-signal 側の deploy check(U3b)、§11 after 計測(別 cmd)"
      q11_not_already_done: "ls docs/research/single_publisher_cleanup_manifest_20260902.md → 無し(2026-09-03 01:35)。rg -c 'cmd_4461' queue/shogun_to_karo.yaml → 0(起票前)。旧経路の関数は全て現存(rg -c 'push_lane_publish_one' scripts/ninja_monitor.sh → 1 以上)"
      q_ambiguity: "曖昧さ: 参照 census の範囲。解消: scripts/ tests/ .githooks/ skills/ docs/ の全体を rg し、コメント行は除外、関数名・option 名・file 名の完全一致で数える"
      q12_lord_30min_cost: "no — 殿 01:30/01:31 で確定、判定は rg 件数と bats"
      diagnosis: "BLOCK理由: 該当なし(新規起票) / 対策: 台帳 1 file+batch 4 回、depends_on=cmd_4460 は実依存(flag ON が削除の前提)"
    environment_change: "type=lesson; file=projects/infra/lessons_shogun.yaml; pattern=cmdテンプレートルール"
    delegated_at: "\"2026-09-03T01:37:00\""
    origin: "[[殿指示_先に進んでから戻れ_20260903_0130]] -> [[cmd_4460_U7_flag下流化]] -> [[cmd_4461_U8_cleanup_manifest]]"
  cmd_4449:
    title: "単一 publisher U2 検証: Codex 忍者が隔離 clone で publish_artifact(capture/restore)と gate_report_format の manifest 検証の bats を選択実行し、設計書契約から敵対 fixture を 1 本追加して multi-CLI 同品質を証明する(実装は飛猿=Claude Sonnet)"
    status: blocked
    project: infra
    purpose: "殿指示 2026-09-02 13:25『どのロールがどの CLI/モデルでも必要十分に同じレベルで作業を続けられるのが我らの仕組み』+殿下問 19:02『順調に進んでいるか？進展が遅すぎないか？』→第 1 波 3 unit の検証 cmd を CLEAR 待ちにせず今起票して直列を 1 段減らす(depends_on で配備は自動待機)。U2(cmd_4446)は飛猿(Claude Sonnet)が実装し report PASS のため、検証は Codex 忍者(設計書 v3.6 §9.1 共通 AC・§12)。cmd_4448(U1 検証)と同型で unit と CLI を入れ替えた別 cmd"
    scope_mode: FULL
    target_path: tests/unit
    acceptance_criteria:
      AC1:
        description: "cmd_4446 の GATE CLEAR 後に origin/main を隔離 clone し、scripts/publish_artifact.sh と scripts/gates/gate_report_format.sh の manifest 検証関数が到達していることを ls と grep で確認した上で、選択実行 bash scripts/run_tests.sh file tests/unit/test_publish_artifact.bats を FAIL 0・SKIP 0 で通し、実行 log を報告 YAML に path で残す(既存 11 test)"
        binary_check: "隔離 clone に 2 script が存在 ∧ 選択実行 FAIL 0 ∧ SKIP 0 ∧ 実行 log の path が報告にある か?"
      AC2:
        description: "設計書 §9.1 U2 行の二値完了欄と §2.3 C6・§13 H7 から、既存 bats に無い敵対 fixture を 1 本(例: capture 後に worktree を rm しても restore で tree id が一致する、manifest の paths[] を 1 件改竄すると gate が FAIL する、patch が空(paths 0)の時の停止条件)選んで tests/unit/test_publish_artifact.bats に追加し、選択実行 bash scripts/run_tests.sh file tests/unit/test_publish_artifact.bats を FAIL 0・SKIP 0 で通して commit する。fixture が FAIL する場合は実装を直さず FAIL 内容を報告して停止する(実装の修正は U2 実装者へ差し戻し)。中断再開時の成果物引継ぎ: 未 commit の worktree 差分と最終 bats 出力 log を報告 YAML の progress に path で残し、再開者はそこから継続する"
        binary_check: "追加 fixture が 1 本 ∧ 追加 fixture の名前と契約の出典(設計書の行)が報告にある ∧ 選択実行 FAIL 0 ∧ SKIP 0(FAIL 時は停止して FAIL 内容が報告にある)∧ 新規 test に非空 test_necessity ∧ 変更 file が tests/unit/test_publish_artifact.bats のみ か?"
    command: |
      1. 設計書 §9.0 共通則と §9.1 U2 行・§2.3 C6・§13 H7 を読み、隔離 clone で origin/main を checkout して 2 script の到達を ls で確認し、選択実行 bash scripts/run_tests.sh file tests/unit/test_publish_artifact.bats で FAIL 0・SKIP 0 を確認する。
