    timeout_minutes: 30
    estimated_minutes: 10
    quality_gate:
      q1_firefighting: "品質向上。理由: Claude 実装を Codex が同じ道具で検証し敵対 fixture を足す=multi-CLI 同品質の証明(§12)と U2 契約(C6/H7)の穴探し"
