        description: 確定月のうちledger未登録で残る月の有無をDB照会で棚卸しし、未登録月が残る場合はPF別・期間別の分布をdocs/research/cmd_3827_ledger_rebuild.mdへ記録する(往復反転が起きた2014-10-31型の凍結保護外を可視化する)
        binary_check: ledger未登録の確定月の棚卸し結果(分布含む)がcmd_3827_ledger_rebuild.mdに記録されているか
    command: '1. ledger全件退避→バンドなしsignals先行でledger再構築→照合結果をcmd_3827_ledger_rebuild.mdへ記録する

      2. fullrecalculate→completed確認→DRIFT BLOCK系統的再発なしをRenderログで確認し同報告書へ記録する

      3. ledger未登録の確定月を棚卸しし分布を同報告書へ記録する

      '
