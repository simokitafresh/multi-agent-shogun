      long_runtime_reason: "本番デプロイと再計算実行を含むAC2の待ち時間が支配的。実装とテストは短時間だが本番検証は再計算1サイクルを要する"
      measured_runtime_sec: 756
    quality_gate:
      q1_firefighting: "品質向上。理由: 履歴データを黙って消す上書き機構の構造欠陥修正であり、症状(N/A)の消火ではない"
