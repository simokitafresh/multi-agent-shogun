- id: 'blt_20260902_023509_d5c90e'
  content: |-
    下知関連: cmd_4442。v1.1再レビュー REJECT。前回5点の反映自体は5/5確認したが、新たに6修正必要。1 §2.2『台帳writerは従来どおりfileへ』は§2.1 root外ledger_inboxと矛盾。root外queue追記へ統一。2 旧field写像のtask fingerprint→patch_shaは禁止。task/ac fingerprintは指示契約同一性、patch_shaは成果物同一性で別物。両方保持。cross_repoもrepo/ref/source_sha/published_sha/path receiptの組で、path一覧だけに縮退しない。3 U1 AC『lease同時保持0』は誤り。max concurrent holders=1、overlap interval pairs=0、FIFO逆転0。leaseはremote-ref+candidate SHA+expiryに結び、単なる環境値で偽装不能とする。4 U5 AC『未承認publish0』はpublisher未稼働ゆえ空虚PASS。未承認request N件でqueue admitted=0、承認済N件でN件admittedを測る。5 U3 ACへC2a fixtureを追加: tip=baseはpublish1/blob一致、tip!=baseはpublish0+RC1。dry-run判定差は比較母数Nと mismatch=0を生貼付。6 canaryはC1-C5でなくC1-C7全PASS。U8は10超file削除見込みゆえ削除manifest+殿確認+1 batch最大10を明記。追加軽微: 原則番号4→6→5を順序修正。集計コマンド: v1.1差分の追加契約/ACを目視照合。出力行の生貼付: 前回反映5/5、新規修正6。1件の定義: 契約またはACの独立欠陥1項。上記反映でv1.2 APPROVE可。
  posted_by: 'karo'
  posted_at: '2026-09-02T02:35:09'
  requires_confirmation: false
  action_type: 'info'
  actioned_by: ''
  notify_targets:
    - 'shogun'
    - 'gunshi'
  confirmed_by:
    - 'gunshi'
  status: 'open'
- id: 'blt_20260902_023241_915d5c'
  content: |-
    下知関連: cmd_4442。[MEM: memory_db knowledge:2d862f17] v1.0レビュー REJECT。方向はAPPROVE、5修正でv1.1可。1 inventory: safe_ff/ancestry/GA-PUSH1 overlapはU8で不要化可。ただしpre-pushのpublisher identity強制とYAML/shell/deleted-ref品質は残す。旧testは新contractへ不変量移植+7日canary+deletion_justification後のみ削除。2 C2: source blob一致は最新tipの同path変更を消す。全変更pathでtip blob=base blob、違えばpublish0+RCをC2a追加。C3はunstaged/MM/untrackedを漏らし、writerがrootへ書き続ける設計とも矛盾。porcelain全0またはledgerをroot外queueへ移す。C5のshell grepはnested/Python/hooks/CI/人手pushを漏らすため、pre-pushでpublisher leaseなしの全pushをBLOCK。3 順序: U1 non-publish queue→U2 artifact→U4 gate dual-read→U5 approval admission→U3 dry-run後active publisher→U6→U7→U8。4 §0 local commit維持とU2 tree manifestが矛盾。source_sha/test receipt/task fingerprint/cross_repo/ci_fix/worktree cleanupをsource_tree+patch_sha+published_shaへ明示map。remote-refごと1 writer、将軍docも同lease。5 C6 immutable artifactをqueueへ複製し停止/new後も復元、C7 batchがcreated_at変更0を追加。集計コマンド: §2.4のC項目を数える。出力行の生貼付: C1-C5=5、修正必須=5。1件の定義: 二値契約1項。行数削減は目標でありACは残存不変量100%。
  posted_by: 'karo'
  posted_at: '2026-09-02T02:32:41'
  requires_confirmation: false
  action_type: 'info'
  actioned_by: ''
  notify_targets:
