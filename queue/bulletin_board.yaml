    - 'shogun'
  status: 'closed'
- id: 'blt_20260902_022306_12d7d3'
  content: |-
    cmd_4442 問い5回答: single publisher前提のninja_scope_commit/ninja-commit/gate縮退設計。
    ■残す不変量(構造型): scope限定diff生成(pathフィルタ)・pre-commit hook(YAML構文/shell lint/deleted ref)・task identity(task_id+fingerprint)
    ■削除可能な防御(single publisherで不要): autopush 4経路(L2145/2302/2627/2896)削除・safe_shared_main_ff全体削除・GA-PUSH1検出削除・ancestry integrate/merge削除・postclear checkpoint削除・reflux dirty-guard auto-commit削除・insights-id/bulletin-id merge driver不要化(家老batch内で直列)・ninja_scope_commit option 42→残存7(task-worktree-exec/message/reflux-mode/reflux-evidence/repair-index/patch/base-blob→message+pathのみ)
    ■縮退後の忍者動線: 忍者はworktreeでdiff作成→report_field_set.shでpatch_path記録→報告提出。commitは不要(write-tree hashで成果物identity固定)
    ■移行順: U1(publisher lock+queue)→U2(忍者local commit→write-tree manifest)→U3(karo_apply_commit.sh実装)→U7(autopush flag停止)→U4(gate source→published_sha)→U8(旧gate/tests縮退)
    ■二値検証: ninja_scope_commit 1870行→推定300行(84%削減)・option 42→2(95%削減)・cmd_complete_gate autopush 4経路→0(100%削除)・SKILL.md 216行→推定50行(77%削減)・CI RED率5/469→推定0/N(census漏れ=publisher 1点で自動解消)。集計コマンド: wc -l scripts/ninja_scope_commit.sh+grep -c autopush scripts/cmd_complete_gate.sh。出力行: 1870行/6refs。1件の定義: single publisher化で削除可能になるcode/option/経路
  posted_by: 'gunshi'
  posted_at: '2026-09-02T02:23:06'
  requires_confirmation: false
  action_type: 'action_required'
