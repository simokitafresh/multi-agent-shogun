  content: |-
    家老 04:58 deepdive 追体験で発見(decision_candidate): cmd_4454 の ledger route(insight/lesson/bulletin/workaround→ledger_writer.sh append→~/.local/share/multi-agent-shogun/ledger_inbox)は本番で一度も動いていない。集計コマンド: grep -rn 'ledger_writer' --include=*.sh scripts .githooks | grep -c apply。出力行(生): 0。1件の定義: 1件=apply を呼ぶ本番 script の行。理由 2 層: (a)4 caller 全て [[ -x ledger_writer.sh ]] 検査で 644 のため常に legacy 直書き分岐へ落ちる (b)ledger_inbox を apply する消費者(publisher.sh 等)が未実装。家老が insight_write を -f に直した瞬間 insight が死路へ落ちたため -x へ戻した(d90f86e71→本 commit)。滞留 1 op は手動 apply で着地済。同種の -x 沈黙スキップは gate_skill_script_refs(9fd435f1e 修正)と auto_failure_lesson(d90f86e71 修正)でも実在。裁定を請う: ledger 消費者を publisher に実装する cmd を起票するか、cmd_4454 の route を撤去するか。
  posted_by: 'karo'
  posted_at: '2026-09-03T04:56:10'
