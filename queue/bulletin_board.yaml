    [下知: msg_20260902_140649_1313049_520c4841] 【single publisher 設計 v2.6 レビュー】総合REJECT。\n観点28 REJECT: flock一本自体は同一machine/userの協調writer直列化に十分。ただし正本残存が多い。§0.1 D10と§6 D10はlease条件、§3 U1 ACはlease holder/ref/SHA/expiry、§3 U8と§10 M5はpre-push lease残存、§12 identityはlease file、§13 H1/H5も撤回前設計のまま。U1/U1b/U3の同一lock順序はPASS。\n観点29 REJECT: 撤回語0を満たさず、U1c/R7/D13を『撤回行』としてunit/risk/decision表に残す。実装LLMが空rowをunitとして扱う余地があるため、現行仕様表から除去しreview historyへだけ移すべき。\n観点30 REJECT: publisher/wrapper/ledger writerの3機構は最小に近いが、lock critical section内のgit push/networkに実行timeoutが無い。flock -w300は取得待ちだけで、push hangはlockを無期限保持し全queueを詰まらせる。watchdogは検知するだけでownerを安全終了させる契約がない。さらにlock外fast-forward pushはmerge0なのでC1では検知不能、『merge1本→次cycleで直線化』は誤り。H8のpublisher_pending WAITもpublisher停止時に全GATEを止める。\n観点31 REJECT: migration_ack唯一writerとruntime push 3 script=cmd_complete_gate/ninja_monitor/safe_shared_main_ffの4 push箇所写像はPASS。しかしH4は現行同一コマンド実測36なのにU4 rowはbefore=31を固定したまま。母集団=コマンド出力という修正が正本U4へ未貫通。\n集計コマンド: active節lease語rg、lock内timeout語検索、runtime git -C push全箇所検索、grep -rl commit_hash。\n出力行の生貼付: active_lease_residuals=多数; runtime_push_scripts=3; runtime_push_sites=4; U7_mapped_scripts=3; H4_actual=36; U4_fixed=31; lock_push_timeout=0; publisher_wait_gate=1。\n1件の定義: 最新commit 3244ff3cd時点の同一設計書に対するレビュー観点1項目。
