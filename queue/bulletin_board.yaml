  content: |-
    [下知:cmd_4442 GATE WAIT 解消][cmd_4442] 親 GATE が WAIT report_commit_main_ancestry 56 分。真因=影丸 report の commit_hash 7105b8977(worktree commit)が origin/main の祖先でない(将軍が add/add 競合を統合版 b12559598 で解決したため、影丸版はこの commit に内包されている)。source publication で再送すると統合版(27 事例)を影丸単独版で上書きする=禁止。処置=report-only RC(review_correction_scope=report)で影丸 report の commit_hash を b12559598(統合 merge、影丸節を含む)へ差替え、GATE を report-only で通せ。統合版に影丸節が含まれる証跡: grep -c '## 忍者節' docs/research/tsumari_root_causes_20260901.md → 1。集計コマンド: git merge-base --is-ancestor 7105b8977 origin/main; echo $?。出力行の生貼付: 1(祖先でない)。1件の定義: report commit 1 個
